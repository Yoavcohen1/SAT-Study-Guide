began at the same internal temperature. The investigators argue that enclosure B slowed the temperature rise more effectively than enclosure A over the full trial, even though neither prevented warming.","strategy":"Compare changes from a shared baseline rather than just assuming a final level means no change."},{"id":"COE-046","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice most accurately uses the graph to support this statement?","choices":{"A":"East was below West at hour 0 but above it by hour 2.","B":"The eastern station first surpassed the western station only at hour 6.","C":"The western station’s level rose faster than the eastern station’s because it began higher.","D":"The two stations were at equal water levels at hour 0 and stayed equal afterward."},"answer":"A","explanation":"East goes from below the West reference at hour 0 to above it at hour 2.","choice_explanations":{"A":"Correct: East goes from below the West reference at hour 0 to above it at hour 2.","B":"Incorrect: East was already higher by hour 2.","C":"Incorrect: West stayed at 2.6 while East rose from 2.3 to 3.5.","D":"Incorrect: They began at different levels and diverged further."},"passage":"In a model estuary, researchers measured water levels at two sites throughout one tidal cycle. The western station’s level stayed approximately constant, while the eastern station rose steadily and passed the western level during the observation period. A student wants to identify when their ordering first reversed.","strategy":"Locate the first pair of observations that brackets a change in which series is higher."},{"id":"COE-047","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice best describes evidence from the graph supporting this interpretation?","choices":{"A":"The treated index dipped briefly in year 3 yet ended above baseline and controls.","B":"The comparison group finished above the treated group because its index was constant after year 1.","C":"The treated group increased in every year without interruption and reached 15 in year 4.","D":"The treatment group finished lower than it began even though the comparison group improved."},"answer":"A","explanation":"A temporary decline does not negate a higher endpoint, and the treated line ends above the control.","choice_explanations":{"A":"Correct: A temporary decline does not negate a higher endpoint, and the treated line ends above the control.","B":"Incorrect: The comparison group finished at 11, below the treated group’s 15.","C":"Incorrect: It declined from 14 to 13 between years 2 and 3.","D":"Incorrect: The treated group increased from 10 to 15 overall."},"passage":"Researchers tracked a soil-quality index at plots receiving an experimental treatment and at comparison plots. They observed that the treatment group did not improve in every single interval but still finished substantially above both its baseline and the comparison group.","strategy":"Assess both local intervals and the full start-to-end change; one dip does not imply an overall decline."},{"id":"COE-048","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice most effectively supports their argument using the graph?","choices":{"A":"The gap between median and 95th-percentile delays remained 8 milliseconds throughout the test.","B":"Both measurements decreased as more users joined, showing better performance under load.","C":"Median delay rose 8 milliseconds, far less than the 132-millisecond 95th-percentile increase.","D":"Median delay rose faster than 95th-percentile delay, reaching 150 milliseconds at 50 users."},"answer":"C","explanation":"The 95th percentile rises by 132 ms versus only 8 ms for the median, widening the distribution’s upper tail.","choice_explanations":{"A":"Incorrect: The gap grew from 8 to 132 milliseconds.","B":"Incorrect: Both series increased as load rose.","C":"Correct: The 95th percentile rises by 132 ms versus only 8 ms for the median, widening the distribution’s upper tail.","D":"Incorrect: 150 milliseconds is the 95th-percentile value, not the median."},"passage":"In a simulated network test, engineers measured the median delay and the 95th-percentile delay as the number of simultaneous users increased. They argue that increasing load affected the slowest requests much more severely than it affected a typical request, making median delay alone an inadequate summary.","strategy":"When comparing percentiles, quantify their divergence instead of using only central tendency."}]},{"category":"Information and Ideas","subcategory":"Inferences","questions":[{"id":"INF-001","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"may be insufficient on its own to establish the crowned figure’s identity.","B":"suggests that the crowned figure represents a member of a household rather than royalty.","C":"proves that the crowned figure represents an earlier ruler rather than the queen.","D":"rules out the possibility that the tablets were produced during the queen’s reign."},"answer":"A","explanation":"The star has multiple documented uses, so its presence cannot uniquely identify the crowned figure.","choice_explanations":{"A":"Correct: The star has multiple documented uses, so its presence cannot uniquely identify the crowned figure.","B":"Incorrect: Finding the star on storage jars does not show that a crowned figure must be nonroyal.","C":"Incorrect: An older use of the symbol does not identify the figure as a specific earlier ruler.","D":"Incorrect: The star’s earlier use does not date the tablets or exclude the queen’s reign."},"passage":"Several tablets recovered from the fictional city of Talor show a crowned figure beside a seven-pointed star. Historians initially identified the figure as a particular queen because the star appears on coins issued during her reign. However, excavators have since found the same star on household storage jars dating from several generations before the queen's birth. The association between the star and the queen, therefore, ______","strategy":"Ask whether the evidence uniquely identifies one explanation or is also compatible with alternatives."},{"id":"INF-002","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"a play can remain accessible through its central conflict while some of its historical references require explanation.","B":"the popularity of the play shows that contemporary audiences recognize the significance of every historical reference.","C":"modern audiences respond primarily to the play’s depiction of its tax system rather than its family conflict.","D":"productions that omit the original civic titles must be more successful than productions that retain them."},"answer":"A","explanation":"Audiences engage with the conflict while missing some context-dependent allusions.","choice_explanations":{"A":"Correct: Audiences engage with the conflict while missing some context-dependent allusions.","B":"Incorrect: Reviewers explicitly say some official titles are misunderstood.","C":"Incorrect: The passage identifies the sibling conflict as understood, not the tax system as the main attraction.","D":"Incorrect: The passage compares neither editing choices nor their success."},"passage":"A play written in the fictional republic of Sereva centers on two siblings who disagree about whether loyalty to family can justify breaking a public oath. Modern productions in several countries have been popular, even though the original script refers repeatedly to a tax system and civic offices abolished centuries ago. Reviewers report that audiences understand the siblings’ conflict but sometimes miss why particular official titles are treated as insults. Consequently, ______","strategy":"Keep two apparently opposing observations together rather than treating one as cancelling the other."},{"id":"INF-003","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the settlement was continuously occupied during the period when canal salinity increased.","B":"the salinity measurements establish that environmental changes played no role in Oran’s eventual decline.","C":"rising salinity may have hindered later agriculture without having initiated the settlement’s abandonment.","D":"the residents must have abandoned Oran because freshwater sources disappeared before the canals became saline."},"answer":"C","explanation":"The proposed cause occurred after the event it was meant to explain, although it could have affected subsequent farming.","choice_explanations":{"A":"Incorrect: The houses had already ceased to be occupied.","B":"Incorrect: One proposed change occurred too late to explain departure, but other environmental changes are unexamined.","C":"Correct: The proposed cause occurred after the event it was meant to explain, although it could have affected subsequent farming.","D":"Incorrect: No evidence about the disappearance of freshwater sources is presented."},"passage":"Researchers had attributed the abandonment of the fictional hill settlement of Oran to the increasing salinity of nearby irrigation canals. But new analyses of sediment layers suggest that canal salinity began rising about two decades after the settlement’s last occupied houses were sealed. The samples are too sparse to determine why residents originally left, though they confirm that farming later became difficult. These findings suggest that ______","strategy":"Put events on a timeline; a later event cannot be the initiating cause of an earlier one."},{"id":"INF-004","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"comparing leaders with all residents who did not seek office would eliminate the influence of prior public-speaking experience.","B":"the close election margins demonstrate that the experience of leadership does not change speaking behavior.","C":"a comparison between leaders of different neighborhoods would reveal whether public speaking causes residents to run for office.","D":"comparing narrowly elected leaders with narrowly defeated candidates could better isolate the influence of holding office."},"answer":"D","explanation":"Close winners and losers both chose to run and are likely more comparable in initial motivation than winners and nonapplicants.","choice_explanations":{"A":"Incorrect: People who never sought leadership likely differ in relevant preexisting ways.","B":"Incorrect: Election margins provide no outcome evidence about behavioral change.","C":"Incorrect: All compared participants held office; that comparison does not isolate its effect.","D":"Correct: Close winners and losers both chose to run and are likely more comparable in initial motivation than winners and nonapplicants."},"passage":"A political scientist hopes to learn whether leading a neighborhood council makes residents more willing to speak at public meetings. Simply comparing current council leaders with residents who never applied for leadership could be misleading: people already comfortable speaking in public may be more likely to seek office. Council elections in one city are often decided by a handful of votes. The scientist therefore argues that ______","strategy":"Choose a comparison that reduces the specific selection bias named in the passage."},{"id":"INF-005","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"a chemical mismatch between the ash and nearby volcanoes demonstrates that the eruption occurred far away.","B":"the two dating methods prove that the eruption occurred exactly 8,300 years ago.","C":"although the ash may be relevant to the event, the present evidence does not establish a volcanic trigger.","D":"the conflicting dates show that lake levels must have fallen for reasons unrelated to volcanic activity."},"answer":"C","explanation":"Date ranges are inconsistent, and the ash is not linked chemically to an eruption, so causation remains possible but unconfirmed.","choice_explanations":{"A":"Incorrect: No chemical match or mismatch has yet been established.","B":"Incorrect: Neither method provides an exact date, and only one range includes that date.","C":"Correct: Date ranges are inconsistent, and the ash is not linked chemically to an eruption, so causation remains possible but unconfirmed.","D":"Incorrect: Uncertain dating does not eliminate volcanic explanations."},"passage":"Some geologists believe that a sudden drop in lake levels around 8,300 years ago was triggered by a nearby volcanic eruption. A newly discovered ash layer offers a possible clue, but two dating methods yield ranges of 8,100–8,450 and 7,900–8,200 years ago. Only one of those ranges overlaps the proposed event, and the ash's chemical fingerprint has not yet been matched to any known volcano. Thus, ______","strategy":"Distinguish a plausible clue from proof, especially when dates or identities remain uncertain."},{"id":"INF-006","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the six lineages inherited the pouch directly from an ancestor shared by all burrowing mammals.","B":"the structure may provide some advantage under conditions encountered by multiple lineages.","C":"every burrowing mammal must eventually develop the pouch if it survives for enough generations.","D":"the pouch necessarily performs the same specific function in each of the six lineages."},"answer":"B","explanation":"Independent recurrence makes a potential selective benefit plausible, without identifying a universal or exact function.","choice_explanations":{"A":"Incorrect: The passage says the pouch evolved independently and common ancestors lacked it.","B":"Correct: Independent recurrence makes a potential selective benefit plausible, without identifying a universal or exact function.","C":"Incorrect: The survey notes that not all burrowing species have it.","D":"Incorrect: Independent appearance does not establish identical function in each lineage."},"passage":"For decades, zoologists classified a small pouch near the throat of several unrelated burrowing mammals as a useless remnant of an ancestral structure. A new survey found, however, that the pouch arose independently in at least six lineages whose common ancestors lacked it. The survey did not determine what the pouch does, and not every burrowing species possesses one. Nevertheless, the repeated appearance of the pouch suggests that ______","strategy":"Infer only as much function as repeated evolution supports; do not invent a precise mechanism."},{"id":"INF-007","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"Eren would likely reject a moral rule that judges these two actions identically solely because both involve taking food.","B":"Eren believes that intentions never matter when determining whether an action is justified.","C":"Eren argues that the moral quality of an action can be determined by its physical features alone.","D":"Eren regards taking food as morally admirable whenever it occurs during a festival."},"answer":"A","explanation":"Different judgments of the same act in different settings conflict with context-independent moral evaluation.","choice_explanations":{"A":"Correct: Different judgments of the same act in different settings conflict with context-independent moral evaluation.","B":"Incorrect: The beneficial purpose of feeding children is relevant to the favorable judgment.","C":"Incorrect: The distinction depends on context even when the physical act is the same.","D":"Incorrect: The festival example is explicitly condemned."},"passage":"A surviving collection of essays from the fictional philosopher Eren distinguishes between taking food from another person's storehouse during a festival and doing so during a famine. Although the physical act is identical, Eren condemns the first case as greedy and praises the second when the food is used to keep children alive. Eren's examples challenge the view that acts have a moral value independent of the circumstances in which they occur. Hence, ______","strategy":"Derive a philosophical principle from the contrast rather than from isolated examples."},{"id":"INF-008","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"must have lived exclusively in treeless coastal habitats.","B":"may have relied more heavily on movement across rocky surfaces than earlier reconstructions allowed.","C":"had stronger wing muscles than all other extinct reptiles of comparable size.","D":"could not have glided at any point in its life."},"answer":"B","explanation":"Ground-adapted joints and toes weaken a primarily gliding reconstruction without eliminating gliding.","choice_explanations":{"A":"Incorrect: Rock-adapted anatomy does not establish an exclusive habitat or coastline.","B":"Correct: Ground-adapted joints and toes weaken a primarily gliding reconstruction without eliminating gliding.","C":"Incorrect: No comparison of wing musculature is reported.","D":"Incorrect: The passage says its wings remain consistent with some gliding."},"passage":"Because only its wing bones had been recovered, the extinct reptile Aerodraco minor was long assumed to have spent most of its time gliding between trees. A newly excavated skeleton shows unusually reinforced ankle joints and short, powerful toes suited to gripping uneven stone. The wings remain consistent with some ability to glide, but the new anatomy resembles that of animals that move frequently over rocky ground. Researchers therefore suggest that A. minor ______","strategy":"Revise the earlier hypothesis only to the extent warranted by the new evidence."},{"id":"INF-009","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"most participants were unable to understand what the low-waste label meant.","B":"the surveyed shoppers became less concerned about waste after seeing the two shirts.","C":"a stated environmental preference may not determine purchasing decisions when price differences are substantial.","D":"price is the only factor that ever influences whether consumers buy environmentally friendly products."},"answer":"C","explanation":"Self-reported concern persisted while behavior differed under a price trade-off.","choice_explanations":{"A":"Incorrect: The passage provides no evidence of misunderstanding.","B":"Incorrect: Participants continued to express concern.","C":"Correct: Self-reported concern persisted while behavior differed under a price trade-off.","D":"Incorrect: One simulated task cannot establish an exclusive or universal influence."},"passage":"In a survey, most participants said they preferred clothing made through low-waste processes. During a subsequent simulated shopping task, however, participants could choose between two otherwise identical shirts, one labeled low-waste and priced 35 percent higher than the other. Only a small minority selected the low-waste shirt, even though the same participants continued to express concern about manufacturing waste. These results suggest that ______","strategy":"Keep stated preferences separate from observed choices when additional constraints are introduced."},{"id":"INF-010","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"proves that no variable other than temperature could have affected glucose consumption.","B":"shows that the samples must have contained a greater total number of bacterial cells after warming.","C":"makes a shift in the community’s species composition a less plausible explanation for the faster consumption.","D":"demonstrates that each bacterial species increased its metabolic rate by exactly the same amount."},"answer":"C","explanation":"Stable species proportions weaken the replacement explanation, though they cannot establish a uniquely measured metabolic response.","choice_explanations":{"A":"Incorrect: An unchanged composition alone does not exclude every possible influence.","B":"Incorrect: Species proportions do not reveal total cell counts.","C":"Correct: Stable species proportions weaken the replacement explanation, though they cannot establish a uniquely measured metabolic response.","D":"Incorrect: Composition data cannot resolve species-specific metabolic changes."},"passage":"Researchers moved sealed samples containing the same mixed bacterial culture from cool storage to a warmer room. Within two days, the samples consumed glucose substantially faster, even though sequencing showed essentially unchanged proportions of the bacterial species in each sample. The researchers had considered two possible explanations for faster consumption: replacement by different species or increased metabolic activity within the existing community. The sequencing result matters because it ______","strategy":"Use a control to remove one alternative explanation, not to claim complete causal proof."},{"id":"INF-011","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"detecting the gas would carry different implications for life depending on the kind of planet observed.","B":"the gas would demonstrate that life exists on any planet whose atmosphere contains it.","C":"the gas would be impossible to detect in the atmospheres of large gas planets.","D":"the absence of the gas on a rocky planet would conclusively establish that the planet has no living organisms."},"answer":"A","explanation":"The gas requires a possible biological source on one planet type but can be sustained without life on another.","choice_explanations":{"A":"Correct: The gas requires a possible biological source on one planet type but can be sustained without life on another.","B":"Incorrect: Abiotic persistence is possible on large gas planets.","C":"Incorrect: The models explicitly allow the gas to persist there.","D":"Incorrect: Life might exist without producing the particular gas."},"passage":"A newly proposed instrument could detect sulfur-bearing gas in distant planets' atmospheres. On small rocky planets, the gas is expected to break down rapidly unless it is replenished by a biological process. Models show, however, that the same gas can persist for long periods without life in the dense atmospheres of large gas planets. The researchers therefore caution that ______","strategy":"For a proxy or biosignature, ask under what conditions a non-target process could create the same signal."},{"id":"INF-012","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"clear-cutting is now known to be as beneficial as limited thinning for preventing fires.","B":"removing trees can protect a forest only when mature trees are cleared first.","C":"all forests would retain more mature trees if logging were increased without restrictions.","D":"certain forms of selective tree removal may aid conservation in particular forest conditions, even though other forms remain damaging."},"answer":"D","explanation":"A conditional benefit of selective thinning does not justify a universal endorsement of logging.","choice_explanations":{"A":"Incorrect: The passage distinguishes selective removal from clear-cutting and provides no comparison supporting that claim.","B":"Incorrect: The treatment removed small trees and protected mature ones.","C":"Incorrect: The study examined only limited thinning in one forest type.","D":"Correct: A conditional benefit of selective thinning does not justify a universal endorsement of logging."},"passage":"Removing trees is ordinarily viewed as harmful to forest conservation, and clear-cutting often is. Yet a study of densely overgrown stands in the fictional Relen Forest found that selectively removing small trees reduced the intensity of subsequent ground fires, allowing more mature trees to survive. Comparable untreated stands lost a higher share of mature trees. The authors emphasize that the treatment was limited and that its effects have not been tested in wetter forests. Accordingly, ______","strategy":"Scope the conclusion to the exact treatment and environmental conditions studied."},{"id":"INF-013","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the critic’s proposed alternative cannot be directly tested against an otherwise identical finished painting.","B":"the curator can reproduce Nore’s original works exactly by removing their upper layers.","C":"opaque paint invariably produces less vivid colors than transparent washes.","D":"the layering method must have been the only technique capable of producing Nore’s chosen subjects."},"answer":"A","explanation":"An exact comparison is unavailable because each finished work is singular and changing its method would change the work being compared.","choice_explanations":{"A":"Correct: An exact comparison is unavailable because each finished work is singular and changing its method would change the work being compared.","B":"Incorrect: The passage says their layered surfaces cannot be reconstructed after alteration.","C":"Incorrect: The curator does not establish a general ranking of paint techniques.","D":"Incorrect: No comparison establishes that alternative techniques were impossible."},"passage":"Painter Elia Nore worked on each canvas by laying down several transparent washes and then scraping away portions of the surface. A critic argues that Nore’s paintings would have been more vivid had she used opaque paint from the start. The curator of a retrospective notes, however, that the original layered surfaces cannot be reconstructed after being replaced by a different method, and no identical version of a finished Nore painting made with opaque paint exists. Thus, ______","strategy":"If a counterfactual requires observing the same unique object under mutually exclusive histories, mark that limit."},{"id":"INF-014","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"is necessary for survival during the dry season because all flapless skinks eventually starve.","B":"must appear only in skinks that have failed to find sufficient food.","C":"cannot play any role in communication because not every adult skink possesses one.","D":"is unlikely to be indispensable for finding food, although it might have another function."},"answer":"D","explanation":"Successful foraging without the trait challenges an essential-for-foraging hypothesis but not all possible uses.","choice_explanations":{"A":"Incorrect: Flapless adults were observed foraging successfully throughout the season.","B":"Incorrect: There is no evidence linking its presence to food scarcity.","C":"Incorrect: A trait can serve communication without being present in every individual.","D":"Correct: Successful foraging without the trait challenges an essential-for-foraging hypothesis but not all possible uses."},"passage":"Male dune skinks sometimes develop an enlarged throat flap that can vibrate during territorial encounters. One hypothesis holds that the flap is essential for locating food because its movement supposedly helps the animals detect nearby insects. Yet field biologists have documented numerous adults without the flap that forage successfully throughout the dry season. The biologists therefore propose that the flap ______","strategy":"The existence of successful exceptions can refute a necessity claim without proving the trait useless."},{"id":"INF-015","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"will eventually fail at 180°C because it retains rather than increases its original bonding strength.","B":"is superior to the conventional adhesive under every temperature condition.","C":"may be preferable in sustained high-heat applications, but its performance under freeze–thaw cycling remains unknown.","D":"must be more economical to manufacture than the conventional adhesive."},"answer":"C","explanation":"Only high-temperature strength retention differs in the new adhesive’s favor; no conclusion is possible about untested cycling.","choice_explanations":{"A":"Incorrect: Retention below an initial value does not show eventual failure, which was not tested.","B":"Incorrect: Room-temperature performance was similar, and freeze–thaw conditions were untested.","C":"Correct: Only high-temperature strength retention differs in the new adhesive’s favor; no conclusion is possible about untested cycling.","D":"Incorrect: No information about manufacturing costs is provided."},"passage":"Manufacturers testing a new heat-resistant adhesive found that it retained more of its bonding strength than a conventional adhesive after 200 hours at 180°C. Both adhesives performed similarly at room temperature, and the researchers did not test either one after repeated freezing and thawing. Their results suggest that the new adhesive ______","strategy":"Separate the precise tested performance outcome from unrelated or untested advantages."},{"id":"INF-016","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"shared vocabulary offers evidence of the ancestral speakers’ environment without establishing the exact route by which their descendants dispersed.","B":"the speakers of the ancestral language could not have known any plants outside salt marshes.","C":"the descendant languages independently invented identical words after their speakers reached the coast.","D":"the ancestral language must have originated at the present-day location of the largest salt marsh."},"answer":"A","explanation":"Inherited plant words support familiarity with wetlands but cannot determine a unique origin or path.","choice_explanations":{"A":"Correct: Inherited plant words support familiarity with wetlands but cannot determine a unique origin or path.","B":"Incorrect: Knowledge of several wetland plants does not exclude other environments.","C":"Incorrect: The passage says the words descended from a shared ancestral language.","D":"Incorrect: No exact location is identified by the shared vocabulary."},"passage":"Languages now spoken across a vast coastal region share words descended from an ancestral language for several kinds of salt-marsh plants. Linguists reason that these words probably existed before the languages diverged, suggesting that speakers of the ancestral language were familiar with coastal wetlands. But the words alone do not identify a specific settlement site, and later groups could have moved in several directions. Therefore, ______","strategy":"Infer an environmental constraint from inherited vocabulary, not a detailed migration map."},{"id":"INF-017","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"all the sediment was deposited in a single event with an unchanging flow speed.","B":"conditions in the basin likely shifted between relatively energetic and relatively calm episodes during the layers’ formation.","C":"the coarse pebbles must have formed after the fine particles were entirely removed from the basin.","D":"the rover proved that permanent rivers crossed the basin for millions of years."},"answer":"B","explanation":"The alternating grain sizes and undisturbed layering support changes in the conditions of transport and settling.","choice_explanations":{"A":"Incorrect: Alternating grain sizes indicate distinct depositional conditions.","B":"Correct: The alternating grain sizes and undisturbed layering support changes in the conditions of transport and settling.","C":"Incorrect: The preserved alternation contradicts complete removal and does not show this sequence.","D":"Incorrect: Layers can record episodes without proving continuous rivers or duration."},"passage":"A rover exploring a dry basin on the fictional moon Aro recorded alternating layers of fine mud-like particles and coarse rounded pebbles. The pebbles are consistent with transport by relatively energetic flows, while the fine particles generally settle in calmer conditions. The rover detected no signs that the layers had been overturned after deposition. The sequence therefore suggests that ______","strategy":"Use the physical meaning of each observation, then combine them without inventing duration or a single cause."},{"id":"INF-018","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the rulers reduced silver content specifically to fund an expanded military campaign.","B":"Selis changed the metallic composition of its coinage, though the reason for the change remains uncertain.","C":"the later coins necessarily had the same exchange value as the earlier issues.","D":"the kingdom had entirely ceased using silver coins by the later date."},"answer":"B","explanation":"The percentages establish a change in alloy, not its cause, denomination, or precise economic value.","choice_explanations":{"A":"Incorrect: A military motive is not documented by composition alone.","B":"Correct: The percentages establish a change in alloy, not its cause, denomination, or precise economic value.","C":"Incorrect: The passage gives no exchange-rate evidence.","D":"Incorrect: Later coins still contained 64 percent silver."},"passage":"Metallurgical analysis of coins from the fictional kingdom of Selis shows that issues minted around 430 BCE contained approximately 91 percent silver, while issues dated a century later contained only 64 percent silver and substantially more copper. Archival references to the kingdom’s spending are fragmentary, and no decree explaining the change has survived. The later coins would also have had a different appearance. Taken together, the findings indicate that ______","strategy":"Distinguish the directly measured historical change from a tempting story about why it happened."},{"id":"INF-019","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"using a different sensory pathway could provide a promising option against some beetles resistant to the existing repellent.","B":"the new compound will permanently prevent resistance in every beetle population.","C":"the new plant compound is already proven to protect entire fields throughout a growing season.","D":"the existing repellent must have failed because it activates only one receptor."},"answer":"A","explanation":"A distinct receptor and laboratory avoidance effect create a plausible alternative, not a proven field-wide or permanent solution.","choice_explanations":{"A":"Correct: A distinct receptor and laboratory avoidance effect create a plausible alternative, not a proven field-wide or permanent solution.","B":"Incorrect: The trials do not establish universal or long-term resistance prevention.","C":"Incorrect: Evidence is limited to laboratory leaf-avoidance trials.","D":"Incorrect: The existing product activates several receptors."},"passage":"A population of crop beetles has become resistant to a commercial repellent that activates several sensory receptors simultaneously. Researchers identify a plant compound that instead triggers a previously unexploited receptor and causes beetles in laboratory trials to avoid treated leaves. They have not yet tested the compound in the field or for long-term resistance. The finding suggests that ______","strategy":"Separate what a novel mechanism makes plausible from effectiveness that remains untested."},{"id":"INF-020","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"parasite load is always unrelated to fin color in the species.","B":"at least part of the color variation may reflect social circumstances rather than differences in health alone.","C":"unfamiliar rivals caused fish to become healthier before their fins changed color.","D":"bright fin coloration cannot convey information about health under any circumstances."},"answer":"B","explanation":"Color changed with group composition while measured health indicators remained stable.","choice_explanations":{"A":"Incorrect: A social effect does not exclude an existing association with parasites.","B":"Correct: Color changed with group composition while measured health indicators remained stable.","C":"Incorrect: Measured health indicators did not change.","D":"Incorrect: The experiment only shows that a second factor can influence color."},"passage":"In a species of lake fish, bright blue fin patches have been treated as reliable signals of an individual’s health because healthy fish typically display deeper colors. In an experiment, however, fish moved into groups with unfamiliar rivals intensified their fin colors without measurable changes in nutrition or parasite load. Fish remaining in familiar groups did not show the same change. This result suggests that ______","strategy":"If a signal changes while its purported underlying property does not, consider additional determinants of that signal."},{"id":"INF-021","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the melon must have evolved independently on the island without human involvement.","B":"traders on the later recorded voyages necessarily introduced the island’s first melon seeds.","C":"the containers prove the exact identity of the sailors who first carried the crop.","D":"the crop reached the island before the documented voyages, potentially through earlier maritime contacts."},"answer":"D","explanation":"Pre-voyage seeds overturn the later-introduction chronology; container similarities leave an earlier route plausible but not proven.","choice_explanations":{"A":"Incorrect: Cultivated seeds and possible earlier containers do not establish independent evolution.","B":"Incorrect: The earliest seeds predate the recorded voyages.","C":"Incorrect: A resemblance does not conclusively identify individual carriers.","D":"Correct: Pre-voyage seeds overturn the later-introduction chronology; container similarities leave an earlier route plausible but not proven."},"passage":"Charred seeds of a cultivated melon were found at a remote island settlement in layers dated several centuries earlier than the first recorded voyages from a nearby continent. Some scholars had assumed that traders on those documented voyages introduced the crop. The seeds were also found in containers resembling those used by earlier, less well documented seafarers. The dates and containers together suggest that ______","strategy":"Use dates to exclude impossible timelines but avoid specifying an unproven route."},{"id":"INF-022","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"every cell in the worm’s body performs the same sensory function as a typical head cell.","B":"the animal must have evolved directly from a modern worm species with a conspicuous head.","C":"despite its unusual appearance, the worm may preserve elements of an ancestral head-related developmental program over an expanded region.","D":"the worm lacks all genetic machinery involved in forming a head."},"answer":"C","explanation":"Widespread head-associated expression suggests a distributed or expanded ancestral developmental domain, not total absence.","choice_explanations":{"A":"Incorrect: Gene-expression regions do not prove identical functions in every cell.","B":"Incorrect: Shared developmental patterns do not establish direct descent from a living species.","C":"Correct: Widespread head-associated expression suggests a distributed or expanded ancestral developmental domain, not total absence.","D":"Incorrect: Head-associated genes are active over a broad region."},"passage":"Most familiar segmented worms develop a distinct head with a concentrated set of sensory organs and then a succession of body segments. A newly studied marine worm has no obvious head, but researchers found that genes normally associated with head development were active across much of its anterior half. Genes associated with rear-segment development were largely confined to a small area at the opposite end. These results suggest that ______","strategy":"Do not assume that absence of an obvious structure means absence of its underlying developmental program."},{"id":"INF-023","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"make a ruling’s reasoning more transparent even when the judge ultimately rejects the opposing position.","B":"require judges to reach the opposite outcome whenever a philosopher disagrees with them.","C":"ensure that all legal rulings become identical in cases involving similar facts.","D":"eliminate the need for judges to present evidence from the actual dispute."},"answer":"A","explanation":"Engaging objections clarifies the reasoning behind rejection rather than mandating adoption.","choice_explanations":{"A":"Correct: Engaging objections clarifies the reasoning behind rejection rather than mandating adoption.","B":"Incorrect: Addressing an objection does not require accepting it.","C":"Incorrect: Better explanation does not guarantee uniform rulings.","D":"Incorrect: Philosophical argument does not replace case-specific evidence."},"passage":"In written rulings, judges sometimes cite thinkers whose arguments support their decisions. Legal scholar Mira Velen argues that this practice can leave unanswered objections that readers might reasonably raise. She suggests that judges also discuss influential thinkers who disagree with their conclusions, explaining why those objections fail in the specific case. Velen's proposal implies that such discussion could ______","strategy":"Infer the contribution of acknowledging opposing views, not an obligation to adopt them."},{"id":"INF-024","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the difference in employment shares demonstrates that dispatch experience is unrelated to job choice.","B":"the control center gives former dispatchers preference in hiring because managers value their prior experience.","C":"the workforce disproportion proves that dispatchers earn higher wages at the control center than elsewhere.","D":"shared workplace practices could help explain why dispatchers enter the control center without establishing that employers favor hiring them."},"answer":"D","explanation":"Transferable experience plausibly explains applicant interest but does not reveal an employer preference or wage effect.","choice_explanations":{"A":"Incorrect: The shared practices provide a plausible connection.","B":"Incorrect: The researcher explicitly lacks evidence about employer hiring preferences.","C":"Incorrect: Employment shares do not reveal wages.","D":"Correct: Transferable experience plausibly explains applicant interest but does not reveal an employer preference or wage effect."},"passage":"Former emergency dispatchers account for a small fraction of a region’s workforce but a much larger fraction of employees at its public transportation control center. Both workplaces use shift rotations, rapid incident reporting, and tightly defined chains of responsibility. A researcher suggests that prior familiarity with these practices makes control-center jobs attractive to some dispatchers. The available records, however, contain no information about employers’ hiring preferences. Consequently, ______","strategy":"Keep employee motivation, employer selection, and pay as separate hypotheses."},{"id":"INF-025","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the preference is necessarily disadvantageous to all species that live alone.","B":"such perceptual preferences need not have evolved exclusively for recognizing parents.","C":"the preference in flocking birds must be entirely learned rather than present at hatching.","D":"solitary reptiles probably provide more parental care than field observations have shown."},"answer":"B","explanation":"A similar preference in animals without parental care undermines the idea that parental recognition is the only possible adaptive explanation.","choice_explanations":{"A":"Incorrect: Its occurrence does not establish whether it helps or harms solitary species.","B":"Correct: A similar preference in animals without parental care undermines the idea that parental recognition is the only possible adaptive explanation.","C":"Incorrect: The passage describes preferences in newly hatched birds and does not test learning.","D":"Incorrect: The experiment does not challenge the reported lack of parental care."},"passage":"Among some flocking birds, newly hatched chicks tend to look longer at simple moving shapes that resemble another bird than at irregular shapes. Researchers once proposed that this preference evolved specifically to help offspring recognize parents. But a recent experiment found a similar preference in hatchlings of a solitary reptile species whose young receive no parental care and rarely encounter adults. The results suggest that ______","strategy":"Find a property shared across contexts that contradicts a claim of exclusive function, not every function."},{"id":"INF-026","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"in the artificial-pond samples, the strip distinguished the target toxin from the three alternative toxins tested.","B":"the strip’s color change identifies the exact concentration of the target toxin in a sample.","C":"the strip can reliably identify the target toxin in every body of freshwater, regardless of sediment.","D":"all algal strains other than the target are incapable of producing any toxin."},"answer":"A","explanation":"A selective color response was observed for one matrix and the tested alternatives, not all waters or toxin levels.","choice_explanations":{"A":"Correct: A selective color response was observed for one matrix and the tested alternatives, not all waters or toxin levels.","B":"Incorrect: Only presence-linked color outcomes, not concentration measurement, are reported.","C":"Incorrect: Natural waters and high-sediment mixtures were not tested.","D":"Incorrect: The other strains produced toxins that did not trigger the strip."},"passage":"A research team developed a paper strip that turns green in the presence of a toxin produced by one strain of freshwater algae. In samples drawn from a single artificial pond, strips turned green when that strain's toxin was added but remained yellow when samples contained toxins from three other algal strains. The team did not test natural lakes, mixtures with large amounts of sediment, or additional strains. The experiment suggests that ______","strategy":"Check which negatives were tested and avoid extending a validation result beyond them."},{"id":"INF-027","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the RNA treatment is certain to eradicate the vine permanently without affecting any other organisms.","B":"the broad-spectrum herbicide protects the fruit trees more effectively than the RNA treatment.","C":"a sequence-specific treatment might suppress the vine more selectively than the existing herbicide, although its field effects remain untested.","D":"the RNA molecule must alter the fruit trees’ own gene sequences in order to reduce vine seed production."},"answer":"C","explanation":"Gene-sequence targeting and greenhouse selectivity support promise, but environmental behavior and comprehensive safety are untested.","choice_explanations":{"A":"Incorrect: Neither permanent eradication nor impacts on all organisms were tested.","B":"Incorrect: The herbicide is described as harming the trees.","C":"Correct: Gene-sequence targeting and greenhouse selectivity support promise, but environmental behavior and comprehensive safety are untested.","D":"Incorrect: The molecule targets a sequence reported absent from the trees."},"passage":"A fast-spreading vine damages orchards in the fictional region of Bellos. Broad-spectrum herbicides kill the vine but also harm fruit trees. In greenhouse trials, researchers used a short RNA molecule that binds to a gene sequence found in the vine but absent from the trees, reducing seed production in treated vines without visibly affecting nearby trees. The researchers have not yet evaluated environmental persistence of the molecule. Their work suggests that ______","strategy":"Keep laboratory selectivity distinct from proven field safety or complete control."},{"id":"INF-028","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the original protein contributes to the early-flowering response, though the experiment does not show that it acts alone.","B":"the original protein is the sole regulator of flowering in all plant species.","C":"temperature can no longer affect any process in the modified plants.","D":"the replacement protein caused earlier flowering during warm nights than the original protein."},"answer":"A","explanation":"Blocking the response through one protein replacement implicates that protein but not a unique, universal mechanism.","choice_explanations":{"A":"Correct: Blocking the response through one protein replacement implicates that protein but not a unique, universal mechanism.","B":"Incorrect: The experiment investigates one species and cannot rule out other regulators.","C":"Incorrect: Only flowering time and ordinary growth were reported.","D":"Incorrect: The response disappeared rather than increased."},"passage":"A fictional plant species flowers earlier after several unusually warm nights. To investigate the response, botanists replaced one temperature-sensitive regulatory protein with a variant from a related plant whose flowering time rarely changes with night temperature. Modified plants did not flower earlier when exposed to the same warm nights, although their growth under ordinary temperatures was similar to that of unmodified plants. These findings suggest that ______","strategy":"An intervention can show a component matters without proving it is sufficient or the only component."},{"id":"INF-029","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"Rasin was certainly the sovereign because only rulers can authorize grain transfers.","B":"Rasin wielded substantial administrative authority, but it does not settle whether she formally occupied the throne.","C":"the young heir must have been fictitious because Rasin’s seal appears on military receipts.","D":"Rasin cannot have held any government position because no sovereign title appears beside her name."},"answer":"B","explanation":"Signed fiscal and military receipts demonstrate influence without resolving a disputed official title.","choice_explanations":{"A":"Incorrect: The passage does not establish that such authorization was reserved for sovereigns.","B":"Correct: Signed fiscal and military receipts demonstrate influence without resolving a disputed official title.","C":"Incorrect: The seal does not establish the heir’s existence or nonexistence.","D":"Incorrect: The receipts show she authorized significant government transactions."},"passage":"Excavations beneath the fictional capital of Vemar uncovered a seal belonging to Lady Rasin, who lived during a disputed royal succession. Inscribed receipts bearing her seal authorize payments to soldiers and transfers from the central grain store. Some historians argue that she ruled as sovereign; others think she was a powerful administrator serving the young heir. No document has yet been found bearing the title of sovereign beside her name. The new evidence suggests that ______","strategy":"Infer responsibilities from documentary evidence without turning them into an unverified formal rank."},{"id":"INF-030","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the combined scores accurately measure intelligence because both puzzles require obtaining food.","B":"dogs with limited mobility necessarily have poorer memory for visual sequences.","C":"at least some differences in the combined scores may reflect physical limitations rather than problem-solving ability.","D":"the latch puzzle is the only valid measure of canine problem-solving ability."},"answer":"C","explanation":"Lower motor-task performance alongside equal cognitive-task performance implicates a physical-demand confound.","choice_explanations":{"A":"Incorrect: A shared reward does not remove the mobility confound.","B":"Incorrect: Their visual-cue scores were comparable to others’.","C":"Correct: Lower motor-task performance alongside equal cognitive-task performance implicates a physical-demand confound.","D":"Incorrect: Performance on the latch puzzle is affected by mobility."},"passage":"Researchers assessed problem-solving in a group of rescue dogs using two puzzles. One required moving a large latch to reveal food; the other required selecting the correct door after a sequence of visual cues. Dogs with limited forelimb mobility performed poorly on the latch puzzle but as well as other dogs on the visual-cue task. An earlier report had combined scores on the two puzzles into a single measure of intelligence. These results suggest that ______","strategy":"Identify an ability needed to perform the test that is not the ability the test claims to measure."},{"id":"INF-031","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"increase use of the route more among inexperienced cyclists than among those already comfortable riding it.","B":"cause experienced cyclists to stop using the shortcut because it would become more visible.","C":"have a greater effect on riders who already use the route at night than on those who currently avoid it.","D":"eliminate all other factors that discourage new cyclists from commuting."},"answer":"A","explanation":"If darkness deters novices more than veterans, removing the deterrent offers novices more room to change behavior.","choice_explanations":{"A":"Correct: If darkness deters novices more than veterans, removing the deterrent offers novices more room to change behavior.","B":"Incorrect: No evidence links lighting improvements to reduced use among experienced riders.","C":"Incorrect: Avoidance due to darkness is reported mainly among inexperienced riders.","D":"Incorrect: Lighting is only one potential deterrent."},"passage":"A transit authority surveyed residents who cycle to commuter stations. New cyclists frequently reported avoiding a dimly lit shortcut, while cyclists who had used the route for years were nearly as willing to take it at night as during the day. Both groups agreed that brighter lighting would make the path more pleasant. The results suggest that adding lights to the shortcut could ______","strategy":"Infer which subgroup is constrained by the factor an intervention changes."},{"id":"INF-032","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the well-studied species must be declining for reasons that never affect other seabirds.","B":"the large number of published studies makes sampling bias impossible.","C":"all understudied seabirds are likely increasing because researchers have recorded few declines among them.","D":"patterns documented in those species may not represent the experiences of all seabirds equally well."},"answer":"D","explanation":"Research volume within a narrow, accessible sample does not guarantee representativeness across different ecological contexts.","choice_explanations":{"A":"Incorrect: The passage does not show wholly distinct causes across species.","B":"Incorrect: Many studies can still focus on an unrepresentative subset.","C":"Incorrect: Limited monitoring cannot support that inference.","D":"Correct: Research volume within a narrow, accessible sample does not guarantee representativeness across different ecological contexts."},"passage":"Researchers have published hundreds of studies on the decline of two conspicuous seabird species that nest near major coastal research stations. Less accessible seabird species, however, have rarely been monitored, and some occupy habitats with different predators and food supplies. A review noted that many conclusions about global seabird decline rely heavily on the two well-studied species. Consequently, ______","strategy":"Count independent populations and conditions, not just published studies, when evaluating generality."},{"id":"INF-033","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the flower’s symbolic role originated with a particular mountain rescue that the historian identified in the travel account.","B":"its association with bravery may owe more to a persuasive cultural story than to the actual difficulty of reaching it.","C":"the flower must be more difficult to collect today than it was in the nineteenth century.","D":"earlier collectors must have followed routes that were substantially more dangerous than the present-day paths."},"answer":"B","explanation":"Ordinary physical accessibility and an influential dramatic narrative together suggest a cultural origin for the symbolism.","choice_explanations":{"A":"Incorrect: No specific mountain rescue is mentioned or identified as the origin of the symbolism.","B":"Correct: Ordinary physical accessibility and an influential dramatic narrative together suggest a cultural origin for the symbolism.","C":"Incorrect: No change in access across time is reported.","D":"Incorrect: The passage provides no comparison of historical and present-day route difficulty."},"passage":"For centuries, a bright red alpine flower has symbolized daring among the inhabitants of the fictional valley of Keros. Yet field surveys show that the flower grows along trails no steeper or more remote than those leading to several ordinary valley plants. A historian traces the symbol to a popular nineteenth-century travel account that portrayed collecting the flower as a perilous achievement. Therefore, ______","strategy":"When a reputation is inconsistent with observed physical features, consider documented social origins."},{"id":"INF-034","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"all instruments must have measured the gas concentration accurately because their values differ.","B":"the gas concentration is too small to matter for wind predictions.","C":"more consistent measurements are needed before the model can confidently predict the planet’s storm patterns.","D":"one of the simulated storm patterns has been confirmed by the conflicting measurements."},"answer":"C","explanation":"Uncertain inputs produce divergent outcomes, so the model lacks a sufficiently constrained basis for a confident prediction.","choice_explanations":{"A":"Incorrect: Disagreement cannot confirm instrument accuracy.","B":"Incorrect: The model is said to depend strongly on that concentration.","C":"Correct: Uncertain inputs produce divergent outcomes, so the model lacks a sufficiently constrained basis for a confident prediction.","D":"Incorrect: The data do not establish which modeled concentration is correct."},"passage":"A model of winds on the fictional planet Ysera depends strongly on the concentration of a trace gas near the surface. The few available measurements were taken at different times and disagree substantially, so the researchers cannot determine whether the gas concentration varies seasonally or whether some instruments were poorly calibrated. Simulations run over the full plausible concentration range produce very different storm patterns. The team concludes that ______","strategy":"Connect uncertainty in a key input to uncertainty in the conclusions of a model."},{"id":"INF-035","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the importance of Lena’s story lies in what she comes to perceive rather than in any prior distinction that sets her above others.","B":"the narrator believes that ordinary lives never contain events worth describing.","C":"Lena’s extraordinary social position is the chief reason the narrator wants to tell her story.","D":"Lena is already a famous gardener whose achievements are widely misunderstood."},"answer":"A","explanation":"The narrator separates an ordinary protagonist from the significance of her eventual insight.","choice_explanations":{"A":"Correct: The narrator separates an ordinary protagonist from the significance of her eventual insight.","B":"Incorrect: The narrator says this ordinary gardener’s experience deserves attention.","C":"Incorrect: The narrator describes her as ordinary and emphasizes a later realization.","D":"Incorrect: Neither fame nor notable gardening achievements are reported."},"passage":"In the opening of a fictional novel, the narrator calls Lena an entirely ordinary gardener, with no unusual talents or ambitions. Yet the narrator repeatedly insists that the account of one particular autumn in Lena’s life deserves close attention. The narrator says that many people might have lived through such an autumn but that few would have noticed what Lena eventually noticed. The passage most strongly suggests that ______","strategy":"Separate a narrator’s praise of a story from praise of the protagonist’s status."},{"id":"INF-036","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the absence of a cooling signal proves the plateau remained warm throughout the entire period.","B":"the lowland records demonstrate that the plateau experienced exactly the same cold spells at the same dates.","C":"failure to detect a cold spell in the plateau cores does not rule out an episode too brief for the records to capture.","D":"the plateau cores must be inaccurate because they differ from the records from the lowlands."},"answer":"C","explanation":"Low-resolution records can fail to detect short events; lack of a signal is not definitive evidence of absence.","choice_explanations":{"A":"Incorrect: Coarse temporal resolution could miss a short episode.","B":"Incorrect: Nearby records do not establish identical plateau conditions.","C":"Correct: Low-resolution records can fail to detect short events; lack of a signal is not definitive evidence of absence.","D":"Incorrect: Different regions and temporal resolutions can produce different records without outright inaccuracy."},"passage":"Scientists are trying to determine whether the fictional Arlon Plateau experienced a brief cold spell 6,000 years ago. Three lake cores from the plateau contain no clear signal of cooling, but each core preserves sediment only at intervals averaging several centuries. Independent records from surrounding lowlands show shorter cold episodes that would be difficult to resolve at that sampling interval. Therefore, ______","strategy":"Ask whether the measurement process would reliably detect the claimed event if it occurred."},{"id":"INF-037","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the orchid can produce seeds only when the moth is present, regardless of human intervention.","B":"viable pollen alone does not ensure natural seed production when the orchid’s usual pollinator is unavailable.","C":"natural seed production always increases in direct proportion to the number of moths present.","D":"the moth makes the orchid’s pollen viable by exposing it to a specific chemical."},"answer":"B","explanation":"Pollen viability is present throughout, but natural pollination depends on the moth; hand pollination shows the barrier is transfer, not viability.","choice_explanations":{"A":"Incorrect: Hand pollination produced seeds without the moth.","B":"Correct: Pollen viability is present throughout, but natural pollination depends on the moth; hand pollination shows the barrier is transfer, not viability.","C":"Incorrect: The passage does not report a moth-number dose response.","D":"Incorrect: The pollen remains viable outside the moth’s active period."},"passage":"Botanists studying a rare orchid found that its pollen remains viable for weeks, yet naturally growing plants set seeds only during a brief period when a particular moth is active. In a greenhouse, researchers successfully produced seeds by transferring pollen by hand outside that period. The findings imply that ______","strategy":"Identify what is necessary under natural conditions and distinguish it from conditions altered experimentally."},{"id":"INF-038","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice is best supported by the text?","choices":{"A":"The amendment has a consistent yield-increasing effect across all tested plots.","B":"The researchers have proven that the amendment’s only effect on plants is to change root aeration.","C":"Irrigation has no influence on wheat yield when planting date and seed variety are controlled.","D":"The amendment’s effect on yield depends at least partly on the water conditions in which it is used."},"answer":"D","explanation":"The same amendment helps in dry conditions and hurts in wet ones, demonstrating a condition-dependent effect.","choice_explanations":{"A":"Incorrect: Its effect was negative in frequently irrigated plots.","B":"Incorrect: The proposed moisture and aeration mechanisms are suspected, not exhaustively established.","C":"Incorrect: The study demonstrates an interaction between irrigation conditions and the amendment.","D":"Correct: The same amendment helps in dry conditions and hurts in wet ones, demonstrating a condition-dependent effect."},"passage":"In a controlled study, adding a soil amendment increased wheat yield in plots with little rainfall. In plots receiving frequent irrigation, the same amendment slightly reduced yield relative to untreated controls. The amendment changed neither seed variety nor planting date. Researchers suspect that it helps roots retain moisture when water is scarce but interferes with aeration when soil is wet.","strategy":"Compare the sign of an intervention’s effect across conditions before accepting an overall claim."},{"id":"INF-039","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"School B must have far more students than School A because it offers more advanced courses.","B":"School B’s completion rate is higher within each course level, so the overall comparison is affected by the schools’ different mixes of course levels.","C":"advanced-course students at both schools always fail more often because their teachers are less effective.","D":"School A has a higher completion rate within both course levels because its overall completion rate is higher."},"answer":"B","explanation":"A higher overall rate can be produced by enrolling a larger share in the easier-to-complete level even when subgroup rates are lower.","choice_explanations":{"A":"Incorrect: Course proportions and completion rates do not show total enrollment.","B":"Correct: A higher overall rate can be produced by enrolling a larger share in the easier-to-complete level even when subgroup rates are lower.","C":"Incorrect: Lower completion rates do not establish teacher effectiveness as a cause.","D":"Incorrect: School B has higher rates in each separately reported level."},"passage":"At School A, 80 percent of students take an introductory course, and 90 percent of those students complete it; among its advanced-course students, 30 percent complete the course. At School B, only 20 percent take the introductory course, but completion rates are 92 percent in introductory courses and 35 percent in advanced courses. School A has a higher overall course-completion rate. The data nevertheless indicate that ______","strategy":"Check rates within comparable groups before attributing an aggregate difference to performance."},{"id":"INF-040","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the anemones lose algae only when water reaches exactly 28°C.","B":"the anemones will never lose algae at any temperature below 27°C.","C":"algal loss must increase by the same amount for every one-degree rise in temperature.","D":"a substantial change occurs somewhere between the tested temperature ranges, but its precise onset cannot be determined from these trials."},"answer":"D","explanation":"Loss is absent at up to 25°C and substantial at 27°C and above, leaving the transition location and shape unresolved.","choice_explanations":{"A":"Incorrect: Algal loss was also observed at 27°C.","B":"Incorrect: Untested temperatures between 25°C and 27°C might already produce loss.","C":"Incorrect: The evidence does not establish a linear response or sample intermediate values.","D":"Correct: Loss is absent at up to 25°C and substantial at 27°C and above, leaving the transition location and shape unresolved."},"passage":"In aquarium trials, a species of sea anemone tolerated water temperatures between 18°C and 25°C without measurable loss of the algae living in its tissues. At 27°C and 28°C, however, the anemones lost much of that algae within two days. The researchers did not test intermediate temperatures and do not know whether the response begins gradually or abruptly. Thus, ______","strategy":"Do not infer continuity, slope, or exact threshold when only a few points are measured."},{"id":"INF-041","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice is best supported by the text?","choices":{"A":"The experiments demonstrate that grooves with the observed pattern could not have formed naturally.","B":"The grooves definitely record the movements of tail-dragging animals because they appear in parallel lines.","C":"The grooves definitely resulted from a flood because no footprints were preserved.","D":"Without additional diagnostic evidence, the grooves alone cannot establish whether animals or branches produced them."},"answer":"D","explanation":"Two mechanisms independently reproduce the same traces, and distinguishing remains are absent.","choice_explanations":{"A":"Incorrect: Both suggested mechanisms are natural and reproduced similar marks.","B":"Incorrect: Parallel grooves are also compatible with dragged branches.","C":"Incorrect: Footprints could have failed to preserve even if animals made the grooves.","D":"Correct: Two mechanisms independently reproduce the same traces, and distinguishing remains are absent."},"passage":"A series of parallel grooves in an ancient riverbed could have been made by animals dragging their tails while walking, or by floating branches scraping the bottom during a flood. The grooves are similar in width and spacing, and neither clear footprints nor associated wood fragments have been preserved. Both mechanisms have produced comparable marks in modern sediment experiments.","strategy":"When two competing explanations predict the observed outcome, withhold a unique identification."},{"id":"INF-042","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the website-visit data conclusively show that the literacy classes became less effective at teaching students.","B":"all visitors to the enrollment website had already completed the literacy course.","C":"greater visibility of the classes need not translate into a corresponding increase in sustained attendance.","D":"a doubling of website visits guarantees twice as many students will finish the course."},"answer":"C","explanation":"Website interest increased without a matching rise in sustained student participation.","choice_explanations":{"A":"Incorrect: Visits do not measure instructional effectiveness.","B":"Incorrect: The passage gives no visitor-level history.","C":"Correct: Website interest increased without a matching rise in sustained student participation.","D":"Incorrect: Sustained attendance remained nearly unchanged."},"passage":"After a city installed new signs advertising its free adult-literacy classes, visits to the enrollment website doubled. The number of new students attending at least four sessions, however, stayed nearly unchanged. A program administrator argues that the advertising was ineffective, while a colleague notes that website visits reflect initial interest rather than sustained participation. Based on the text, the colleague would most likely agree that ______","strategy":"Differentiate leading indicators or attention metrics from the outcome of interest."},{"id":"INF-043","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Based on the text, which statement would the biologist most likely agree with?","choices":{"A":"The fish increase proves that reeds alone can restore the marsh even without tidal water.","B":"Neither reeds nor tidal flooding can affect fish populations because the restoration used both at once.","C":"The blocked channel shows that water access matters, but it does not establish that the reeds were irrelevant when both measures operated together.","D":"The channel experiment demonstrates that removing reeds would have no effect while tides are restored."},"answer":"C","explanation":"The intervention tests one needed condition but cannot eliminate a possible interaction with sheltering reeds.","choice_explanations":{"A":"Incorrect: The fish increase stopped when the channel was blocked.","B":"Incorrect: The experiment supplies evidence that water access matters, though the reeds’ separate contribution remains unmeasured.","C":"Correct: The intervention tests one needed condition but cannot eliminate a possible interaction with sheltering reeds.","D":"Incorrect: The experiment altered water access, not the presence of reeds."},"passage":"A restoration project reintroduced reeds to a damaged marsh and also reopened a channel that allowed periodic tidal flooding. Fish populations increased in the restored area. In a later test, workers temporarily blocked the channel while leaving the reeds intact; the fish increase stopped. Some observers concluded that reeds had played no role in the initial recovery. A project biologist, however, noted that reeds provide shelter only when enough water reaches them.","strategy":"A failed outcome after removing one factor shows that factor may be required, not that every remaining factor is useless."},{"id":"INF-044","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"removing any dam will guarantee increased fish populations after exactly three seasons.","B":"benefits for the spawning fish may appear only after the habitat changes initiated by dam removal have had time to develop.","C":"dam removal reduced spawning opportunities in the long term because fish were initially scarce.","D":"the fish increase must have occurred before gravel began accumulating."},"answer":"B","explanation":"Habitat changes preceded the delayed population response, consistent with reproduction depending on stable gravel.","choice_explanations":{"A":"Incorrect: The record concerns one river and does not establish a universal timeline.","B":"Correct: Habitat changes preceded the delayed population response, consistent with reproduction depending on stable gravel.","C":"Incorrect: Fish later increased as the gravel beds stabilized.","D":"Incorrect: The passage gives the opposite sequence."},"passage":"When a small dam was removed from a mountain river, gravel began accumulating in the former reservoir within months. Spawning fish remained scarce during the first two seasons but became noticeably more abundant in the third and fourth seasons, after gravel beds had stabilized. Scientists note that these fish typically need stable gravel to reproduce successfully. The observations suggest that ______","strategy":"Check whether an intervention’s expected outcome requires an intermediate process that takes time."},{"id":"INF-045","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Based on the text, which statement would the biologist most likely agree with?","choices":{"A":"Higher traffic levels always cause every individual bird to sing at precisely the same pitch.","B":"The birds change pitch only because their species composition changes between Sunday and Monday.","C":"Streetlights are definitely the sole cause of the pitch change because they remain in place all week.","D":"Variation in traffic noise contributes to song pitch, although the observations do not exclude every other influence."},"answer":"D","explanation":"Pitch covaries with traffic while lighting is relatively stable, which favors the noise hypothesis without proving it exclusive.","choice_explanations":{"A":"Incorrect: Average changes do not establish identical individual behavior.","B":"Incorrect: No change in species composition is documented.","C":"Incorrect: A factor that remains nearly constant does not readily explain a recurring day-specific change.","D":"Correct: Pitch covaries with traffic while lighting is relatively stable, which favors th
