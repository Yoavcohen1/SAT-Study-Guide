.","strategy":"Consider the relevant comparison class. Challenging the diagnostic value of a resemblance is not proving that contact never happened."},{"id":"CTC-024","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would the second trial's author most likely respond to the evaluator?","choices":{"A":"The original conclusion concerns acoustic quality, whereas the second trial evaluates relevance and therefore cannot inform an explanation of passengers' ratings.","B":"Expectations influence reception of the unchanged tone sequence, so its acoustic properties may contribute to annoyance without fully explaining it.","C":"The tone sequence should replace the familiar chime because informing passengers of its purpose eliminates the features that caused unfavorable ratings.","D":"The familiar chime received better ratings because passengers associated it with the arrival of their service, an association the report failed to measure."},"answer":"B","explanation":"An unchanged sound receives different ratings under different preparation, but the shared harshness judgment preserves an intrinsic contribution.","choice_explanations":{"A":"The second trial directly measures ratings of the same sound; the relevance manipulation is pertinent to their explanation.","B":"An unchanged sound receives different ratings under different preparation, but the shared harshness judgment preserves an intrinsic contribution.","C":"Harshness persists, and the second trial does not establish comparative superiority to the familiar chime.","D":"The trial offers a possible contextual influence but does not establish why the familiar chime was rated better in the original comparison."},"text_1":"An evaluator attributes passengers' annoyance with a new station alert to its unusual tone sequence. Since passengers rated the sound less favorably than a familiar chime, the evaluator concludes that the sequence itself is poorly suited to public announcements. The report treats the setting in which passengers first heard it as incidental.","text_2":"A second trial used the identical sequence. One group heard it without explanation while waiting; another was told beforehand that it would signal the arrival of the specific service they needed. The second group rated the sound more favorably, though both groups sometimes described its tone as harsh. The trial's author argues that perceived relevance affects reception without making the sound's acoustic properties irrelevant.","strategy":"A demonstrated contextual effect need not explain the entire original comparison. Prefer a bounded qualification to an invented complete causal story."},{"id":"CTC-025","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would Leda most likely respond to the historian's account?","choices":{"A":"The records complicate both the proposed chronology and the replacement sequence: numbering existed earlier, while the two systems continued to serve different destinations.","B":"The records show that landmark directions were more efficient than numbering for homes, which explains why the survey failed to make numbering feasible.","C":"The records support the proposed sequence but require moving its final stage to year 784, when numbering definitively replaced landmark directions throughout the city.","D":"The records concern different destinations, so they cannot challenge the proposed sequence unless warehouses and homes are shown to have received identical deliveries."},"answer":"A","explanation":"Directly dated evidence supports earlier occurrence and continuing purpose-dependent coexistence, not merely late adoption in outer districts.","choice_explanations":{"A":"Directly dated evidence supports earlier occurrence and continuing purpose-dependent coexistence, not merely late adoption in outer districts.","B":"Continued use does not establish comparative efficiency, and numbering was already in use; the survey is not shown to have failed.","C":"Both systems coexist in the earlier and later records; year 784 is not established as an exact origin or citywide replacement date.","D":"The records directly concern the use and persistence of the two address systems; identical cargo is not a necessary condition for their relevance."},"text_1":"A history of the fictional city of Orven presents numbered addresses as the final stage in a progression away from landmark-based directions. A reconstruction of the city's mapping system suggests that consistent numbering became feasible only after a survey in year 810. The historian therefore dates the replacement of landmark directions to that survey, while allowing that some outer districts adopted numbers later.","text_2":"Historian Leda found dated delivery books from year 784 that use numbered addresses for warehouses and landmarks for nearby homes. Books from after the survey continue this division, and the same messengers use both systems according to the kind of destination. Leda treats the records as evidence of earlier numbering and persistent coexistence, not as proof of the exact year in which either system originated.","strategy":"Check chronology and relationship separately. Correcting the date alone will not repair a mistaken replacement model."},{"id":"CTC-026","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would the study's author most likely respond to the critic?","choices":{"A":"The glossary should be expanded because readers' understanding increases in direct proportion to the amount of explanatory information an edition contains.","B":"The critic underestimates the glossary's universal necessity, since recognizing ceremonial roles depends on consulting the entries regardless of previous knowledge.","C":"The glossary's brevity and limited use by knowledgeable readers do not establish a merely decorative role, since it can supply interpretive distinctions that novices otherwise lack.","D":"The glossary is decorative for novices but informative for experts, since recognizing its scholarly appearance requires knowledge of the terms before reading."},"answer":"C","explanation":"The contribution is both functionally important and dependent on readers' prior knowledge; neither page count nor expert nonuse refutes it.","choice_explanations":{"A":"The study emphasizes relationships rather than quantity and does not establish a proportional effect or propose expansion.","B":"Experienced readers can make the distinction without consulting the glossary; the role is not universally necessary.","C":"The contribution is both functionally important and dependent on readers' prior knowledge; neither page count nor expert nonuse refutes it.","D":"This reverses the observed contribution and substitutes an aesthetic purpose for an interpretive one."},"text_1":"A critic argues that the glossary accompanying a fictional travel narrative is merely decorative. Glossary entries occupy few pages, and experienced readers often finish the narrative without consulting them. The critic concludes that the glossary cannot be important to how the work conveys its account of unfamiliar customs, even if it makes the edition look more scholarly.","text_2":"A reading study found that novices who consulted the glossary recognized that several apparent descriptions of personal traits actually referred to ceremonial roles. Experienced readers often made the same distinction without consulting it because they already knew the relevant terms. The study's author argues that the glossary supplies interpretive relationships rather than a large quantity of information, and that its contribution depends partly on the knowledge readers bring.","strategy":"Do not convert conditional importance into either universal necessity or total insignificance."},{"id":"CTC-027","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would the educator most likely respond to the director's proposal?","choices":{"A":"The proposal should be delayed only until a larger sample confirms the absence of first-draft improvement during the same four-week period.","B":"The proposal overlooks the educational value of enjoyment, which the longer study establishes as the mechanism responsible for improved revisions.","C":"The initial result warrants scrutiny but not necessarily removal, since workshop structure, the writing outcome measured, and the evaluation period may all affect the judgment.","D":"The proposal is contradicted by the second program, whose results show that keeping the original workshops unchanged will improve first drafts after ten weeks."},"answer":"C","explanation":"The educator concedes the weak evidence and possible distraction but proposes redesign and more appropriate outcome and time comparisons.","choice_explanations":{"A":"A larger sample in the same format, outcome, and period does not address the distinctions the educator considers important.","B":"Both authors reject enjoyment alone as proof; the study does not identify enjoyment as the mechanism.","C":"The educator concedes the weak evidence and possible distraction but proposes redesign and more appropriate outcome and time comparisons.","D":"The second workshops used explicit criteria, improved revisions rather than first drafts, and do not guarantee transfer to unchanged workshops."},"text_1":"After four weeks of peer-review workshops, a writing program found no improvement in students' first drafts. Its director argued that feedback from inexperienced classmates distracts from sound instruction and proposed removing workshops from the curriculum. The director acknowledged that students enjoyed the sessions but insisted that enjoyment was not a substitute for improved writing.","text_2":"An educator agrees that enjoyment alone cannot establish effectiveness and that unstructured peer comments can be distracting. In another program, workshops using explicit revision criteria produced little immediate change in first drafts, but students' later revisions improved over ten weeks. The educator favors restructuring the workshops and evaluating both drafting and revision over a longer period, rather than assuming that all workshop formats produce the same outcomes.","strategy":"List the dimensions that changed: format, outcome, and time. A half-true option often preserves one and silently substitutes another."},{"id":"CTC-028","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would Dalen most likely characterize the survey team's interpretation?","choices":{"A":"As resting on a model match that does not uniquely discriminate between relevant possibilities, because a physically demonstrated alternative produces the same measured signature.","B":"As secure unless excavation reveals that the measured echoes were shorter than the survey reported, since correct durations are sufficient to identify empty chambers.","C":"As contradicted by the test-bed experiment, which establishes that compact wet clay rather than buried rooms caused the echoes at the surveyed site.","D":"As premature only because the model has not yet been applied to enough sites, a limitation that could be resolved by collecting more echoes of the same type."},"answer":"A","explanation":"The experimental counterexample undermines diagnostic uniqueness without disproving the observations or proving the site contains clay.","choice_explanations":{"A":"The experimental counterexample undermines diagnostic uniqueness without disproving the observations or proving the site contains clay.","B":"The challenge concerns the interpretation of correct durations; a reporting error is unnecessary.","C":"Demonstrating an alternative cause in a test bed does not identify the actual cause at the site.","D":"More occurrences of a nonunique signature would not by themselves distinguish chambers from the demonstrated alternative."},"text_1":"An archaeological survey uses a model linking long underground echoes to empty chambers. At one site, several echoes fit the modeled chamber signature, and the survey team concludes that buried rooms are probably present. The team argues that the close match between predicted and measured echo durations supports the interpretation even without excavation.","text_2":"Physicist Dalen reproduced the same echo signature in a test bed containing compact wet clay but no empty spaces. Dalen does not dispute the field measurements or rule out chambers at the site. Instead, the experiment shows that the model's signature is not specific to chambers; distinguishing the explanations would require information about subsurface composition that the survey did not collect.","strategy":"Model fit is not uniqueness. Repetition of the same ambiguous indicator does not necessarily resolve the ambiguity."},{"id":"CTC-029","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would Oren most likely respond to the report?","choices":{"A":"Its interpretation remains valid for essays with low clicks because display position can explain increased attention but not a lack of attention.","B":"Its interpretation treats access to the same comparison set and independence from presentation as given, although the findings show that neither assumption is warranted.","C":"Its main limitation is that it compares essays across groups rather than across platforms, so the remedy is to repeat the analysis on a second reading service.","D":"Its conclusion is wrong because the position effect proves that all essays are equally appealing when exposed to the same readership."},"answer":"B","explanation":"Filtering challenges the shared-choice-set premise; position effects challenge an exclusively intrinsic interpretation of clicks.","choice_explanations":{"A":"Position affects relative opportunity to be clicked; the text gives no basis for exempting low-click essays from the concern.","B":"Filtering challenges the shared-choice-set premise; position effects challenge an exclusively intrinsic interpretation of clicks.","C":"A second platform does not inherently control exposure sets or display positions, the actual sources of concern.","D":"A position effect does not establish equality of intrinsic appeal, which Oren explicitly does not deny."},"text_1":"A report interprets an online reading platform's click counts as a competition among essays based primarily on their intrinsic appeal. Since every essay is listed on the platform, the report assumes that readers can compare the same alternatives. The report also treats display position as irrelevant to the counts. Essays with consistently fewer clicks are therefore described as less appealing to the readership as a whole.","text_2":"Researcher Oren found that recommendation filters expose different groups to different subsets of essays. Among essays that do appear together, moving an unchanged essay higher in the display increases its clicks. Oren does not deny differences in appeal, but argues that the observed counts reflect both which comparisons readers can make and how the alternatives are presented.","strategy":"Check access before comparison and presentation before attribution. Do not infer equal quality from unequal opportunity."},{"id":"CTC-030","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would Teren most likely evaluate the managers' inference?","choices":{"A":"The field decline should be attributed entirely to occupancy and wash size, because the controlled test's small effect is inconsistent with the managers' larger estimate.","B":"The three-day test cannot provide evidence about efficiency until it measures wear, although the month-long field decline establishes the immediate design effect.","C":"Controlled evidence supports some design-related savings, but the field decline does not isolate their magnitude and the short tests do not establish their year-long durability.","D":"The controlled test validates the yearly projection, since an effect observed with identical loads demonstrates that changing occupancy cannot affect the measured savings."},"answer":"C","explanation":"The account selectively supports the mechanism while limiting conclusions about size and persistence.","choice_explanations":{"A":"Different effect sizes do not prove that the design contributed nothing to the field decline.","B":"The short controlled test can support immediate efficiency; the uncontrolled field result does not isolate the design effect.","C":"The account selectively supports the mechanism while limiting conclusions about size and persistence.","D":"The controlled comparison does not isolate the field effect or establish durability over wear and a full year."},"text_1":"A residence hall used less electricity during the first month after installing a new laundry drum. Its managers attributed the decline to the drum's design and projected comparable savings throughout the coming year. They treated the size of the first-month decline as a practical estimate of the design's continuing effect.","text_2":"Engineer Teren notes that occupancy and average wash size also fell during that month. In a separate controlled test, the new drum used slightly less electricity than the old one for identical loads, providing evidence of some design-related savings. That test lasted three days and did not address wear. Teren therefore distinguishes support for a modest efficiency effect from support for the managers' estimate of its size and durability.","strategy":"Decompose a conclusion into existence, size, cause, and duration. Evidence may support one component without supporting the rest."},{"id":"CTC-031","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would Veren most likely respond to the essay?","choices":{"A":"The essay correctly identifies a developmental difference but reverses its direction, since sparse maps are more attractive and therefore belong to a more advanced stage.","B":"The essay should reserve its claim for maps from different cartographers, since maps by one maker cannot differ substantially in the amount of information they communicate.","C":"The essay understates the importance of annotation, since adding more labels would necessarily preserve every relationship currently represented by the sparse symbols.","D":"The essay mistakes visible quantity for both functional complexity and developmental position, since sparse symbols can encode interdependent relationships within a mature alternative strategy."},"answer":"D","explanation":"The same-period maps and relational functions challenge both the proposed sequence and the quantity-based complexity inference.","choice_explanations":{"A":"Neither a reversed chronology nor beauty as a measure of advancement is supported.","B":"Maps by one maker can differ in visible density and function; the proposed restriction does not follow.","C":"No result about adding labels or necessary preservation of relationships is given.","D":"The same-period maps and relational functions challenge both the proposed sequence and the quantity-based complexity inference."},"text_1":"An essay on mapmaking proposes that densely annotated maps represent a later, more developed stage than maps using a handful of symbols. The essay acknowledges that sparse maps can be attractive but argues that their limited visible information reflects an early approach, before mapmakers learned to encode complex relationships systematically.","text_2":"Scholar Veren studied maps made by the same cartographer within one decade. Some were densely labeled reference maps; others used only four symbols whose positions encoded ownership, access rights, and seasonal restrictions together. Removing one symbol from the sparse maps could change several relationships at once. Veren argues that density reflects different representational strategies here, not a developmental sequence or a simple measure of complexity.","strategy":"Quantity, complexity, and chronology are distinct. An author rejecting their conflation need not rank the supposedly simpler form as superior."},{"id":"CTC-032","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would the study's author most likely respond to the manager's proposal?","choices":{"A":"By suggesting that changes in orientation offer a way to improve access while retaining the arrangement, without assuming that every visitor will prefer the resulting experience.","B":"By claiming that ecological organization is scientifically superior and therefore should remain even if changes to presentation cannot improve public access.","C":"By denying that the arrangement ever caused genuine confusion, since visitors' preferences for familiar categories explain their complaints without reference to navigation.","D":"By agreeing that reorganization is ultimately required, because the remaining preference for familiar categories establishes the failure of explanatory signs."},"answer":"A","explanation":"The unchanged arrangement becomes easier to navigate through altered preparation, while residual preferences remain.","choice_explanations":{"A":"The unchanged arrangement becomes easier to navigate through altered preparation, while residual preferences remain.","B":"The author's argument uses evidence of improved access rather than dismissing accessibility in favor of scientific value.","C":"Navigation errors are measured and decline; the study does not deny the original confusion.","D":"Remaining preference does not negate reduced errors or establish that replacement is necessary."},"text_1":"A garden manager argues that arranging plants by ecological relationship rather than familiar categories inevitably confuses visitors. After complaints about navigation, the manager proposes reorganizing the entire collection. The proposal accepts the scientific value of the present arrangement but treats public accessibility as incompatible with retaining it.","text_2":"A visitor study retained the plant arrangement and changed the paths' introductory signs to explain the relationships visitors would encounter. Navigation errors declined, though some visitors still preferred familiar categories. The study's author argues that orientation can make an unfamiliar arrangement easier to use and that complaints about its current presentation do not, by themselves, establish the necessity of replacing its organizing principle.","strategy":"A contextual remedy can weaken the case for replacement even without resolving every preference or difficulty."},{"id":"CTC-033","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would Evin most likely evaluate the field team's interpretation?","choices":{"A":"The enclosure supports a color preference, but unequal field access leaves its contribution to the persistent visitation pattern unresolved.","B":"The enclosure establishes that color preference is the principal field cause, because holding access constant reveals a preference consistent with the observed pattern.","C":"The field team can separate the explanations by extending observations into another season while leaving access differences unchanged across the plots.","D":"The field pattern should be attributed to accessibility alone, because a stable access difference makes the modest enclosure preference irrelevant to actual visits."},"answer":"A","explanation":"Independent evidence supports some color preference, while the field setting fails to provide comparable access needed to isolate its contribution.","choice_explanations":{"A":"Independent evidence supports some color preference, while the field setting fails to provide comparable access needed to isolate its contribution.","B":"Showing some preference under equal access does not establish that it is the principal cause under unequal field access.","C":"Repeating a stable confound without separating access and color does not identify their relative effects.","D":"Evin accepts a color influence; accessibility does not establish that color contributes nothing in the field."},"text_1":"A field team observed that insects visited red flowers more often than pale flowers throughout a flowering season. Because the pattern recurred in several plots, the team interpreted it as evidence that color preference largely determined the field distribution of visits. The team treated the persistence of the pattern as protection against explanations based on temporary differences in access.","text_2":"Researcher Evin found that red flowers were consistently at heights accessible to the insects, whereas many pale flowers remained above their usual flight range. In a controlled enclosure with equally accessible artificial flowers, the insects showed a modest preference for red. Evin accepts that color can influence choice but argues that stable accessibility differences can also produce a stable field pattern; repetition across time does not separate those effects.","strategy":"Independent support for a mechanism does not establish its relative contribution in a confounded setting. A stable pattern can reflect a stable confound."},{"id":"CTC-034","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would the educator most likely respond to the recommendation?","choices":{"A":"The recommendation conflates early task completion with independent understanding and overlooks a preparatory change that can preserve exploration while supporting the latter outcome.","B":"The recommendation overlooks that unguided exploration invariably produces better transfer, which the pilot establishes without changing visitors' preparation.","C":"The recommendation is contradicted because the orientation eliminated visitors' initial uncertainty and enabled them to complete exploration tasks faster than instructed visitors.","D":"The recommendation should be implemented until exploration stations can match fixed instructions in first-hour completion, the shared educational goal of both authors."},"answer":"A","explanation":"The pilot retains exploration, changes preparation, and distinguishes a later transfer outcome from initial completion speed.","choice_explanations":{"A":"The pilot retains exploration, changes preparation, and distinguishes a later transfer outcome from initial completion speed.","B":"Preparation changed, and one pilot does not establish an invariable effect of completely unguided exploration.","C":"The passage does not claim elimination of uncertainty, and initial completion remained slower.","D":"Independent understanding is the stated educational goal; the educator challenges using completion speed as its stand-in."},"text_1":"A science-center evaluation found that first-time visitors using open-ended exploration stations completed fewer tasks in their first hour than visitors following fixed instructions. The evaluator recommended removing the exploration stations, arguing that their lack of direction made them ineffective for developing independent understanding. The report treated early task completion as a useful stand-in for that educational goal.","text_2":"An educator accepts that unexplained exploration can leave newcomers unsure how to proceed. In a pilot, a brief orientation was added without converting the stations into fixed sequences. Initial completion remained slower, but visitors performed better on a related unfamiliar task a week later than visitors who had followed fixed instructions. The educator argues for preserving room for exploration while improving preparation and measuring the understanding the program aims to develop.","strategy":"Keep format, preparation, immediate performance, and later transfer separate. An improvement in the target outcome need not improve every proxy."},{"id":"CTC-035","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would Peren most likely assess the catalog's method?","choices":{"A":"The sequence remains the best explanation because a production-cost model outweighs surviving orders, but the emblem should be ignored in all future attribution work.","B":"The attribution remains secure because borrowed stamps reproduce an emblem only approximately, although the dated orders undermine the proposed stylistic sequence.","C":"The catalog should reverse its stylistic sequence and attribute the panels to the workshops that borrowed the stamps, because the contracts identify those workshops as the actual makers.","D":"Documentary evidence weakens a one-way stylistic sequence, while the lending of stamps makes the emblem insufficient on its own to establish workshop origin."},"answer":"D","explanation":"The evidence independently challenges chronological ordering and unique attribution, without supplying complete replacement dates or origins.","choice_explanations":{"A":"The model is not given priority over direct records, and nonunique evidence need not be entirely worthless in combination with other evidence.","B":"No difference in stamped appearance is given. This option pairs a correct chronological objection with an invented rescue of attribution.","C":"Alternation is not a reversed sequence; lending contracts do not identify these particular panels' makers.","D":"The evidence independently challenges chronological ordering and unique attribution, without supplying complete replacement dates or origins."},"text_1":"An art catalog dates a set of stamped metal panels to a workshop's supposed transition from hand finishing to machine finishing. Its historian treats the two surface styles as successive stages and attributes all panels bearing a particular small emblem to that workshop. A model of production costs makes simultaneous use of both finishing styles seem unlikely, reinforcing the proposed sequence.","text_2":"Historian Peren found dated orders showing the workshop alternating between both finishes for different clients after acquiring its machines. Separate contracts show that emblem stamps were loaned between workshops, although the particular panels' production records have not survived. Peren argues that the catalog's assumptions about both sequence and attribution need reconsideration, without claiming to know where or when every panel was made.","strategy":"When an answer contains two claims, validate both. A valid objection to dating can be paired with a fabricated conclusion about authorship."},{"id":"CTC-036","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would Nalen most likely respond to the reviewer?","choices":{"A":"The reviewer's recommendation is sound for novices but not experts, because the introductory explanation works only after students have independently mastered the controls.","B":"The reviewer overstates the initial confusion, which disappears because the improved introduction replaces exploration with a prescribed sequence of simulated trials.","C":"The reviewer undervalues the organizing role of the brief instructions and treats a remediable problem of preparation as grounds for rejecting the interactive format.","D":"The reviewer should retain the simulation because entertainment is itself sufficient evidence of learning, regardless of the role of written instructions or novice preparation."},"answer":"C","explanation":"The brief text governs meaningful comparisons, and contextual preparation reduces a conceded obstacle without replacing the format.","choice_explanations":{"A":"The introduction reduces novices' errors; prior independent mastery is not required.","B":"Exploratory freedom is retained, and reduced errors are not the same as disappearance of all confusion.","C":"The brief text governs meaningful comparisons, and contextual preparation reduces a conceded obstacle without replacing the format.","D":"Nalen argues from instructional function and reduced errors, not from enjoyment alone."},"text_1":"A curriculum reviewer argues that a simulation-based lesson is mainly entertainment because its written explanations occupy only a few screens. Novices also misinterpret several controls on their first attempt. The reviewer therefore recommends replacing the simulation with a conventional explanatory lesson, reasoning that the sparse prose and initial confusion show that the interactive elements are distractions from learning.","text_2":"Educator Nalen notes that short instructions establish the comparisons students must make between successive simulated trials; removing them changes what students can infer from the activity. A brief introduction to the controls also reduces novices' errors without reducing their freedom to explore. Nalen accepts that unexplained controls can obstruct learning but favors improving the introduction rather than treating the simulation's format as educationally empty.","strategy":"A small amount of guidance can organize an activity. Improving how it is introduced is different from replacing the activity."},{"id":"CTC-037","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, which statement would both authors most likely agree with?","choices":{"A":"Beginners misunderstand the techniques mainly because the specialist account lacks a sufficiently precise explanation of how the techniques differ.","B":"Replacing specialist terms with familiar expressions is necessary to make a scholarly account useful to readers without prior training.","C":"An account can have substantial scholarly value while still requiring changes that help its intended nonspecialist readers understand distinctions within its subject.","D":"Technical terms should be retained in public editions because acquiring specialists' distinctions is more important than making an account immediately accessible."},"answer":"C","explanation":"Both praise the account's substance, identify a barrier for newcomers, and propose a public-facing change; they disagree about replacement versus explanation.","choice_explanations":{"A":"Both locate the access problem in unexplained terminology for newcomers, not an established lack of precision in the specialist account.","B":"Text 2 explicitly proposes defining and retaining terms as an alternative to replacement.","C":"Both praise the account's substance, identify a barrier for newcomers, and propose a public-facing change; they disagree about replacement versus explanation.","D":"Only Text 2 favors retention, and neither author frames accessibility as less important than specialist distinctions."},"text_1":"The catalog's account of a regional craft is valuable to specialists, but its unexplained technical terms prevent many new readers from understanding what distinguishes one technique from another. A public edition should therefore replace those terms with familiar expressions. Scholarly value does not excuse barriers that prevent the intended audience from using the account.","text_2":"The catalog offers a substantial account of the craft, yet beginners given its unexplained terminology often draw incorrect distinctions among techniques. Rather than replace the terminology, a public edition should define it through paired examples. These examples would address the barrier while allowing beginners to acquire distinctions that specialists use.","strategy":"For agreement questions, prove every clause from both texts. A well-supported recommendation in only one text is not common ground."},{"id":"CTC-038","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, which proposition is supported by both authors' accounts?","choices":{"A":"The residue's composition is established, and an explanation relying exclusively on ordinary weathering is inadequate to account for it.","B":"The heating system contributed to the residue, but information about earlier coatings is needed to determine whether it was the only source.","C":"The residue's composition makes smoke a more probable explanation than protective coatings, although either remains physically possible.","D":"Laboratory comparison can determine the actual source of a residue whenever it eliminates a previously proposed explanation such as weathering."},"answer":"A","explanation":"Both accept the measurements and exclusion of weathering alone, even though only the first selects smoke as the specific explanation.","choice_explanations":{"A":"Both accept the measurements and exclusion of weathering alone, even though only the first selects smoke as the specific explanation.","B":"Text 2 does not establish any contribution by the heating system; the option smuggles in the disputed attribution.","C":"Text 2 supplies no ranking of smoke and coating; Text 1 does not consider the coating alternative.","D":"Text 2 specifically shows why eliminating one explanation need not identify the actual source."},"text_1":"Chemical tests on a building's stonework confirmed a dark residue. Ordinary weathering had been suggested as its source, but laboratory comparisons show that weathering alone cannot produce the residue's composition. The investigators therefore attribute it to smoke from an old heating system, which can produce the same composition.","text_2":"The comparisons do exclude ordinary weathering alone as the explanation, and there is no reason to doubt the residue's measured composition. However, a protective coating once used on similar stonework can also produce that composition as it ages. Without evidence about earlier coatings on this building, attributing the residue specifically to the heating system remains uncertain.","strategy":"Eliminating one candidate does not select another unless the candidates are exhaustive. Shared evidence need not entail a shared attribution."},{"id":"CTC-039","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Based on the texts, how would the evaluator in Text 1 most likely respond to the findings in Text 2?","choices":{"A":"They refute the rejection because matching the conventional interface after two months shows that the coded system meets the terminal's first-use requirement.","B":"They demonstrate learnability for returning users but do not resolve the first-use difficulty that matters for the evaluator's stated decision about this terminal.","C":"They justify retaining the coded interface until new visitors have used it repeatedly, because the evaluator treats long-term improvement as the decisive outcome.","D":"They should be dismissed because any initially confusing interface must remain confusing despite repeated practice or greater familiarity."},"answer":"B","explanation":"The evaluator explicitly allows learning but prioritizes one-time novice performance; repeated-user improvement addresses a different criterion.","choice_explanations":{"A":"Later performance among returning users does not establish first-use performance among unfamiliar visitors.","B":"The evaluator explicitly allows learning but prioritizes one-time novice performance; repeated-user improvement addresses a different criterion.","C":"The evaluator gives the opposite priority: correct use without prior practice for mainly one-time visitors.","D":"Text 1 expressly does not claim that the codes cannot be learned."},"text_1":"A usability evaluator rejects a coded ticket interface for a terminal serving mainly one-time visitors. In tests, first-time users often selected the wrong destination. The evaluator does not claim that the codes cannot be learned; rather, the decision rests on a requirement that an unfamiliar visitor be able to buy the correct ticket without prior practice. Improvement after repeated visits would not, by itself, satisfy that requirement.","text_2":"A researcher followed returning users of the coded interface over two months. These users became faster and more accurate, and eventually performed as well as returning users of a conventional interface. The researcher argues that an assessment limited to initial use can overlook substantial gains produced by familiarity. First-time users were not retested under altered instructions.","strategy":"Follow the direction of the question. When asked to reason from Text 1, apply its stated criterion rather than automatically siding with the later study."},{"id":"CTC-040","category":"Craft and Structure","skill":"Cross-Text Connections","level":"extreme","question":"Which choice best describes the relationship between the two texts?","choices":{"A":"Text 2 substitutes an intrinsic difference between the fleets for the contextual explanation in Text 1, using waiting times to identify the better navigating fleet.","B":"Text 2 provides observational and experimental support for the explanation proposed in Text 1 while explicitly limiting the conditions under which the support has been established.","C":"Text 2 rejects the explanation in Text 1 by showing that the fleets compete whenever their schedules overlap, contrary to the engineer's claim that competition is impossible.","D":"Text 2 supplies the missing proof that the explanation in Text 1 is sufficient at every traffic level, because the controlled trials isolated scheduling from other influences."},"answer":"B","explanation":"The follow-up confirms a predicted pattern and tests its effect, but limits the evidence to low-traffic conditions rather than claiming universal sufficiency.","choice_explanations":{"A":"Neither text attributes the result to intrinsic navigational superiority; the follow-up tests the scheduling explanation.","B":"The follow-up confirms a predicted pattern and tests its effect, but limits the evidence to low-traffic conditions rather than claiming universal sufficiency.","C":"Text 1 proposes infrequent overlap, not impossibility of competition; the overlap result supports the proposed mechanism.","D":"The controlled trials concern low traffic, and Text 2 explicitly withholds a conclusion about every demand level."},"text_1":"An engineer proposes that two delivery-robot fleets can share a narrow corridor with little conflict because their ordinary dispatch schedules rarely overlap. The engineer offers this as a possible explanation for the observed low waiting times, rather than as evidence that either fleet is intrinsically better at navigating. Detailed dispatch records have not yet been examined.","text_2":"A follow-up team compared dispatch records and found the predicted separation. In controlled low-traffic trials, aligning the schedules increased waiting, while separating them reduced it. The team considers these results support for a scheduling explanation of low conflict under those conditions. High-traffic periods were not tested, so the team does not claim that scheduling alone can explain waiting times at every demand level.","strategy":"Distinguish support with limits from disagreement. Evidence can strengthen a hypothesis without proving that it is universally sufficient."}]},{"category":"Craft and Structure","subcategory":"Text Structure and Purpose","questions":[{"id":"TSP-001","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the overall structure of the text?","choices":{"A":"It develops an extended portrayal of memory as an inconvenient housemate, ending with acceptance that does not resolve the inconvenience.","B":"It contrasts a disorderly childhood home with the speaker's present home, then explains why the speaker decides to return to the former.","C":"It compares memory to several unrelated occupants before choosing the one whose behavior best explains the speaker's nostalgia.","D":"It describes memory's unreliability, then replaces that judgment with evidence that memory has become more responsive to the speaker's needs."},"answer":"A","explanation":"The domestic details consistently personify memory as a tenant. The ending accepts its presence while preserving the original complaint about disorder.","choice_explanations":{"A":"The domestic details consistently personify memory as a tenant. The ending accepts its presence while preserving the original complaint about disorder.","B":"The domestic setting organizes an extended metaphor; two literal homes or a return journey are not narrated.","C":"The poem sustains one tenant comparison. The coats, boxes, and footsteps elaborate it rather than introduce separate occupants.","D":"Acceptance is explicitly not based on improved orderliness, and memory's response to the requested name remains unhelpful."},"text":"Memory is my untidy tenant.\nIt pays no rent, yet chooses every room,\nkeeps winter coats upon the summer chairs,\nand hangs a vanished doorway in the hall.\nI ask it for the name I need today;\nit brings a scent of rain from years ago.\nI threaten to put all its boxes out,\nbut at the threshold find my own handwriting\non every label. So I clear a shelf,\nnot because the tenant has grown orderly,\nbut because the house would sound so strange\nwithout its footsteps overhead.","text_html":"Memory is my untidy tenant.<br>\nIt pays no rent, yet chooses every room,<br>\nkeeps winter coats upon the summer chairs,<br>\nand hangs a vanished doorway in the hall.<br>\nI ask it for the name I need today;<br>\nit brings a scent of rain from years ago.<br>\nI threaten to put all its boxes out,<br>\nbut at the threshold find my own handwriting<br>\non every label. So I clear a shelf,<br>\nnot because the tenant has grown orderly,<br>\nbut because the house would sound so strange<br>\nwithout its footsteps overhead.","strategy":"A poem can change the speaker's response while sustaining the same figurative framework. Do not invent a literal journey or improvement in the thing described."},{"id":"TSP-002","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It presents a finding from the new experiment that confirms the role of fiber alignment in determining the direction of curling.","B":"It identifies a conclusion about wooden materials that the later packing-sheet experiments demonstrate to be mistaken.","C":"It supplies an analogy that motivates a prediction whose application to the new material is subsequently challenged.","D":"It explains why the researchers changed both fiber alignment and adhesive pattern simultaneously in their initial tests."},"answer":"C","explanation":"The clause provides the basis for expecting a similar directional effect in the packing sheet. Later observations challenge that expectation for the sheet without overturning the original observation about wood.","choice_explanations":{"A":"The wood comparison precedes the prediction; the new sheets do not respond as the fiber-alignment prediction suggests.","B":"The experiments challenge transfer of an explanation to a different material, not the stated behavior of the wooden laminates.","C":"The clause provides the basis for expecting a similar directional effect in the packing sheet. Later observations challenge that expectation for the sheet without overturning the original observation about wood.","D":"The initial tests held the adhesive pattern unchanged; the two variables were not changed together."},"text":"A laminated packing sheet curled when exposed to damp air. Because familiar wooden laminates bend differently depending on the direction of their grain, the team initially predicted that the alignment of fibers in the sheet would determine the direction of its curl. They made sheets with fibers running at several angles while leaving the adhesive pattern unchanged. The sheets nevertheless curled in the same direction. Changing the adhesive pattern then changed the direction of curling. The comparison with wood had supplied a reasonable starting point, but the new results directed attention toward the distribution of adhesive in this particular material.","text_html":"A laminated packing sheet curled when exposed to damp air. <u>Because familiar wooden laminates bend differently depending on the direction of their grain<\/u>, the team initially predicted that the alignment of fibers in the sheet would determine the direction of its curl. They made sheets with fibers running at several angles while leaving the adhesive pattern unchanged. The sheets nevertheless curled in the same direction. Changing the adhesive pattern then changed the direction of curling. The comparison with wood had supplied a reasonable starting point, but the new results directed attention toward the distribution of adhesive in this particular material.","strategy":"Failure of an analogy in a new setting does not show that the original example was false. Track which object each claim is about."},{"id":"TSP-003","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It qualifies an earlier conclusion about the order of revisions by presenting evidence that some stains were added afterward.","B":"It explains why a gap in existing knowledge matters for the inquiry the team later undertakes.","C":"It identifies a defect in the imaging method that the team subsequently eliminates by distinguishing materials at different wavelengths.","D":"It summarizes the team's discovery that the substances in the stains cannot be identified without determining their chronological order."},"answer":"B","explanation":"The target connects an existing uncertainty to its significance. The subsequent experiment is motivated by that problem but succeeds only at distinguishing materials, not at solving the problem.","choice_explanations":{"A":"No order had been established, and the target presents no evidence favoring either sequence.","B":"The target connects an existing uncertainty to its significance. The subsequent experiment is motivated by that problem but succeeds only at distinguishing materials, not at solving the problem.","C":"The uncertainty existed before the imaging attempt, and that attempt did not resolve it.","D":"The substances were already known. The unanswered question concerns order, not identification."},"text":"A manuscript contains pale stains beside several passages that later readers appear to have altered. Conservators know what substances are present in the stains, but not whether the stains preceded the alterations or resulted from work done afterward. That uncertainty prevents them from using the stains to establish the sequence of revisions. A team tried imaging the page at different wavelengths, hoping that the intersections of stains and ink would reveal which came first. Although the images distinguished the materials more clearly, the relevant intersections remained indistinct. The approach therefore improved description of the page without resolving the chronological question that had motivated it.","text_html":"A manuscript contains pale stains beside several passages that later readers appear to have altered. Conservators know what substances are present in the stains, but not whether the stains preceded the alterations or resulted from work done afterward. <u>That uncertainty prevents them from using the stains to establish the sequence of revisions.<\/u> A team tried imaging the page at different wavelengths, hoping that the intersections of stains and ink would reveal which came first. Although the images distinguished the materials more clearly, the relevant intersections remained indistinct. The approach therefore improved description of the page without resolving the chronological question that had motivated it.","strategy":"Locate the problem before reading the proposed solution. An improvement in measurement does not necessarily resolve the uncertainty that motivated the measurement."},{"id":"TSP-004","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the overall structure of the text?","choices":{"A":"It presents a dispute about the source of delivery delays, recounts a controlled test, and identifies the bell as the decisive cause of improvement.","B":"It establishes that disputes preceded the removal of the bell, describes an unsuccessful remedy, and closes by questioning whether coordination was needed.","C":"It describes the removal of a coordinating device, the difficulties that followed, and a response whose recorded success cannot be assigned to one component alone.","D":"It explains why an outdated device was removed, compares several proposed replacements, and recommends the most successful alternative."},"answer":"C","explanation":"The historical sequence is removal, difficulties, and actual intervention. The author then limits causal attribution because both the bell and supervision changed together.","choice_explanations":{"A":"The records do not isolate the bell's effect. The response is not a controlled test, and no initial dispute about causal explanations is reported.","B":"The sequence and outcome are reversed: disputes followed removal, fewer were recorded after restoration, and the need for coordination is not questioned.","C":"The historical sequence is removal, difficulties, and actual intervention. The author then limits causal attribution because both the bell and supervision changed together.","D":"The reason for removal is expressly unknown, no alternatives are compared, and the response was implemented rather than merely recommended."},"text":"The covered market once used a bell to announce when its shared loading passage was clear. After the bell was removed, stallholders arranged deliveries independently. Within a month, carts were regularly meeting head-on in the passage, and the resulting arguments delayed unloading. The market council then restored the bell and assigned a porter to ring it at the end of each delivery interval. Contemporary entries record fewer disputes afterward, though they do not isolate the effect of the bell from that of the porter's supervision. The records also give no explanation for the original decision to remove the bell.","text_html":"The covered market once used a bell to announce when its shared loading passage was clear. After the bell was removed, stallholders arranged deliveries independently. Within a month, carts were regularly meeting head-on in the passage, and the resulting arguments delayed unloading. The market council then restored the bell and assigned a porter to ring it at the end of each delivery interval. Contemporary entries record fewer disputes afterward, though they do not isolate the effect of the bell from that of the porter&#x27;s supervision. The records also give no explanation for the original decision to remove the bell.","strategy":"Track what actually happened separately from why it happened. A successful combined intervention does not identify the contribution of each part."},{"id":"TSP-005","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best states the main purpose of the text?","choices":{"A":"To explain how conservators verified that aging leaves bell metal unchanged by reproducing the conditions under which the bells were cast.","B":"To describe an investigation that questions a customary explanation by demonstrating another way the observed effect could arise.","C":"To establish that historical accounts of the bells' composition were inaccurate and explain how those errors affected restoration.","D":"To compare the advantages of two treatments for aged metal and recommend the one that preserves a bell's original sound."},"answer":"B","explanation":"The experiment supplies a possible explanation involving supports, weakening the need to invoke metal aging. Showing that an account is unnecessary is narrower than proving that the proposed process never occurred.","choice_explanations":{"A":"The team expressly did not determine whether aging changed the metal. It showed that a change was unnecessary to explain the sound.","B":"The experiment supplies a possible explanation involving supports, weakening the need to invoke metal aging. Showing that an account is unnecessary is narrower than proving that the proposed process never occurred.","C":"The documented alloy is used as an experimental input. The text does not challenge the historical composition records.","D":"The alternatives tested are mounting arrangements, not treatments for metal; no comparison of surface treatments is reported."},"text":"Conservators had attributed the dull sound of several ceremonial bells to changes in the metal as it aged. To assess that account, a team made replicas using the bells' documented alloy and original dimensions. The replicas also sounded dull when held by rigid brackets, but rang clearly when suspended from flexible straps. The historical bells had acquired rigid brackets during a later renovation. The researchers did not determine whether aging had altered the metal at all; rather, they concluded that the mounting arrangement could account for the acoustic difference without requiring such an alteration. Their report recommends examining supports before treating the bells' surfaces.","text_html":"Conservators had attributed the dull sound of several ceremonial bells to changes in the metal as it aged. To assess that account, a team made replicas using the bells&#x27; documented alloy and original dimensions. The replicas also sounded dull when held by rigid brackets, but rang clearly when suspended from flexible straps. The historical bells had acquired rigid brackets during a later renovation. The researchers did not determine whether aging had altered the metal at all; rather, they concluded that the mounting arrangement could account for the acoustic difference without requiring such an alteration. Their report recommends examining supports before treating the bells&#x27; surfaces.","strategy":"When identifying a research passage's purpose, preserve the difference between challenging an explanation and disproving every part of it."},{"id":"TSP-006","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It summarizes Sena's initial assumption that she later abandoned after discovering disagreement in the drafting records.","B":"It explains why the fee schedule was ultimately excluded from the final regulations despite being the principal subject of negotiation.","C":"It presents the final document's own explanation of how its provisions were ranked in order of importance.","D":"It identifies an analytical benefit of consulting records beyond the final document, preparing for the example that follows."},"answer":"D","explanation":"The target explains what access to drafts and meeting notes makes visible. The next sentence supplies a case showing why this benefit matters to interpreting the finished regulations.","choice_explanations":{"A":"The distinction is a benefit of examining the records, not an initial assumption that the passage refutes.","B":"The fee schedule remains prominent in the final document, and the waiting-area rule generated more discussion.","C":"Sena obtains the distinction from supplementary materials; the final document does not itself supply that explanation.","D":"The target explains what access to drafts and meeting notes makes visible. The next sentence supplies a case showing why this benefit matters to interpreting the finished regulations."},"text":"Final copies of the harbor regulations suggest a consistent set of priorities: clear access, predictable schedules, and uniform charges. Historian Sena also examined rejected drafts and notes from the drafting meetings. Those materials allowed her to distinguish provisions that had been accepted immediately from provisions that emerged only after repeated objections. She found that an apparently minor rule about waiting areas had generated more discussion than the prominent fee schedule. The final document alone would not have revealed that difference. Sena consequently treats the regulations as the outcome of negotiations, not as a transparent ranking of what every participant initially considered most important.","text_html":"Final copies of the harbor regulations suggest a consistent set of priorities: clear access, predictable schedules, and uniform charges. Historian Sena also examined rejected drafts and notes from the drafting meetings. <u>Those materials allowed her to distinguish provisions that had been accepted immediately from provisions that emerged only after repeated objections.<\/u> She found that an apparently minor rule about waiting areas had generated more discussion than the prominent fee schedule. The final document alone would not have revealed that difference. Sena consequently treats the regulations as the outcome of negotiations, not as a transparent ranking of what every participant initially considered most important.","strategy":"A sentence can explain the value of a method before a later sentence supplies its result. Keep method benefit, example, and final interpretation distinct."},{"id":"TSP-007","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It resolves the disagreement between copies by identifying which number accurately describes the harbor at the time of the visit.","B":"It draws a limited conclusion from the preceding evidence while keeping that conclusion separate from a historical fact the evidence does not settle.","C":"It introduces an additional observation showing that the traveler deliberately changed the number of towers between drafts.","D":"It rejects the earlier documentary evidence because a more numerous set of later copies supports a different historical account."},"answer":"B","explanation":"The target states an implication of the draft and early copies: frequency of later copying is less persuasive as a guide to original wording. It does not establish the real number of towers.","choice_explanations":{"A":"The preceding sentence expressly withholds that factual conclusion; original wording and historical accuracy are different issues.","B":"The target states an implication of the draft and early copies: frequency of later copying is less persuasive as a guide to original wording. It does not establish the real number of towers.","C":"The sentence adds no new observation, and no deliberate change by the traveler is established.","D":"The conclusion uses the earlier evidence to question a frequency-based editorial choice, not to reject the earlier records."},"text":"Two of the oldest surviving copies of a travel account describe the harbor as having nine towers. Three later copies give seven, and a recent edition adopts that reading because it appears more frequently. A newly catalogued draft, written before either early copy, also gives nine. The draft's author later corrected several place names but left the number untouched. These records do not establish how many towers stood in the harbor when the traveler visited it. They do, however, weaken the case for treating the more frequently copied number as the traveler's original wording.","text_html":"Two of the oldest surviving copies of a travel account describe the harbor as having nine towers. Three later copies give seven, and a recent edition adopts that reading because it appears more frequently. A newly catalogued draft, written before either early copy, also gives nine. The draft&#x27;s author later corrected several place names but left the number untouched. These records do not establish how many towers stood in the harbor when the traveler visited it. <u>They do, however, weaken the case for treating the more frequently copied number as the traveler&#x27;s original wording.<\/u>","strategy":"Ask whether the target contributes a new fact or interprets facts already given. Then check exactly which question that interpretation answers."},{"id":"TSP-008","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It explains how the cooperative persuaded growers that reusable packaging had financial advantages over disposable alternatives.","B":"It identifies a coordination obstacle that helps explain the delay without treating it as opposition to the proposed practice.","C":"It describes a consequence of growers' initial refusal to participate that subsequently made the equipment less compatible.","D":"It presents the growers' preferred solution to the disagreement, which the cooperative then implemented to secure universal adoption."},"answer":"B","explanation":"The clause supplies a practical reason for waiting. That reason supports the passage's later correction of the cooperative's interpretation of the delay as resistance.","choice_explanations":{"A":"No financial comparison or persuasive strategy is given. The clause describes an unresolved equipment specification.","B":"The clause supplies a practical reason for waiting. That reason supports the passage's later correction of the cooperative's interpretation of the delay as resistance.","C":"Unresolved shelf dimensions help explain the delay; they are not described as its consequence, and no refusal is established.","D":"The clause states the obstacle, not a preferred solution, and universal adoption is expressly unestablished."},"text":"A cooperative hoped to persuade growers to use returnable crates instead of disposable boxes. Several growers liked the idea but delayed ordering crates, since the sorting sheds had not agreed on a common width for the shelves that would hold them. The cooperative initially interpreted the delay as resistance to reusing packaging. Interviews instead revealed that growers were waiting to learn which crate dimensions would fit the equipment they would share. Once a common specification was announced, orders increased, although the study did not determine whether every grower who waited eventually adopted the crates.","text_html":"A cooperative hoped to persuade growers to use returnable crates instead of disposable boxes. Several growers liked the idea but delayed ordering crates, <u>since the sorting sheds had not agreed on a common width for the shelves that would hold them<\/u>. The cooperative initially interpreted the delay as resistance to reusing packaging. Interviews instead revealed that growers were waiting to learn which crate dimensions would fit the equipment they would share. Once a common specification was announced, orders increased, although the study did not determine whether every grower who waited eventually adopted the crates.","strategy":"Identify whether a detail is a reason for hesitation, a proposed solution, or a consequence of refusal. Similar vocabulary can conceal reversed causation."},{"id":"TSP-009","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best states the main purpose of the text?","choices":{"A":"To present Evan's increasing willingness to revise his work as evidence of his sustained commitment to a goal.","B":"To illustrate how Evan's growing technical skill allows him to complete a melody that had initially seemed irrecoverable.","C":"To explain why Evan ultimately replaces an unreliable personal memory with his sister's account of the melody.","D":"To contrast the precision of Evan's early musical records with the uncertainty that eventually prevents him from continuing."},"answer":"A","explanation":"The sister sees the revisions as decline, but the narrator explains that they reflect stricter standards. Evan continues even when progress is minute, so the purpose is to portray persistence through revision, not completion.","choice_explanations":{"A":"The sister sees the revisions as decline, but the narrator explains that they reflect stricter standards. Evan continues even when progress is minute, so the purpose is to portray persistence through revision, not completion.","B":"No completed melody or increase in technical musical skill is reported. The advance is in discriminating memory from invention.","C":"The sister interprets the erasures; she supplies no account of the melody, and Evan does not abandon his own recollection.","D":"His early confidence is not precision, and the final sentence explicitly conveys continued determination."},"text":"Each evening, Evan tried to reconstruct the melody his grandmother had hummed while repairing nets. His first notebook contained only confident rows of notes; his second was crowded with crossings-out and questions. His sister took the erasures as proof that the project was fading. Evan thought otherwise. He had learned to distinguish the tune he actually remembered from the pleasing phrases he had supplied to fill its gaps. Some nights he recovered no more than the length of a pause. Still, he kept both notebooks open on the table: one showed what he had once been willing to accept, the other what he was now determined to get right.","text_html":"Each evening, Evan tried to reconstruct the melody his grandmother had hummed while repairing nets. His first notebook contained only confident rows of notes; his second was crowded with crossings-out and questions. His sister took the erasures as proof that the project was fading. Evan thought otherwise. He had learned to distinguish the tune he actually remembered from the pleasing phrases he had supplied to fill its gaps. Some nights he recovered no more than the length of a pause. Still, he kept both notebooks open on the table: one showed what he had once been willing to accept, the other what he was now determined to get right.","strategy":"Do not confuse a character's self-correction with loss of commitment, or progress toward a goal with achievement of it."},{"id":"TSP-010","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best states the main purpose of the text?","choices":{"A":"To argue that portable displays should replace fixed classroom equipment because they can serve a wider variety of teachers.","B":"To compare the educational effectiveness of wooden panels, fabric sheets, and interchangeable diagrams in different subjects.","C":"To explain why the Varo workshop's first designers deliberately created a device suitable for every kind of lesson.","D":"To trace how practical changes in use shaped the development of a particular instructional device."},"answer":"D","explanation":"The narrative connects successive design changes to storage, portability, and reuse needs. Its focus is the device's development, not a ranking of teaching effectiveness or an argument for adoption.","choice_explanations":{"A":"The passage recounts development; it does not prescribe replacing fixed equipment or establish comparative superiority.","B":"Material changes are described, but student learning outcomes and comparisons across subjects are not.","C":"The passage explicitly contrasts incremental development with an initial universal ambition.","D":"The narrative connects successive design changes to storage, portability, and reuse needs. Its focus is the device's development, not a ranking of teaching effectiveness or an argument for adoption."},"text":"The Varo workshop's folding display screens began as a response to an ordinary storage problem: its demonstrations occupied rooms that also served as evening classrooms. Early screens carried diagrams on hinged wooden panels so they could be packed away between uses. When visiting teachers requested portable versions, the workshop replaced the panels with fabric sheets stretched over jointed frames. Later makers added interchangeable sheets, allowing one frame to serve several lessons. The resulting device therefore developed through changes in where and by whom it was used, rather than through a single attempt to invent a universal teaching tool.","text_html":"The Varo workshop&#x27;s folding display screens began as a response to an ordinary storage problem: its demonstrations occupied rooms that also served as evening classrooms. Early screens carried diagrams on hinged wooden panels so they could be packed away between uses. When visiting teachers requested portable versions, the workshop replaced the panels with fabric sheets stretched over jointed frames. Later makers added interchangeable sheets, allowing one frame to serve several lessons. The resulting device therefore developed through changes in where and by whom it was used, rather than through a single attempt to invent a universal teaching tool.","strategy":"Historical accounts of how a device changed are not necessarily arguments that it is best, novel in every respect, or intended from the start for all its later uses."},{"id":"TSP-011","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It defines a requirement whose specific implementation and consequences are discussed afterward.","B":"It qualifies the claim that delayed edits necessarily produce more reliable records in a distributed archive.","C":"It explains why the designers chose agreement among four machines rather than agreement among all seven.","D":"It identifies the experimental finding that establishes how many machines the archive needs to operate efficiently."},"answer":"A","explanation":"The phrase immediately follows the technical term and tells the reader what it means. The particular threshold and the resulting trade-off belong to subsequent sentences, not to the definition itself.","choice_explanations":{"A":"The phrase immediately follows the technical term and tells the reader what it means. The particular threshold and the resulting trade-off belong to subsequent sentences, not to the definition itself.","B":"The target is a definition. The later discussion introduces costs and benefits but does not make the claimed necessary relation.","C":"Neither this definition nor the passage supplies that comparative design rationale. The numerical choice appears afterward.","D":"The phrase defines quorum in general; the next sentence specifies four of seven, and no efficiency optimum is established."},"text":"A laboratory's distributed archive sometimes receives contradictory edits while its computers are temporarily disconnected. Its designers require a quorum, the minimum number of independent machines that must agree before an edit is accepted, to reconcile those edits. In the prototype, an edit requires agreement from four of seven machines. This rule can keep a single malfunctioning machine from rewriting a record, but it can also delay valid updates when too few machines are connected. The designers therefore evaluate the arrangement as a trade-off between prompt access and resistance to conflicting records, rather than as a way of maximizing both without cost.","text_html":"A laboratory&#x27;s distributed archive sometimes receives contradictory edits while its computers are temporarily disconnected. Its designers require a quorum, <u>the minimum number of independent machines that must agree before an edit is accepted<\/u>, to reconcile those edits. In the prototype, an edit requires agreement from four of seven machines. This rule can keep a single malfunctioning machine from rewriting a record, but it can also delay valid updates when too few machines are connected. The designers therefore evaluate the arrangement as a trade-off between prompt access and resistance to conflicting records, rather than as a way of maximizing both without cost.","strategy":"First isolate exactly what is underlined. A definition embedded in a research passage is not automatically a finding or a justification."},{"id":"TSP-012","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best states the main purpose of the text?","choices":{"A":"To trace Sela's gradual recognition that her replacement is better equipped than she is to manage the station.","B":"To explain why Sela regards her retirement arrangements as impractical despite appreciating her colleagues' intentions.","C":"To show how a disappointing farewell persuades Sela to abandon her remaining emotional ties to the station.","D":"To portray Sela's relief at leaving a demanding role alongside her continuing attachment to it."},"answer":"D","explanation":"The empty diary promises freedom, while Sela's care for the clock, repeated advice, and gesture toward the missing keys show a bond that persists. The passage holds these feelings together rather than resolving one into the other.","choice_explanations":{"A":"The replacement's competence is never evaluated; giving advice is not evidence that Sela judges the replacement superior.","B":"The clock complaint is subordinate to mixed feelings about leaving; no general evaluation of retirement arrangements is given.","C":"Her protective handling of the gift and lingering gestures show attachment, not abandonment or disappointment with the farewell itself.","D":"The empty diary promises freedom, while Sela's care for the clock, repeated advice, and gesture toward the missing keys show a bond that persists. The passage holds these feelings together rather than resolving one into the other."},"text":"On her last afternoon as station superintendent, Sela complained that the farewell clock was absurdly large. It would dominate any room she put it in, she said, and she had spent enough years arranging her life around clocks. Nevertheless, she asked the porter to wrap it twice and carried it herself rather than risk the luggage cart. When her replacement requested the office keys, she surrendered them promptly, then explained for a second time which lock stuck in damp weather. Outside, she opened her new pocket diary. Tomorrow's page was empty. She smiled at the freedom of it, though her thumb remained pressed against the place where the keys had hung.","text_html":"On her last afternoon as station superintendent, Sela complained that the farewell clock was absurdly large. It would dominate any room she put it in, she said, and she had spent enough years arranging her life around clocks. Nevertheless, she asked the porter to wrap it twice and carried it herself rather than risk the luggage cart. When her replacement requested the office keys, she surrendered them promptly, then explained for a second time which lock stuck in damp weather. Outside, she opened her new pocket diary. Tomorrow&#x27;s page was empty. She smiled at the freedom of it, though her thumb remained pressed against the place where the keys had hung.","strategy":"F
