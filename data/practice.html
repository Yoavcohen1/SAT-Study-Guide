number is singular even though seedlings and storms are plural; varies agrees with number.","choice_explanations":{"A":"Correct: The number is singular even though seedlings and storms are plural; varies agrees with number.","B":"Incorrect: Are is plural and incorrectly follows the nearer noun seedlings instead of the true subject number.","C":"Incorrect: Varying is a participle, leaving the sentence without a finite main verb.","D":"Incorrect: Vary is plural present tense and agrees with neither the singular head noun number nor the sentence frame."},"passage":"The number of seedlings that sprout after each major storm _______ considerably from season to season, according to the current monitoring reports.","strategy":"Strip out phrases between the subject and verb and test subject-verb agreement."},{"id":"FSS-016","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"contain","B":"contains","C":"have contained","D":"containing"},"answer":"B","explanation":"Each is singular and determines agreement even though inscriptions and tiles are plural.","choice_explanations":{"A":"Incorrect: Contain is plural, incorrectly attracted to inscriptions or tiles.","B":"Correct: Each is singular and determines agreement even though inscriptions and tiles are plural.","C":"Incorrect: Have is plural and cannot agree with the singular each.","D":"Incorrect: Containing is a nonfinite form and cannot alone supply the main verb."},"passage":"Each of the inscriptions on the surviving tiles _______ a short line of verse followed by the name of a local artisan.","strategy":"Strip out phrases between the subject and verb and test subject-verb agreement."},{"id":"FSS-017","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"being","B":"are","C":"was","D":"is"},"answer":"B","explanation":"The true subject, three narrow staircases, comes after the verb and is plural; are agrees with staircases.","choice_explanations":{"A":"Incorrect: Being cannot function as the finite main verb of this independent sentence.","B":"Correct: The true subject, three narrow staircases, comes after the verb and is plural; are agrees with staircases.","C":"Incorrect: Was is singular and does not agree with the three staircases.","D":"Incorrect: Is is singular and does not agree with staircases."},"passage":"At the far end of the restored passage _______ three narrow staircases that lead visitors down to the original foundation.","strategy":"Find the subject after the blank; do not let a fronted location phrase dictate verb number."},{"id":"FSS-018","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"is","B":"are","C":"being","D":"were"},"answer":"A","explanation":"The subject after the verb is the singular noun phrase an unsigned note, which takes is.","choice_explanations":{"A":"Correct: The subject after the verb is the singular noun phrase an unsigned note, which takes is.","B":"Incorrect: Are is plural and incorrectly agrees with letters instead of note.","C":"Incorrect: Being is nonfinite and cannot serve as the independent clause’s main verb.","D":"Incorrect: Were is plural and does not agree with the singular note."},"passage":"Among the surviving letters from the expedition _______ an unsigned note describing a route that no other document mentions.","strategy":"Find the subject after the blank; do not let a fronted location phrase dictate verb number."},{"id":"FSS-019","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"hangs","B":"have hung","C":"hang","D":"hanging"},"answer":"A","explanation":"The grammatical head of the subject after the blank is the singular series, so the verb is hangs.","choice_explanations":{"A":"Correct: The grammatical head of the subject after the blank is the singular series, so the verb is hangs.","B":"Incorrect: Have is plural and does not agree with the singular a series.","C":"Incorrect: Hang is the plural present form, attracted to the nearby plural paintings.","D":"Incorrect: Hanging is nonfinite and leaves the sentence without a main verb."},"passage":"In the central gallery of the museum _______ a series of experimental paintings whose arrangement changes every season.","strategy":"Find the subject after the blank; do not let a fronted location phrase dictate verb number."},{"id":"FSS-020","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"lie","B":"lies","C":"has lain","D":"lying"},"answer":"A","explanation":"The postverbal subject several freshwater springs is plural, requiring the plural verb lie.","choice_explanations":{"A":"Correct: The postverbal subject several freshwater springs is plural, requiring the plural verb lie.","B":"Incorrect: Lies is singular and cannot agree with springs.","C":"Incorrect: Has is singular and cannot agree with several springs.","D":"Incorrect: Lying is nonfinite and cannot independently supply the sentence’s main verb."},"passage":"Beyond the shallow ridge to the north _______ several freshwater springs that supply water to villages in the valley.","strategy":"Find the subject after the blank; do not let a fronted location phrase dictate verb number."},{"id":"FSS-021","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"presents","B":"presenting","C":"has presented","D":"presented"},"answer":"D","explanation":"The event is located in 1908, and presented matches the past tense of answered.","choice_explanations":{"A":"Incorrect: Present-tense presents conflicts with the past-tense answered in this sequence of historical events.","B":"Incorrect: The participle presenting leaves the main clause without a finite verb.","C":"Incorrect: Present perfect is not ordinarily used with an explicitly finished time in 1908, and it conflicts with answered.","D":"Correct: The event is located in 1908, and presented matches the past tense of answered."},"passage":"At a conference in 1908, the physicist _______ a preliminary theory of the instrument and then answered questions from several engineers in the audience.","strategy":"Use dates and words such as now, every year, and in 19XX to pick the appropriate finite tense."},{"id":"FSS-022","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"collects","B":"have collected","C":"collected","D":"collecting"},"answer":"A","explanation":"Every autumn indicates a recurring present action, and collects parallels the present-tense singular updates.","choice_explanations":{"A":"Correct: Every autumn indicates a recurring present action, and collects parallels the present-tense singular updates.","B":"Incorrect: Have is plural, while the subject team is singular; it also disrupts the parallel present-tense routine.","C":"Incorrect: Past-tense collected does not match the recurring present routine conveyed by every autumn and updates.","D":"Incorrect: A participle without a helping verb cannot supply the main verb preceding and updates."},"passage":"Every autumn, the migration team _______ GPS readings from marked birds and updates the public database with the results.","strategy":"Use dates and words such as now, every year, and in 19XX to pick the appropriate finite tense."},{"id":"FSS-023","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"completing","B":"completed","C":"has completed","D":"completes"},"answer":"B","explanation":"The dated event and the coordinated past-tense returned require a matching past-tense verb completed.","choice_explanations":{"A":"Incorrect: Completing cannot independently serve as the finite verb of the main clause.","B":"Correct: The dated event and the coordinated past-tense returned require a matching past-tense verb completed.","C":"Incorrect: Present perfect cannot naturally be combined with the finished date in 1996, and it conflicts with returned.","D":"Incorrect: Present-tense completes is inconsistent with returned in this completed 1996 sequence."},"passage":"In 1996, the research vessel _______ its first test voyage and returned to port two days later with samples from the continental shelf.","strategy":"Use dates and words such as now, every year, and in 19XX to pick the appropriate finite tense."},{"id":"FSS-024","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"is","B":"being","C":"were","D":"have been"},"answer":"A","explanation":"Today identifies the archive’s current state, so the singular present-tense linking verb is is needed.","choice_explanations":{"A":"Correct: Today identifies the archive’s current state, so the singular present-tense linking verb is is needed.","B":"Incorrect: Being is nonfinite and does not supply a finite main verb for the clause.","C":"Incorrect: Were is a plural form in this ordinary declarative sentence, so it does not agree with the singular subject archive.","D":"Incorrect: Have is a plural auxiliary that does not agree with the singular archive."},"passage":"The old handwritten index was replaced decades ago. Today, the archive _______ searchable through a digital catalog that visitors can access from home.","strategy":"Use dates and words such as now, every year, and in 19XX to pick the appropriate finite tense."},{"id":"FSS-025","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"has been","B":"had been","C":"being","D":"will be"},"answer":"B","explanation":"The power outage was already in progress before the past moment when the generator switched on; had been marks that prior state.","choice_explanations":{"A":"Incorrect: The present perfect is anchored to now, not to the earlier moment when the generator switched on.","B":"Correct: The power outage was already in progress before the past moment when the generator switched on; had been marks that prior state.","C":"Incorrect: A lone participle after system does not form a finite main-clause predicate.","D":"Incorrect: The future tense incorrectly places the outage after the generator switched on."},"passage":"When the backup generator finally switched on, the refrigeration system _______ without electricity for nearly ten minutes. The technician immediately checked that the stored samples had not warmed.","strategy":"Put the events on a timeline; the event completed before a past reference point takes had + past participle."},{"id":"FSS-026","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"will complete","B":"completing","C":"have completed","D":"had completed"},"answer":"D","explanation":"The assistants finished the maps before the cartographer returned, so past perfect correctly expresses the earlier completed action.","choice_explanations":{"A":"Incorrect: Future tense places completion after the past return rather than before it.","B":"Incorrect: A participle alone cannot function as the main finite verb of the assistants’ clause.","C":"Incorrect: Present perfect takes the present as its reference point rather than the specified past return.","D":"Correct: The assistants finished the maps before the cartographer returned, so past perfect correctly expresses the earlier completed action."},"passage":"By the time the cartographer returned from the spring expedition, the assistants _______ the preliminary maps. The group could therefore begin checking the measurements immediately.","strategy":"Put the events on a timeline; the event completed before a past reference point takes had + past participle."},{"id":"FSS-027","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"have acquired","B":"had acquired","C":"acquiring","D":"will acquire"},"answer":"B","explanation":"The collecting happened before the past event of the museum’s opening, so had acquired marks the earlier action.","choice_explanations":{"A":"Incorrect: The present perfect does not locate the acquisition before the specified past opening in the same way.","B":"Correct: The collecting happened before the past event of the museum’s opening, so had acquired marks the earlier action.","C":"Incorrect: The participle acquiring cannot stand alone as the finite verb of its founders.","D":"Incorrect: Future tense would place the acquisition after the past opening."},"passage":"Before the museum opened to the public in 2003, its founders _______ several thousand artifacts from local collections. Those objects formed the basis of the inaugural exhibition.","strategy":"Put the events on a timeline; the event completed before a past reference point takes had + past participle."},{"id":"FSS-028","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"had been","B":"being","C":"are","D":"will be"},"answer":"A","explanation":"Had been distributed is a past-perfect passive construction showing that distribution preceded the discovery.","choice_explanations":{"A":"Correct: Had been distributed is a past-perfect passive construction showing that distribution preceded the discovery.","B":"Incorrect: Being distributed lacks the finite auxiliary required here to complete the passive verb phrase.","C":"Incorrect: Are distributed is present tense and does not fit the past discovery and completed first edition.","D":"Incorrect: Will be distributed places distribution after the discovery, contrary to only after."},"passage":"The printmaker discovered a mislabeled image only after the first edition _______ distributed to subscribers. Corrected labels appeared in the second edition.","strategy":"Put the events on a timeline; the event completed before a past reference point takes had + past participle."},{"id":"FSS-029","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"remaining","B":"remains","C":"having remained","D":"to remain"},"answer":"B","explanation":"The subject the method requires a finite main verb after the introductory dependent phrase; remains supplies it.","choice_explanations":{"A":"Incorrect: Remaining is a nonfinite participle, leaving the main clause without a predicate.","B":"Correct: The subject the method requires a finite not replace the required main verb; appears is the finite predicate of the manual.","choice_explanations":{"A":"Correct: The relative clause which includes does not replace the required main verb; appears is the finite predicate of the manual.","B":"Incorrect: Having appeared is a nonfinite participial phrase, not a finite main-clause predicate.","C":"Incorrect: To appear is infinitival and leaves the subject the manual with no finite predicate.","D":"Incorrect: Appearing is a participle; without an auxiliary, the main clause is incomplete."},"passage":"The revised instrument manual, which includes diagrams of every component and a glossary of technical terms, _______ on the laboratory’s public website.","strategy":"Locate the main-clause subject; participles and infinitives alone cannot serve as its finite predicate."},{"id":"FSS-032","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"showing it","B":"having shown it","C":"shows it","D":"to show it"},"answer":"C","explanation":"Shows is a finite singular present-tense verb with the object it, completing the main clause the completed map.","choice_explanations":{"A":"Incorrect: The present participle showing cannot serve as the independent main verb.","B":"Incorrect: The perfect participle having shown cannot serve as the main finite verb.","C":"Correct: Shows is a finite singular present-tense verb with the object it, completing the main clause the completed map.","D":"Incorrect: The infinitive to show does not supply a finite verb to the main clause."},"passage":"Although early sketches omitted the river’s western branch, the completed map _______ clearly, allowing readers to trace the full extent of the watershed.","strategy":"Locate the main-clause subject; participles and infinitives alone cannot serve as its finite predicate."},{"id":"FSS-033","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"to creating","B":"create","C":"they created","D":"creating"},"answer":"D","explanation":"The present participle creating adds a supplementary consequence of digitizing the pages without starting a second finite clause.","choice_explanations":{"A":"Incorrect: After to introducing an infinitive, the base form create, not creating, is required.","B":"Incorrect: Create is a present-tense finite form and cannot be attached to the past main clause with a comma alone.","C":"Incorrect: They created is a separate independent clause; a comma alone cannot join it to the preceding independent clause.","D":"Correct: The present participle creating adds a supplementary consequence of digitizing the pages without starting a second finite clause."},"passage":"To help preserve a fragile set of field notebooks, the archivists digitized each page, _______ a backup copy before returning the originals to climate-controlled storage.","strategy":"Ask whether the blank is a modifier or purpose phrase, not an extra finite verb."},{"id":"FSS-034","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"collects","B":"collecting","C":"was collected","D":"collected"},"answer":"D","explanation":"Collected is a nonfinite past participle forming a passive supplementary modifier of the basalt sample.","choice_explanations":{"A":"Incorrect: Collects is finite and cannot stand as an unconnected modifier between these two commas.","B":"Incorrect: Collecting would incorrectly make the basalt sample the agent that collected something.","C":"Incorrect: The finite verb phrase was collected would form another main clause between the commas without an appropriate link.","D":"Correct: Collected is a nonfinite past participle forming a passive supplementary modifier of the basalt sample."},"passage":"The basalt sample, _______ during a survey of the northern ridge, contains small crystals that can be examined under a microscope.","strategy":"Ask whether the blank is a modifier or purpose phrase, not an extra finite verb."},{"id":"FSS-035","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"to reduce","B":"reduce","C":"reducing","D":"reduced"},"answer":"A","explanation":"The fixed construction in order to takes the base verb reduce to express purpose.","choice_explanations":{"A":"Correct: The fixed construction in order to takes the base verb reduce to express purpose.","B":"Incorrect: In order reduce omits to, which is required before this purpose infinitive.","C":"Incorrect: In order reducing lacks the infinitival marker to and is not standard English.","D":"Incorrect: In order reduced incorrectly uses a past-tense form instead of an infinitive."},"passage":"The designers installed a translucent panel above the exhibit in order _______ glare on the glass cases while preserving the room’s natural light.","strategy":"Ask whether the blank is a modifier or purpose phrase, not an extra finite verb."},{"id":"FSS-036","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"reveal","B":"it revealed","C":"revealing","D":"to revealing"},"answer":"C","explanation":"The participle revealing introduces a result or accompanying discovery of the recording process.","choice_explanations":{"A":"Incorrect: Reveal would be another finite present-tense predicate improperly joined to recorded without a conjunction.","B":"Incorrect: It revealed forms another independent clause; joining it with only a comma creates a comma splice.","C":"Correct: The participle revealing introduces a result or accompanying discovery of the recording process.","D":"Incorrect: A to-infinitive requires the base form reveal; to revealing is malformed here."},"passage":"Using a newly calibrated thermal camera, the botanists recorded subtle changes in leaf temperature, _______ a recurring pattern that ordinary photographs had missed.","strategy":"Ask whether the blank is a modifier or purpose phrase, not an extra finite verb."},{"id":"FSS-037","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"visitors could not see the inscription as they climbed the stairs.","B":"the guide struggled to photograph the inscription.","C":"the excavation team had difficulty locating the inscription.","D":"the inscription remained hidden from visitors walking above it."},"answer":"D","explanation":"The introductory passive modifier carved into the underside must describe the inscription, which correctly appears as the main-clause subject.","choice_explanations":{"A":"Incorrect: The opening modifier would wrongly describe the visitors as being carved into the stone step.","B":"Incorrect: The placement would wrongly make the guide the thing carved into the stone step.","C":"Incorrect: The placement would wrongly make the team the thing carved into the step.","D":"Correct: The introductory passive modifier carved into the underside must describe the inscription, which correctly appears as the main-clause subject."},"passage":"Carved into the underside of a stone step, _______","strategy":"Name who or what the introductory phrase describes; that noun must be the grammatical subject after it."},{"id":"FSS-038","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"the coastline receives frequent visits from weather researchers.","B":"visitors can watch the sea through the tower’s thick windows.","C":"engineers reinforced the observation tower’s joints and windows.","D":"the observation tower has reinforced joints and unusually thick windows."},"answer":"D","explanation":"The observation tower is the object built to withstand storms, so the subject immediately after the modifier is correctly the tower.","choice_explanations":{"A":"Incorrect: The coastline, not a built structure, would become the subject modified by built to withstand storms.","B":"Incorrect: This placement falsely describes the visitors as having been built for storms.","C":"Incorrect: This placement illogically modifies engineers rather than the tower they constructed.","D":"Correct: The observation tower is the object built to withstand storms, so the subject immediately after the modifier is correctly the tower."},"passage":"Built to withstand powerful coastal storms, _______","strategy":"Name who or what the introductory phrase describes; that noun must be the grammatical subject after it."},{"id":"FSS-039","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"the museum has not restored the large ceramic vessel.","B":"the large ceramic vessel has never undergone restoration.","C":"conservators have never restored the large ceramic vessel.","D":"the vessel’s surface still shows traces of its original pigments."},"answer":"B","explanation":"Unlike most other objects correctly compares one object, the ceramic vessel, with the other objects.","choice_explanations":{"A":"Incorrect: This compares an institution with objects in its collection, which is illogical.","B":"Correct: Unlike most other objects correctly compares one object, the ceramic vessel, with the other objects.","C":"Incorrect: This compares conservators (people) with the objects in the collection, rather than comparing objects.","D":"Incorrect: This compares a surface with entire objects rather than the vessel with other objects."},"passage":"Unlike most other objects in the museum’s collection, _______","strategy":"Name who or what the introductory phrase describes; that noun must be the grammatical subject after it."},{"id":"FSS-040","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"a recurring afternoon air current became apparent to the scientists.","B":"the field scientists noticed a recurring afternoon air current.","C":"the station’s equipment was calibrated by the scientists.","D":"the researchers’ notes eventually revealed a recurring current."},"answer":"B","explanation":"The scientists are the ones studying weather patterns, so the participial modifier correctly attaches to them.","choice_explanations":{"A":"Incorrect: The air current would become the one studying the weather.","B":"Correct: The scientists are the ones studying weather patterns, so the participial modifier correctly attaches to them.","C":"Incorrect: The equipment would incorrectly be described as studying weather patterns.","D":"Incorrect: The notes, rather than the researchers who made them, would be described as studying weather."},"passage":"Studying weather patterns from a remote mountain station, _______","strategy":"Name who or what the introductory phrase describes; that noun must be the grammatical subject after it."},{"id":"FSS-041","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"depicting","B":"to depict","C":"depict","D":"depicts"},"answer":"C","explanation":"The relative clause modifies the explicitly plural noun maps; the finite verb depict agrees with that noun.","choice_explanations":{"A":"Incorrect: The form that depicting leaves the relative clause without a finite verb.","B":"Incorrect: That to depict cannot supply a finite verb in a relative clause.","C":"Correct: The relative clause modifies the explicitly plural noun maps; the finite verb depict agrees with that noun.","D":"Incorrect: Depicts is singular and does not agree with the plural maps modified by that."},"passage":"The historian examined several maps that _______ the coastline as it appeared before the harbor was enlarged.","strategy":"After who, which, or that, check whether the clause has a finite verb and whether it agrees with the preceding noun."},{"id":"FSS-042","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"to trap","B":"trapping","C":"trapped","D":"having trapped"},"answer":"C","explanation":"The relative pronoun which is the subject of a clause requiring a finite verb; trapped supplies a finite past-tense verb.","choice_explanations":{"A":"Incorrect: Which to trap is nonfinite and cannot serve as the relative clause’s predicate.","B":"Incorrect: Which trapping lacks the finite verb required by the relative clause.","C":"Correct: The relative pronoun which is the subject of a clause requiring a finite verb; trapped supplies a finite past-tense verb.","D":"Incorrect: Which having trapped consists of nonfinite forms and does not complete a finite relative clause."},"passage":"The prototype included a filter, which _______ microscopic particles before the water reached the collection tank.","strategy":"After who, which, or that, check whether the clause has a finite verb and whether it agrees with the preceding noun."},{"id":"FSS-043","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"who's","B":"whose","C":"whom","D":"who"},"answer":"B","explanation":"Whose expresses possession and connects the illustrator to the drawings in the relative clause.","choice_explanations":{"A":"Incorrect: Who’s is short for who is or who has and cannot possessively modify drawings.","B":"Correct: Whose expresses possession and connects the illustrator to the drawings in the relative clause.","C":"Incorrect: Whom is an object form and does not mean belonging to whom before a noun.","D":"Incorrect: Who is a subject relative pronoun and cannot act as a possessive determiner before drawings."},"passage":"The illustrator _______ drawings appear throughout the field guide received an award for clear depictions of unfamiliar species.","strategy":"After who, which, or that, check whether the clause has a finite verb and whether it agrees with the preceding noun."},{"id":"FSS-044","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"whose","B":"which","C":"who","D":"whom"},"answer":"C","explanation":"Who is the relative subject pronoun referring to the people, the researchers, and serves as the subject of had worked.","choice_explanations":{"A":"Incorrect: Whose is possessive and requires a following noun, not the verb had worked.","B":"Incorrect: Which is not the conventional relative subject pronoun for the people identified as researchers in this context.","C":"Correct: Who is the relative subject pronoun referring to the people, the researchers, and serves as the subject of had worked.","D":"Incorrect: Whom is an object-case relative pronoun; here the relative pronoun is the subject of had worked."},"passage":"A team of field researchers _______ had worked in the valley since May presented its findings at the annual conference.","strategy":"After who, which, or that, check whether the clause has a finite verb and whether it agrees with the preceding noun."},{"id":"FSS-045","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"generated","B":"to generate","C":"generating","D":"generate"},"answer":"D","explanation":"The modal can applies across the coordinated list, requiring the base verbs hover, measure, and generate.","choice_explanations":{"A":"Incorrect: The past-tense generated cannot follow the modal can in this coordinated series.","B":"Incorrect: To generate adds an infinitive marker to only one item of the coordinated base-verb series.","C":"Incorrect: The participle generating is not parallel to the base verbs after can.","D":"Correct: The modal can applies across the coordinated list, requiring the base verbs hover, measure, and generate."},"passage":"During a field survey, the small drone can hover above a plot, measure soil temperature, and _______ a map of moisture variations for the research team.","strategy":"Read the shared helper (can, would, should, to) across every coordinated action."},{"id":"FSS-046","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"records","B":"record","C":"recording","D":"recorded"},"answer":"B","explanation":"The shared had to requires a sequence of coordinated base verbs: photograph, record, and submit.","choice_explanations":{"A":"Incorrect: Records is an inflected present-tense form and cannot follow the shared to in the coordinated series.","B":"Correct: The shared had to requires a sequence of coordinated base verbs: photograph, record, and submit.","C":"Incorrect: Recording turns one coordinated action into a participle rather than the required base verb.","D":"Incorrect: Recorded switches to the past tense inside the parallel infinitival series."},"passage":"Before the fragments could be reassembled, the restoration team had to photograph each piece, _______ its position in the grid, and submit the final inventory.","strategy":"Read the shared helper (can, would, should, to) across every coordinated action."},{"id":"FSS-047","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"bonds","B":"bonded","C":"bond","D":"bonding"},"answer":"C","explanation":"The modal should governs both coordinated verbs, so remain and bond must both be in their base forms.","choice_explanations":{"A":"Incorrect: Bonds has a third-person singular ending, which cannot follow should.","B":"Incorrect: Bonded is a past or participial form and does not fit the base-verb slot governed by should.","C":"Correct: The modal should governs both coordinated verbs, so remain and bond must both be in their base forms.","D":"Incorrect: Bonding is a participle and is not coordinated correctly with the base verb remain."},"passage":"The manufacturer specifies that the adhesive should remain flexible during installation and _______ firmly once the parts are aligned.","strategy":"Read the shared helper (can, would, should, to) across every coordinated action."},{"id":"FSS-048","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"improves","B":"improving","C":"improved","D":"improve"},"answer":"D","explanation":"The modal would requires base-form verbs across both actions: would reduce and improve.","choice_explanations":{"A":"Incorrect: Improves is third-person singular present tense and cannot follow would.","B":"Incorrect: Improving is a participle, not a parallel base verb governed by would.","C":"Incorrect: Improved is past tense and cannot be coordinated directly with reduce under would.","D":"Correct: The modal would requires base-form verbs across both actions: would reduce and improve."},"passage":"In the report, the ecologists argued that new wildlife corridors would reduce animal-vehicle collisions and _______ access to seasonal feeding grounds.","strategy":"Read the shared helper (can, would, should, to) across every coordinated action."}]}]}</script><script>"use strict";

INF-038","BND-014","BND-030","FSS-006","FSS-022","FSS-038","TRN-047","CID-043","CID-047"]]},{"id":"custom-7","number":7,"label":"Practice Test 7","difficulty":"Very Hard","modules":[["CTC-007","CTC-023","CTC-039","TSP-015","TSP-031","TSP-047","WIC-015","WIC-031","RS-007","RS-023","RS-039","TRN-015","TRN-031","CID-007","CID-023","CID-039","COE-015","COE-031","INF-007","INF-023","INF-039","BND-007","BND-023","BND-039","FSS-007","FSS-023","FSS-039","COE-043","COE-047"],["CTC-015","CTC-031","TSP-007","TSP-023","TSP-039","WIC-007","WIC-023","WIC-039","RS-015","RS-031","TRN-007","TRN-023","TRN-039","CID-015","CID-031","COE-007","COE-023","COE-039","INF-015","INF-031","INF-047","BND-015","BND-031","BND-047","FSS-015","FSS-031","FSS-047","INF-041","INF-045","INF-048"]]},{"id":"custom-8","number":8,"label":"Practice Test 8","difficulty":"Very Hard","modules":[["CTC-008","CTC-024","CTC-040","TSP-016","TSP-032","WIC-008","WIC-024","WIC-040","RS-008","RS-024","RS-040","TRN-008","TRN-024","TRN-040","CID-008","CID-024","CID-040","COE-008","COE-024","COE-040","INF-016","INF-032","BND-008","BND-024","BND-040","FSS-016","FSS-032","BND-043","BND-046"],["CTC-016","CTC-032","TSP-008","TSP-024","TSP-040","WIC-016","WIC-032","WIC-048","RS-016","RS-032","RS-048","TRN-016","TRN-032","TRN-048","CID-016","CID-032","CID-048","COE-016","COE-032","INF-008","INF-024","INF-040","BND-016","BND-032","FSS-008","FSS-024","FSS-040","FSS-041","FSS-044","FSS-048"]]}];
const DATA=JSON.parse(document.getElementById('embedded-bank').textContent);
const QMAP=new Map(DATA.banks.flatMap(b=>b.questions.map(q=>[q.id,q])));
let progress=loadProgress(),exam=null,activeIndex=0,explanationOpen=false,navOpen=false;
let audioCtx=null;
const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function safeRich(s){return esc(s).replace(/&lt;br\s*\/?&gt;/gi,'<br>').replace(/&lt;(\/?)u&gt;/gi,'<$1u>').replace(/&lt;(\/?)em&gt;/gi,'<$1em>').replace(/&lt;(\/?)i&gt;/gi,'<$1i>').replace(/&lt;(\/?)b&gt;/gi,'<$1b>');}
function loadProgress(){try{const p=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');return p&&typeof p==='object'&&!Array.isArray(p)?p:{};}catch{return {};}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));}catch(e){console.warn('Local storage unavailable',e);}}
function ids(e){return e.modules.flat();}
function attempt(e){
  progress.attempts??={};let a=progress.attempts[e.id];
  if(!a)a=progress.attempts[e.id]={answers:{},checked:{},flagged:[],globalIndex:0};
  a.answers??={};a.checked??={};a.flagged??=[];
  if(!Number.isInteger(a.globalIndex))a.globalIndex=Math.min((a.module||0)*27+(a.index||0),53);
  // Import answers/flags previously completed in Bonus Challenge, now distributed among eight tests.
  const oldBonus=progress.attempts['custom-9'];
  if(oldBonus){for(const id of ids(e)){
    if(oldBonus.answers?.[id]&&!a.answers[id])a.answers[id]=oldBonus.answers[id];
    if(oldBonus.checked?.[id])a.checked[id]=true;
    if(oldBonus.flagged?.includes(id)&&!a.flagged.includes(id))a.flagged.push(id);
  }}
  if(a.finishedAt&&!a.checkedMigrated){ids(e).forEach(id=>{if(a.answers[id])a.checked[id]=true;});a.checkedMigrated=true;}
  // Old tests had 27+27 questions; two new questions now precede module 2.
  if(a.layoutVersion!==4){if(a.globalIndex>=27 && a.globalIndex<54)a.globalIndex+=2;a.layoutVersion=4;}
  save();return a;
}
function isChecked(a,id){return !!a.checked[id];}
function countChecked(e,a){return ids(e).filter(id=>isChecked(a,id)).length;}
function countCorrect(e,a){return ids(e).filter(id=>isChecked(a,id)&&a.answers[id]===QMAP.get(id)?.answer).length;}
function playSound(kind){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let notes=kind==='correct'?[[523,.0,.13,.023],[660,.11,.18,.02]]:kind==='wrong'?[[220,0,.17,.026]]:[[435,0,.08,.013]];notes.forEach(([freq,delay,dur,vol])=>{let start=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,start);g.gain.linearRampToValueAtTime(vol,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g);g.connect(audioCtx.destination);o.start(start);o.stop(start+dur+.02);});}catch(e){}}
function flagSvg(){return '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5.5 21V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6.5 4.25c2.3-1.45 4.7 1.15 7 .05 2.15-1 3.4-1.15 5.25-.6v10.2c-2-.65-3.2-.35-5.25.6-2.3 1.08-4.7-1.48-7-.05Z" fill="currentColor"/></svg>';}
function showLibrary(){
  exam=null;document.title='Unofficial SAT Practice Tests';
  app.innerHTML=`<section class="select-screen"><h1>Practice Tests</h1><div class="selection-grid">${EXAMS.map(e=>{
    const a=progress.attempts?.[e.id],n=a?countChecked(e,a):0,checked=!!progress.customDone?.[e.id];

  }).join('')}</div></section>`;
}
function goExam(id){let e=EXAMS.find(x=>x.id===id);if(!e)return;exam=e;let a=attempt(e);activeIndex=Math.min(Math.max(0,a.globalIndex||0),ids(e).length-1);explanationOpen=false;navOpen=false;renderQuestion();}
function passageHtml(q){if(q.text_1&&q.text_2)return `<div class="passage-text split-text"><div class="split-block"><strong>Text 1</strong>${safeRich(q.text_1)}</div><div class="split-block"><strong>Text 2</strong>${safeRich(q.text_2)}</div></div>`;
if(q.notes?.length)return `<div class="passage-text notes-block">${q.passage?`<p>${safeRich(q.passage)}</p>`:''}<ul>${q.notes.map(x=>`<li>${safeRich(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul></div>`;
if(q.text_html)return `<div class="passage-text">${safeRich(q.text_html)}</div>`;
let t=String(q.passage||q.text||''),display=safeRich(t);if(q.target_text&&t.includes(q.target_text))display=safeRich(t.slice(0,t.indexOf(q.target_text)))+'<u>'+esc(q.target_text)+'</u>'+safeRich(t.slice(t.indexOf(q.target_text)+q.target_text.length));return t?`<div class="passage-text">${display}</div>`:'';}
function questionBody(q){let body=passageHtml(q);if(q.goal&&!q.question?.includes(q.goal))body+=`<p class="passage-text">${esc(q.goal)}</p>`;return `${body}<div class="question-stem">${safeRich(q.question)}</div>`;}
function explanationHtml(q,a){return `<div class="choice-explanations">${'ABCD'.split('').map(c=>{let cls=c===q.answer?'correct-choice':(a.answers[q.id]===c&&c!==q.answer?'user-wrong-choice':'');let exp=q.choice_explanations?.[c]||((c===q.answer)?q.explanation:'');return `<div class="choice-explanation ${cls}"><div class="choice-letter-badge">${c}</div><div class="choice-text">${safeRich(exp)}</div></div>`;}).join('')}</div>`;}
function navHtml(e,a){let offset=0;
  return `<aside class="navigation ${navOpen?'open':''}" id="navigation" aria-label="Question navigation"><div class="nav-heading"><strong>Questions</strong></div><div class="nav-scroll" id="navScroll">${e.modules.map((module,m)=>{
    let out=`<div class="nav-module-title">Module ${m+1}</div><div class="nav-module-grid">${module.map((id,i)=>{
      const q=QMAP.get(id),marked=a.flagged.includes(id),result=isChecked(a,id)?(a.answers[id]===q.answer?'correct':'wrong'):'';
      return `<button type="button" data-act="jump" data-index="${offset+i}" class="nav-tile ${result} ${marked?'marked':''} ${offset+i===activeIndex?'current':''}" aria-label="Question ${offset+i+1}${marked?', flagged':''}${result?', '+result:''}" aria-current="${offset+i===activeIndex?'true':'false'}">${offset+i+1}</button>`;
    }).join('')}</div>`;offset+=module.length;return out;
  }).join('')}</div></aside>`;
}
let infoHideTimer=null;
function actionButtons(done,selected){
  if(!done)return `<div class="actions actions-before"><button type="button" class="btn btn-primary check-wide" data-act="check" ${!selected?'disabled':''}>Check</button></div>`;
  return `<div class="actions actions-after"><div class="navigation-actions"><button type="button" class="btn btn-next" data-act="previous" ${activeIndex===0?'disabled':''}>Previous</button><button type="button" class="btn btn-primary" data-act="next">Next Question &rarr;</button></div><button type="button" class="btn btn-secondary show explanation-toggle" data-act="explain">${explanationOpen?'Hide Explanation':'Show Explanation'}</button></div>`;
}
function renderQuestion(){
  if(!exam)return showLibrary();clearTimeout(infoHideTimer);
  const a=attempt(exam),id=ids(exam)[activeIndex],q=QMAP.get(id);
  if(!q){app.textContent='Question not found';return;}
  const selected=a.answers[id],done=isChecked(a,id),marked=a.flagged.includes(id);
  const options='ABCD'.split('').map(letter=>{
    const cls=done?(letter===q.answer?'correct':(selected===letter?'wrong':'')):(selected===letter?'selected':'');
    return `<div class="option ${cls} ${done?'disabled':''}" role="button" tabindex="${done?'-1':'0'}" aria-pressed="${selected===letter}" data-act="select" data-letter="${letter}"><div class="option-letter">${letter}</div><div class="option-text">${safeRich(q.choices[letter])}</div></div>`;
  }).join('');
  app.innerHTML=`<div class="practice-shell"><div class="question-column"><div class="tiny-toolbar"><button type="button" data-act="back" class="back">Practice Tests</button><span class="exam-label">${esc(exam.label)}</span><button type="button" class="nav-mobile-trigger" data-act="nav" aria-label="Show question navigation">Questions &#9776;</button></div><main class="quiz-container"><section class="question-wrapper" id="activeQuestion"><div class="question-card-top"><div class="question-meta" id="questionMeta" aria-hidden="true"><span class="meta-pill">Question ${activeIndex+1} / ${ids(exam).length}</span><span class="meta-pill">${esc(q.category)}</span><span class="meta-pill">${esc(q.skill)}</span></div><div class="question-tools"><button type="button" class="info-btn" title="Question information" aria-label="Show question information" aria-expanded="false" data-act="info">i</button><button class="star-btn ${marked?'saved':''}" title="Flag question" aria-label="Flag question" aria-pressed="${marked}" data-act="flag">&#9733;</button></div></div><div class="question-text">${questionBody(q)}</div><div class="options">${options}</div><div id="questionActions">${actionButtons(done,selected)}</div><div class="explanation-box ${done&&explanationOpen?'show':''}" id="explanationBox"><div class="explanation-inner">${done?explanationHtml(q,a):''}</div></div></section></main></div><div class="nav-shade ${navOpen?'show':''}" data-act="hide-nav"></div>${navHtml(exam,a)}</div>`;
  requestAnimationFrame(()=>document.getElementById('activeQuestion')?.classList.add('active'));
  const nav=document.querySelector('.nav-tile.current');
  if(nav&&window.matchMedia('(min-width: 841px)').matches)nav.scrollIntoView({block:'nearest'});
  a.globalIndex=activeIndex;save();document.title=`${esc(exam.label)} - Question ${activeIndex+1}`;
}
function selectOption(letter){if(!exam)return;let a=attempt(exam),id=ids(exam)[activeIndex];if(isChecked(a,id))return;a.answers[id]=letter;save();playSound('select');document.querySelectorAll('.option').forEach(x=>{x.classList.toggle('selected',x.dataset.letter===letter);x.setAttribute('aria-pressed',String(x.dataset.letter===letter));});document.querySelector('[data-act="check"]').disabled=false;}
function checkAnswer(){
  if(!exam)return;const a=attempt(exam),id=ids(exam)[activeIndex],selected=a.answers[id];
  if(!selected || a.checked[id])return;
  a.checked[id]=true;explanationOpen=false;save();
  const q=QMAP.get(id),correct=selected===q.answer;
  playSound(correct?'correct':'wrong');
  // Update in place: avoid replaying the whole question entrance animation on Check.
  document.querySelectorAll('.option').forEach(el=>{
    const letter=el.dataset.letter;
    el.classList.remove('selected');
    el.classList.toggle('correct',letter===q.answer);
    el.classList.toggle('wrong',letter===selected&&letter!==q.answer);
    el.classList.add('disabled');el.tabIndex=-1;
  });
  document.getElementById('questionActions').innerHTML=actionButtons(true,selected);
  document.querySelector('#explanationBox .explanation-inner').innerHTML=explanationHtml(q,a);
  const tile=document.querySelector(`.nav-tile[data-index="${activeIndex}"]`);
  if(tile){tile.classList.add(correct?'correct':'wrong');tile.setAttribute('aria-label',`Question ${activeIndex+1}, ${correct?'correct':'wrong'}`);}
}
function jump(i){
  if(!exam)return;const all=ids(exam);
  if(!Number.isInteger(i)||i<0||i>=all.length)return;
  activeIndex=i;explanationOpen=false;navOpen=false;playSound('select');renderQuestion();
  window.scrollTo({top:0,behavior:'instant'});
}
function toggleFlag(){
  if(!exam)return;const a=attempt(exam),id=ids(exam)[activeIndex];
  const marked=a.flagged.includes(id);
  a.flagged=marked?a.flagged.filter(x=>x!==id):[...a.flagged,id];save();playSound('select');
  const btn=document.querySelector('.star-btn');if(btn){btn.classList.toggle('saved',!marked);btn.setAttribute('aria-pressed',String(!marked));}
  const tile=document.querySelector(`.nav-tile[data-index="${activeIndex}"]`);if(tile){tile.classList.toggle('marked',!marked);tile.setAttribute('aria-label',`Question ${activeIndex+1}${!marked?', flagged':''}`);}
}
function showQuestionInfo(){
  const info=document.getElementById('questionMeta'),btn=document.querySelector('[data-act="info"]');if(!info)return;
  clearTimeout(infoHideTimer);info.classList.add('revealed');info.setAttribute('aria-hidden','false');
  if(btn)btn.setAttribute('aria-expanded','true');playSound('select');
  infoHideTimer=setTimeout(()=>{info.classList.remove('revealed');info.setAttribute('aria-hidden','true');if(btn)btn.setAttribute('aria-expanded','false');},3000);
}
function backToTests(){if(window.self!==window.top){window.parent.postMessage({type:'sat-original-show-tests'},'*');}else showLibrary();}
app.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const type=el.dataset.act;
  if(type==='open')goExam(el.dataset.id);
  else if(type==='back')backToTests();
  else if(type==='select')selectOption(el.dataset.letter);
  else if(type==='check')checkAnswer();
  else if(type==='next')jump((activeIndex+1)%ids(exam).length);
  else if(type==='previous')jump(activeIndex-1);
  else if(type==='jump')jump(Number(el.dataset.index));
  else if(type==='flag')toggleFlag();
  else if(type==='info')showQuestionInfo();
  else if(type==='explain'){
    explanationOpen=!explanationOpen;
    document.getElementById('explanationBox').classList.toggle('show',explanationOpen);
    el.textContent=explanationOpen?'Hide Explanation':'Show Explanation';playSound('select');
  } else if(type==='nav'){
    navOpen=true;document.getElementById('navigation').classList.add('open');document.querySelector('.nav-shade').classList.add('show');
  }else if(type==='hide-nav'){
    navOpen=false;document.getElementById('navigation').classList.remove('open');el.classList.remove('show');
  }
});
app.addEventListener('change',ev=>{if(ev.target.matches('[data-done]')){
  progress.customDone??={};progress.customDone[ev.target.dataset.done]=ev.target.checked;save();
}});
app.addEventListener('keydown',ev=>{const opt=ev.target.closest('.option[data-act="select"]');if(opt&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();selectOption(opt.dataset.letter);}});
window.addEventListener('message',ev=>{if(ev.source!==window.parent||ev.data?.type!=='sat-original-open-test')return;goExam(ev.data.id);});
window.addEventListener('storage',ev=>{if(ev.key!==STORAGE_KEY||!ev.newValue)return;try{const fresh=JSON.parse(ev.newValue);if(fresh&&typeof fresh==='object'){progress.customDone=fresh.customDone||{};progress.officialDone=fresh.officialDone||{};}}catch{}});
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&navOpen){navOpen=false;document.getElementById('navigation').classList.remove('open');document.querySelector('.nav-shade').classList.remove('show');}});
const param=new URLSearchParams(window.location.search).get('test');if(EXAMS.some(e=>e.id===param))goExam(param);else showLibrary();
</script></body></html>
