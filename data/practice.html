to one assessment.","D":"Incorrect: The broader benefit does not reverse the two earlier benefits."},"passage":"A revised bus network shortened journeys for residents of the northern neighborhoods. It also extended service into the evening, making transit available to more late-shift workers. _______ the changes expanded the network's usefulness to several groups of residents.","strategy":"Combine the preceding findings into a balanced overall statement; do not turn a conclusion into one example."},{"id":"TRN-040","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Similarly,","B":"For example,","C":"Previously,","D":"On balance,"},"answer":"D","explanation":"The conclusion weighs improvement, no effect, and deterioration before assessing the interface overall.","choice_explanations":{"A":"Incorrect: No second study or comparable overall conclusion is given.","B":"Incorrect: The sentence evaluates the entire study; it does not add another task as an example.","C":"Incorrect: The conclusion is not situated before an earlier round of tests.","D":"Correct: The conclusion weighs improvement, no effect, and deterioration before assessing the interface overall."},"passage":"In a pilot study, participants using a new interface performed one task more accurately, showed no change on a second task, and made more errors on a third. _______ the mixed results did not justify a general claim that the new interface was superior.","strategy":"Combine the preceding findings into a balanced overall statement; do not turn a conclusion into one example."},{"id":"TRN-041","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Consequently,","B":"Today,","C":"Likewise,","D":"For example,"},"answer":"B","explanation":"Access to complete audio is a present-day development contrasted with earlier reliance on an incomplete transcript.","choice_explanations":{"A":"Incorrect: The old transcript did not cause the digitized recording to provide additional content.","B":"Correct: Access to complete audio is a present-day development contrasted with earlier reliance on an incomplete transcript.","C":"Incorrect: The availability of full audio differs from the earlier restricted source material.","D":"Incorrect: Audio access is a new situation, not a specific instance of relying only on the transcript."},"passage":"The surviving written record was missing several minutes of a crucial exchange. For decades, historians knew a disputed meeting only from a partial written transcript. _______ recently digitized audio allows them to hear the entire exchange, including comments that the transcript omitted.","strategy":"Identify when the earlier practice held and how a later or current practice differs."},{"id":"TRN-042","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"In other words,","B":"More recently,","C":"Therefore,","D":"For example,"},"answer":"B","explanation":"The software changed over time from manual entry to automatic importing.","choice_explanations":{"A":"Incorrect: Automatic import is not a paraphrase of typing each measurement by hand.","B":"Correct: The software changed over time from manual entry to automatic importing.","C":"Incorrect: The manual-input requirement did not logically cause the later software to support direct import.","D":"Incorrect: The new version is a later alternative to the early design, not a specimen of that design."},"passage":"Technicians often entered hundreds of values after a single experimental run. Early versions of the laboratory's software required technicians to type each measurement into a form. _______ updated versions can import measurements directly from the sensors that record them.","strategy":"Identify when the earlier practice held and how a later or current practice differs."},{"id":"TRN-043","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Likewise,","B":"Previously,","C":"Nevertheless,","D":"Increasingly,"},"answer":"D","explanation":"The sentence describes a growing current practice that developed after reliance on print.","choice_explanations":{"A":"Incorrect: New online sharing is not merely a parallel instance of earlier printed circulation.","B":"Incorrect: The online sharing is the newer and increasingly common activity, not the earlier one.","C":"Incorrect: The online practice represents an adopted development, not an achievement despite a competing obstacle.","D":"Correct: The sentence describes a growing current practice that developed after reliance on print."},"passage":"At the start of the project, the research group circulated its findings mainly through printed conference proceedings. The group gradually adopted open digital repositories. _______ its members share preliminary results online before the proceedings are published.","strategy":"Identify when the earlier practice held and how a later or current practice differs."},{"id":"TRN-044","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Similarly,","B":"In other words,","C":"Now,","D":"Previously,"},"answer":"C","explanation":"The new extent of the reedbeds is a current condition contrasted with the historical photographs.","choice_explanations":{"A":"Incorrect: The current expansion is different from the narrow historical reedbelt, not a similar condition.","B":"Incorrect: A greatly expanded marsh is not a restatement of the older narrow belt.","C":"Correct: The new extent of the reedbeds is a current condition contrasted with the historical photographs.","D":"Incorrect: The expanded reeds are the later state, not the earlier one."},"passage":"Photographs taken forty years ago show only a narrow belt of reeds along the estuary. A restoration program later expanded the wetlands in several stages. _______ aerial surveys show reeds extending across much of the adjacent marsh.","strategy":"Identify when the earlier practice held and how a later or current practice differs."},{"id":"TRN-045","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Unexpectedly,","B":"Ironically,","C":"By comparison,","D":"Fittingly,"},"answer":"D","explanation":"Allowing free reproduction is consistent with Sol's stated commitment to affordable public technology.","choice_explanations":{"A":"Incorrect: The action is in line with the designer's expressed aims, not surprising in light of them.","B":"Incorrect: Open licensing fulfills, rather than undermines, the engineer's stated priority.","C":"Incorrect: The text does not compare two designers or two different licensing approaches.","D":"Correct: Allowing free reproduction is consistent with Sol's stated commitment to affordable public technology."},"passage":"Engineer Mara Sol designed a flood-warning system around low-cost radio beacons, arguing that emergency technology should remain accessible to small towns with limited budgets. _______ when Sol published the design, she allowed communities to reproduce the plans without paying a licensing fee.","strategy":"Determine whether the ensuing development is consistent with expectations, ironical, or especially revealing."},{"id":"TRN-046","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Predictably,","B":"Consequently,","C":"Similarly,","D":"Ironically,"},"answer":"D","explanation":"The station's significant result arose from a backup system during the failure of instruments central to its intended purpose.","choice_explanations":{"A":"Incorrect: A major insect discovery was not the expected result of the wind-measuring project.","B":"Incorrect: The sensor failure does not itself demonstrate a causal mechanism producing the insect-call pattern.","C":"Incorrect: Insect calls and wind measurements are not two comparable successes reported in parallel.","D":"Correct: The station's significant result arose from a backup system during the failure of instruments central to its intended purpose."},"passage":"A research station was built to detect tiny changes in prevailing winds. During a storm, its wind sensors stopped working, but a backup microphone continued recording. _______ the station's most influential finding that month was a previously unknown pattern in insect calls, not a measurement of wind.","strategy":"Determine whether the ensuing development is consistent with expectations, ironical, or especially revealing."},{"id":"TRN-047","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Ironically,","B":"Unsurprisingly,","C":"Therefore,","D":"Nevertheless,"},"answer":"B","explanation":"The observed response matches the biologists' explicit expectation about island birds.","choice_explanations":{"A":"Incorrect: The finding supports the prediction instead of reversing or subverting it.","B":"Correct: The observed response matches the biologists' explicit expectation about island birds.","C":"Incorrect: The act of predicting the response did not cause the birds to behave that way.","D":"Incorrect: No disappointing or counterintuitive outcome is reported; the observation was anticipated."},"passage":"An island bird has few natural predators, so biologists predicted that it would be less cautious around unfamiliar objects than its mainland relatives. _______ when researchers placed a novel device near the birds, island individuals approached it quickly while mainland birds kept their distance.","strategy":"Determine whether the ensuing development is consistent with expectations, ironical, or especially revealing."},{"id":"TRN-048","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Similarly,","B":"To put it another way,","C":"Significantly,","D":"Consequently,"},"answer":"C","explanation":"The date of the paper-maker's mark is especially important because it challenges an influential historical claim.","choice_explanations":{"A":"Incorrect: The maker's mark challenges rather than parallels the earlier conclusion.","B":"Incorrect: A mark introduced in 1907 is new evidence contradicting the earlier claim, not a paraphrase of the date 1902.","C":"Correct: The date of the paper-maker's mark is especially important because it challenges an influential historical claim.","D":"Incorrect: The 1902 claim did not cause the maker's mark to have been introduced in 1907."},"passage":"An undated manuscript has often been cited as evidence that a poet stopped revising a long poem in 1902. The manuscript contains a replacement stanza written on a separate sheet. _______ a paper-maker's mark on that sheet was first introduced in 1907, which undermines the usual dating of the revision.","strategy":"Determine whether the ensuing development is consistent with expectations, ironical, or especially revealing."}]},{"category":"Information and Ideas","subcategory":"Central Ideas and Details","questions":[{"id":"CID-001","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Flood-storing parks can help walls and pumps manage storms without replacing those conventional defenses.","B":"Conventional flood walls are becoming unnecessary as cities convert recreation areas into reservoirs.","C":"The hospital in Merrow was the only neighborhood that remained protected during heavy storms.","D":"Lowering park terraces reduces stormwater everywhere in a coastal city, regardless of where the parks are located."},"answer":"A","explanation":"The parks function as part of flood control, alongside rather than instead of traditional infrastructure.","choice_explanations":{"A":"Correct: The parks function as part of flood control, alongside rather than instead of traditional infrastructure.","B":"Incorrect: The text explicitly says walls and pumps remained necessary; replacing them is too strong.","C":"Incorrect: The passage mentions pumps near the hospital, not comparative protection among neighborhoods.","D":"Incorrect: The evidence concerns reduced pressure during some storms, not a citywide guarantee."},"passage":"Engineers once treated a city's flood barriers as separate from its parks: concrete walls stopped water, while green spaces served recreation. In the coastal district of fictional Merrow, planners instead lowered several park terraces to admit exceptional stormwater. The terraces did not prevent flooding everywhere, and pumps remained necessary near the hospital. Yet monitoring showed that, during several heavy storms, temporarily storing water in the parks reduced pressure on the walls and pumps. The planners now regard the parks not as replacements for flood infrastructure but as components of it.","strategy":"Identify the claim that the final sentence generalizes; treat the hospital as an example, not the point."},{"id":"CID-002","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Technicians at the Riverton workshop were the true creators of most designs attributed to engravers.","B":"Plate technicians helped shape finished prints, but there is no proof they designed the works alone.","C":"Workshop catalogues identify the engravers but omit the technicians who prepared their plates.","D":"Changes to plate spacing are more important to a print than changes to the artist’s initial design."},"answer":"B","explanation":"The main point is the more collaborative picture suggested by the accounts, with a stated limit.","choice_explanations":{"A":"Incorrect: The author expressly declines to conclude that technicians designed works independently.","B":"Correct: The main point is the more collaborative picture suggested by the accounts, with a stated limit.","C":"Incorrect: This is background information, not the overall significance of the accounts.","D":"Incorrect: No ranking of contributions is given."},"passage":"Early catalogues of the fictitious Riverton print workshop identify artists by the designs they engraved but rarely name the technicians who prepared the printing plates. Newly examined workshop accounts show that technicians sometimes suggested changes to line thickness and spacing that were incorporated into the final images. The accounts do not establish that technicians designed the works independently, as some commentators have proposed. They do, however, complicate a view of the workshop's output as the exclusive expression of the named engravers.","strategy":"Combine what the evidence establishes with what it explicitly does not establish."},{"id":"CID-003","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Tree shade is always more effective than fabric shade because it cools sidewalks at every hour.","B":"Traffic volume was the single largest determinant of evening sidewalk temperature in Talmere.","C":"Trees and canopies showed different cooling patterns, although other street factors could matter.","D":"Fabric canopies provide no meaningful benefit to cities once the sun has set."},"answer":"C","explanation":"The conclusion is about differentiated benefits and uncertainty, not universal tree superiority.","choice_explanations":{"A":"Incorrect: The evidence does not support all-hours superiority and includes a confounding-factor caveat.","B":"Incorrect: Traffic is mentioned as a possible difference, not measured as the decisive factor.","C":"Correct: The conclusion is about differentiated benefits and uncertainty, not universal tree superiority.","D":"Incorrect: The comparison does not establish an absence of benefit after sunset."},"passage":"In a survey of shaded streets in the invented city of Talmere, researchers compared the daytime temperatures of sidewalks beneath trees and fabric canopies. Both types of shade reduced the temperature of surfaces receiving direct sunlight, but tree-covered streets also tended to be cooler late in the evening. The team cautioned that the surveyed streets differed in traffic and building height, so the temperature difference could not be attributed entirely to trees. The findings nevertheless suggest that the benefits of urban shade depend partly on its form and on the time of day being considered.","strategy":"Use the conclusion to distinguish a measured pattern from an unproven causal explanation."},{"id":"CID-004","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"The painted ceiling was originally blue, but restorers mistakenly covered it with gray paint during a later repair.","B":"Chemical changes to pigments are the main reason seventeenth-century artworks cannot be safely displayed.","C":"Restorers rejected laboratory testing and relied on historical descriptions to choose ceiling colors.","D":"Pigment traces offer clues about a ceiling’s former colors but cannot establish one certain reconstruction."},"answer":"D","explanation":"The main idea is a limitation of reconstructing appearance from ambiguous physical evidence.","choice_explanations":{"A":"Incorrect: The source of some blue traces is a later repair; the original scheme remains uncertain.","B":"Incorrect: The text discusses uncertainty about reconstruction, not display safety.","C":"Incorrect: They performed analyses and did not choose one definitive scheme.","D":"Correct: The main idea is a limitation of reconstructing appearance from ambiguous physical evidence."},"passage":"Restorers of a seventeenth-century painted ceiling identified microscopic traces of blue pigment beneath areas that now appear gray. At first, the discovery seemed to offer a straightforward guide for repainting the ceiling. Additional analysis, however, showed that some of the blue traces came from a later repair, while pigments from the original decoration had changed chemically over time. The restorers therefore chose to document several plausible appearances rather than present a single reconstructed color scheme as certain.","strategy":"Look for the general methodological lesson, not the initially tempting interpretation."},{"id":"CID-005","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Residue findings weaken a jars-based argument for grain dependence, but do not rule out grain trade.","B":"The Kelan settlements survived poor harvests entirely by importing dried fruit and fragrant oils.","C":"Foreign jars demonstrate that grain imports became unnecessary as locally grown food supplies recovered.","D":"Because few grain containers survive, archaeologists can conclude that no long-distance grain trade occurred."},"answer":"A","explanation":"Some containers had non-grain contents; this weakens a particular inference but does not exclude grain trade.","choice_explanations":{"A":"Correct: Some containers had non-grain contents; this weakens a particular inference but does not exclude grain trade.","B":"Incorrect: The text identifies possible uses of some vessels, not the entire food supply.","C":"Incorrect: Neither the end of imports nor a recovery of harvests is described.","D":"Incorrect: The text specifically allows that grain may have arrived in less durable containers."},"passage":"Several settlements on the fictional Kelan coast contain foreign-made jars dating to a period of poor local harvests. One interpretation holds that the jars demonstrate a sudden dependence on imported grain. A later study found residues of dried fruit and fragrant oils in many of the jars, suggesting that some imports served other purposes. This does not rule out grain imports, which may have traveled in containers that were less likely to survive. It does mean that the jars alone are a weaker basis for claims about food dependence than previously assumed.","strategy":"Locate the exact claim weakened; avoid changing “not proven” into “disproven.”"},{"id":"CID-006","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Curators who favor subtitles generally regard original title cards as obstacles that archives should remove permanently.","B":"Curators debate subtitle effects on viewing silent films but agree on preserving the originals.","C":"Adding synchronized subtitles necessarily reproduces the original pace and emphasis of a silent film.","D":"Film archives have stopped presenting silent films in languages that modern viewers do not understand."},"answer":"B","explanation":"The central contrast is between viewing approaches, bounded by agreement on preservation.","choice_explanations":{"A":"Incorrect: Both groups support preserving originals; the dispute is about access versions.","B":"Correct: The central contrast is between viewing approaches, bounded by agreement on preservation.","C":"Incorrect: One group warns that subtitles can change attention and timing.","D":"Incorrect: The passage says archives are experimenting with subtitled access, not ending screenings."},"passage":"A film archive has begun adding modern subtitles to silent films that originally used printed title cards. Some curators object that subtitles can shift attention away from the timing of the original cards, altering the pace of a scene. Others point out that, when carefully synchronized, subtitles make unfamiliar languages more accessible without altering the projected image. Neither group argues that a subtitled version should replace the preserved original. The disagreement concerns how archives should make films available for viewing, not whether their historical forms deserve protection.","strategy":"Distinguish the parties’ point of dispute from their explicitly stated common ground."},{"id":"CID-007","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Fragmented hedgerows were shown to prevent butterflies from returning to restored meadows.","B":"Introducing native flowers is ineffective unless every surrounding hedgerow has been reconnected.","C":"Meadow habitat connections may affect recovery, but their contribution is still uncertain.","D":"The researchers calculated precisely how much butterfly recovery could be attributed to hedgerows."},"answer":"C","explanation":"The passage qualifies a flowers-only explanation by introducing a second possible factor without quantifying it.","choice_explanations":{"A":"Incorrect: Butterfly numbers increased in both groups; the passage does not indicate prevention.","B":"Incorrect: Plants coincided with increases even where hedgerows remained fragmented.","C":"Correct: The passage qualifies a flowers-only explanation by introducing a second possible factor without quantifying it.","D":"Incorrect: The passage explicitly says the contribution was not established precisely."},"passage":"In a controlled restoration project, butterflies returned quickly to several meadows where native flowering plants had been reintroduced. In neighboring meadows where the same plants were added but surrounding hedgerows remained fragmented, butterfly numbers rose more slowly. Researchers suggest that access to connecting habitat may matter alongside the abundance of flowers. The difference between meadow groups was not large enough to establish precisely how much the hedgerows contributed, but it challenges the view that planting flowers alone determines the speed of recovery.","strategy":"Prefer a bounded, multicausal interpretation to a categorical one."},{"id":"CID-008","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Streaming has caused most independent venues to sell more tickets than before recorded music became widespread.","B":"Concertgoers prefer recorded improvisation to unpredictable live performances.","C":"Because nonattendees were excluded, the interviews show that streaming always reduces concert attendance.","D":"Streaming may draw some listeners to live concerts, but its total effect on ticket sales is unknown."},"answer":"D","explanation":"Some attendees discover artists via streaming, but sampling limits claims about all ticket sales.","choice_explanations":{"A":"Incorrect: No historical comparison or representative total-sales measure is provided.","B":"Incorrect: The interviewed patrons value improvisation unavailable on recordings.","C":"Incorrect: A limitation on generalization is not evidence for a universal negative effect.","D":"Correct: Some attendees discover artists via streaming, but sampling limits claims about all ticket sales."},"passage":"Small concert venues have sometimes argued that streaming services reduce ticket sales because listeners can hear recordings at home. In interviews with patrons of independently owned venues, however, many reported first discovering unfamiliar performers through streaming. Those patrons also reported attending shows to experience improvisation unavailable on recordings. The interviews cannot reveal whether streaming increases total ticket sales, since people who never attend concerts were not surveyed. Nonetheless, the findings complicate the assumption that recorded and live performances necessarily compete for the same audiences.","strategy":"Ask whose behavior the evidence represents before making claims about an entire market."},{"id":"CID-009","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Flowering began earlier, but delayed pollinator arrival may explain later seed maturation.","B":"Warming caused the pollinating moths to emerge earlier, delaying flowering across the valley.","C":"Seed maturation was delayed entirely because warmer temperatures directly slowed seed development.","D":"Researchers established that snowmelt is the only environmental factor influencing the plant’s reproduction."},"answer":"A","explanation":"Flowering advances while maturation lags; a mismatch with pollinators helps account for the discrepancy.","choice_explanations":{"A":"Correct: Flowering advances while maturation lags; a mismatch with pollinators helps account for the discrepancy.","B":"Incorrect: The moths arrived later relative to flowers, and flowering itself advanced.","C":"Incorrect: The proposed mechanism concerns pollinator timing; the text does not prove a direct thermal effect.","D":"Incorrect: Other conditions are explicitly acknowledged."},"passage":"In an alpine valley, a spring warming trend caused one flowering plant to open its blossoms earlier than in previous decades. Yet researchers found that its seeds matured later, not earlier. Temperature records and insect surveys suggested a reason for the mismatch: the pollinating moths, whose emergence depends heavily on snowmelt rather than air temperature, were arriving later relative to flowering. The researchers caution that seed maturation depends on other conditions as well, but the observations show why an earlier start to a biological process need not produce an earlier finish.","strategy":"Identify the apparent contradiction and the mechanism offered to reconcile it."},{"id":"CID-010","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"The crab species proved to have different diets, invalidating the assumption that they shared food resources.","B":"Crabs with similar diets may coexist by feeding in different places and at different times.","C":"The efficiency of the crabs’ claws determined which species could survive in shallow seagrass beds.","D":"All the crab species avoided feeding at night because predators hunted near the seagrass tips."},"answer":"B","explanation":"The surprising coexistence is explained by niche separation in time and space despite dietary overlap.","choice_explanations":{"A":"Incorrect: The diet overlap remains; time and location differ.","B":"Correct: The surprising coexistence is explained by niche separation in time and space despite dietary overlap.","C":"Incorrect: The expected dominance based on claws did not occur.","D":"Incorrect: Some crabs hunted after sunset; predators are not mentioned."},"passage":"In shallow seagrass beds, multiple small crab species appear to rely on the same tiny crustaceans for food. Ecologists expected the species with the most efficient claws to dominate. Instead, the crabs persisted together in relatively stable numbers. Nighttime observations revealed that some hunted near the grass tips after sunset, whereas others searched among roots before dawn. Thus, an apparent overlap in diet concealed a difference in feeding schedules and locations that could reduce direct competition.","strategy":"When a predicted winner fails to emerge, search for the newly introduced distinction."},{"id":"CID-011","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Replacing older processors made each individual request consume more electricity despite falling demand.","B":"The increase in demand caused processors to become less efficient after their installation.","C":"Per-request efficiency rose, yet increased demand drove up the facility’s total electricity use.","D":"Overall electricity consumption provides no useful information about the environmental costs of computing."},"answer":"C","explanation":"Efficiency and total consumption move in opposite directions when demand grows sufficiently.","choice_explanations":{"A":"Incorrect: The passage states per-request consumption decreased and demand increased.","B":"Incorrect: The processors became more efficient; usage growth drove total consumption.","C":"Correct: Efficiency and total consumption move in opposite directions when demand grows sufficiently.","D":"Incorrect: The passage instead argues that total consumption matters alongside unit efficiency."},"passage":"The electricity required to process one request at a cloud-computing facility fell substantially after the facility replaced older processors. Nonetheless, its overall electricity consumption rose over the same period. Analysts found that the new equipment enabled the facility to process far more requests, and demand grew faster than per-request energy use declined. The result illustrates a limitation of evaluating efficiency only per unit of activity: a more efficient system can still consume more resources in total if its use expands enough.","strategy":"Track the denominator of each metric rather than assuming “more efficient” means “less total.”"},{"id":"CID-012","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Darsen residents stopped using bicycle lanes because the new routes were unsafe during the summer.","B":"The survey confirmed that residents had no interest in borrowing bicycles, so officials abandoned cycling improvements.","C":"Building protected cycling lanes is less valuable than replacing all parking spaces with bicycle-sharing stations.","D":"Missing destination facilities may explain why cycling plateaued despite new protected lanes."},"answer":"D","explanation":"Infrastructure can produce early gains but still be limited by connections and end-of-trip access.","choice_explanations":{"A":"Incorrect: Safety and a decline in use are not reported.","B":"Incorrect: The survey found too few useful destination facilities, not a lack of interest.","C":"Incorrect: The text offers no such policy comparison or universal prescription.","D":"Correct: Infrastructure can produce early gains but still be limited by connections and end-of-trip access."},"passage":"After the fictional town of Darsen added protected bicycle lanes, cycling trips increased sharply for one summer and then leveled off. Officials initially interpreted the plateau as evidence that residents had lost interest in cycling. A travel survey found, however, that many would-be riders lived near the new lanes but far from places to park or borrow bicycles at their destinations. The plateau therefore may reflect a bottleneck in the usefulness of the overall cycling network rather than a decline in demand for cycling itself.","strategy":"Treat an observed trend and its initial interpretation as separate; locate the proposed alternative."},{"id":"CID-013","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Unequal preservation of pottery makes excavated proportions unreliable as measures of past use.","B":"Glazed bowls were probably used only during ceremonial meals because they endured burial better.","C":"Experiments proved that all unglazed bowls at the settlement were destroyed before excavation.","D":"The excavated refuse pits contain more unglazed bowls than glazed ones despite their different durability."},"answer":"A","explanation":"The argument centers on a preservation bias between observed artifacts and original practices.","choice_explanations":{"A":"Correct: The argument centers on a preservation bias between observed artifacts and original practices.","B":"Incorrect: Neither ceremonial use nor infrequent use follows from preservation rates.","C":"Incorrect: The text indicates differential erosion, not complete destruction.","D":"Incorrect: This reverses the reported count."},"passage":"Excavators at a desert settlement found far more glazed bowls than unglazed ones in its surviving refuse pits. Some scholars interpreted this as evidence that glazed bowls were used for most everyday meals. Experiments with replicas suggested, however, that glazed bowls resist certain soil conditions that rapidly erode the surfaces of unglazed pottery. Because the archaeological record may preserve the two types at different rates, the relative abundance of recovered bowls cannot be taken as a straightforward measure of how frequently each was used.","strategy":"Ask whether an observed sample is representative of the original population."},{"id":"CID-014","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"The discovery proves that methane is absent from the planet’s atmosphere and that life could not exist there.","B":"The observed atmospheric signal supports more than one explanation, so a biological origin remains uncertain.","C":"The second team directly measured two gases and therefore disproved the first team’s computer models.","D":"Atmospheric absorption patterns are generally too unreliable to provide useful information about any planet."},"answer":"B","explanation":"Detection is firm but chemical and biological interpretation remains underdetermined.","choice_explanations":{"A":"Incorrect: An alternative explanation does not exclude methane or life.","B":"Correct: Detection is firm but chemical and biological interpretation remains underdetermined.","C":"Incorrect: The second team modeled a possible combination; no such direct detection is reported.","D":"Incorrect: The passage concerns one unresolved signal, not atmospheric spectroscopy as a whole."},"passage":"Astronomers detected a distinctive absorption pattern in light passing through the atmosphere of a distant planet. Computer models showed that methane could produce the pattern, prompting speculation that biological activity might be present. A second team demonstrated that a combination of two nonbiological gases could create a closely similar pattern at the available resolution. The observation therefore remains noteworthy, but the models do not yet distinguish sufficiently between competing explanations for the atmosphere's composition.","strategy":"Separate direct observation from interpretations compatible with that observation."},{"id":"CID-015","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Most residents favored longer market hours but were prevented by officials from requesting them.","B":"Municipal petitions are generally fabricated and therefore unsuitable for historical research.","C":"Petitions reveal petitioners’ concerns but may not represent the views of most residents.","D":"The number of market petitions fell because noisy marketplaces became quieter over time."},"answer":"C","explanation":"The historian critiques sample selection rather than the authenticity of the petitions.","choice_explanations":{"A":"Incorrect: The text does not establish what most residents wanted or any prevention of requests.","B":"Incorrect: The records may be accurate for their authors; the problem is representativeness.","C":"Correct: The historian critiques sample selection rather than the authenticity of the petitions.","D":"Incorrect: No chronological change in petition volume or noise is mentioned."},"passage":"An archive of municipal petitions from a nineteenth-century port contains many complaints about noisy markets but relatively few requests to extend market hours. A historian once used these documents to argue that most residents opposed the markets. Another historian points out that residents satisfied with existing arrangements had little reason to submit petitions at all. The documents may faithfully record the concerns of people who wrote to officials while still giving a distorted picture of the wider population's preferences.","strategy":"For archival evidence, identify who had an incentive to enter the record."},{"id":"CID-016","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Loud ventilation was proven to improve participants’ memory by distracting them from the heat.","B":"Participants in warmer rooms recalled more words despite reporting greater distraction.","C":"The experiment demonstrated that temperature and noise influence memory by the same biological mechanism.","D":"Temperature cannot be singled out as the cause of poorer recall because the rooms also differed in noise."},"answer":"D","explanation":"The result is real within the experiment, but temperature and noise were not disentangled.","choice_explanations":{"A":"Incorrect: The proposed effect of noise is a possible confound, not a demonstrated improvement.","B":"Incorrect: The observed difference runs the other way.","C":"Incorrect: No such mechanism is identified or tested.","D":"Correct: The result is real within the experiment, but temperature and noise were not disentangled."},"passage":"In a memory experiment, participants who studied a list of words in a warmer room later recalled fewer words than participants in a cooler room. The research team initially suggested that heat directly interfered with memory. Follow-up observations showed that the warmer room also had a louder ventilation fan, and several participants reported finding its noise distracting. Without a comparison that separates temperature from noise, the experiment does not establish which feature of the rooms accounts for the difference in recall.","strategy":"List variables that changed simultaneously and avoid assigning causality to just one."},{"id":"CID-017","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Nora delays the speech to ensure even the audience members farthest away can hear it.","B":"Nora postpones her speech because she cannot recall the words without a microphone.","C":"Nora is disappointed that the audience expects her to give an improvised speech instead of reading prepared pages.","D":"Nora refuses to speak at a ceremony because she believes large gatherings prevent meaningful discussion."},"answer":"A","explanation":"Her refusal arises from her principle that those in the back should not be excluded.","choice_explanations":{"A":"Correct: Her refusal arises from her principle that those in the back should not be excluded.","B":"Incorrect: She knows every word; audibility is her concern.","C":"Incorrect: No such expectation is described; someone simply encourages her to begin.","D":"Incorrect: She is willing to speak after the power returns and objects only to inaudibility."},"passage":"Nora had practiced the speech until its pauses seemed as familiar as the furniture in her kitchen. On the evening of the ceremony, a sudden power failure left the hall without a microphone. She could still deliver every word, and someone near the front urged her to begin. But Nora folded the pages and waited for the lights to return. She had spent years teaching the people in the back row to speak up; giving a speech they could not hear felt to her like betraying its subject.","strategy":"Distinguish the character’s stated motivation from obstacles the setting merely introduces."},{"id":"CID-018","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Elias discovers that his grandfather intentionally falsified drawings to conceal uncertain observations.","B":"Elias comes to value revisions in the notebook as signs of persistence rather than incompetence.","C":"Elias concludes that the final drawings cannot be trusted because the early sketches are inaccurate.","D":"Elias intends to publish the weather predictions from the notebook after correcting its mistakes."},"answer":"B","explanation":"The passage turns on a reassessment of imperfect notes as evidence of persistence.","choice_explanations":{"A":"Incorrect: Crossed-out notes signify revision, not deliberate falsification.","B":"Correct: The passage turns on a reassessment of imperfect notes as evidence of persistence.","C":"Incorrect: He comes to appreciate the process that produced the later drawings.","D":"Incorrect: Neither publication nor his own editorial plan is described."},"passage":"Elias opened his grandfather's field notebook expecting careful drawings of birds. Between the sketches he found pages of crossings-out, weather guesses, and notes headed \"wrong again.\" He almost closed the book, disappointed that so much of it was uncertain. Then he noticed that several final drawings had begun as the clumsy figures beneath the ink. The notebook was not a record of a man who never made mistakes, Elias realized, but of one who returned to the same question until he saw it more clearly.","strategy":"Track the initial expectation, the turning point, and the changed judgment."},{"id":"CID-019","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Mira returns to persuade the children to recreate the mural exactly as it appeared before the flood.","B":"Mira finds that the neighborhood suffered less damage than she expected and decides to leave.","C":"Mira’s grief about neighborhood damage shifts toward hope when she sees children beginning a mural.","D":"Mira believes the children’s disagreement about paint colors will prevent the mural from being restored."},"answer":"C","explanation":"The ending reframes loss through the children’s active planning.","choice_explanations":{"A":"Incorrect: No request or instruction from Mira is described.","B":"Incorrect: The damage is significant, and she stays.","C":"Correct: The ending reframes loss through the children’s active planning.","D":"Incorrect: Their argument accompanies constructive work and invites hope."},"passage":"After the flood, Mira walked through the neighborhood where she had grown up. The corner bakery was gone, and the windows of her old school were boarded over. She stopped at a blank wall where a mural had once shown the town's river in bright blue. Beside it, three children were mixing paint in buckets, arguing over which shade was closest to the water they knew. Mira had come to see what remained. She stayed because someone was already imagining what might come next.","strategy":"Use the final change in the character’s emotional orientation to locate the central idea."},{"id":"CID-020","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Amara is relieved that her final reading disproves the significance of an earlier unusual finding.","B":"Amara regrets that most of her work produced repetitive measurements rather than discoveries.","C":"Amara decides to reopen the observatory because the final measurement matches earlier results.","D":"Amara recognizes that ordinary observations helped make earlier discoveries meaningful."},"answer":"D","explanation":"The passage values cumulative routine as the foundation of identifying meaningful anomalies.","choice_explanations":{"A":"Incorrect: The last reading is ordinary, but does not disprove anything earlier.","B":"Incorrect: She reflects appreciatively on the routine work.","C":"Incorrect: The observatory closes; no reopening decision is described.","D":"Correct: The passage values cumulative routine as the foundation of identifying meaningful anomalies."},"passage":"On the morning the observatory closed, Amara took one last reading of the sky. She had expected the instrument's final measurement to feel momentous. Instead, it matched the previous night's results almost exactly. As she covered the telescope, she thought of the hundreds of uneventful observations that had made a single unusual one meaningful years earlier. The last reading mattered to her not because it was exceptional, but because it belonged to the long, ordinary work that had allowed the exceptions to be noticed.","strategy":"Do not confuse the occasion that prompts reflection with the point of the reflection."},{"id":"CID-021","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"The two translation styles offer different benefits depending on a reader’s goals.","B":"Modernized translations consistently preserve every feature of historical letters better than literal translations.","C":"Historical letters usually contain social information but rarely communicate practical requests.","D":"The study established that translation style has no effect on what readers notice in a text."},"answer":"A","explanation":"Different versions helped readers with different tasks; the passage resists a single best method.","choice_explanations":{"A":"Correct: Different versions helped readers with different tasks; the passage resists a single best method.","B":"Incorrect: The two approaches have different observed advantages; neither is universally superior.","C":"Incorrect: Both social rank and practical requests are present in the study.","D":"Incorrect: The comparison specifically found different patterns of noticing."},"passage":"Translators of historical letters sometimes preserve unfamiliar words, fearing that modern substitutes would conceal the writers' social world. Other translators replace those words with expressions readily understood today. In a comparison of student responses, readers of the modernized versions more accurately identified the letters' immediate practical requests, while readers of the less modernized versions noticed more distinctions in social rank. The comparison does not settle which translation is best; it suggests that fidelity can involve competing goals, depending on what a reader needs to understand.","strategy":"When alternatives each help in different ways, avoid claims that one is globally best."},{"id":"CID-022","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Human analysts are no longer needed to identify sensor artifacts in satellite images.","B":"The detector helps flag candidates for inspection but cannot itself confirm that they are real.","C":"Because most flagged patterns were artifacts, automated detection offers no value in atmospheric research.","D":"The detector showed that the satellite sensor had failed to record any genuine weather phenomena."},"answer":"B","explanation":"The key boundary is discovery as candidate detection versus reliable verification.","choice_explanations":{"A":"Incorrect: Human inspection distinguished the real formations from artifacts.","B":"Correct: The key boundary is discovery as candidate detection versus reliable verification.","C":"Incorrect: Two formations were confirmed, illustrating its value as a screening tool.","D":"Incorrect: Two genuine formations were confirmed in the image."},"passage":"An automated detector flagged several faint patterns in a satellite image that analysts had previously overlooked. Subsequent inspection confirmed two unusual cloud formations but identified the remaining patterns as artifacts introduced by the sensor. The detector therefore proved useful for directing analysts' attention, though not for deciding on its own which patterns represented real atmospheric events. Researchers argue that this distinction matters when interpreting reports that a machine has \"discovered\" something new.","strategy":"Distinguish a tool’s screening function from a stronger claim of autonomous confirmation."},{"id":"CID-023","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"The populations are unquestionably separate species because they normally mate at different times.","B":"The insects belong to one population because they are nearly identical in appearance.","C":"Mating time and appearance alone cannot conclusively classify populations that sometimes interbreed.","D":"Unusually warm springs permanently eliminate all differences in breeding schedules between the two populations."},"answer":"C","explanation":"Neither morphology nor typical timing alone provides a decisive boundary.","choice_explanations":{"A":"Incorrect: Occasional interbreeding limits such certainty.","B":"Incorrect: Physical similarity alone does not establish reproductive unity.","C":"Correct: Neither morphology nor typical timing alone provides a decisive boundary.","D":"Incorrect: Interbreeding occurs occasionally; no permanent elimination is described."},"passage":"Two populations of a shoreline insect look nearly identical, but researchers found that individuals from one population mate several weeks earlier than those from the other. Some biologists argued that the timing difference showed the populations were separate species. A genetic survey, however, revealed occasional breeding between the groups in years with unusually warm springs. The findings suggest that visible similarity does not guarantee reproductive unity, but neither does a typical difference in timing establish complete separation.","strategy":"Look for a conclusion that preserves both sides of a qualified classification problem."},{"id":"CID-024","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best states the main idea of the text?","choices":{"A":"Readers consistently reject algorithmic suggestions and prefer every book to be selected by librarians.","B":"Borrowing history is an unreliable source of information because patrons never read similar subjects twice.","C":"Librarians demonstrated that unfamiliar books are always borrowed more often than relevant recommendations.","D":"Library recommendations can serve both familiar interests and discoveries beyond those interests."},"answer":"D","explanation":"The central lesson is a design tradeoff, not algorithm rejection.","choice_explanations":{"A":"Incorrect: Patrons generally rated algorithmic suggestions relevant.","B":"Incorrect: Recommendations based on borrowing history were relevant; repetition was a different concern.","C":"Incorrect: The text gives no comparative borrowing rate or universal claim.","D":"Correct: The central lesson is a design tradeoff, not algorithm rejection."},"passage":"A digital library began recommending books based on patrons' recent borrowing patterns. Patrons generally rated the suggestions as relevant, but librarians observed that recommendations tended to repeat subjects readers already knew. The library then added a small number of unfamiliar titles selected by staff, and patrons often borrowed those as well. The experiment does not show that algorithms should be abandoned. Instead, it suggests that relevance based on past preferences and opportunities for unexpected discovery may be distinct goals of a recommendation system.","strategy":"Find the two objectives the final sentence contrasts, and retain both."},{"id":"CID-025","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, which characteristic distinguished the pillar fragments found in the middle layer?","choices":{"A":"They were the only fragments that retained traces of red paint.","B":"They had tool marks that were already shown to match marks at nearby caves.","C":"They were the only fragments carved from stone found outside the town.","D":"They carried pigments conclusively traced to the artisans who decorated nearby caves."},"answer":"A","explanation":"The passage directly restricts surviving red paint to the middle layer.","choice_explanations":{"A":"Correct: The passage directly restricts surviving red paint to the middle layer.","B":"Incorrect: Tool-mark analysis was only planned, and no match is established.","C":"Incorrect: The origin of the stone is not addressed.","D":"Incorrect: A comparison was conducted but did not establish a shared group of artisans."},"passage":"At a site near the fictional town of Ennel, researchers found fragments of carved stone pillars in three distinct layers of soil. Only fragments in the middle layer retained traces of red paint. The team compared the paint's mineral composition with pigments from nearby caves, but the comparison could not determine whether the same artisans decorated both sites. Researchers plan to examine tool marks next, since the marks may reveal whether the stone was shaped with similar equipment.","strategy":"Locate the exact layer named and avoid replacing a comparison with a confirmed identity."},{"id":"CID-026","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, where did the researchers detect increased numbers of the salt-tolerant microbes?","choices":{"A":"In leaves of both grass species as the salt concentration increased.","B":"In the roots of the marsh grass as the surrounding water became saltier.","C":"In the roots of the related grass that was grown under identical conditions.","D":"On the surfaces of the tanks regardless of whether any grass was present."},"answer":"B","explanation":"Only the first grass’s roots contained microbes that increased under salt exposure.","choice_explanations":{"A":"Incorrect: The microbes were not detected in leaves.","B":"Correct: Only the first grass’s roots contained microbes that increased under salt exposure.","C":"Incorrect: The related grass’s roots lacked the microbes.","D":"Incorrect: Tank surfaces were not described as a sampling location."},"passage":"A laboratory studied a fictional marsh grass whose roots shelter a group of salt-tolerant microbes. When the grass was exposed to increasingly salty water, the microbes became more numerous in the root tissue but were not detected in leaf samples. The researchers also found that the microbes were absent from roots of a related grass grown in the same tanks. They therefore proposed that the association might depend on characteristics of the first grass, though the exact mechanism has not been identified.","strategy":"Keep the organism, tissue, and condition aligned; each wrong option alters one."},{"id":"CID-027","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, what triggers the lantern to brighten during the ensemble’s performances?","choices":{"A":"A recording that automatically activates the lantern at predetermined moments.","B":"A cue from the director after members of the audience change seats.","C":"A hand gesture made by the lead actor and followed by a technician.","D":"The end of a longer silence introduced in the ensemble’s latest public performances."},"answer":"C","explanation":"The technical cue originates with the lead actor; a technician executes it.","choice_explanations":{"A":"Incorrect: The lantern is specifically not controlled by a prerecorded timer.","B":"Incorrect: No audience-seating cue or live director trigger is described.","C":"Correct: The technical cue originates with the lead actor; a technician executes it.","D":"Incorrect: Longer pauses are only planned, not yet part of public performances."},"passage":"During performances by the fictional Aster Ensemble, actors sometimes pause in silence while a small lantern onstage slowly brightens. The lantern is controlled by a technician following the lead actor's hand gesture, not by a prerecorded timer. In a workshop, the director explained that the silence gives spectators time to notice changes in the actors' positions. The ensemble plans to experiment with longer pauses but has not yet altered the timing of public performances.","strategy":"Differentiate who signals an action from who physically carries it out."},{"id":"CID-028","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, what did clerks do before the suggested transcriptions were added to the public database?","choices":{"A":"They translated every record into a language used by the public database.","B":"They manually photographed every line that the software could not recognize.","C":"They removed the images after checking the transcriptions to minimize storage costs.","D":"They compared each proposed line of text with an image of the original handwritten page."},"answer":"D","explanation":"Human verification of software suggestions occurred before publication.","choice_explanations":{"A":"Incorrect: Translation was not part of the workflow.","B":"Incorrect: The pages were photographed before software transcription; no selective rephotography is reported.","C":"Incorrect: The database preserves links to the images.","D":"Correct: Human verification of software suggestions occurred before publication."},"passage":"To make old shipping records searchable, archivists first photographed handwritten pages and then used software to suggest transcriptions. Clerks checked each suggested line against the photographs before any text entered the public database. The team did not use software to translate the documents, which were already written in the database's working language. The database also preserves links to the photographs so users can inspect difficult handwriting themselves.","strategy":"Trace the order of steps; eliminate options that add or reverse a documented operation."},{"id":"CID-029","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, which sequence produced substantial germination in the hillgrass trials?","choices":{"A":"A short period of high heat followed by several days of cool moisture.","B":"Several days of cool moisture followed by a burst of high heat.","C":"Ordinary summer heat without a later change in moisture.","D":"A prolonged period of high heat with no subsequent moisture treatment."},"answer":"A","explanation":"The two treatments are both required in the specified order for substantial germination.","choice_explanations":{"A":"Correct: The two treatments are both required in the specified order for substantial germination.","B":"Incorrect: The passage says the reversed sequence led to low germination.","C":"Incorrect: Ordinary heat did not end dormancy.","D":"Incorrect: A brief burst was used, and subsequent cool moisture was necessary for most seeds."},"passage":"Seeds of the fictional hillgrass Astera dura remain dormant through ordinary summer heat. Laboratory trials showed that exposure to a brief burst of high heat weakened their protective coating, but most seeds still failed to sprout unless they subsequently received several days of cool moisture. When cool moisture came first and the heat treatment followed, germination remained low. Researchers suggest that the sequence of events, rather than exposure to either condition alone, is important.","strategy":"Convert the passage into an ordered two-step condition before considering options."},{"id":"CID-030","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, under what circumstances does the system issue a public flood warning?","choices":{"A":"Whenever heavy rainfall occurs upstream, even if downstream water remains stable.","B":"When upstream rainfall passes its threshold and downstream water rises for at least forty consecutive minutes.","C":"Whenever the downstream gauge rises briefly, regardless of upstream rainfall.","D":"Only after technicians independently confirm that a public warning is already in effect."},"answer":"B","explanation":"The warning is gated by the conjunction of two independent conditions.","choice_explanations":{"A":"Incorrect: Heavy rain alone produces a technician alert.","B":"Correct: The warning is gated by the conjunction of two independent conditions.","C":"Incorrect: A brief rise without qualifying rainfall prompts an equipment check.","D":"Incorrect: No such confirmation step is stated."},"passage":"A river-monitoring system issues a public flood warning only when two conditions occur together: rainfall upstream exceeds a preset threshold, and water at a downstream gauge rises for at least forty consecutive minutes. If rainfall is heavy but downstream water levels remain stable, the system alerts technicians rather than the public. Likewise, a brief rise in the downstream gauge without qualifying rainfall prompts an equipment check. These distinctions are intended to reduce false public warnings.","strategy":"Underline each condition; an option with only one is not sufficient."},{"id":"CID-031","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, when did researchers open the temporary fish traps?","choices":{"A":"When the tide was rising and cameras showed fish entering the channel.","B":"Whenever the current flowed toward the sea, regardless of the water level.","C":"After the tide dropped below a marked level, provided that water was also flowing seaward.","D":"At the highest tide, once the traps had been submerged long enough."},"answer":"C","explanation":"Trap access required both low tide and seaward flow; video observations could occur separately.","choice_explanations":{"A":"Incorrect: The team used cameras, not trap capture, during rising tides.","B":"Incorrect: The specified low-tide threshold was also required.","C":"Correct: Trap access required both low tide and seaward flow; video observations could occur separately.","D":"Incorrect: High-tide trap opening is unsupported and conflicts with the conditions."},"passage":"Researchers fitted temporary traps in a tidal channel to study the movements of juvenile fish. The traps could be opened safely only when the tide had fallen below a marked level and the current was flowing toward the sea. At other times, workers collected information from underwater cameras rather than opening the traps. Although the cameras showed fish entering the channel on rising tides, the team did not attempt to capture fish during those periods.","strategy":"Do not confuse an observation interval with the narrower interval when equipment was operated."},{"id":"CID-032","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, which treatment yielded sheets most resistant to repeated bending?","choices":{"A":"Stretching the sheets and releasing tension before rapid cooling.","B":"Cooling unstretched sheets slowly until they retained their original shape.","C":"Rapidly cooling the sheets before applying any mechanical treatment.","D":"Stretching the sheets and keeping them under tension while they cooled slowly."},"answer":"D","explanation":"Both stretching and slow cooling under maintained tension were necessary to obtain the durable result.","choice_explanations":{"A":"Incorrect: Rapidly cooled stretched sheets were less resistant, and tension was maintained in the successful treatment.","B":"Incorrect: Slow cooling without stretching lacked the benefit.","C":"Incorrect: This sequence is not reported and differs from the successful process.","D":"Correct: Both stretching and slow cooling under maintained tension were necessary to obtain the durable result."},"passage":"A new flexible sheet for sensors was strengthened by stretching it and then cooling it slowly while the tension was maintained. Sheets cooled rapidly after stretching retained their shape but were less resistant to repeated bending. Sheets cooled slowly without being stretched also lacked the desired durability. The engineers concluded that the benefit arose from a particular combination of mechanical treatment and cooling, not from either step in isolation.","strategy":"Keep sequence, speed, and mechanical state attached to the same condition."},{"id":"CID-033","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, which concern did the conservation group express?","choices":{"A":"Whether the roof’s heat-reducing coatings would continue to work effectively over time.","B":"Whether the glass roof admitted enough daylight during its first month.","C":"Whether the managers had accurately measured electricity costs in the first month.","D":"Whether the architect deliberately designed the roof to trap extra heat."},"answer":"A","explanation":"The group questioned the longevity of the coating, not the amount of light or energy accounting.","choice_explanations":{"A":"Correct: The group questioned the longevity of the coating, not the amount of light or energy accounting.","B":"Incorrect: The group welcomed the added daylight, rather than questioning its amount.","C":"Incorrect: The managers discussed costs; the group’s concern focused on coating durability.","D":"Incorrect: The architect intended to limit heat, and the group did not allege otherwise."},"passage":"After the renovation of the fictional Hall of Hours, its architect, Livia Maret, said the glass roof was intended to admit daylight while keeping heat low through special coatings. A conservation group welcomed the added daylight but questioned whether the coatings would remain effective after years of exposure. Building managers, for their part, emphasized that electricity costs had fallen during the first month of operation, though they cautioned that seasonal changes could partly explain the reduction.","strategy":"Map each claim to its speaker before choosing an answer."},{"id":"CID-034","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, what did the team that analyzed museum specimens establish?","choices":{"A":"Warmer winters were the exclusive cause of the change in wing color.","B":"The beetles’ change in wing color began before the warmest winters in the record.","C":"The preferred host plant became less common as wing color changed.","D":"The color change had not occurred and was produced by incorrect museum labels."},"answer":"B","explanation":"The museum-specimen team contributed a timing constraint that complicates a simple climate explanation.","choice_explanations":{"A":"Incorrect: The specimen team supplied timing evidence, not support for an exclusive warming cause.","B":"Correct: The museum-specimen team contributed a timing constraint that complicates a simple climate explanation.","C":"Incorrect: A different team noted an increase in the host plant, not a decrease.","D":"Incorrect: All groups agreed that the color change occurred."},"passage":"One team studying a fictional beetle population proposed that a sudden change in wing color resulted from warmer winters. Another team accepted the color change but argued that the beetles' preferred host plant had also become more common and might explain the shift. A third group analyzed museum specimens and found that the color change had begun before the warmest winters recorded. All three groups agreed on the observed change, but not on its cause or timing.","strategy":"For multi-team passages, write a one-line note assigning one finding to each team."},{"id":"CID-035","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, what role does Corven assign to lower printing costs?","choices":{"A":"They were irrelevant to club membership because people attended only for debates.","B":"They were the primary cause of every joint lecture organized by the clubs.","C":"They made joining book clubs more practical, though they do not fully explain why the clubs attracted members.","D":"They reduced the number of books available to people outside scholarly occupations."},"answer":"C","explanation":"Corven partially accepts the older account and supplements it with a social explanation.","choice_explanations":{"A":"Incorrect: Corven acknowledges a practical effect of cheaper books.","B":"Incorrect: No link between printing costs and every lecture is established.","C":"Correct: Corven partially accepts the older account and supplements it with a social explanation.","D":"Incorrect: The text reports no reduction in availability."},"passage":"In an essay on nineteenth-century book clubs, historian Mina Corven argues that reading rooms helped members exchange ideas across occupations. An earlier scholar had attributed the clubs' growth mainly to lower printing costs. Corven acknowledges that cheaper books made membership more practical but points to records of joint lectures and debates as evidence that social exchange was an independent attraction. She does not claim that the older explanation was entirely false.","strategy":"Notice concessions: accepting a contributing factor is different from endorsing a complete explanation."},{"id":"CID-036","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, what explanation does the museum director offer for the garden’s narrow paths?","choices":{"A":"They were required by regulations that limit the width of outdoor museum paths.","B":"They were designed chiefly to increase the number of routes available to visitors using mobility devices.","C":"They were temporary features that the museum planned to widen after the exhibition.","D":"They were intended to lead visitors through a planned sequence of perspectives on the sculptures."},"answer":"D","explanation":"The director frames the design as sequencing views; others evaluate access.","choice_explanations":{"A":"Incorrect: No regulatory requirement is mentioned.","B":"Incorrect: The director speaks about viewing sequence, while the organization identifies reduced route choices.","C":"Incorrect: No temporary status or widening plan is stated.","D":"Correct: The director frames the design as sequencing views; others evaluate access."},"passage":"A reviewer describes a new sculpture garden as visually striking but argues that its narrow pathways make certain works difficult to approach. The museum's director responds that the paths were designed to guide visitors through a particular sequence of views, not to maximize direct access to each sculpture. A local accessibility organization says that regardless of the intended artistic effect, visitors using mobility devices have fewer route choices than other visitors. The three assessments thus address different aspects of the same design.","strategy":"Distinguish an intentional design objective from a consequence that critics identify."},{"id":"CID-037","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best describes what Lena does after noticing that the ticket and display give different platform information?","choices":{"A":"She follows an elderly porter toward a newly illuminated staircase.","B":"She telephones the railway office to confirm which platform is open.","C":"She remains on the closed platform until the porter retrieves his bag.","D":"She decides to board without checking where the train will arrive."},"answer":"A","explanation":"Lena resolves the conflicting directions by observing someone familiar with the station.","choice_explanations":{"A":"Correct: Lena resolves the conflicting directions by observing someone familiar with the station.","B":"Incorrect: The narrator directly states that she does not call.","C":"Incorrect: She moves toward the illuminated stairs; no waiting on the closed platform is described.","D":"Incorrect: Her action is an attempt to navigate to the correct platform, not to ignore location."},"passage":"When the train's announcement crackled through the empty station, Lena checked her ticket again. It named a platform that had been closed for repairs, but the display above the stairs directed passengers to another. She did not call the railway office. Instead, she watched an elderly porter set down his bag and followed him toward the newly illuminated staircase. For once, the small print on her ticket seemed less trustworthy than the movement of someone who knew the place.","strategy":"Track the character’s actual response, not the response that might be most practical."},{"id":"CID-038","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, how does Ada’s teacher respond to the bowl’s crack?","choices":{"A":"He repairs the bowl so that it can safely hold soup.","B":"He gives the bowl a different use by putting seeds in it.","C":"He instructs Ada to discard the bowl and begin a new one.","D":"He praises the crack as proof that the bowl is more valuable than an unbroken one."},"answer":"B","explanation":"The teacher repurposes the imperfect object without pretending the damage is gone.","choice_explanations":{"A":"Incorrect: The crack remains, and the bowl is not used for soup.","B":"Correct: The teacher repurposes the imperfect object without pretending the damage is gone.","C":"Incorrect: Ada anticipates this response, but it is not what happens.","D":"Incorrect: The passage makes no claim about the crack increasing value."},"passage":"Ada turned the cracked bowl slowly under the lamp. She had expected her teacher to point out the flaw and tell her to begin again. Instead, he placed a handful of seeds inside it and carried it to the windowsill. \"It won't hold soup,\" he said, \"but the seeds won't ask it to.\" Ada saw that the fracture had not vanished; the bowl had simply been given a task for which the fracture did not matter.","strategy":"Separate the character’s expectation from the event that follows."},{"id":"CID-039","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, why does Theo keep the outdated map?","choices":{"A":"It shows a route that is still more accurate than those on newer maps.","B":"It reminds him of the harbor’s former name, which he wishes officials would restore.","C":"Its margins preserve dates connected to his father’s return from voyages.","D":"It serves as evidence that visitors misunderstand his father’s occupation."},"answer":"C","explanation":"The map holds personal annotations, not reliable geographic information.","choice_explanations":{"A":"Incorrect: The passage says the highway was rerouted and the map contains geographical mistakes.","B":"Incorrect: The harbor’s name is background; Theo’s reason is the penciled dates.","C":"Correct: The map holds personal annotations, not reliable geographic information.","D":"Incorrect: The visitors misunderstand his nostalgia, not his father’s work."},"passage":"Theo kept the old map pinned to his wall, though the highway on it had been rerouted and the harbor renamed. Visitors took the map as evidence of nostalgia, but Theo kept it for a less sentimental reason: in its margins he had recorded the dates when his father returned from each voyage. The map's geographical mistakes mattered less than the small penciled entries that no newer map could reproduce.","strategy":"Distinguish the reason observers assume from the narrator’s disclosed reason."},{"id":"CID-040","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"Which choice best describes the speaker’s action at the end of the poem?","choices":{"A":"The speaker sweeps the leaf away after the floor has dried.","B":"The speaker places the bowl outside to collect more rainwater.","C":"The speaker lights a lamp to guide the returning visitor home at dawn.","D":"The speaker chooses to leave a rain-carried leaf on the windowsill."},"answer":"D","explanation":"The concluding action is to preserve the remaining leaf rather than remove it.","choice_explanations":{"A":"Incorrect: The final line explicitly rejects sweeping it away.","B":"Incorrect: The bowl was placed beneath an indoor leak; no later relocation is described.","C":"Incorrect: The lamp was left by the door earlier; no returning visitor or dawn lighting action is stated.","D":"Correct: The concluding action is to preserve the remaining leaf rather than remove it."},"passage":"The rain arrived without its customary thunder,\nlike a gue
