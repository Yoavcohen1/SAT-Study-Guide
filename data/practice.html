st too tired to knock.\nI put a bowl beneath the window's leak\nand left the lamp beside the door.\nBy dawn the floor was dry, the guest long gone;\nI found one leaf upon the sill,\nits veins lit amber by the sun,\nand kept it there instead of sweeping it away.","strategy":"Read the final action literally before interpreting the poem’s imagery."},{"id":"CID-041","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, what have scientists not yet determined about the new strip of land?","choices":{"A":"Whether a recent volcanic event or gradual sediment deposition formed it.","B":"Where along the island the strip of land is located.","C":"Whether the strip is visible in satellite imagery.","D":"Whether both possible processes could produce a similar shape."},"answer":"A","explanation":"The uncertainty concerns formation mechanism, not existence, location, or shape compatibility.","choice_explanations":{"A":"Correct: The uncertainty concerns formation mechanism, not existence, location, or shape compatibility.","B":"Incorrect: Its position was confirmed with photographs.","C":"Incorrect: Satellite images revealed the strip.","D":"Incorrect: The passage states that both could account for its shape."},"passage":"Satellite imagery revealed a narrow new strip of land along the shore of a remote volcanic island. Scientists confirmed the strip's position with aerial photographs but could not yet determine whether it formed during a recent eruption or accumulated gradually from wave-carried sediment. Both processes could account for its shape. The team plans to collect rock and sediment samples before describing the strip's origin in a report.","strategy":"Find the “could not determine” clause and avoid transferring uncertainty to established observations."},{"id":"CID-042","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, which issue remains unresolved for historians?","choices":{"A":"Whether the vessel ever stopped at Port Sela.","B":"Why the ship’s arrival day differs between the original log and the later printed summary.","C":"Whether the summary was printed before the voyage began.","D":"Whether Port Sela was the final destination rather than an intermediate stop."},"answer":"B","explanation":"Historians know the voyage included Port Sela but not why two sources date its arrival differently.","choice_explanations":{"A":"Incorrect: The letter confirms that it did.","B":"Correct: Historians know the voyage included Port Sela but not why two sources date its arrival differently.","C":"Incorrect: The summary was produced fifty years later.","D":"Incorrect: Neither record is described as identifying a final destination."},"passage":"The log of a fictional merchant vessel records that its crew reached Port Sela on the third day of a journey. A printed summary made fifty years later gives the arrival as the fourth day. Historians cannot currently decide whether the difference reflects an error in the summary or a change in how travel days were counted. A surviving letter confirms that the vessel visited Port Sela, but it gives no arrival date.","strategy":"Keep disagreement about a date separate from uncertainty about the event itself."},{"id":"CID-043","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, what prevents researchers from identifying the dye’s geographical source with confidence?","choices":{"A":"The dye left no measurable chemical traces on the basket fragments.","B":"The plant fibers could not be dated using radiocarbon methods.","C":"The detected compound can come from multiple plants that grow in different regions.","D":"No plants capable of producing violet dye grow beyond the cave’s immediate region."},"answer":"C","explanation":"Chemical identification narrows a class of compounds but does not uniquely determine where the plant material came from.","choice_explanations":{"A":"Incorrect: The passage says chemical analysis identified a compound.","B":"Incorrect: The fibers were dated to a range of several centuries.","C":"Correct: Chemical identification narrows a class of compounds but does not uniquely determine where the plant material came from.","D":"Incorrect: The compound occurs in plants far beyond the cave region."},"passage":"Fragments of woven baskets at a desert cave carry traces of a violet dye. Chemical analysis identified one plant compound capable of producing the color, but that compound occurs in several plants, including species found far beyond the cave's region. Researchers can therefore describe the colorant's chemical family more confidently than its geographical source. Radiocarbon dating of plant fibers in the baskets places their manufacture within a period spanning several centuries.","strategy":"An identified chemical marker need not identify a unique source."},{"id":"CID-044","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, which potentially relevant information did the researchers not collect?","choices":{"A":"How often participants visited community gardens.","B":"Participants’ responses about their sleep quality.","C":"Whether the participants lived in one of the two neighborhoods.","D":"The participants’ work schedules."},"answer":"D","explanation":"Work schedules are named as an unmeasured factor that could affect both observed variables.","choice_explanations":{"A":"Incorrect: Garden visits were recorded.","B":"Incorrect: Sleep was assessed using questionnaire answers.","C":"Incorrect: The study was framed around residents of two neighborhoods; this is not the identified omitted variable.","D":"Correct: Work schedules are named as an unmeasured factor that could affect both observed variables."},"passage":"In a hypothetical study of two neighborhoods, researchers reported that residents who spent more time in community gardens also reported better sleep. The study recorded garden visits and questionnaire answers but did not collect information about participants' work schedules. Because work schedules could influence both the opportunity to visit gardens and sleep patterns, the researchers stated that their findings should not be taken as proof that garden visits improve sleep.","strategy":"Identify the absent measurement rather than other measurements that have limitations."},{"id":"CID-045","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, which statement accurately describes the star’s measured brightness?","choices":{"A":"It increased on both intervals, with a larger percentage increase in the first interval than in the second.","B":"It increased by 5 percent first and by 12 percent during the next interval.","C":"Its physical radius increased by 12 percent on the first night and remained unchanged afterward.","D":"It became dimmer between the second and third nights because the later increase was smaller."},"answer":"A","explanation":"The two reported changes are both positive; the first is larger than the second.","choice_explanations":{"A":"Correct: The two reported changes are both positive; the first is larger than the second.","B":"Incorrect: The reported chronological order is 12 percent then 5 percent.","C":"Incorrect: The measurements were brightness, not size.","D":"Incorrect: A smaller positive increase is still an increase."},"passage":"A research team tracked a fictional variable star on three successive nights. Its apparent brightness increased by 12 percent from the first night to the second and by a further 5 percent from the second to the third. The researchers emphasized that these were changes in observed light, not measurements of the star's physical size. They also noted that cloud cover was stable throughout the observations.","strategy":"Compare direction and period of each percentage separately; do not confuse a slower rise with a fall."},{"id":"CID-046","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, how did the new schedule affect the number of ferry crossings?","choices":{"A":"Weekday crossings increased by three, while Saturday crossings decreased by two.","B":"Weekday crossings decreased by two, while Saturday crossings increased by three.","C":"Weekday and Saturday crossings both increased, though by different amounts.","D":"Saturday crossings increased by three and Sunday crossings were eliminated."},"answer":"B","explanation":"The weekday change is 14 to 12, and the Saturday change is 8 to 11.","choice_explanations":{"A":"Incorrect: This swaps the differences and their directions.","B":"Correct: The weekday change is 14 to 12, and the Saturday change is 8 to 11.","C":"Incorrect: Weekday service fell from 14 to 12.","D":"Incorrect: No information about Sunday service is provided."},"passage":"Before a harbor changed its docking schedule, a ferry operator made 14 crossings on weekdays and 8 on Saturdays. Under the new schedule, weekday crossings fell to 12, while Saturday crossings rose to 11. The operator explained that the changes redistributed service toward weekends rather than increasing service on every day. Sunday service was not mentioned in the report.","strategy":"Associate each number with its day and its before/after status."},{"id":"CID-047","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, which event attracted the largest number of first-time library-event attendees?","choices":{"A":"The history discussion, with 52 first-time attendees.","B":"The poetry evening, with 46 first-time attendees.","C":"The science demonstration, with 37 first-time attendees.","D":"The history discussion, with 31 first-time attendees."},"answer":"C","explanation":"After subtracting returning patrons, the counts of first-time attendees are 34 for poetry, 31 for history, and 37 for science.","choice_explanations":{"A":"Incorrect: 52 is total attendance; 21 of those people were returning, leaving 31 first-timers.","B":"Incorrect: 46 is total attendance, but 12 were returning, leaving 34 first-timers.","C":"Correct: After subtracting returning patrons, the counts of first-time attendees are 34 for poetry, 31 for history, and 37 for science.","D":"Incorrect: 31 is the correct first-time count for history, but science had 37."},"passage":"A community library counted attendance at three events, distinguishing returning patrons from people attending a library event for the first time. The poetry evening drew 46 people, 12 of whom had attended a previous event. The history discussion drew 52 people, including 21 returning patrons. The science demonstration drew just 39 people, but only 2 of those attendees had previously been to a library event. Organizers emphasized that total attendance and first-time attendance measure different kinds of reach.","strategy":"Subtract the specified subgroup from each total before comparing the newly defined quantities."},{"id":"CID-048","category":"Information and Ideas","skill":"Central Ideas and Details","level":"very_hard","question":"According to the text, how did February compare with January at the station?","choices":{"A":"February had more snowy days overall and fewer days with heavy snowfall.","B":"February accumulated a greater total depth of snow despite having fewer snowy days.","C":"February had exactly five days of snowfall, all of which exceeded 10 centimeters.","D":"February had fewer days with any snowfall but more days with snowfall above 10 centimeters."},"answer":"D","explanation":"The frequency of any snowfall fell from 11 to 8, but heavy-snow days rose from 3 to 5.","choice_explanations":{"A":"Incorrect: The numbers show 8 versus 11 total and 5 versus 3 heavy.","B":"Incorrect: Total snow accumulation is not provided.","C":"Incorrect: Five were heavy-snow days out of eight snowy days.","D":"Correct: The frequency of any snowfall fell from 11 to 8, but heavy-snow days rose from 3 to 5."},"passage":"A fictional mountain station measured snowfall in January and February of the same year. January had 11 days with measurable snowfall, but only 3 days with more than 10 centimeters. February had 8 days with measurable snowfall, including 5 days with more than 10 centimeters. The researchers distinguished the frequency of snowfall from the frequency of heavy snowfall and made no claim about the total snow depth accumulated in either month.","strategy":"Keep the denominator or event category fixed before comparing months."}]},{"category":"Information and Ideas","subcategory":"Command of Evidence","questions":[{"id":"COE-001","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which finding, if true, would most directly support the researchers’ hypothesis?","choices":{"A":"Adults called more often at feeding sites where predators had recently been sighted.","B":"Chicks called more frequently when other chicks moved away from them.","C":"Chicks approached parental call recordings, but not silent speakers, in predator-free enclosures.","D":"Adults remained near feeding patches longer when they had many chicks."},"answer":"C","explanation":"Orientation toward parental calls without a predator directly tests the proposed navigation role.","choice_explanations":{"A":"Incorrect: This pattern primarily supports an alarm function rather than the proposed location function.","B":"Incorrect: This concerns chicks’ own calls and does not test their response to parental calls.","C":"Correct: Orientation toward parental calls without a predator directly tests the proposed navigation role.","D":"Incorrect: The result addresses parental behavior but not the hypothesized orientation mechanism."},"passage":"Biologists studying a hypothetical shorebird noticed that adults call more frequently when their chicks are scattered across a feeding area. The calls could warn chicks of predators, but the researchers instead hypothesize that the calls help chicks locate a parent. They predict that chicks unable to see a parent should orient toward the sound even when no predator is present.","strategy":"Match the proposed mechanism, not just the same species or behavior, to a result that separates it from a rival explanation."},{"id":"COE-002","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which finding, if true, would most directly support the historians’ hypothesis?","choices":{"A":"The disks bore symbols that also appeared on several merchant seals.","B":"Disks had standardized masses corresponding to fractional units of merchant scales.","C":"Merchants exchanged copper objects for goods more often than they exchanged silver ones.","D":"A large number of disks were found in stalls selling imported spices."},"answer":"B","explanation":"Consistent masses in fractional units are the hypothesis’s distinctive prediction.","choice_explanations":{"A":"Incorrect: Shared decoration does not establish that the disks were used to measure mass.","B":"Correct: Consistent masses in fractional units are the hypothesis’s distinctive prediction.","C":"Incorrect: This supports a possible monetary function and says nothing about mass groups.","D":"Incorrect: Location is compatible with either weights or money and does not test standardization."},"passage":"Excavators of the fictional port of Nerath found small copper disks near merchants’ stalls. Some historians suggest that the disks served as weights for measuring spices rather than as currency. Under this hypothesis, individual disks should have standardized masses that correspond to subdivisions of a larger measuring unit, even if their decorations vary.","strategy":"Find the prediction that would be unlikely under the competing interpretation."},{"id":"COE-003","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which result, if true, would most directly support the team’s explanation?","choices":{"A":"Pore size affected cracking even when chemical composition and rigidity were held constant.","B":"The coating cracked less frequently at lower temperatures than at higher temperatures.","C":"Several coatings with different chemical compositions exhibited different cracking rates.","D":"The new coating had a lower rigidity than the existing product and developed fewer cracks."},"answer":"A","explanation":"A pore-size effect under controlled composition and rigidity isolates the hypothesized mechanism.","choice_explanations":{"A":"Correct: A pore-size effect under controlled composition and rigidity isolates the hypothesized mechanism.","B":"Incorrect: Temperature changes the stress itself, rather than isolating the role of pore size.","C":"Incorrect: Chemical composition varies, leaving the crucial proposed mechanism untested.","D":"Incorrect: Rigidity differs, so the result cannot distinguish the proposed pore mechanism from the alternative."},"passage":"A research team developed a ceramic coating that resisted cracks after repeated heating. The team argues that tiny pores within the coating absorb some of the stress created as the material expands, rather than the coating simply being less rigid than an existing product. If so, changing pore size while holding chemical composition and overall rigidity constant should alter crack formation.","strategy":"Prefer evidence that manipulates the hypothesized cause while controlling the strongest rival factor."},{"id":"COE-004","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which finding, if true, would most directly support the researchers’ proposal?","choices":{"A":"Participants who listened to more total playbacks performed better than participants who listened to fewer.","B":"Listeners predicting each next note recognized melodies better despite exposure to identical playback sequences.","C":"Participants who heard easier melodies remembered them better than participants who heard more complex melodies.","D":"Participants who played an instrument performed better than those with no musical training."},"answer":"B","explanation":"Equal exposure with different anticipation demands is the direct controlled comparison.","choice_explanations":{"A":"Incorrect: This isolates exposure quantity, not the proposed anticipation process.","B":"Correct: Equal exposure with different anticipation demands is the direct controlled comparison.","C":"Incorrect: Melody difficulty changes and does not isolate anticipation.","D":"Incorrect: Prior musical training is a different variable and does not test the proposed instruction."},"passage":"Researchers propose that people remember an unfamiliar melody better when they silently anticipate its next note than when they merely hear it repeatedly. Both tasks expose listeners to the same sounds, so an experiment must separate active anticipation from simple exposure. The researchers plan to teach participants short artificial melodies and later test recognition.","strategy":"Identify what the hypothesis uniquely changes and require the proposed control condition."},{"id":"COE-005","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which finding, if true, would most strongly support the planner’s explanation over the critic’s?","choices":{"A":"Buildings with more bicycle commuters generally had more bicycle-storage spaces.","B":"New buildings were more likely than old ones to have storage and higher cycling rates.","C":"After buildings were randomly assigned storage, bicycle commuting rose relative to control buildings.","D":"Residents who owned bicycles were more likely to request storage than residents who did not."},"answer":"C","explanation":"Randomized assignment and before/after comparison reduce the alternative that existing cyclists caused storage installation.","choice_explanations":{"A":"Incorrect: This association is exactly what selection by existing cyclists could generate.","B":"Incorrect: Building age could account for the association, with no controlled intervention.","C":"Correct: Randomized assignment and before/after comparison reduce the alternative that existing cyclists caused storage installation.","D":"Incorrect: Preference differences reinforce the possibility of selection rather than testing a causal effect."},"passage":"A city planner argues that the addition of secure bicycle storage at apartment buildings increases residents’ bicycle commuting. A critic suggests instead that buildings already occupied by frequent cyclists are simply more likely to install storage. The planner seeks evidence that would distinguish a change in commuting behavior from this selection effect.","strategy":"When two causal directions fit a correlation, prefer a change assigned independently of preexisting behavior."},{"id":"COE-006","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which result, if true, would most directly support the proposal?","choices":{"A":"Marshes with many animal burrows contained more plant species than marshes with few burrows.","B":"Sediment collected immediately after an animal was introduced was greater at the surface than at depth.","C":"Vegetated sites trapped more sediment at the surface during storms than unvegetated sites.","D":"Deep sediment increased weeks after colonization, without a corresponding change in surface deposition."},"answer":"D","explanation":"The delayed increase in deeper sediment, with vegetation comparable, matches the proposed process and timing.","choice_explanations":{"A":"Incorrect: Plant diversity does not test particle movement or its predicted timing.","B":"Incorrect: The hypothesis predicts a delayed subsurface effect, not an immediate surface difference.","C":"Incorrect: This is evidence for the competing vegetation process, not delayed subsurface movement.","D":"Correct: The delayed increase in deeper sediment, with vegetation comparable, matches the proposed process and timing."},"passage":"Researchers investigating a tidal marsh propose that burrowing animals help retain sediment by moving fine particles beneath the surface. The particles should accumulate in deeper layers only after animals have occupied a site for several weeks. The researchers distinguish this delayed process from the immediate trapping of sediment by vegetation.","strategy":"Use both location and timing in a mechanistic prediction; a merely related increase is insufficient."},{"id":"COE-007","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which finding, if true, most directly supports the scholar’s proposal?","choices":{"A":"Speakers often borrowed a single word from another language while discussing an unchanged topic.","B":"Speakers switched languages at topic changes despite knowing the vocabulary in both.","C":"Speakers with limited ability in one language switched languages more than highly proficient speakers.","D":"Speakers switched languages more often for technical subjects than for familiar subjects."},"answer":"B","explanation":"Switching where vocabulary is available in both languages points toward discourse marking rather than lexical necessity.","choice_explanations":{"A":"Incorrect: Single-word borrowings do not show switching at topic boundaries.","B":"Correct: Switching where vocabulary is available in both languages points toward discourse marking rather than lexical necessity.","C":"Incorrect: Differences in proficiency favor the alternative vocabulary explanation.","D":"Incorrect: This is compatible with missing technical vocabulary rather than boundary marking."},"passage":"Researchers examining conversations in a fictional bilingual community noticed that speakers changed languages most often at the start of new topics. One scholar proposes that switching marks a transition for listeners, rather than merely reflecting whichever language contains a convenient word. The scholar predicts that switching should be common even when a speaker has equally familiar words for the topic in both languages.","strategy":"Demand evidence that remains when the main alternative explanation has been ruled out."},{"id":"COE-008","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which finding, if true, would provide the most direct support for their proposal?","choices":{"A":"Fungi aided growth in phosphorus-poor soil but not phosphorus-rich soil under otherwise matched conditions.","B":"Phosphorus-poor fields contained more of the fungus than phosphorus-rich fields.","C":"All seedlings grew faster in phosphorus-rich soil, regardless of whether the fungus was present.","D":"Fungus-treated seedlings grew faster than untreated seedlings when the groups also received different amounts of phosphorus."},"answer":"A","explanation":"The treatment-by-phosphorus interaction, under controlled conditions, uniquely fits the claim.","choice_explanations":{"A":"Correct: The treatment-by-phosphorus interaction, under controlled conditions, uniquely fits the claim.","B":"Incorrect: This documents the suspected association without establishing the fungus’s conditional effect.","C":"Incorrect: A general phosphorus effect does not reveal the fungus’s proposed conditional benefit.","D":"Incorrect: The two treatment variables are confounded."},"passage":"Agronomists propose that a certain soil fungus improves seedling growth only when phosphorus is scarce. They note that an apparent average benefit could arise if the fungus happens to be more common in nutrient-poor fields, and so they recommend varying both phosphorus availability and fungal presence under controlled conditions.","strategy":"Test the condition in the hypothesis, not just the average effect of one variable."},{"id":"COE-009","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which finding, if true, would most directly weaken the zoologist’s hypothesis?","choices":{"A":"Lizards drank more water on the hottest days than on cooler days.","B":"Shade use stayed unchanged when humidity varied under fixed conditions.","C":"Lizards lost less water in humid air than in dry air.","D":"Lizards spent more time in shade when both temperature and sunlight increased."},"answer":"B","explanation":"If humidity does not affect shade-seeking when other conditions are fixed, the water-loss account is weakened.","choice_explanations":{"A":"Incorrect: Drinking behavior on different days does not distinguish reasons for seeking shade.","B":"Correct: If humidity does not affect shade-seeking when other conditions are fixed, the water-loss account is weakened.","C":"Incorrect: This verifies a physical effect of humidity but does not test the proposed cause of shading behavior.","D":"Incorrect: This does not isolate humidity and could reflect temperature regulation."},"passage":"A zoologist proposes that desert lizards seek shade at noon primarily to avoid losing water through their skin, rather than to control body temperature. The hypothesis predicts that changing air humidity while keeping temperature and illumination constant should strongly influence how long the lizards remain in shade.","strategy":"For a weakening question, identify a distinctive prediction and look for its failure under a clean test."},{"id":"COE-010","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which finding, if true, would most directly weaken the administrator’s proposed mechanism?","choices":{"A":"Students given charts were more likely than others to report having weekly study goals.","B":"Students using charts completed more practice problems and earned higher scores than students without charts.","C":"Teachers who encouraged students verbally to set goals had higher average class scores.","D":"With practice equalized, charts increased goal setting, but test scores stayed the same."},"answer":"D","explanation":"Goals increased but score gains did not under equal practice, undermining the proposed performance mechanism.","choice_explanations":{"A":"Incorrect: This supports part of the proposed process but does not test whether it caused score gains.","B":"Incorrect: Both the original and rival explanations predict this pattern.","C":"Incorrect: Teacher differences make this indirect and do not evaluate the chart’s distinctive contribution.","D":"Correct: Goals increased but score gains did not under equal practice, undermining the proposed performance mechanism."},"passage":"A school administrator claims that providing students with a weekly progress chart raises their mathematics scores because the chart helps them set specific goals. A rival explanation is that the chart simply increases the number of practice problems students complete. The administrator expects that chart users who receive equal practice time will still show greater goal-setting and performance gains.","strategy":"Distinguish whether an intervention changes the intermediate behavior from whether that change explains the outcome."},{"id":"COE-011","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which finding, if true, would most directly weaken the archaeologist’s explanation?","choices":{"A":"Hilltop construction predated the valley floods by generations.","B":"Hilltop households used pottery styles also found in valley settlements.","C":"Flood deposits were thicker in some valleys than in others.","D":"Several households eventually returned to valley settlements."},"answer":"A","explanation":"The proposed cause occurs after most supposed effects, contradicting the necessary temporal order.","choice_explanations":{"A":"Correct: The proposed cause occurs after most supposed effects, contradicting the necessary temporal order.","B":"Incorrect: Shared material culture is compatible with migration but does not establish when it occurred.","C":"Incorrect: Variation in flooding intensity does not show that the proposed migration sequence is wrong.","D":"Incorrect: A later return would not by itself undermine an earlier move prompted by flooding."},"passage":"An archaeologist attributes a series of abandoned hilltop dwellings to repeated flooding of nearby valleys. The archaeologist reasons that families gradually moved uphill as floodwater became more frequent. If this migration story is correct, the hilltop dwellings should have been built after the period when flood deposits became widespread in the valleys.","strategy":"Check whether an explanation requires a specific sequence, then seek dates that reverse it."},{"id":"COE-012","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which finding, if true, would most directly weaken the curator’s causal claim?","choices":{"A":"Visitors in both studies generally preferred shorter descriptions when interviewed.","B":"More visitors attended the museum after the new labels were installed.","C":"With matching inclusion rules, measured viewing time did not change.","D":"Visitors who stopped to read labels spent longer in the galleries than visitors who did not."},"answer":"C","explanation":"Eliminating the measurement inconsistency eliminates the reported effect, directly undermining the claimed cause.","choice_explanations":{"A":"Incorrect: Preferences do not establish a change in time spent looking at art.","B":"Incorrect: Attendance growth does not reveal whether individual viewing behavior changed.","C":"Correct: Eliminating the measurement inconsistency eliminates the reported effect, directly undermining the claimed cause.","D":"Incorrect: This uses different visitor groups and does not compare before and after using consistent measurement."},"passage":"A museum curator argues that replacing long wall labels with shorter ones caused visitors to spend more time examining paintings. The curator cites an increase in average viewing times measured after the change. A researcher notes that the original timing study included people who merely walked past a painting, while the later study counted only visitors who stopped for at least several seconds.","strategy":"If the measurement rules change, prefer evidence from a reanalysis using matched definitions."},{"id":"COE-013","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which quotation would best illustrate the critic’s interpretation?","choices":{"A":"“For months Dara had kept the observatory keys in her pocket, even when she went nowhere near the hill.”","B":"“Dara smiled as the dome moved freely, but feared her brother’s renewed warmth might not last.”","C":"“Dara checked each bolt twice before inviting her brother to test the mechanism.”","D":"“Her brother declared the telescope repaired, and Dara felt certain the observatory would welcome visitors for years.”"},"answer":"B","explanation":"The line combines pride at completion with apprehension about continued emotional closeness.","choice_explanations":{"A":"Incorrect: Possessing keys could symbolize attachment, but neither completion nor uncertainty about closeness is expressed.","B":"Correct: The line combines pride at completion with apprehension about continued emotional closeness.","C":"Incorrect: Careful workmanship does not reveal simultaneous satisfaction and anxiety about the relationship.","D":"Incorrect: This concerns confidence in the structure, not uncertainty about their bond."},"passage":"In an original fictional story, Dara has spent months restoring a disused observatory with her estranged brother. A literary critic argues that Dara’s satisfaction at finishing the project is inseparable from her uncertainty about whether their renewed closeness will last.","strategy":"Require one quotation to support both halves of a compound interpretive claim."},{"id":"COE-014","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which quotation from the poem would most directly support the critic’s claim?","choices":{"A":"“I crossed the bridge when morning made the river bright.”","B":"“The bridge had weathered storms before my birth.”","C":"“At last my fear departed, and the far bank seemed near.”","D":"“My knees still shook, yet I set my foot upon the bridge.”"},"answer":"D","explanation":"The simultaneous shaking knees and deliberate step embody action taken despite continuing fear.","choice_explanations":{"A":"Incorrect: This reports an action and setting but does not establish ongoing fear.","B":"Incorrect: This describes the bridge’s endurance, not the speaker’s emotional condition.","C":"Incorrect: This treats courage as following the disappearance of fear, contrary to the critic’s claim.","D":"Correct: The simultaneous shaking knees and deliberate step embody action taken despite continuing fear."},"passage":"A critic reading the invented poem “At the Crossing” contends that its speaker presents courage not as an absence of fear but as a decision made while fear persists. The critic wishes to cite a single line that makes the distinction explicit without relying on an assumption about the speaker’s background.","strategy":"Treat contrastive words such as “yet” as clues, but verify the two claims on either side."},{"id":"COE-015","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which quotation from the novel best supports the commentator’s reading?","choices":{"A":"“Enna watched the river rise and silently counted the years since the last flood.”","B":"“Her vote was folly, and anyone who praised it shared the blame.”","C":"“I understood Enna’s difficult choice, but her vote still left us stranded.”","D":"“The district had demanded more from Enna than any one councilor could provide.”"},"answer":"C","explanation":"The speaker acknowledges Enna’s burden and directly maintains responsibility for the damaged bridge.","choice_explanations":{"A":"Incorrect: The quotation shows attention to flooding, not both sympathy and moral criticism.","B":"Incorrect: The speaker criticizes Enna but expresses no sympathetic understanding.","C":"Correct: The speaker acknowledges Enna’s burden and directly maintains responsibility for the damaged bridge.","D":"Incorrect: This is sympathetic but does not say the vote was mistaken."},"passage":"In a fictional novel, Councilor Enna blocks a bridge-repair proposal that would help her own district. A commentator argues that the narrator sympathizes with Enna’s difficult position while still regarding her vote as a serious mistake. The commentator needs a quotation that conveys both judgments.","strategy":"For mixed-attitude claims, ensure both poles are present in the same evidence."},{"id":"COE-016","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which quotation from the memoir would best illustrate the historian’s claim?","choices":{"A":"“The register dates our departure accurately; it cannot measure how that morning felt.”","B":"“I never trusted records, and I refused to read them after the war.”","C":"“I later learned that the register listed the wrong month for our departure.”","D":"“We consulted the register and found the names of several families we had forgotten.”"},"answer":"A","explanation":"The register is accurate about facts yet inadequate about lived experience.","choice_explanations":{"A":"Correct: The register is accurate about facts yet inadequate about lived experience.","B":"Incorrect: The historian says the memoirist values records, not that the author rejects them.","C":"Incorrect: This challenges the register’s factual accuracy, a different claim.","D":"Incorrect: This supports the usefulness of records but not their experiential limits."},"passage":"A historian analyzing a fictional memoir argues that its author values official records but doubts that such records can convey what an event felt like to people who lived through it. The historian is not claiming that the author believes documents to be factually false. A suitable quotation must preserve that distinction.","strategy":"Distinguish a criticism of scope from a criticism of reliability."},{"id":"COE-017","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which quotation from a contemporary observer would best support the scholar’s argument?","choices":{"A":"“The guild prohibited apprentices from signing official contracts in their own names.”","B":"“Several apprentices left the guild after refusing the customary examination.”","C":"“The masters displayed their seals prominently above the entrance to the workshop.”","D":"“The guild ranks apprentices last; masters nevertheless follow their daily advice.”"},"answer":"D","explanation":"The quote contrasts official rank with practical consultation of junior workers.","choice_explanations":{"A":"Incorrect: This records formal subordination without informal influence.","B":"Incorrect: Departure and resistance do not demonstrate influence within normal workshop practice.","C":"Incorrect: This confirms symbolic hierarchy but does not complicate its daily operation.","D":"Correct: The quote contrasts official rank with practical consultation of junior workers."},"passage":"A scholar studying a fictional eighteenth-century guild argues that written rules described a sharply ranked apprentice system, but everyday workshop arrangements often gave junior workers substantial informal influence. The scholar seeks a quotation that contrasts formal hierarchy with routine practice, not merely an example of obedience or rebellion.","strategy":"Find a quotation that directly juxtaposes the institutional claim and a qualifying counterpattern."},{"id":"COE-018","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which quotation from Serra best supports the critic’s claim?","choices":{"A":"“I cropped out the bus; the passengers’ leaning faces show its departure.”","B":"“I photograph traffic because cities never become still.”","C":"“I have always liked the symmetry of bridges and railway platforms.”","D":"“I used a long exposure so the buses would become streaks of light.”"},"answer":"A","explanation":"The bus is intentionally excluded while the remaining visual cues imply movement.","choice_explanations":{"A":"Correct: The bus is intentionally excluded while the remaining visual cues imply movement.","B":"Incorrect: This concerns subject choice, not a compositional method.","C":"Incorrect: This describes aesthetic preference without deliberate omission of moving subjects.","D":"Incorrect: This relies on blur rather than omission."},"passage":"A critic of the invented photographer Lio Serra argues that his compositions convey urban movement largely through what they leave out rather than through blurred depictions of motion. The critic needs a quotation from Serra that supports an emphasis on deliberate omission, not simply the speed of the city.","strategy":"Use a quotation that demonstrates the specified artistic mechanism, not simply its subject."},{"id":"COE-019","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which quotation from a troupe member would most strongly support the archivist’s interpretation?","choices":{"A":"“Sometimes an actor forgot a line and invented a substitute onstage.”","B":"“Our director drafted it; we rewrote entire scenes together.”","C":"“Our director assigned each actor a part before rehearsals began.”","D":"“We stopped keeping scripts after our director resigned.”"},"answer":"B","explanation":"The line explicitly describes joint changes to a director’s draft before performance.","choice_explanations":{"A":"Incorrect: Accidental improvisation does not establish collaborative authorship in preparation.","B":"Correct: The line explicitly describes joint changes to a director’s draft before performance.","C":"Incorrect: This is consistent with ordinary direction and not evidence of actor-led revision.","D":"Incorrect: This suggests a later change, not collaboration while the director remained."},"passage":"An archivist suggests that a fictional traveling theater troupe produced its performances collaboratively, with actors revising their dialogue and not merely executing scripts supplied by the director. The archivist does not claim that the troupe lacked a director or that every performance was improvised.","strategy":"Beware evidence that overstates the claim by eliminating a role the passage still acknowledges."},{"id":"COE-020","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which line from the poem would best support the reader’s interpretation?","choices":{"A":"“The train arrived in rain and opened all its doors.”","B":"“I watched my neighbor grow smaller through the glass.”","C":"“Unchained at last, I lost the voice that knew me.”","D":"“At last the schedules fell behind me like old chains.”"},"answer":"C","explanation":"The line pairs freedom from a restrictive daily routine with separation from a familiar person.","choice_explanations":{"A":"Incorrect: This describes a literal departure with no emotional duality.","B":"Incorrect: This suggests loss but not release from an oppressive routine.","C":"Correct: The line pairs freedom from a restrictive daily routine with separation from a familiar person.","D":"Incorrect: This expresses liberation without the loss of personal closeness."},"passage":"A reader of the fictional poem “Last Platform” claims that the speaker experiences departure as both release from an oppressive routine and a loss of familiar intimacy. The reader wants to avoid citing a line that merely mentions a train or conveys only one feeling.","strategy":"In metaphorical quotation questions, decode each image and match every clause in the critic’s claim."},{"id":"COE-021","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which additional evidence would most directly help the historian distinguish these explanations?","choices":{"A":"Documents showing that sunset occurred at different clock times during the year.","B":"Records showing that the council issued fines for many kinds of market violations.","C":"Stalls closed at the evening bell despite daylight and busy streets.","D":"Accounts indicating that merchants complained both about council rules and about nighttime theft."},"answer":"C","explanation":"Closure aligned with the bell well before darkness is stronger evidence for compliance than fear of darkness.","choice_explanations":{"A":"Incorrect: Seasonal daylight variation is background knowledge unless compared with observed stall closures.","B":"Incorrect: General enforcement does not establish whether the new bell determined when stalls closed.","C":"Correct: Closure aligned with the bell well before darkness is stronger evidence for compliance than fear of darkness.","D":"Incorrect: Complaints establish two concerns but do not separate their effects on actual closing times."},"passage":"A historian observes that market stalls in the imaginary town of Alven closed earlier after the council introduced evening bell signals. Some scholars interpret the change as merchants obeying the new rule; others suggest that streets had become unsafe after sunset. The historian wants to test whether compliance with the bell, rather than fear of nighttime travel, explains the shift.","strategy":"Choose observations for which the competing explanations predict different patterns."},{"id":"COE-022","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which finding would best support the group’s interpretation?","choices":{"A":"Fish numbers were lower in years when the reservoir released less total water.","B":"Identical volumes disrupted feeding only when released overnight in bursts.","C":"The reservoir released different total volumes on weekdays and weekends.","D":"Water temperatures were higher downstream during summer than during winter."},"answer":"B","explanation":"Holding daily volume constant isolates how timing changes feeding patterns.","choice_explanations":{"A":"Incorrect: This supports a volume explanation rather than distinguishing release timing.","B":"Correct: Holding daily volume constant isolates how timing changes feeding patterns.","C":"Incorrect: This documents quantity differences without a measured response to timing.","D":"Incorrect: Temperature differs seasonally but is not evidence for overnight releases with equal volumes."},"passage":"A conservation group argues that a stream’s declining fish numbers are associated with when water is released from an upstream reservoir, not simply with how much water is released in total. The group claims that brief overnight releases disrupt feeding even if the stream receives its usual daily volume. Researchers seek evidence that distinguishes timing from quantity.","strategy":"State exactly which variable must remain constant and which variable should differ."},{"id":"COE-023","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which evidence would most directly support the scientist’s argument?","choices":{"A":"Fewer collisions were reported after construction, but the number of attempted crossings was not recorded.","B":"Collision counts increased near crossings, where animal activity also increased sharply.","C":"More animals used the new crossings than crossed at nearby sections without them.","D":"Collisions per crossing attempt declined at sections given animal crossings, relative to controls."},"answer":"D","explanation":"The comparison estimates collision probability conditional on an attempt and controls for different activity levels.","choice_explanations":{"A":"Incorrect: Without attempts, the per-attempt risk cannot be estimated.","B":"Incorrect: Raw collision totals do not show whether risk per attempt went down or up.","C":"Incorrect: Increased use does not establish lower collision risk per attempt.","D":"Correct: The comparison estimates collision probability conditional on an attempt and controls for different activity levels."},"passage":"A scientist argues that newly constructed animal crossings reduce collision risk per crossing attempt, rather than simply attracting animals to roads where they would otherwise make fewer attempts. To support the claim, the scientist needs information about both the number of attempted crossings and the number of collisions at comparable road sections.","strategy":"If the claim is about a rate, reject raw totals that omit the denominator."},{"id":"COE-024","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which finding, if true, would most directly support the district’s proposal?","choices":{"A":"All students who received tutoring reported liking their tutors.","B":"Randomly offered tutoring increased pass rates among borderline, coursework-completing students.","C":"Students who had not completed coursework rarely attended tutoring sessions.","D":"Students who passed the exam on their first attempt were more likely to study independently than students who did not pass."},"answer":"B","explanation":"The randomized comparison measures the intended benefit within the precise target population.","choice_explanations":{"A":"Incorrect: Satisfaction is not the claimed outcome and includes students outside the target group.","B":"Correct: The randomized comparison measures the intended benefit within the precise target population.","C":"Incorrect: This concerns a different group and does not test effectiveness for the targeted students.","D":"Incorrect: This compares a different outcome and cannot establish tutoring’s benefit for borderline candidates."},"passage":"A district proposes offering optional tutoring to students who have completed the required coursework but narrowly missed a certification exam. Officials expect the program to be particularly effective for this group because their difficulties concern a small number of topics. They do not claim that tutoring will have the same effect for students who have not completed the coursework.","strategy":"Match the evidence population, comparison, and desired outcome to the full claim."},{"id":"COE-025","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice most effectively uses data from the table to support the student’s claim?","choices":{"A":"Section A increased from 21 to 31 groups, so it had the greatest increase despite finishing below section C.","B":"Section C increased from 25 to 33 groups, giving it both the largest gain and the largest final count.","C":"Section D increased from 20 to 29 groups, giving it a greater increase than section B.","D":"B gained 13 insect groups from its baseline, whereas C finished with 33 groups overall."},"answer":"D","explanation":"B has the largest change (13), while C has the highest final value (33).","choice_explanations":{"A":"Incorrect: Section A gained 10, not the highest increase.","B":"Incorrect: Section C gained only 8 groups, less than B’s gain of 13.","C":"Incorrect: Section D gained 9, smaller than B’s gain of 13.","D":"Correct: B has the largest change (13), while C has the highest final value (33)."},"passage":"A fictional river-restoration project measured the number of aquatic insect groups detected in four sections of a river before and one year after adding habitat structures. A student claims that the section with the greatest increase was not the section with the greatest final number of groups.","strategy":"Compute change for each row before comparing final values."},{"id":"COE-026","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice most effectively supports the analyst’s claim using the table?","choices":{"A":"Z hosted 56 events with seven volunteers, or 8 each; X hosted 66 events overall.","B":"Library W ran 30 events with 6 volunteers, so it had the highest events-per-volunteer rate.","C":"Library X ran 66 events with 12 volunteers, giving it both the highest event count and the highest rate.","D":"Library Y ran 48 events with 8 volunteers, the highest event rate among the libraries."},"answer":"A","explanation":"Z has 8 events per volunteer; X has 5.5, Y has 6, and W has 5. The highest rate belongs to Z while the highest total belongs to X.","choice_explanations":{"A":"Correct: Z has 8 events per volunteer; X has 5.5, Y has 6, and W has 5. The highest rate belongs to Z while the highest total belongs to X.","B":"Incorrect: W had 5 events per volunteer, below all others.","C":"Incorrect: X had the highest event count but a rate of only 5.5 events per volunteer.","D":"Incorrect: Y had 6 events per volunteer, below Z’s 8."},"passage":"Four imaginary libraries hosted volunteer-led reading events. The libraries differed greatly in the number of volunteers available. A city analyst argues that the library that ran the most events per volunteer was not necessarily the one that ran the most events overall.","strategy":"Calculate events ÷ volunteers and distinguish rate from total."},{"id":"COE-027","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice most effectively uses the table to illustrate this possibility?","choices":{"A":"Neighborhood Q used less energy than P in the evening, even though its daily total was greater.","B":"Neighborhood P had higher total usage than Q because it used 62 units in the morning compared with Q’s 45.","C":"Neighborhoods P and R used the same total electricity but had different morning/evening splits.","D":"Neighborhoods P and Q each used 100 units daily but concentrated use at opposite times."},"answer":"D","explanation":"Both sum to 100, but the timing distributions differ substantially.","choice_explanations":{"A":"Incorrect: Q used more in the evening (55 versus 38) and the totals are equal.","B":"Incorrect: P and Q both total 100 units; the morning comparison alone does not determine totals.","C":"Incorrect: P totaled 100, while R totaled 90.","D":"Correct: Both sum to 100, but the timing distributions differ substantially."},"passage":"Researchers built three model neighborhoods that used different amounts of electricity in the morning and evening. A student argues that two neighborhoods could have identical total daily use yet rely more heavily on different times of day.","strategy":"Calculate totals before interpreting how the total is distributed among categories."},{"id":"COE-028","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice most effectively uses the data to support the researchers’ suggestion?","choices":{"A":"Untreated strips were stronger at high temperature than treated strips, by 9 units.","B":"The treatment raised strength at low temperature from 40 to 39 units, showing a strong benefit in cool conditions.","C":"Untreated strength fell 15 units with heating; treated strength fell only 5.","D":"Both treated and untreated strips lost exactly the same strength when heated."},"answer":"C","explanation":"Treatment reduces the temperature-associated strength loss from 15 to 5 units.","choice_explanations":{"A":"Incorrect: The treated high-temperature strength was 34, greater than the untreated value of 25.","B":"Incorrect: 39 is lower than 40, so this is not a strength gain.","C":"Correct: Treatment reduces the temperature-associated strength loss from 15 to 5 units.","D":"Incorrect: The losses are 5 and 15 units, respectively."},"passage":"A laboratory tested the strength of identical polymer strips at two temperatures, with and without a surface treatment. The researchers suggest that the treatment matters more at high temperatures because it reduces the loss of strength associated with heating.","strategy":"Compute the within-treatment changes, then compare those changes."},{"id":"COE-029","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice most effectively supports the article’s claim?","choices":{"A":"R’s noise fell 13 units; S started higher but registered a smaller decrease.","B":"Noise fell at all four intersections, including U, where the reading fell slightly below 52.","C":"Noise declined most at S because it began at the highest level, 60 units.","D":"Noise stayed the same at U, so it had a greater decline than the intersections where noise decreased."},"answer":"A","explanation":"R has the largest measured decline, while S is the highest baseline; one row remains unchanged.","choice_explanations":{"A":"Correct: R has the largest measured decline, while S is the highest baseline; one row remains unchanged.","B":"Incorrect: U remained at exactly 52, so only three sites had lower readings.","C":"Incorrect: S decreased by only 2 units, from 60 to 58.","D":"Incorrect: A change of zero cannot exceed positive reductions."},"passage":"Engineers compared typical noise measurements at four intersections before and after a trial traffic design. An article claims that the design was associated with a reduction in noise at three intersections, but the largest reduction occurred at an intersection that did not have the highest initial noise level.","strategy":"Compare signed changes separately from initial rankings, and check the number of decreasing rows."},{"id":"COE-030","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice uses the data to identify the organism with the widest recorded depth range?","choices":{"A":"Organism D has the greatest range because its deepest sighting was 710 meters.","B":"Organism C spans 200 to 650 meters and thus covers a greater range than B.","C":"Organism A has the greatest range because its shallowest sighting is at only 20 meters.","D":"Organism B spanned 700 meters, from 100 to 800, exceeding every other recorded range."},"answer":"D","explanation":"The correct statistic is deepest minus shallowest; B yields 800 - 100 = 700 m.","choice_explanations":{"A":"Incorrect: D spans 40 to 710 meters, a 670-meter range, less than B’s 700.","B":"Incorrect: C’s 450-meter range is less than B’s 700.","C":"Incorrect: A spans 20 to 620 meters, a 600-meter range.","D":"Correct: The correct statistic is deepest minus shallowest; B yields 800 - 100 = 700 m."},"passage":"A field guide lists the shallowest and deepest recorded sightings of four fictional deep-sea organisms. A student wants to identify the organism observed across the widest vertical range, not simply the one observed at the greatest depth.","strategy":"Do not confuse the maximum observation with the difference between extremes."},{"id":"COE-031","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice best supports the team’s conclusion about the best lifetime-per-cost ratio?","choices":{"A":"The mineral-ceramic filter is best because it has the lowest price and lasts 28 months.","B":"The bamboo-composite filter delivered 8 usable months per cost unit, the highest ratio.","C":"The fiber-resin filter is best because it lasts 54 months, which is longer than the bamboo-composite filter.","D":"The layered-composite filter is best because its 70-month lifetime is the longest."},"answer":"B","explanation":"Lifetime divided by cost yields 7, 6, 8, and 7 months per cost unit.","choice_explanations":{"A":"Incorrect: 28/4 = 7, below the bamboo-composite’s 8.","B":"Correct: Lifetime divided by cost yields 7, 6, 8, and 7 months per cost unit.","C":"Incorrect: Longer life alone ignores cost; 54/9 = 6, compared with 8.","D":"Incorrect: 70/10 = 7 months per unit, less than bamboo-composite’s 8."},"passage":"An engineering team compared the estimated usable lifetime and upfront cost of four experimental reusable filters. The team notes that price alone is an incomplete measure of value and proposes comparing usable months of service per unit of cost.","strategy":"Normalize by the requested denominator before ranking designs."},{"id":"COE-032","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which statement most effectively uses the table to support this claim?","choices":{"A":"School D had the highest participation rate because it contributed 111 participants.","B":"School A’s participation rate exceeded C’s because 40 students attended, compared with 22 at C.","C":"C had the highest participation share, 88%, despite D supplying more students.","D":"School B had an 88% participation rate since 65 of its 100 eligible students attended."},"answer":"C","explanation":"C has the highest proportion despite fewer participants than several larger schools.","choice_explanations":{"A":"Incorrect: 111/150 = 74%, less than school C’s 88%.","B":"Incorrect: A’s rate was 40/50 = 80%, less than C’s 88%.","C":"Correct: C has the highest proportion despite fewer participants than several larger schools.","D":"Incorrect: 65/100 is 65%, not 88%."},"passage":"A team studied responses to optional museum workshops at four schools. One investigator claims that the highest percentage of eligible students participating occurred at a smaller school, even though larger schools supplied more participants in absolute numbers.","strategy":"Use eligible population as the denominator and separate shares from absolute counts."},{"id":"COE-033","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice best describes evidence from the graph that supports the student’s suggestion?","choices":{"A":"R gained 14 calls, while S reached the highest nighttime count, 34.","B":"Species P had the largest increase because its nighttime total was 21.","C":"Species Q showed the greatest increase because it made 24 daylight calls.","D":"Species S had the largest increase because it produced the greatest number of nighttime calls."},"answer":"A","explanation":"R has the greatest positive difference and S the largest nighttime count.","choice_explanations":{"A":"Correct: R has the greatest positive difference and S the largest nighttime count.","B":"Incorrect: P rose by 7, smaller than R’s increase of 14.","C":"Incorrect: Q’s count declined from 24 to 22.","D":"Incorrect: S rose only 4, from 30 to 34, while R rose 14."},"passage":"Scientists counted calls from four fictional frog species during daylight and after sunset. A student suggests that the species exhibiting the greatest increase in calls after sunset was not the species with the highest nighttime call count.","strategy":"Calculate the differences in paired bar heights; do not rank by the ending bar alone."},{"id":"COE-034","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice best supports the analyst’s claim using the graph?","choices":{"A":"West had a greater relative increase than North because its final total reached 24 permits.","B":"North’s increase was 200% against East’s 150%, although East gained more permits in absolute terms.","C":"South had the largest increase because it began with 20 permits, more than any other district.","D":"East had the greatest percentage increase because it added 12 permits compared with North’s 10."},"answer":"B","explanation":"Percentage change divides the change by the starting value; North rises 10/5 = 200%.","choice_explanations":{"A":"Incorrect: West rose from 16 to 24, a 50% increase, below North’s 200%.","B":"Correct: Percentage change divides the change by the starting value; North rises 10/5 = 200%.","C":"Incorrect: South rose by only 2 permits, or 10%.","D":"Incorrect: A larger absolute gain does not imply a larger percentage; East increased 150%, North 200%."},"passage":"A city development office tracked the number of rooftop-garden permits approved in four districts over two years. An analyst claims that North had the greatest percentage increase, although a different district registered a larger numerical increase.","strategy":"Compute (new - old) / old for relative growth, then separately compare absolute differences."},{"id":"COE-035","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice uses the graph to identify the habitat with the largest rise in photographs?","choices":{"A":"Desert increased the most since its count grew from 18 to 20, a 2-photograph gain.","B":"Forest increased the most because its late-spring count was 41, higher than Marsh’s 33.","C":"Marsh rose by 21 photographs, the largest increase between the two spring observations.","D":"Grassland increased more than Marsh because its late-spring count was 35."},"answer":"C","explanation":"Marsh’s gain of 21 exceeds Forest (11), Grassland (13), and Desert (2).","choice_explanations":{"A":"Incorrect: A gain of 2 is much smaller than Marsh’s 21.","B":"Incorrect: Forest increased by 11, not 21.","C":"Correct: Marsh’s gain of 21 exceeds Forest (11), Grassland (13), and Desert (2).","D":"Incorrect: Grassland rose from 22 to 35, an increase of 13."},"passage":"Researchers photographed birds in four invented habitats during early spring and late spring. They argue that habitat-specific changes in observed activity should be assessed by changes within the same habitat, not by ranking habitats by late-spring totals alone.","strategy":"Select the biggest paired difference rather than the tallest final column."},{"id":"COE-036","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice best supports the student’s conclusion?","choices":{"A":"T2 had the smallest initial coefficient and thus the smallest decrease after redesign.","B":"The T4 shape had the largest drag reduction because its initial coefficient was 0.44, the highest.","C":"The T1 shape had a reduction of 0.31, which was greater than the reduction for T3.","D":"T3 had the lowest initial drag, 0.36, yet its decrease of 0.14 was greatest."},"answer":"D","explanation":"T3 has both the lowest baseline value and the largest absolute decline.","choice_explanations":{"A":"Incorrect: T2 started at 0.42; T3 started lower at 0.36.","B":"Incorrect: T4 dropped by 0.09, less than T3’s 0.14.","C":"Incorrect: 0.31 is T1’s final coefficient, not its reduction; T1 decreased by 0.09.","D":"Correct: T3 has both the lowest baseline value and the largest absolute decline."},"passage":"A team compared drag coefficients for four experimental wingtip shapes before and after a minor redesign. A student concludes that the design with the lowest initial drag did not necessarily show the smallest absolute reduction after modification.","strategy":"Separate the baseline measurement, the final measurement, and their numerical difference."},{"id":"COE-037","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice most accurately identifies the exception from the graph?","choices":{"A":"Street W was the exception because it remained the busiest street in the evening.","B":"Street Y was the exception because its evening count was close to its noon count.","C":"Street X was the exception because it fell by 13 pedestrians.","D":"Only Street Z rose from noon to evening, increasing from 30 to 35."},"answer":"D","explanation":"Z is the only street with evening > noon.","choice_explanations":{"A":"Incorrect: W declined from 48 to 45, so it does not show the opposite pattern.","B":"Incorrect: Y still declined from 37 to 33, unlike Z’s increase.","C":"Incorrect: X shows the dominant decrease, not a reversal.","D":"Correct: Z is the only street with evening > noon."},"passage":"A transport researcher counted pedestrians along four streets at noon and in the evening. Three streets had fewer pedestrians in the evening, but one showed the opposite pattern. The researcher wants to identify this exception rather than merely the street with the most traffic.","strategy":"Look for a sign reversal within each paired category; the largest absolute count is irrelevant."},{"id":"COE-038","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice best supports the researcher’s claim?","choices":{"A":"Valley B had the largest proportional increase because its nighttime total of 52 was highest.","B":"C’s 80% increase was largest even though B had more nighttime detections.","C":"Valley A had the largest proportional increase because its detections rose by 10.","D":"Valley D had the largest proportional increase because it added 10 detections, matching valley A’s gain."},"answer":"B","explanation":"C’s gain of 12 divided by 15 is 80%, exceeding B (30%), A (50%), and D (40%).","choice_explanations":{"A":"Incorrect: B increased by 12 over a baseline of 40, which is 30%.","B":"Correct: C’s gain of 12 divided by 15 is 80%, exceeding B (30%), A (50%), and D (40%).","C":"Incorrect: A increased from 20 to 30, a 50% rise, less than C’s 80%.","D":"Incorrect: D’s relative gain is 10/25 = 40%, not the largest."},"passage":"Researchers compared the number of acoustic detections recorded in four valleys during daylight and darkness. One researcher argues that valley C had the largest proportional increase in detections even though it recorded fewer detections at night than valley B.","strategy":"Use percentage change, not final counts or unnormalized changes, to compare growth."},{"id":"COE-039","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice most effectively supports this observation?","choices":{"A":"Task D had the largest coaching advantage because its coached and independent rates were nearly equal.","B":"Task C had the largest coaching advantage because 82% of coached participants passed it.","C":"A’s coaching gap was 15 points, though C had the highest coached pass rate.","D":"Task B had the largest coaching advantage because 63% passed with coaching."},"answer":"C","explanation":"A has the widest coached-minus-independent gap, whereas C has the highest coached value.","choice_explanations":{"A":"Incorrect: D’s gap was 1 percentage point, the smallest.","B":"Incorrect: C’s coaching advantage was only 8 percentage points (82% minus 74%).","C":"Correct: A has the widest coached-minus-independent gap, whereas C has the highest coached value.","D":"Incorrect: B’s gap was only 3 percentage points."},"passage":"An education researcher compared the percentages of participants who passed four simulated certification tasks after either independent study or guided coaching. The researcher observes that the task with the largest coaching advantage was not the task with the highest coached pass rate.","strategy":"Compare differences between the paired bars rather than comparing only one series."},{"id":"COE-040","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice best describes data from the graph that support the report’s claim?","choices":{"A":"W fell by 28 units, the largest reduction, despite the lowest starting consumption.","B":"Process X had the greatest reduction because its post-change consumption was 96 units.","C":"Process Z had the largest reduction because its original energy consumption was highest at 130 units.","D":"Process Y had the largest reduction because it used fewer units than X after the change."},"answer":"A","explanation":"W has the largest difference (28), although its starting measurement is the lowest (80).","choice_explanations":{"A":"Correct: W has the largest difference (28), although its starting measurement is the lowest (80).","B":"Incorrect: X fell by 24 units, and its final level alone does not measure the decrease.","C":"Incorrect: Z fell from 130 to 104, a reduction of 26, less than W’s 28.","D":"Incorrect: Y dropped by only 4 units; it was already lower before the change."},"passage":"A manufacturing lab compared the energy consumption of four experimental production processes before and after changing a heating step. A claim in a technical report states that process W achieved the greatest absolute energy reduction, though its original energy consumption was the lowest of the four.","strategy":"Compute the changes from paired columns and compare them independently of starting magnitudes."},{"id":"COE-041","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice best describes data from the graph that support the researchers’ proposal?","choices":{"A":"The enriched batch declined between days 2 and 3 before recovering on day 4.","B":"The enriched batch was already larger on day 0 and maintained that advantage throughout the study.","C":"The batches grew at identical rates on all five days, so the treatment had no detectable effect.","D":"Both groups matched through day 2; only then did the enriched group pull ahead."},"answer":"D","explanation":"Equality through day 2 followed by divergence is the expected delayed response.","choice_explanations":{"A":"Incorrect: Its value increased from 28 to 40 to 52; there was no decline.","B":"Incorrect: Both batches began at 20 and remained equal through day 2.","C":"Incorrect: They diverged after day 2; the treated group rose to 52 while the control reached 36.","D":"Correct: Equality through day 2 followed by divergence is the expected delayed response."},"passage":"Two identical batches of experimental seedlings received either ordinary watering or a mineral-enriched solution. Researchers proposed that the treatment’s effect on leaf area would become visible only after several days of exposure, not immediately. Leaf area was measured once a day for five days.","strategy":"Read the entire time sequence before deciding whether an effect is immediate, delayed, transient, or absent."},{"id":"COE-042","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice best describes the graph evidence that supports this expectation?","choices":{"A":"The east-facing panel peaked at 10:00; the west-facing panel peaked later, at 14:00.","B":"The west-facing panel peaked earlier because its maximum was 11 units rather than 12.","C":"Both panels peaked at 12:00 because they produced equal outputs at that hour.","D":"The east-facing panel did not peak until 14:00, when the west-facing output was highest."},"answer":"A","explanation":"The x-position of the maximum is earlier for the east-facing panel; equal output at noon does not change the peak times.","choice_explanations":{"A":"Correct: The x-position of the maximum is earlier for the east-facing panel; equal output at noon does not change the peak times.","B":"Incorrect: Magnitude of peak output does not determine when the maximum occurs.","C":"Incorrect: An intersection is not necessarily a maximum for either series.","D":"Incorrect: At 14:00 east-facing output was 4; its peak was at 10:00."},"passage":"Engineers measured hourly output from two solar-panel orientations in a simulated day. They expected the east-facing panel to reach its maximum earlier than the west-facing panel, even if the panels occasionally produced the same power at one intermediate hour.","strategy":"Distinguish the time of the maximum from its magnitude and from a crossing of the series."},{"id":"COE-043","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice most effectively supports the team’s hypothesis using the graph?","choices":{"A":"Pre-soaked seeds continued to have a higher cumulative germination percentage through day 4.","B":"Both groups had identical cumulative germination on day 2, so pre-soaking had no early effect.","C":"Pre-soaked seeds led through day 3; both groups reached 80% on day 4.","D":"Untreated seeds germinated more quickly at every observation because their curve was initially lower."},"answer":"C","explanation":"An early lead that disappears by the final observation supports faster onset but equal final total.","choice_explanations":{"A":"Incorrect: The groups were equal at 80% on the last day.","B":"Incorrect: The values on day 2 were 30% and 50%, not identical.","C":"Correct: An early lead that disappears by the final observation supports faster onset but equal final total.","D":"Incorrect: A lower cumulative percentage indicates fewer seeds had germinated so far."},"passage":"A team tested two methods for starting seedlings in the same growing room. They hypothesized that a pre-soak treatment would accelerate early germination without changing the final percentage of seeds germinated after four days. The graph shows cumulative germination, not the number germinating on each individual day.","strategy":"With cumulative curves, distinguish an early lead from a lasting difference at the endpoint."},{"id":"COE-044","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice best supports the planner’s statement?","choices":{"A":"Trams exceeded buses only in 2020, after which their performance fell below bus performance.","B":"Trams trailed buses in 2019–2020 but overtook them and remained ahead through 2022.","C":"The two services were tied in 2021 and buses regained the lead in 2022.","D":"Buses had the higher on-time rate in every recorded year, although the gap narrowed."},"answer":"B","explanation":"The tram line crosses the bus line between 2020 and 2021 and stays above it afterward.","choice_explanations":{"A":"Incorrect: Trams trailed buses in 2020 and led in 2021 and 2022.","B":"Correct: The tram line crosses the bus line between 2020 and 2021 and stays above it afterward.","C":"Incorrect: The 2021 values were 83% and 85%; 2022 trams were also higher.","D":"Incorrect: Trams were higher in both final years."},"passage":"A regional planner compared the share of scheduled trips arriving on time for buses and trams over four years. The planner states that trams began the period behind buses but overtook them and retained the lead for the remaining years observed.","strategy":"Check the ordering at the beginning, at the first crossover, and at every later observation."},{"id":"COE-045","category":"Information and Ideas","skill":"Command of Evidence","level":"very_hard","question":"Which choice most effectively supports the investigators’ argument?","choices":{"A":"Enclosure A rose by 14°C while B rose by 22°C, showing A insulated better.","B":"Enclosure B maintained a constant 20°C throughout the experiment.","C":"Enclosure A started at a higher temperature than B and therefore cannot be compared.","D":"From 20°C, A rose 22°C while B rose only 14°C."},"answer":"D","explanation":"From the common baseline, the rise is smaller for B (14°C) than for A (22°C).","choice_explanations":{"A":"Incorrect: The end values imply the opposite differences.","B":"Incorrect: B warmed to 34°C; the claim is reduced warming, not no warming.","C":"Incorrect: Both began at exactly 20°C.","D":"Correct: From the common baseline, the rise is smaller for B (14°C) than for A (22°C)."},"passage":"Engineers tested two hypothetical enclosure materials by heating them for four hours. Both
