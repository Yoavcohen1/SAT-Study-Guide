<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice Tests</title><style>
    :root {
      --bg-main: #f3f4f5;
      --panel: #ffffff;
      --text-main: #212529;
      --text-muted: #5f6973;
      --accent: #2596be;
      --accent-hover: #1f7f9f;
      --accent-light: rgba(37, 150, 190, 0.12);
      --gold: #f5b301;
      --gold-light: rgba(245, 179, 1, 0.16);
      --success: #16a34a;
      --success-light: rgba(22, 163, 74, 0.12);
      --error: #dc2626;
      --error-light: rgba(220, 38, 38, 0.12);
      --border: #d9dee3;
      --soft-border: #e8ecef;
      --option-gray: #edf0f2;
      --shadow: rgba(33, 37, 41, 0.08);
      --sat-serif: Georgia, "Times New Roman", Times, serif;
      --ui-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html { font-size: 145%; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--ui-sans);
    }

    body {
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 112px 24px 120px;
      overflow-x: hidden;
    }

    .menu-btn {
      position: fixed;
      top: 30px;
      left: 30px;
      width: 64px;
      height: 64px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--text-main);
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 10px 25px var(--shadow);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .menu-btn:hover { background: #fff; transform: translateY(-1px); }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(33, 37, 41, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 150;
    }

    .sidebar-overlay.show { opacity: 1; pointer-events: all; }

    .sidebar {
      position: fixed;
      top: 0;
      left: -470px;
      width: 470px;
      max-width: 90vw;
      height: 100vh;
      background: #fff;
      box-shadow: 12px 0 34px rgba(33, 37, 41, 0.14);
      transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 200;
      padding: 34px;
      display: flex;
      flex-direction: column;
    }

    .sidebar.open { left: 0; }

    .sidebar-header {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 24px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--soft-border);
    }

    .sidebar-title {
      font-size: 1.16rem;
      font-weight: 900;
      color: var(--text-main);
      text-align: center;
      width: 100%;
    }

    .close-btn {
      position: absolute;
      right: 0;
      top: -4px;
      font-size: 38px;
      line-height: 1;
      cursor: pointer;
      color: var(--text-muted);
    }

    .close-btn:hover { color: var(--text-main); }

    .answered-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 6px;
    }

    .menu-section { margin-bottom: 24px; }

    .menu-section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 900;
      margin-bottom: 12px;
    }

    .category-grid {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .category-chip {
      width: 100%;
      text-align: left;
      border: 1px solid var(--soft-border);
      background: #f7f8f9;
      color: var(--text-main);
      padding: 11px 13px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 750;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .category-chip:hover,
    .category-chip.active {
      background: var(--accent-light);
      border-color: rgba(37, 150, 190, 0.36);
    }

    .category-count { color: var(--text-muted); font-weight: 900; }

    .nav-item {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: #f7f8f9;
      color: var(--text-main);
      padding: 15px 16px;
      border-radius: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.84rem;
      line-height: 1.25;
    }

    .nav-item:hover { background: var(--accent-light); border-color: rgba(37, 150, 190, 0.32); }
    .nav-item.current { border-color: var(--accent); background: var(--accent-light); }

    .nav-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-weight: 850;
    }

    .nav-star { color: var(--gold); font-size: 0.9rem; }

    .nav-question-preview {
      display: block;
      color: var(--text-muted);
      font-size: 0.68rem;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-type-preview {
      display: inline-block;
      margin-top: 7px;
      font-size: 0.58rem;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--option-gray);
      color: var(--text-muted);
    }

    .nav-status {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.58rem;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--option-gray);
      color: var(--text-muted);
    }

    .nav-status.correct { background: var(--success-light); color: var(--success); }
    .nav-status.wrong { background: var(--error-light); color: var(--error); }

    .sidebar-footer {
      padding-top: 22px;
      border-top: 1px solid var(--soft-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .domain-divider {
      height: 1px;
      background: var(--soft-border);
      margin: 10px 0 12px;
    }

    .tools-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 18px;
      background: #f8fafb;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-8px);
      pointer-events: none;
      transition: max-height 0.34s ease, opacity 0.24s ease, transform 0.34s ease, padding 0.34s ease, border-color 0.34s ease;
    }

    .tools-panel.show {
      max-height: 300px;
      opacity: 1;
      transform: translateY(0);
      padding: 12px;
      border-color: var(--soft-border);
      pointer-events: all;
    }

    .tools-timer {
      height: 6px;
      border-radius: 999px;
      background: #e2e8ee;
      overflow: hidden;
      opacity: 0.85;
    }

    .tools-timer-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: inherit;
      transform-origin: left center;
      transform: scaleX(1);
      transition: transform 0.08s linear;
    }

    .drop-zone {
      border: 2px dashed #b8c9d1;
      background: #fff;
      color: var(--text-main);
      border-radius: 16px;
      padding: 16px 14px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .drop-zone small {
      display: block;
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 0.62rem;
      font-weight: 750;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      background: var(--accent-light);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .empty-upload-panel {
      width: min(520px, 100%);
      margin: 26px auto 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-upload-panel .drop-zone {
      padding: 22px 18px;
      font-size: 0.9rem;
    }

    .screen-guide-btn {
      width: 100%;
    }

    .side-btn {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 0.8rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .side-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .side-btn.secondary {
      background: #fff;
      color: var(--text-main);
      border-color: var(--border);
    }

    .side-btn.secondary:hover { background: #f6f7f8; }

    .reset-btn {
      align-self: stretch;
      background: #e9ecef;
      border-color: #cfd4da;
      color: var(--text-main);
      padding: 10px 14px;
      font-size: 0.72rem;
      box-shadow: none;
    }

    .reset-btn:hover { background: #dee2e6; border-color: #b8c0c7; }

    .reset-btn.resetting {
      animation: resetPulse 0.72s ease both;
    }

    .quiz-container.resetting {
      animation: resetSweep 0.72s ease both;
    }

    @keyframes resetPulse {
      0% { transform: scale(1); }
      35% { transform: scale(0.96) rotate(-1deg); }
      70% { transform: scale(1.03) rotate(1deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes resetSweep {
      0% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      45% { opacity: 0.18; transform: translateY(12px) scale(0.985); filter: blur(2px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .json-status {
      color: var(--text-muted);
      font-size: 0.66rem;
      line-height: 1.35;
      min-height: 0;
    }

    .credit-text {
      color: var(--text-muted);
      opacity: 0.48;
      font-size: 0.62rem;
      text-align: center;
      margin-top: 8px;
      padding-top: 4px;
      user-select: none;
    }

    .quiz-container {
      width: 100%;
      max-width: 1050px;
      display: grid;
    }

    .question-wrapper,
    .empty-screen,
    .end-screen {
      grid-area: 1 / 1;
      padding: 26px 0;
      opacity: 0;
      transform: scale(0.965);
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.34s ease, transform 0.34s ease, visibility 0.34s ease;
    }

    .question-wrapper.active,
    .empty-screen.active,
    .end-screen.active {
      opacity: 1;
      transform: scale(1);
      visibility: visible;
      pointer-events: all;
    }

    .question-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--soft-border);
    }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 900;
    }

    .meta-pill {
      border: 1px solid var(--soft-border);
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.66);
    }

    .star-btn {
      width: auto;
      height: auto;
      border: none;
      background: transparent;
      color: #9aa3ad;
      font-size: 1.65rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      box-shadow: none;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .star-btn:hover { transform: translateY(-1px) scale(1.08); color: var(--gold); }
    .star-btn.saved { color: var(--gold); }

    .question-text {
      margin-bottom: 42px;
      color: var(--text-main);
      user-select: text;
      max-width: 980px;
    }

    .passage-text {
      font-family: var(--sat-serif);
      font-size: 1.12rem;
      line-height: 1.62;
      font-weight: 400;
      color: var(--text-main);
      white-space: normal;
    }

    .question-stem {
      margin-top: 26px;
      text-align: left;
      font-family: var(--sat-serif);
      font-size: 1.12rem;
      line-height: 1.62;
      font-weight: 600;
      color: var(--text-main);
      white-space: normal;
      overflow: visible;
      padding: 0;
    }

    .sat-target-word,
    .choice-text strong,
    .passage-text strong,
    .question-stem strong {
      font-weight: 900;
    }

    .sat-blank {
      font: inherit;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .sat-highlight {
      font: inherit;
      background: rgba(255, 221, 87, 0.78);
      color: inherit;
      border-radius: 5px;
      padding: 1px 3px;
      cursor: pointer;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 46px;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 22px 28px;
      background: rgba(255,255,255,0.74);
      border: 2px solid var(--soft-border);
      border-radius: 19px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
      user-select: text;
    }

    .option:hover:not(.disabled) {
      background: #fff;
      border-color: rgba(37, 150, 190, 0.36);
      transform: translateY(-1px);
    }

    .option.selected {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .option.correct {
      border-color: var(--success);
      background: var(--success-light);
    }

    .option.wrong {
      border-color: var(--error);
      background: var(--error-light);
    }

    .option-letter {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--option-gray);
      color: var(--text-main);
      border: 1px solid #d8dde2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 25px;
      font-size: 0.78rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      user-select: none;
    }

    .option.correct .option-letter {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .option.wrong .option-letter {
      background: var(--error);
      border-color: var(--error);
      color: #fff;
    }

    .option-text {
      font-family: var(--sat-serif);
      font-size: 1.05rem;
      line-height: 1.42;
      color: var(--text-main);
      user-select: text;
    }

    .disabled { pointer-events: none; }
    .disabled .option-text { pointer-events: auto; }

    .actions {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 34px;
    }

    .btn {
      min-width: 220px;
      border: none;
      border-radius: 16px;
      padding: 18px 36px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-secondary {
      display: none;
      background: #fff;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary.show { display: block; }

    .explanation-box {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transform: translateY(-12px) scale(0.99);
      transition: grid-template-rows 0.38s ease, opacity 0.28s ease, transform 0.38s ease;
    }

    .explanation-box.show {
      grid-template-rows: 1fr;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .explanation-inner { overflow: hidden; }

    .choice-explanations {
      background: rgba(255,255,255,0.62);
      border: 1px solid var(--soft-border);
      border-radius: 22px;
      padding: 14px;
    }

    .choice-explanation {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 16px;
      align-items: start;
      padding: 16px 12px;
      border-radius: 16px;
      color: var(--text-main);
    }

    .choice-explanation + .choice-explanation { border-top: 1px solid var(--soft-border); }

    .choice-letter-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 900;
      background: var(--option-gray);
      color: var(--text-main);
      border: 1px solid #d8dde2;
    }

    .choice-explanation.correct-picked .choice-letter-badge,
    .choice-explanation.correct-choice .choice-letter-badge {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .choice-explanation.user-wrong-choice .choice-letter-badge {
      background: var(--error);
      border-color: var(--error);
      color: #fff;
    }

    .choice-text {
      font-size: 0.92rem;
      line-height: 1.56;
      color: var(--text-main);
      user-select: text;
    }

    .picked-message {
      margin-top: 18px;
      text-align: center;
      font-size: 0.94rem;
      line-height: 1.35;
      font-weight: 900;
    }

    .picked-message.correct { color: var(--success); }
    .picked-message.wrong { color: var(--error); }

    .empty-screen,
    .end-screen {
      text-align: center;
      max-width: 980px;
      justify-self: center;
      padding-top: 64px;
      width: 100%;
    }

    .screen-title {
      font-size: 1.86rem;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 18px;
    }

    .screen-actions {
      display: flex;
      flex-direction: column;
      gap: 13px;
      align-items: center;
      margin-top: 22px;
    }

    .screen-actions .btn { min-width: 320px; }

    @media (max-width: 760px) {
      html { font-size: 118%; }
      body { padding-top: 102px; }
      .menu-btn { width: 56px; height: 56px; top: 22px; left: 22px; }
      .option { padding: 20px 20px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; min-width: 0; }
      .screen-actions .btn { min-width: 0; width: 100%; }
      .screen-title.nowrap { white-space: normal; }
      .screen-category-grid { grid-template-columns: 1fr; }
    }
  


    /* v3 behavior/style fixes */
    .question-meta {
      font-size: 0.64rem;
      gap: 7px;
      opacity: 0.86;
    }

    .meta-pill {
      padding: 5px 9px;
      border-radius: 999px;
      font-weight: 850;
    }

    .question-stem {
      font-family: var(--sat-serif);
      font-size: 1.12rem;
      line-height: 1.62;
      font-weight: 400;
      text-align: left;
      margin-top: 24px;
      color: var(--text-main);
    }

    .question-stem strong { font-weight: 900; }



/* Navigation and selection: only the surrounding layout differs from the reference app. */
html {font-size:145%}
body {display:block; padding:0; background:#f3f4f5; min-height:100vh; overflow-x:hidden}
button {font:inherit}
button:focus-visible {outline:3px solid #2596be; outline-offset:3px}
[hidden] {display:none !important}
.select-screen {max-width:1190px; margin:0 auto; padding:54px 26px 100px; animation:softAppear .28s ease both}
.select-screen h1 {text-align:center; font-size:clamp(1.8rem,3.3vw,2.35rem); line-height:1.2; font-weight:900; margin:0 0 28px; letter-spacing:-.045em}
.selection-grid {display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px}
.test-card {min-width:0; position:relative; padding:23px; border:1px solid #e6ebf3; border-radius:17px; background:#fff; transition:box-shadow .2s,border-color .2s,transform .2s; box-shadow:0 3px 16px rgba(31,61,112,.025)}
.test-card:hover {border-color:#d3def0;box-shadow:0 10px 25px rgba(31,61,112,.065);transform:translateY(-1px)}
.test-card-head {display:flex;align-items:center;gap:12px;margin-bottom:13px;padding-right:30px;min-height:49px}
.test-number {display:grid;place-items:center;flex:0 0 49px;width:49px;height:49px;border-radius:13px;background:#edf3ff;color:#3260cc;font-size:1.12rem;font-weight:820;font-variant-numeric:tabular-nums}
.test-name {margin:0;font-size:1.02rem;font-weight:800;line-height:1.25;letter-spacing:-.02em}
.test-count {color:#8290a0;font-size:.64rem;margin-top:4px}
.test-link {display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:43px;padding:10px 12px;border:1px solid #e1e9f6;border-radius:10px;background:#f7f9fe;color:#325fc4;font-size:.76rem;font-weight:720;text-align:left;cursor:pointer;transition:background .18s,border-color .18s,color .18s}
.test-link:hover {background:#eaf1ff;border-color:#c4d5f4;color:#224da7}
.test-difficulty {position:absolute;right:17px;top:17px;color:#cd504c;line-height:1}
.test-difficulty svg {width:21px;height:21px}
@keyframes softAppear {from{opacity:.6}to{opacity:1}}
.practice-shell {display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:22px;width:min(1580px,100%);min-height:100vh;margin:0 auto;padding:0 24px 32px 35px}
.question-column {min-width:0;display:flex;flex-direction:column;align-items:center}

</style></head><body><div id="app"></div><script id="embedded-bank" type="application/json">{"format":"sat-original-normalized-v1","total_questions":472,"banks":[{"category":"Craft and Structure","subcategory":"Cross-Text Connections","questions":[{"id":"CTC-001","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would the author of Text 2 most likely respond to the historian's account in Text 1?","choices":{"A":"By arguing that firms pass through the proposed stages at different rates, since the records show that equipment and workers were not replaced simultaneously.","B":"By questioning whether the firm had genuinely reached the automated stage, since retaining skilled workers is inconsistent with the organizational sequence the historian describes.","C":"By arguing that access to automation need not produce an irreversible organizational transition, since production arrangements may vary with the kinds of orders a firm receives.","D":"By proposing that integrated hand production generally produces greater efficiencies than automation, since customized orders continued to justify its use at the firm."},"answer":"C","explanation":"The case involves the same firm returning to an earlier arrangement despite retaining its machines and increasing annual output.","choice_explanations":{"A":"Text 1 already allows different rates. Text 2 describes repeated reversals, not delayed advancement, and does not discuss replacement timing.","B":"Neither text defines automation as eliminating skilled workers. The machinery was installed and used.","C":"The case involves the same firm returning to an earlier arrangement despite retaining its machines and increasing annual output.","D":"Suitability for customized orders is not evidence that hand production is generally more efficient."},"text_1":"A history of manufacturing describes a sequence from workers completing whole objects, through specialized assembly lines, to automated production. The historian allows that firms enter each stage at different dates but maintains that rising output makes the transitions effectively irreversible: once a firm can automate, returning to integrated hand production would surrender the efficiencies responsible for its growth.","text_2":"Records from the fictional Kelmar Works show that, after installing automated equipment, the firm repeatedly alternated between automated summer production and hand-built winter production. The same workers and managers oversaw both systems, and the machinery remained available throughout. Automation accommodated large standardized orders, whereas integrated hand production accommodated smaller customized orders. Annual output increased even as the firm continued to alternate between the two arrangements.","strategy":"Distinguish a later transition from a genuine reversal. An exception to irreversibility does not establish the superiority of the earlier arrangement."},{"id":"CTC-002","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Ren most likely respond to Vale's reason for calling the musician an operator?","choices":{"A":"The quality of the resulting music establishes the musician's status as a composer, even if the initial rules have little effect on the performance's structure.","B":"The musician's control should be judged by how many individual notes can be predicted from the rules rather than by how many decisions occur during performance.","C":"The software's inability to determine relationships among motifs requires the musician to make more decisions during the performance than Vale acknowledges.","D":"The number of decisions made during a performance understates the artistic importance of earlier choices that organize the musical relationships produced by the software."},"answer":"D","explanation":"Ren accepts that few notes are individually selected but shows how a few initial rules control significant musical structure.","choice_explanations":{"A":"Ren emphasizes the rules' structural effects, not quality alone. Vale already admires the result.","B":"Neither predictability nor counting predictable notes is Ren's criterion. Structural influence is.","C":"The software can generate these relationships under initial rules; Ren does not claim continuous intervention.","D":"Ren accepts that few notes are individually selected but shows how a few initial rules control significant musical structure."},"text_1":"Critic Vale describes a generative composition in which software produces almost all the notes after a musician supplies a short set of rules. Vale admires the resulting music but calls the musician an operator rather than a composer: the musician makes too few decisions during the performance to exercise meaningful artistic control over it.","text_2":"Composer Ren agrees that the software supplies most individual notes. Yet altering one of the musician's initial rules changes which motifs return, how sections contrast, and whether the piece reaches a recognizable ending. Several very different musical structures can therefore arise from equally brief sets of rules. Ren locates the musician's contribution in determining these structural relationships, not in choosing each note as it sounds.","strategy":"A small contribution in quantity can be essential in function. Also separate a classification dispute from a judgment of quality."},{"id":"CTC-003","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would the educator most likely respond to the director's proposed removal of lectures?","choices":{"A":"By recommending retention of conventional lectures because their familiarity can attract more visitors and offset the cost of adding participatory sessions.","B":"By suggesting that the festival retain lectures until participatory sessions can convey the same material without relying on explanations from an expert.","C":"By accepting the concern about passive audiences while arguing that restructuring a familiar format can address that concern without eliminating the format itself.","D":"By disputing the claim that lectures leave visitors passive, since the pilot shows that audiences learn effectively whenever an expert presents accurate information."},"answer":"C","explanation":"Both identify passivity as a problem; the educator proposes modification rather than removal.","choice_explanations":{"A":"Attendance and costs were not compared, and the educator recommends adapting lectures rather than retaining them unchanged.","B":"The pilot retains the expert and the explanations; it does not treat their removal as an eventual goal.","C":"Both identify passivity as a problem; the educator proposes modification rather than removal.","D":"The educator accepts the problem in uninterrupted lectures. The improvement concerns participation, not accuracy alone."},"text_1":"An outreach director argues that conventional expert lectures leave audiences passive and should be removed from a science festival. Even accurate presentations, the director says, merely deliver information instead of allowing visitors to shape their own investigation. Keeping familiar formats would therefore preserve the very obstacle the festival hopes to overcome.","text_2":"An educator accepts that uninterrupted lectures can make visitors passive but distinguishes the lecture format from that particular use of it. In a pilot session, the same expert covered the same subject while allowing the audience to select questions and test predictions between short explanations. Visitors demonstrated better understanding than attendees at an uninterrupted session. Attendance and operating costs were not compared. The educator favors adapting the existing format around these opportunities for participation.","strategy":"Write the shared problem and each proposed remedy separately. Do not mistake agreement on the problem for agreement on the remedy."},{"id":"CTC-004","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Iven most likely evaluate the date proposed by the model's designers?","choices":{"A":"As too late given direct records of earlier through-navigation, although those records do not establish exactly when such navigation began.","B":"As dependent on improving estimates of cargo size, because sufficiently accurate models would eliminate the need to consult records of actual journeys.","C":"As approximately correct, because the records establish earlier boat use but leave unresolved whether boats could travel beyond the canal's shallowest section.","D":"As demonstrably too late, because the first surviving journey record establishes year 590 as the beginning of regular through-navigation."},"answer":"A","explanation":"Iven uses documented journeys to challenge the model-derived beginning date without converting the earliest surviving record into the exact origin.","choice_explanations":{"A":"Iven uses documented journeys to challenge the model-derived beginning date without converting the earliest surviving record into the exact origin.","B":"Iven favors records of actual navigation; neither cargo-size estimates nor eliminating documentary evidence is proposed.","C":"The records specifically describe passage through that section to the other terminus.","D":"The record establishes occurrence by that time, not the first journey or regular frequency."},"text_1":"A reconstruction of an old canal assumes that boats could traverse its shallowest section only after a major rebuilding in year 640. The model calculates that the earlier channel was too shallow, and its designers use this result to date the beginning of through-navigation. They acknowledge that the canal existed earlier but distinguish its existence from its use as a continuous shipping route.","text_2":"Historian Iven argues that securely dated journey records provide stronger evidence of actual navigation than a reconstruction of possible depths. Records from year 590 describe cargo boats passing the named shallow section and continuing to the canal's other terminus. The records do not establish how frequently such journeys occurred or when the first one took place. Nevertheless, Iven considers them evidence that through-navigation preceded the rebuilding.","strategy":"An event documented by an earlier date need not have begun exactly then. Preserve the difference between occurrence, frequency, and onset."},{"id":"CTC-005","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Sato most likely respond to the analysts' prediction?","choices":{"A":"By suggesting that the analysts extend their observation period, since partitions delay but do not alter the process by which one algorithm will dominate.","B":"By arguing that the persistence of several algorithms shows that their speeds are approximately equal, despite differences in the jobs they process.","C":"By questioning whether shared machines imply extensive competition for usable capacity, while allowing speed to matter within each partition.","D":"By concluding that the reserved partitions prevent performance differences from influencing competition anywhere in the computing service."},"answer":"C","explanation":"The prediction rests on extensive shared competition; partitioning weakens that premise while leaving within-partition speed relevant.","choice_explanations":{"A":"Sato challenges the competition premise, not merely the time needed for the prediction to occur.","B":"No equivalence in speed is reported. Distinct allocations, not identical performance, explain reduced competition.","C":"The prediction rests on extensive shared competition; partitioning weakens that premise while leaving within-partition speed relevant.","D":"Text 2 explicitly retains the relevance of speed within a partition; the option broadens the conclusion to the entire service."},"text_1":"Analysts predict that one scheduling algorithm will eventually dominate a computing service. All algorithms run on the same physical cluster, they reason, so each must repeatedly compete with the others for the same processing capacity. Small differences in speed should therefore accumulate until the fastest algorithm displaces its rivals. The continued use of several algorithms is treated as evidence that the service has not yet reached a stable state.","text_2":"Engineer Sato finds that the cluster is divided into reserved processing partitions assigned to different kinds of jobs. An algorithm cannot ordinarily consume capacity reserved for another job category, even when both run on the same physical machines. Within a partition, speed still affects performance. Sato argues, however, that cross-category competition for capacity is far less extensive than the analysts assume.","strategy":"Identify the premise connecting the observation to the prediction. A challenge to that premise need not reject every factor in the original account."},{"id":"CTC-006","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, what would Deren most likely recommend before accepting the evaluator's conclusion?","choices":{"A":"Repeat the ten-day comparison with more trainees, since the main uncertainty is whether the early difference is too small to represent a genuine effect.","B":"Assess whether the initial difference persists when durable learning is tested later, rather than treating early practice accuracy as sufficient evidence of long-term effectiveness.","C":"Compare the routines only while coaching is available, since later tests introduce conditions that cannot inform the evaluation of a training program.","D":"Replace fixed routines with changing ones, since the six-week result establishes that early practice errors reliably predict stronger long-term retention."},"answer":"B","explanation":"The evaluator's goal is durable skill, but the evidence is limited to early practice; Deren calls for an appropriate later assessment.","choice_explanations":{"A":"Text 2 does not question the early difference's size or reliability. It questions what that difference establishes about durable learning.","B":"The evaluator's goal is durable skill, but the evidence is limited to early practice; Deren calls for an appropriate later assessment.","C":"Deren uses later uncoached performance as relevant evidence, not as an invalid complication.","D":"Deren explicitly cautions against generalization; early errors are not established as a reliable positive predictor."},"text_1":"A training evaluator compared fixed practice routines with routines that change unpredictably from trial to trial. During the first ten days, trainees using changing routines made more errors. The evaluator consequently recommended fixed routines for a program intended to develop durable skills, arguing that the added difficulty of changing routines impedes learning rather than strengthening it.","text_2":"Researcher Deren argues that errors during initial practice need not indicate what learners retain. In another skill program, changing routines initially reduced accuracy but produced better performance six weeks later, when participants had to apply the skill without coaching. Deren cautions that this result need not generalize to every task. Its importance, Deren says, is that an early disadvantage can coexist with a later advantage.","strategy":"A recommendation to investigate a later effect is not a prediction that the later effect will certainly reverse."},{"id":"CTC-007","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Erol most likely characterize the monitoring team's interpretation?","choices":{"A":"As adequately supported by two independent indicators, provided that neither compound occurs naturally in the district's environment.","B":"As insufficiently discriminating among sources, since the reported combination is not unique to van coatings even though the measurements themselves may be accurate.","C":"As unreliable because accurately measuring both compounds requires knowing in advance which nearby product released them into the dust.","D":"As less plausible than the road-marking explanation, since the presence of both compounds establishes that the dust contains the mixture used nearby."},"answer":"B","explanation":"Erol disputes the source attribution, not detection accuracy; the same pair occurs in another product.","choice_explanations":{"A":"The proposed condition does not resolve the stated alternative: the same pair occurs in another manufactured product.","B":"Erol disputes the source attribution, not detection accuracy; the same pair occurs in another product.","C":"Text 2 accepts the measurements. Source identification is not stated to be a prerequisite for measurement.","D":"The evidence is compatible with multiple sources; it does not establish that road markings are the actual or more likely source."},"text_1":"A monitoring team found elevated levels of two compounds in dust collected near a shopping district. Both compounds occur in a coating used on delivery vans. The team therefore interpreted their joint presence as evidence that van traffic had increased, arguing that detecting two indicators together is more informative than detecting either one alone.","text_2":"Chemist Erol accepts the measurements but notes that both compounds also occur together in a road-marking mixture used nearby. Their relative proportions differ between the two products, but the monitoring team reported only whether each compound was present. Erol therefore regards the joint detection as compatible with more than one source, while not ruling out an increase in van traffic.","strategy":"Two indicators are not automatically independent or uniquely diagnostic. Ask whether an alternative source produces the same combination."},{"id":"CTC-008","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would the second researcher most likely respond to the designer's attribution of the trial results?","choices":{"A":"The attribution should be retained because participants who understood the directions probably had more prior experience with the symbols than the original users.","B":"The attribution concerns wording rather than presentation, whereas the second trial demonstrates that familiar symbols are effective only when placed beside relevant objects.","C":"The attribution is mistaken because confusion about unfamiliar symbols disappears once instructions are placed next to the objects they concern.","D":"The attribution overlooks how presentation can affect comprehension of unchanged symbols, although the symbols' unfamiliarity may still contribute to misunderstanding."},"answer":"D","explanation":"The second trial changes placement, not notation, and improves performance while leaving some symbol-related confusion.","choice_explanations":{"A":"The second participants are novices, and no difference in prior experience is reported.","B":"The symbols in the second trial remain unfamiliar and unchanged; familiar symbols are not tested.","C":"Some symbols still caused confusion. The result supports a contextual contribution, not elimination of the notation's influence.","D":"The second trial changes placement, not notation, and improves performance while leaving some symbol-related confusion."},"text_1":"A designer argues that a notation system's unfamiliar symbols make it unsuitable for public instructions. In a trial, first-time users frequently misunderstood directions written in the notation. Because the symbols departed from familiar conventions, the designer attributes the poor results to the notation itself and recommends replacing it with conventional wording.","text_2":"A second researcher used the identical symbols and directions but displayed each instruction next to the object on which it was to be performed. Novices understood the directions substantially more often than when they saw the same material on a separate reference sheet. Some symbols still caused confusion. The researcher argues that unfamiliar notation and the conditions of presentation jointly influence understanding.","strategy":"Not solely intrinsic is weaker than not intrinsic at all. Preserve both the contextual effect and the remaining limitation."},{"id":"CTC-009","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would the second archivist most likely respond to the proposed dating method?","choices":{"A":"Its sequence should be applied separately to different observatories, since institutions often adopt automatic instruments at substantially different dates.","B":"Its sequence should be reversed for experimental work, since narrative logs became available only after automatic instruments were introduced.","C":"Its chronological sequence may confuse a log's purpose with its age, since later observers can deliberately reuse supposedly earlier formats.","D":"Its sequence is valid for narrative logs but not for numerical records, since narratives preserve a clearer account of why an observation was made."},"answer":"C","explanation":"The same staff used both formats after automation; purpose therefore complicates a simple chronological inference.","choice_explanations":{"A":"The first account already allows lagging adoption, and the counterexample occurs within one observatory.","B":"Returning to narratives does not mean narratives first became available after automation or establish a universal reversed sequence.","C":"The same staff used both formats after automation; purpose therefore complicates a simple chronological inference.","D":"The evidence challenges the chronological placement of narrative logs themselves. Their relative clarity is not discussed."},"text_1":"An archivist proposes dating anonymous observation logs by their format. Early observers, the archivist argues, wrote continuous narratives; they later adopted standardized tables; finally, automatic instruments generated numerical records. Although isolated observers might have lagged behind, the archivist treats these formats as successive stages, so a narrative log should ordinarily predate a numerical one from the same observatory.","text_2":"A second archivist examined a fully dated collection from one observatory. After automatic instruments were installed, staff continued to produce numerical records for routine measurements but returned to narrative logs whenever testing an unfamiliar instrument. Both formats were used by the same staff over several decades. The second archivist concludes that a log's immediate purpose must be considered before its format is used to infer its age.","strategy":"When an author has already allowed delayed adoption, a case of delay is not a rebuttal. Look for evidence that changes the sequence itself."},{"id":"CTC-010","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Jori most likely respond to Halen's argument?","choices":{"A":"The exhibits should qualify because careful craftsmanship compensates for the limited role of evidence, a limitation that both writers acknowledge.","B":"The exhibits' educational value warrants treating their fictional conversations as historical evidence, even when documentary notes play only a supporting role.","C":"The exhibits' interpretations depend primarily on visitors' choices, so the amount of documentary material matters less than how freely visitors can revise the recorded events.","D":"Documentary material can organize an exhibit's interpretation despite occupying little space, so its relative quantity does not establish a peripheral role."},"answer":"D","explanation":"Jori argues for the evidence's organizing function without converting fictional dialogue into evidence or relying on educational merit alone.","choice_explanations":{"A":"Halen already grants craftsmanship; Jori disputes that the evidentiary role is limited in importance.","B":"Jori expressly distinguishes fictional conversations from evidence and emphasizes the documentary material's central function.","C":"Jori emphasizes constraints imposed by evidence, not unrestricted visitor choice.","D":"Jori argues for the evidence's organizing function without converting fictional dialogue into evidence or relying on educational merit alone."},"text_1":"Reviewer Halen excludes interactive historical exhibits from historical scholarship. Their reconstructions contain invented conversations and visitor choices, while documentary notes occupy only a small portion of the experience. Halen grants that such exhibits can be carefully made and educational but argues that evidence is too peripheral to their storytelling for them to count as scholarly interpretations.","text_2":"Historian Jori notes that, in several exhibits, the documentary material constrains which events visitors can alter and which outcomes the reconstruction permits. Removing the notes and their associated constraints would change the historical argument, not merely reduce the amount of background information. Jori does not claim that fictional conversations are themselves evidence; the point is that brief documentary components can organize the interpretation presented by the whole exhibit.","strategy":"Ask what a component does, not just how much space it occupies. Do not answer a classification argument with an unrelated compliment."},{"id":"CTC-011","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Bera most likely respond to the report's conclusion?","choices":{"A":"By arguing that preserving the station should take priority over accessibility, since the trial confirmed that its original arrangement has architectural value.","B":"By disputing whether the station currently creates access barriers, since the trial demonstrates that visitors can already use all its rooms without permanent changes.","C":"By accepting replacement as the more effective remedy but recommending redesign as an interim measure because it would require a smaller investment.","D":"By disputing the necessity of replacement, since redesign could address the acknowledged barriers while preserving important parts of the station."},"answer":"D","explanation":"Bera accepts the current access problem but disputes the exclusion of a preservation-compatible remedy.","choice_explanations":{"A":"Neither priority nor confirmation of architectural value is the trial's result. The proposal addresses access while preserving parts.","B":"The trial used temporary openings; Bera explicitly agrees that the current arrangement creates barriers.","C":"Bera does not concede replacement is superior or claim a lower cost, and does not present redesign as interim.","D":"Bera accepts the current access problem but disputes the exclusion of a preservation-compatible remedy."},"text_1":"A planning report recommends demolishing an old station because its narrow entrances and separate waiting rooms make the building difficult to use. The authors acknowledge its architectural interest but argue that preserving the station would also preserve barriers to access. A replacement building, they conclude, is necessary if the site is to become a usable community facility.","text_2":"Architect Bera agrees that the station's present arrangement creates barriers. A redesign, however, would open two internal passageways and add an accessible entrance while retaining the exterior and the main hall. A small-scale access trial using temporary openings allowed visitors to reach rooms previously cut off from the hall. Bera considers this evidence that preservation and improved access need not be incompatible, without claiming that redesign would cost less than replacement.","strategy":"Challenge necessity with a supported alternative. Do not import an attractive but unstated financial justification."},{"id":"CTC-012","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Olan most likely evaluate the developers' stated threshold?","choices":{"A":"It conflicts with observed cracking under the conditions it is meant to describe, without the observations necessarily settling the separate question of catastrophic failure.","B":"It should be retained until the simulation reproduces the measurements, since the measurements alone cannot constrain the point at which cracking becomes physically possible.","C":"It should be replaced by a universal limit of one hundred eighty cycles, since agreement between two measurement methods establishes the alloy's behavior under any loading regime.","D":"It remains plausible because the detected cracks did not cause catastrophic failure, the outcome the developers use to define the onset of cracking."},"answer":"A","explanation":"The evidence directly contradicts a crack-free interval under matched conditions but does not answer a different failure endpoint.","choice_explanations":{"A":"The evidence directly contradicts a crack-free interval under matched conditions but does not answer a different failure endpoint.","B":"Olan says observations should constrain claims; the option makes simulation agreement a prerequisite.","C":"The result concerns specified conditions, not every regime, and does not establish a universal exact threshold.","D":"Text 1 explicitly distinguishes first cracking from catastrophic failure; the option merges them."},"text_1":"A simulation of a new alloy predicts that the material will remain free of internal cracks through five hundred loading cycles. Its developers describe this threshold as the earliest point at which cracking can begin under the specified conditions. They distinguish the first crack from catastrophic failure, which the simulation predicts would occur much later.","text_2":"Under the same specified conditions, researcher Olan detected small internal cracks after one hundred eighty cycles using both acoustic monitoring and three-dimensional imaging. Repeated trials yielded similar results. Olan argues that physical observations should constrain claims about when cracks first appear, although the observations do not establish when the alloy would fail catastrophically or whether every possible loading regime would yield the same result.","strategy":"Check whether two authors are discussing the same endpoint. A valid rebuttal of an onset claim need not determine a later consequence."},{"id":"CTC-013","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would the study's author most likely respond to the analyst?","choices":{"A":"The prediction would be supported if the analyst compared ratings only among services in the directory, rather than including services that operate elsewhere.","B":"The prediction understates the influence of qualifications, since services with more certifications necessarily receive higher overall ratings from clients.","C":"The prediction cannot apply because ratings play no role in client decisions once language pair, certification, and delivery window have been specified.","D":"The prediction assumes more overlap in eligible work than the platform permits, although ratings may still affect choices within the smaller sets of actual competitors."},"answer":"D","explanation":"Listing together does not entail competing for comparable eligible jobs; within-set effects remain possible.","choice_explanations":{"A":"The analyst already concerns listed services; changing an external comparison does not address filtered eligibility.","B":"Qualifications determine eligibility; no necessary relationship with overall ratings is established.","C":"Text 2 explicitly allows ratings to influence choices within the eligible set.","D":"Listing together does not entail competing for comparable eligible jobs; within-set effects remain possible."},"text_1":"An analyst predicts that a single translation service will eventually absorb a platform's smaller services. Because all appear in the same directory, the analyst assumes that clients repeatedly choose among them for comparable work. The service with the best overall rating should therefore attract an increasing proportion of orders until the others become unviable.","text_2":"A platform study found that search results are filtered by language pair, professional certification, and delivery window before clients see ratings. Most of the listed services rarely appear in the same eligible set. Ratings can influence choices among services that do appear together, but a high overall rating does not make a service eligible for work outside its qualifications. The study's author argues that the directory exaggerates how extensively the services compete.","strategy":"A shared directory is not a shared comparison group. Preserve the boundary between within-group and across-group effects."},{"id":"CTC-014","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, which recommendation would Neri most likely make to the evaluator?","choices":{"A":"Repeat the fortnight-long assessment using only first-time users, since returning users' adaptation prevents their performance from informing an interface evaluation.","B":"Abandon the interface unless it reduces the number of specialized materials in the catalog, since the study locates the initial slowdown in excessive collection size.","C":"Retain the interface because the second library's results show that any initial disadvantage will disappear once the redesign has been available for two months.","D":"Track search times beyond the introductory period and distinguish returning from first-time users before deciding whether the initial slowdown represents a lasting loss of efficiency."},"answer":"D","explanation":"Text 2 supplies both a time-window distinction and a user-group distinction; neither guarantees the same library will improve.","choice_explanations":{"A":"Neri calls for distinguishing groups, not discarding one group's experience.","B":"The study does not discuss collection size or reducing materials; it concerns adaptation and different users.","C":"First-time users remained slower, and the other library's results do not guarantee a universal two-month improvement.","D":"Text 2 supplies both a time-window distinction and a user-group distinction; neither guarantees the same library will improve."},"text_1":"A library introduced a new catalog interface designed to make locating specialized materials easier. During the first fortnight, users took longer to complete searches than they had with the old interface. An evaluator recommended abandoning the new system, interpreting the increased search time as evidence that the redesign had made retrieval less efficient.","text_2":"In a separate library, researcher Neri observed an initially similar slowdown after a catalog redesign. By the end of the second month, returning users located materials faster than before, while first-time users still needed extra time. Neri argues that evaluating an interface requires distinguishing adaptation from persistent difficulty and specifying whose experience is being assessed.","strategy":"Align the conclusion with both the time window and population. A longer study is not permission to ignore a subgroup that still struggles."},{"id":"CTC-015","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Meren most likely evaluate the editor's attribution?","choices":{"A":"The combination remains a secure signature because a copyist can change spelling without influencing a letter's closing phrase.","B":"The combination is not necessarily an individual author's signature, since a shared copying practice could produce it even in letters composed by different people.","C":"The combination identifies the clerk as the author of both anonymous letters, since the working notes show that the clerk used the two features together.","D":"The combination is less useful than either feature considered alone, since separate features are less likely to be altered by a professional copyist."},"answer":"B","explanation":"Meren identifies a mechanism that can produce the same joint features without common authorship but does not establish the anonymous letters' actual history.","choice_explanations":{"A":"The notes prescribe both features. The option ignores the paired convention that motivates the challenge.","B":"Meren identifies a mechanism that can produce the same joint features without common authorship but does not establish the anonymous letters' actual history.","C":"Copying conventions do not prove original authorship, and the anonymous letters are not known to have passed through this clerk.","D":"No relative reliability of isolated features is established; both are prescribed in the copying practice."},"text_1":"Two anonymous letters share an unusual spelling and a rare closing phrase. An editor attributes both letters to the same author, reasoning that the combination is more distinctive than either feature separately. The editor acknowledges that either feature might circulate independently but treats their joint appearance as an individual signature.","text_2":"Scholar Meren found the same combination in copies of letters whose original authors are independently known to differ. The copies were produced by one clerk, whose working notes prescribe both the spelling and the closing phrase. Meren therefore argues that the shared features may reflect a copyist's conventions rather than an original author's habits. The anonymous letters' copying history has not yet been established.","strategy":"Distinctive is not the same as unique. An intermediary can generate a pattern mistakenly attributed to an original source."},{"id":"CTC-016","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would the researcher most likely respond to the critic's explanation of readers' confusion?","choices":{"A":"Preparation can reduce a specific confusion while the form remains demanding, so the form alone does not explain that confusion.","B":"The trial undermines the explanation by showing that the narrators' shifts are not demanding for readers who receive accurate information about the story.","C":"The explanation applies to confusion about remembered events but not imagined scenes, since the note only changes readers' judgments about the former.","D":"The trial demonstrates that readers find the novel accessible only after its narrative structure has been simplified through explanatory prose."},"answer":"A","explanation":"The form is unchanged, the note changes preparation, and a specific error declines without all difficulty disappearing.","choice_explanations":{"A":"The form is unchanged, the note changes preparation, and a specific error declines without all difficulty disappearing.","B":"The prepared readers still found the shifts demanding; the improvement concerns a specific confusion.","C":"The study concerns distinguishing the two, not a one-sided effect limited to remembered events.","D":"The note does not change the novel's narrative structure, and the result does not establish an exclusive condition for accessibility."},"text_1":"A critic argues that a novel's abrupt changes of narrator make it inaccessible to general readers. Readers in a trial frequently confused imagined scenes with events the narrators claimed had actually occurred. The critic treats this confusion as a consequence of the narrative form itself, rather than of any information supplied outside the story.","text_2":"A researcher gave new readers the identical novel but preceded it with a short note explaining that each narrator reports possibilities as well as remembered events. These readers still found the shifts demanding but were less likely to mistake an imagined scene for a remembered one. The researcher considers the note a change in interpretive preparation, not a simplification of the novel's prose or narrative structure.","strategy":"Keep the measured improvement narrow. Fewer errors of one kind does not imply that a work has become easy in every respect."},{"id":"CTC-017","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Tovan most likely respond to the model's account of fluent speakers?","choices":{"A":"By proposing a different sequence in which memorized expressions are acquired after novel sentences because time-pressured tasks require more advanced language skills.","B":"By accepting the model for interviews but recommending that language programs favor memorization because it produces more effective communication overall.","C":"By disputing the assumption that greater competence necessarily replaces the earlier strategy, since skilled speakers may alternate strategies as communicative demands change.","D":"By questioning whether the speakers were genuinely fluent, since their reliance on stored expressions during the task revealed deficiencies not apparent in interviews."},"answer":"C","explanation":"The same fluent speakers switch strategies with task demands; this is not a slower completion of a one-way progression.","choice_explanations":{"A":"Use by advanced speakers does not establish that memorized expressions are acquired later or require greater overall skill.","B":"Tovan reports task-dependent usefulness, not a general ranking or a recommendation for language programs.","C":"The same fluent speakers switch strategies with task demands; this is not a slower completion of a one-way progression.","D":"Tovan explicitly interprets the switch as an efficient response rather than deficient generative ability."},"text_1":"A language-learning model describes progress from memorized expressions to independently generated sentences. Its author argues that fluent speakers eventually leave memorized expressions behind: once they can generate suitable sentences, returning to stored phrases would indicate incomplete command of the language. Variation between speakers is attributed to differences in how quickly they complete this progression.","text_2":"Linguist Tovan observed highly fluent speakers who generated novel sentences in interviews but used stored expressions when coordinating a fast-paced cooperative task. The same speakers switched back to novel sentences when the task ended. Tovan interprets the stored expressions as an efficient response to time pressure, not evidence that the speakers had lost the ability to generate language.","strategy":"Being able to use one strategy does not entail using it in every context. Avoid converting flexible selection into a universal ranking."},{"id":"CTC-018","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, which response would Senn most likely make to the reviewer's argument?","choices":{"A":"The cues prescribe more individual movements than the reviewer recognizes, since reversing relationships forces every dancer to adopt a different movement vocabulary.","B":"The director deserves sole responsibility for the work's organization because the dancers' choices become artistically insignificant when constrained by a framework.","C":"The dancers' skill shows that the work is choreographed, since skilled performers are less likely to make spontaneous decisions that disrupt an organized sequence.","D":"Sparse cues can organize relationships without prescribing most movements, so their brevity does not establish a negligible choreographic role."},"answer":"D","explanation":"Senn distinguishes specifying movements from organizing the relationships among them and accepts the dancers' substantial freedom.","choice_explanations":{"A":"Text 2 says the relationships can change while individual movements remain; a new vocabulary is not required.","B":"An important organizing role does not make the dancers' contributions insignificant or establish sole responsibility.","C":"Skill is not Senn's criterion, and Senn accepts that dancers choose movements rather than denying spontaneity.","D":"Senn distinguishes specifying movements from organizing the relationships among them and accepts the dancers' substantial freedom."},"text_1":"A dance reviewer argues that a work directed through only three brief cues should be classified as improvisation rather than choreography. Most movements are selected by the dancers, not prescribed in advance. The reviewer praises their skill but considers the director's sparse instructions too limited to account for the work's organization.","text_2":"Choreographer Senn agrees that the dancers choose their movements. However, each cue determines which dancers may respond to which others and when those relationships reverse. Changing a cue reorganizes the entire sequence of encounters even when the dancers retain their individual movements. Senn therefore regards the cues as an organizing framework whose contribution cannot be measured by the number of movements they specify.","strategy":"Essential interaction does not mean exclusive authorship. Watch for an option that corrects one undervaluation by erasing everyone else's role."},{"id":"CTC-019","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Leren most likely respond to the consultant's recommendation?","choices":{"A":"By proposing contextual explanations as an alternative to necessary removal, without claiming proven superiority over the untested everyday-only labels.","B":"By rejecting everyday-only labels as a less effective alternative, because the study demonstrates that retaining specialist terms improves understanding more than removing them.","C":"By arguing that specialist vocabulary is less difficult than the consultant assumes, because the original unexplained labels enabled most visitors to interpret the objects accurately.","D":"By accepting that technical terms should ultimately be removed but treating paired explanations as a temporary way to prepare visitors for everyday descriptions."},"answer":"A","explanation":"The comparison supports an improvement over unexplained terms, not superiority over an untested everyday-only condition.","choice_explanations":{"A":"The comparison supports an improvement over unexplained terms, not superiority over an untested everyday-only condition.","B":"The everyday-only alternative was not tested. The option substitutes an unobserved comparison.","C":"The evidence concerns improvement with explanations; no majority success on the original labels is reported.","D":"Leren proposes retaining terms as learning resources, not using explanations as a step toward their removal."},"text_1":"A museum consultant recommends removing specialist terms from object labels. Visitors often fail to understand the terms, and the consultant argues that retaining them necessarily preserves a barrier between the collection and its public. Everyday descriptions, the consultant concludes, should replace technical terminology throughout the exhibition.","text_2":"Curator Leren accepts that unexplained specialist terms can exclude visitors. In a revised display, each term remained but was paired with a short everyday explanation and an example visible on the object. Visitors unfamiliar with the terminology answered interpretation questions more accurately than visitors who saw the unexplained labels. Leren argues that terms can become resources for learning when introduced appropriately, although the study did not compare the revised labels with labels using everyday language alone.","strategy":"A successful modification can challenge a claim of necessary removal without proving the modification is better than every alternative."},{"id":"CTC-020","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Arven most likely respond to the model's authors?","choices":{"A":"Their model should be rejected across its entire speed range, since an inaccurate lower limit demonstrates that its agreement at higher speeds is accidental.","B":"Higher-speed success does not override contradictory observations at lower speeds, even without identifying the particular assumption that requires revision.","C":"Their lower-speed prediction is contradicted because a stationary support frame necessarily increases ripple formation compared with a frame that is allowed to move.","D":"Their interpretation of the observations remains preferable until the experiment determines exactly which assumption could account for lower-speed ripples."},"answer":"B","explanation":"The observations separate panel motion from support motion under matched conditions and directly challenge the lower-speed claim.","choice_explanations":{"A":"Text 2 preserves the higher-speed success and calls for revising one prediction, not rejecting every result.","B":"The observations separate panel motion from support motion under matched conditions and directly challenge the lower-speed claim.","C":"No comparison between mounting types or claim that frame stillness increases ripples is given.","D":"Failure to identify the faulty assumption does not nullify the observed contradiction; Arven explicitly separates the two."},"text_1":"A model of a flexible panel predicts that visible ripples cannot appear below a wind speed of twenty units under a specified mounting arrangement. Its authors infer that reported ripples at lower speeds must have been misidentified movements of the support frame. The model reproduces the panel's behavior accurately at substantially higher speeds.","text_2":"Experimentalist Arven recorded the panel and support frame separately under the specified arrangement. At fifteen units, the frame remained still while ripples traveled across the panel; repeated recordings showed the same pattern. Arven argues that the model's success at higher speeds does not eliminate the need to revise its lower-speed prediction, although the recordings do not indicate which modeling assumption requires revision.","strategy":"An observed contradiction need not come with a complete alternative theory. Conversely, one failed prediction does not automatically invalidate all others."},{"id":"CTC-021","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Venn most likely respond to the report's prediction?","choices":{"A":"Its prediction fails because the loudness of a call has no effect on detectability once species divide their activity into different intervals.","B":"Its proposed advantage may operate during overlapping calls, but the timing of calls limits how broadly that advantage can explain communication across the meadow.","C":"Its prediction overlooks that quieter species produce more attractive calls, which compensates for the loudest species' greater detectability.","D":"Its prediction should be preserved because similar frequencies guarantee interference even when calls are made during separate intervals."},"answer":"B","explanation":"Venn retains masking during overlap but disputes its frequency and thus its explanatory reach.","choice_explanations":{"A":"Intervals can overlap, and Text 2 explicitly allows louder calls to mask quieter ones there.","B":"Venn retains masking during overlap but disputes its frequency and thus its explanatory reach.","C":"The attractiveness of quieter calls is not discussed; timing, not compensation through quality, is the explanation.","D":"This denies the timing distinction central to Text 2."},"text_1":"A field report predicts that one species of singing insect should dominate communication in a meadow. The species use similar sound frequencies, so the report assumes that calls from different species repeatedly mask one another. The loudest species should consequently be easiest to detect, while quieter species should have increasing difficulty attracting partners.","text_2":"Researcher Venn found that most species call during distinct intervals and pause during neighboring species' peak intervals. Where intervals overlap, louder calls can mask quieter ones; across an entire evening, however, similar frequencies do not imply frequent interference. Venn therefore argues that the report overestimates how often the condition needed for its predicted advantage is actually present.","strategy":"Do not confuse questioning how often a mechanism operates with denying that it can operate."},{"id":"CTC-022","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Rell most likely respond to the committee's conclusion?","choices":{"A":"The conclusion is invalid because erosion caused by planting disturbance should be excluded when the method's effectiveness is calculated.","B":"The initial losses are relevant but insufficient for the stated long-term judgment, which requires determining whether later performance offsets or perpetuates those losses at this site.","C":"The conclusion can be evaluated by comparing the first season at several additional sites, since geographic variation is the missing dimension in the committee's assessment.","D":"The conclusion should be reversed because established roots have been shown to offset planting losses at any riverbank where erosion is initially greater."},"answer":"B","explanation":"Rell accepts initial costs and calls for cumulative long-term evaluation without guaranteeing an offset.","choice_explanations":{"A":"Rell explicitly agrees that disturbance costs should be counted.","B":"Rell accepts initial costs and calls for cumulative long-term evaluation without guaranteeing an offset.","C":"Additional first-season sites do not provide the later performance needed for a long-term conclusion.","D":"The other project is not a guarantee for every site; Rell expressly withholds that generalization."},"text_1":"A restoration committee judged a newly planted riverbank after its first rainy season. The planted plots lost more soil than nearby unplanted plots, and the committee concluded that planting was an ineffective long-term erosion strategy at the site. The planting work had disturbed the soil, but the committee regarded that initial cost as part of the method's overall effect.","text_2":"Ecologist Rell agrees that disturbance costs should be counted. In another restoration project, however, the initial soil loss was followed by reduced erosion once roots developed, and cumulative soil loss after four years was lower in planted plots. Rell does not assume that the same reversal will occur at every site. Instead, Rell argues that a long-term judgment must include both establishment costs and subsequent performance.","strategy":"Delayed benefits do not erase early costs. The appropriate comparison may be cumulative, not just the final measurement or the initial one."},{"id":"CTC-023","category":"Craft and Structure","skill":"Cross-Text Connections","level":"very_hard","question":"Based on the texts, how would Isen most likely characterize the historian's reasoning?","choices":{"A":"It would be secure if the broad survey included more regions, since a larger sample could determine whether the two traditions had historical contact.","B":"It confuses common origin with later contact, since the instruments' similar limitations establish that the songs developed separately before musicians met.","C":"It understates the evidence for contact because an easily played pattern is more likely to have spread between regions than one requiring difficult fingering.","D":"It treats global rarity as evidence of local improbability without adequately considering constraints that could make the same pattern arise independently in both traditions."},"answer":"D","explanation":"The relevant alternatives depend on the instruments' restricted choices, not just the pattern's frequency worldwide.","choice_explanations":{"A":"A larger global count alone would not address local constraints or uniquely establish contact.","B":"The constraints allow independent development but do not establish a history of separation followed by contact.","C":"That diffusion claim is not made by Isen, who emphasizes the plausibility of independent recurrence.","D":"The relevant alternatives depend on the instruments' restricted choices, not just the pattern's frequency worldwide."},"text_1":"A music historian identifies the same five-note pattern in songs from two regions and proposes a common historical origin. The pattern is uncommon in a broad survey of world music, and the historian treats its recurrence in both regions as evidence of contact rather than independent invention.","text_2":"Researcher Isen notes that the two regions' instruments permit only a small set of pitch sequences, and the five-note pattern is one of the few sequences that can be played with a simple fingering. Its rarity in the broad survey may therefore overstate how surprising independent recurrence would be in these particular traditions. Isen does not deny that contact occurred, but argues that the pattern alone is insufficient to establish it
