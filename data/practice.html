his is a difference in location, not the similarity requested.","B":"Correct: The two installations both convey local oral histories through recordings, despite their different venues and interactions.","C":"Incorrect: This highlights different interfaces rather than their shared inclusion of community voices.","D":"Incorrect: This provides a true detail about one artwork but does not link the two."},"passage":"While researching a topic, a student has taken the following notes:\n• Sculptor Mina Vale created Tidal Alphabet in 2017 for an outdoor walkway.\n• Tidal Alphabet plays recorded stories from fishers as visitors pass its sensors.\n• Vale created Window Archive in 2022 for an indoor exhibition.\n• Window Archive plays recorded stories from former neighborhood shopkeepers when visitors open small drawers.\n• The two works use different forms of visitor interaction.","notes":["Sculptor Mina Vale created Tidal Alphabet in 2017 for an outdoor walkway.","Tidal Alphabet plays recorded stories from fishers as visitors pass its sensors.","Vale created Window Archive in 2022 for an indoor exhibition.","Window Archive plays recorded stories from former neighborhood shopkeepers when visitors open small drawers.","The two works use different forms of visitor interaction."],"goal":"emphasize a similarity between the two artworks","strategy":"Select the relevant shared feature; do not substitute differences, dates, or a fact about just one item."},{"id":"RS-002","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to highlight a shared adaptation of reedgrass and the marsh orchid. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Reedgrass and the marsh orchid both retain internal air spaces that help them endure temporary flooding.","B":"Although they share a habitat, the marsh orchid disperses its seeds on the wind.","C":"Reedgrass has air-filled stem tissue and releases seeds into floodwater.","D":"Reedgrass disperses its seeds by water, whereas the marsh orchid relies on wind."},"answer":"A","explanation":"Both species have structures that trap air when flooded, though those structures occur in different organs.","choice_explanations":{"A":"Correct: Both species have structures that trap air when flooded, though those structures occur in different organs.","B":"Incorrect: This links their habitat with only one plant’s reproduction, not a shared adaptation.","C":"Incorrect: This discusses only the reedgrass and omits the orchid.","D":"Incorrect: This contrasts their different dispersal strategies, not a shared flood adaptation."},"passage":"While researching a topic, a student has taken the following notes:\n• At the edge of Lake Vey, reedgrass survives short floods by trapping air in specialized stem tissue.\n• The lake’s marsh orchid survives short floods by trapping air in pockets within its roots.\n• Reedgrass releases its seeds into the water.\n• The marsh orchid disperses seeds on the wind.\n• The two plants occupy overlapping parts of the wetland.","notes":["At the edge of Lake Vey, reedgrass survives short floods by trapping air in specialized stem tissue.","The lake’s marsh orchid survives short floods by trapping air in pockets within its roots.","Reedgrass releases its seeds into the water.","The marsh orchid disperses seeds on the wind.","The two plants occupy overlapping parts of the wetland."],"goal":"highlight a shared adaptation of reedgrass and the marsh orchid","strategy":"Select the relevant shared feature; do not substitute differences, dates, or a fact about just one item."},{"id":"RS-003","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to stress a similarity in how thermal cameras and acoustic recorders are used. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Thermal cameras and acoustic recorders both allow researchers to monitor animals at night without shining lights on them.","B":"Thermal cameras at Orien Observatory detect body heat, whereas its acoustic recorders capture calls that help document animal activity in darkness using a different signal.","C":"Acoustic recorders help identify calls from animals that researchers cannot see.","D":"Unlike acoustic recorders, thermal cameras can reveal animals’ heat patterns."},"answer":"A","explanation":"The shared benefit is nocturnal observation without light, despite the instruments sensing different physical signals.","choice_explanations":{"A":"Correct: The shared benefit is nocturnal observation without light, despite the instruments sensing different physical signals.","B":"Incorrect: This identifies a mechanism difference rather than shared use.","C":"Incorrect: This mentions only acoustic recorders and cannot establish a comparison.","D":"Incorrect: This concerns a capability of thermal cameras alone."},"passage":"While researching a topic, a student has taken the following notes:\n• At the fictional Orien Observatory, thermal cameras track animals using heat patterns.\n• Acoustic recorders at the same site track animals using their calls.\n• Both instruments can be operated at night without illuminating the animals.\n• Thermal cameras cannot reliably distinguish calls from different species.\n• Acoustic recorders cannot show the animals’ body temperatures.","notes":["At the fictional Orien Observatory, thermal cameras track animals using heat patterns.","Acoustic recorders at the same site track animals using their calls.","Both instruments can be operated at night without illuminating the animals.","Thermal cameras cannot reliably distinguish calls from different species.","Acoustic recorders cannot show the animals’ body temperatures."],"goal":"stress a similarity in how thermal cameras and acoustic recorders are used","strategy":"Select the relevant shared feature; do not substitute differences, dates, or a fact about just one item."},{"id":"RS-004","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to emphasize a similarity in the services offered by the Book Cart and Mobile Museum. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The Northbank Book Cart lent novels in districts without permanent library branches.","B":"The Northbank Book Cart began visiting outer districts in 1968, while the Mobile Museum started serving those same areas in 1984 and received funding from the city.","C":"Both the Northbank Book Cart and the Mobile Museum brought cultural resources to neighborhoods distant from central institutions.","D":"The Book Cart depended on private donations, unlike the city-funded Mobile Museum."},"answer":"C","explanation":"Each program improved access to cultural resources outside the city center, though the resources and funding differed.","choice_explanations":{"A":"Incorrect: This describes only one program.","B":"Incorrect: This provides chronology, not the common service.","C":"Correct: Each program improved access to cultural resources outside the city center, though the resources and funding differed.","D":"Incorrect: This emphasizes a funding difference rather than the service similarity."},"passage":"While researching a topic, a student has taken the following notes:\n• The Northbank Book Cart began visiting outer districts of fictional Dell City in 1968.\n• The Book Cart lent novels in neighborhoods without permanent branches.\n• The Mobile Museum began serving those same outer districts in 1984.\n• The Mobile Museum brought rotating exhibits to neighborhoods far from the city center.\n• The Book Cart was funded by donations; the Mobile Museum was supported by the city.","notes":["The Northbank Book Cart began visiting outer districts of fictional Dell City in 1968.","The Book Cart lent novels in neighborhoods without permanent branches.","The Mobile Museum began serving those same outer districts in 1984.","The Mobile Museum brought rotating exhibits to neighborhoods far from the city center.","The Book Cart was funded by donations; the Mobile Museum was supported by the city."],"goal":"emphasize a similarity in the services offered by the Book Cart and Mobile Museum","strategy":"Select the relevant shared feature; do not substitute differences, dates, or a fact about just one item."},{"id":"RS-005","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to contrast how coppercap and ashcup mushrooms obtain nutrients. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Coppercap and ashcup mushrooms can grow in the same forest and both disperse spores through the air.","B":"Coppercap mushrooms receive sugars from living roots, whereas ashcup mushrooms feed by breaking down dead wood.","C":"Although both fungi are found in forests, ashcup mushrooms often grow on fallen branches.","D":"Coppercap mushrooms commonly grow beneath pines, where they exchange minerals with roots."},"answer":"B","explanation":"The goal calls for opposite nutrient-acquisition pathways: exchange with living roots versus decomposition of dead material.","choice_explanations":{"A":"Incorrect: This emphasizes similarities unrelated to nutrient acquisition.","B":"Correct: The goal calls for opposite nutrient-acquisition pathways: exchange with living roots versus decomposition of dead material.","C":"Incorrect: This notes different locations but does not fully explain either nutrient pathway.","D":"Incorrect: This gives only coppercap’s mechanism and does not contrast ashcup."},"passage":"While researching a topic, a student has taken the following notes:\n• The fictional coppercap mushroom obtains sugars from living tree roots in exchange for minerals.\n• The fictional ashcup mushroom obtains nutrients by decomposing fallen branches.\n• Coppercap mushrooms often grow around the bases of living pines.\n• Ashcup mushrooms often grow in the same forests as coppercaps.\n• Both species release spores into the air.","notes":["The fictional coppercap mushroom obtains sugars from living tree roots in exchange for minerals.","The fictional ashcup mushroom obtains nutrients by decomposing fallen branches.","Coppercap mushrooms often grow around the bases of living pines.","Ashcup mushrooms often grow in the same forests as coppercaps.","Both species release spores into the air."],"goal":"contrast how coppercap and ashcup mushrooms obtain nutrients","strategy":"State the requested distinction accurately and symmetrically rather than summarizing unrelated similarities."},{"id":"RS-006","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to emphasize a change in Meln’s structural materials. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Although Harbor Hall had stone walls, the architect also included tall windows.","B":"Meln’s early halls relied on load-bearing stone walls, whereas her later halls used lightweight timber frames joined with steel.","C":"Tall windows appeared in Meln’s early and later civic buildings.","D":"Harbor Hall, completed in 1999, preceded Meln’s Lantern Hall, completed in 2018, and both buildings reflect the architect’s long-standing interest in tall windows."},"answer":"B","explanation":"The correct option directly contrasts the earlier and later structural systems, not just when the buildings were made.","choice_explanations":{"A":"Incorrect: This gives information about one early building, not a change across periods.","B":"Correct: The correct option directly contrasts the earlier and later structural systems, not just when the buildings were made.","C":"Incorrect: This is a similarity in window design, not the requested structural change.","D":"Incorrect: This lists dates without contrasting structural materials."},"passage":"While researching a topic, a student has taken the following notes:\n• Architect Soraya Meln designed her early civic halls with load-bearing stone walls.\n• Meln’s later halls used lightweight timber frames supported by steel joints.\n• Her early Harbor Hall was completed in 1999.\n• Her later Lantern Hall was completed in 2018.\n• Meln used tall windows in buildings from both periods.","notes":["Architect Soraya Meln designed her early civic halls with load-bearing stone walls.","Meln’s later halls used lightweight timber frames supported by steel joints.","Her early Harbor Hall was completed in 1999.","Her later Lantern Hall was completed in 2018.","Meln used tall windows in buildings from both periods."],"goal":"emphasize a change in Meln’s structural materials","strategy":"State the requested distinction accurately and symmetrically rather than summarizing unrelated similarities."},{"id":"RS-007","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to contrast what Sensor A and Sensor B measure. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Sensor A tracks humidity, while Sensor B tracks temperature.","B":"Both Sensor A and Sensor B send readings to a shared display.","C":"Sensor A uses an absorbing film, whereas Sensor B uses a bending metal strip.","D":"The Vela group designed Sensor A, and the Lumen group designed Sensor B."},"answer":"A","explanation":"Although their construction also differs, the requested contrast is in the measured variable: humidity versus temperature.","choice_explanations":{"A":"Correct: Although their construction also differs, the requested contrast is in the measured variable: humidity versus temperature.","B":"Incorrect: This is a similarity in output, not a contrast in measurements.","C":"Incorrect: This contrasts components but not the quantities the sensors measure.","D":"Incorrect: This contrasts designers rather than measured variables."},"passage":"While researching a topic, a student has taken the following notes:\n• Sensor A measures changes in humidity using a water-absorbing film.\n• Sensor B measures changes in temperature using a metal strip that bends as it warms.\n• Both sensors send readings to the same display.\n• Sensor A was developed by the Vela engineering group.\n• Sensor B was developed by the Lumen group.","notes":["Sensor A measures changes in humidity using a water-absorbing film.","Sensor B measures changes in temperature using a metal strip that bends as it warms.","Both sensors send readings to the same display.","Sensor A was developed by the Vela engineering group.","Sensor B was developed by the Lumen group."],"goal":"contrast what Sensor A and Sensor B measure","strategy":"State the requested distinction accurately and symmetrically rather than summarizing unrelated similarities."},{"id":"RS-008","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to highlight the distinction between the two poems’ meters. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The meter of Oar Song includes four stressed beats in each line.","B":"Salt Ledger follows a fixed syllable count, whereas Oar Song follows a fixed pattern of stressed beats.","C":"Iva Rane wrote Salt Ledger, and Tomas Kett wrote Oar Song.","D":"Both Salt Ledger and Oar Song concern journeys by sea, though the poems were written by different authors, Iva Rane and Tomas Kett, whose works explore similar settings."},"answer":"B","explanation":"The two poems are regulated by different metrical constraints: syllable number in one and stress beats in the other.","choice_explanations":{"A":"Incorrect: This reports only the pattern of Oar Song without contrasting Salt Ledger.","B":"Correct: The two poems are regulated by different metrical constraints: syllable number in one and stress beats in the other.","C":"Incorrect: This contrasts authors, not metrical organization.","D":"Incorrect: This is shared subject matter, not a contrast in meter."},"passage":"While researching a topic, a student has taken the following notes:\n• In the fictional poem Salt Ledger, each line contains ten syllables, though stresses vary.\n• In the fictional poem Oar Song, each line has four prominent stressed beats, though syllable counts vary.\n• Both poems concern journeys by sea.\n• Salt Ledger was written by Iva Rane.\n• Oar Song was written by Tomas Kett.","notes":["In the fictional poem Salt Ledger, each line contains ten syllables, though stresses vary.","In the fictional poem Oar Song, each line has four prominent stressed beats, though syllable counts vary.","Both poems concern journeys by sea.","Salt Ledger was written by Iva Rane.","Oar Song was written by Tomas Kett."],"goal":"highlight the distinction between the two poems’ meters","strategy":"State the requested distinction accurately and symmetrically rather than summarizing unrelated similarities."},{"id":"RS-009","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to compare the rivers’ average flow rates in June. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"In June, River Dalen carried 280 cubic meters of water per second in the North Gate monitoring network.","B":"River Mera’s average flow fell by 80 cubic meters per second between June and July.","C":"The rivers were monitored with identical instruments during the same study.","D":"In June, River Mera’s average flow was 40 cubic meters per second greater than River Dalen’s."},"answer":"D","explanation":"June’s comparable rates are 320 and 280 cubic meters per second; their difference is 40.","choice_explanations":{"A":"Incorrect: This states a single river’s June rate and does not make the comparison.","B":"Incorrect: This compares months for only one river, not the two rivers in June.","C":"Incorrect: This mentions a methodological similarity without comparing the requested quantities.","D":"Correct: June’s comparable rates are 320 and 280 cubic meters per second; their difference is 40."},"passage":"While researching a topic, a student has taken the following notes:\n• At the fictional North Gate monitoring network, River Mera carried an average of 320 cubic meters of water per second in June.\n• The same monitoring network measured River Dalen carrying an average of 280 cubic meters per second in June.\n• Measurements were made using identical instruments.\n• In July, River Mera’s average flow fell to 240 cubic meters per second.\n• The study compared seasonal flow between the rivers.","notes":["At the fictional North Gate monitoring network, River Mera carried an average of 320 cubic meters of water per second in June.","The same monitoring network measured River Dalen carrying an average of 280 cubic meters per second in June.","Measurements were made using identical instruments.","In July, River Mera’s average flow fell to 240 cubic meters per second.","The study compared seasonal flow between the rivers."],"goal":"compare the rivers’ average flow rates in June","strategy":"Compare exactly the requested quantities, periods, units, or proportions."},{"id":"RS-010","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to compare the amount of time the researchers spent observing at the two sites. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The team recorded 28 calls at the Basin Site and 23 at the Ridge Site.","B":"The team observed the Basin Site for 2.5 hours longer than the Ridge Site.","C":"Observations began after sunset at both the Ridge and Basin sites.","D":"The Basin Site had five more recorded calls than the Ridge Site."},"answer":"B","explanation":"Comparing 9.5 hours with 7 hours yields a 2.5-hour longer observation at the Basin Site.","choice_explanations":{"A":"Incorrect: This compares call counts, not time spent observing.","B":"Correct: Comparing 9.5 hours with 7 hours yields a 2.5-hour longer observation at the Basin Site.","C":"Incorrect: This explains when observation began, not how long it lasted.","D":"Incorrect: This gives a valid numerical difference for calls, not hours."},"passage":"While researching a topic, a student has taken the following notes:\n• A team observed owl activity for 7 hours at the Ridge Site.\n• The same team observed owl activity for 9.5 hours at the Basin Site.\n• At both sites, recording began shortly after sunset.\n• The Ridge Site recording included 23 calls.\n• The Basin Site recording included 28 calls.","notes":["A team observed owl activity for 7 hours at the Ridge Site.","The same team observed owl activity for 9.5 hours at the Basin Site.","At both sites, recording began shortly after sunset.","The Ridge Site recording included 23 calls.","The Basin Site recording included 28 calls."],"goal":"compare the amount of time the researchers spent observing at the two sites","strategy":"Compare exactly the requested quantities, periods, units, or proportions."},{"id":"RS-011","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to compare the numbers of annual growth rings in the two samples. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The cedar sample contained 212 annual rings and came from a 17-meter-tall tree.","B":"The alder was two meters taller than the cedar despite having fewer growth rings.","C":"The cores were collected during the same sampling season.","D":"The cedar sample contained 65 more annual growth rings than the alder sample."},"answer":"D","explanation":"The recorded ring counts are 212 for cedar and 147 for alder, a difference of 65 rings.","choice_explanations":{"A":"Incorrect: This describes a single tree and gives no comparison of ring numbers.","B":"Incorrect: This introduces tree height rather than directly comparing the requested ring counts.","C":"Incorrect: This states sampling timing without comparing ring counts.","D":"Correct: The recorded ring counts are 212 for cedar and 147 for alder, a difference of 65 rings."},"passage":"While researching a topic, a student has taken the following notes:\n• A core taken from an old alder near fictional Lake Orin contained 147 annual growth rings.\n• A core taken from a nearby cedar contained 212 annual growth rings.\n• The two cores were collected in the same year.\n• The alder was 19 meters tall.\n• The cedar was 17 meters tall.","notes":["A core taken from an old alder near fictional Lake Orin contained 147 annual growth rings.","A core taken from a nearby cedar contained 212 annual growth rings.","The two cores were collected in the same year.","The alder was 19 meters tall.","The cedar was 17 meters tall."],"goal":"compare the numbers of annual growth rings in the two samples","strategy":"Compare exactly the requested quantities, periods, units, or proportions."},{"id":"RS-012","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to compare the proportions of respondents using the filter in the two districts. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The survey included 80 people in District H and 50 people in District J.","B":"District H had nine more filter users in the survey than District J.","C":"More people used the filter in District H than in District J, according to the survey counts.","D":"In both districts, 30% of surveyed respondents used the filter, despite the different sample sizes."},"answer":"D","explanation":"24/80 and 15/50 both equal 0.30; counts differ, but the requested proportions do not.","choice_explanations":{"A":"Incorrect: This compares sample sizes, not the shares of respondents using the filter.","B":"Incorrect: This compares the raw numbers of users rather than the proportions.","C":"Incorrect: This reports a count difference that may mislead if interpreted as a rate difference.","D":"Correct: 24/80 and 15/50 both equal 0.30; counts differ, but the requested proportions do not."},"passage":"While researching a topic, a student has taken the following notes:\n• In a fictional survey, 24 of 80 respondents in District H used the new water filter.\n• In District J, 15 of 50 respondents used the same filter.\n• District H had more survey respondents than District J.\n• The survey was administered during the same week in both districts.\n• The researchers reported both counts and proportions of respondents.","notes":["In a fictional survey, 24 of 80 respondents in District H used the new water filter.","In District J, 15 of 50 respondents used the same filter.","District H had more survey respondents than District J.","The survey was administered during the same week in both districts.","The researchers reported both counts and proportions of respondents."],"goal":"compare the proportions of respondents using the filter in the two districts","strategy":"Compare exactly the requested quantities, periods, units, or proportions."},{"id":"RS-013","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to introduce the Thread Atrium to readers unfamiliar with the artwork. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Leyla Rho’s work has appeared at the Havil Museum, where visitors can see art in several media.","B":"Created by Leyla Rho in 2019, the Thread Atrium is a walk-through artwork of plant-dyed fabric strips that shift the shadows around visitors.","C":"Hundreds of strips dyed with plant pigments cast moving shadows as people pass through them.","D":"The Havil Museum was the first venue to exhibit Leyla Rho’s Thread Atrium, and the museum subsequently acquired some of the artist’s drawings for its collection."},"answer":"B","explanation":"The option identifies the work, its creator, and its defining experience, giving an unfamiliar reader essential context.","choice_explanations":{"A":"Incorrect: This supplies vague background about the artist and does not explain the particular work.","B":"Correct: The option identifies the work, its creator, and its defining experience, giving an unfamiliar reader essential context.","C":"Incorrect: This describes the experience but never names or identifies the artwork the sentence is supposed to introduce.","D":"Incorrect: This emphasizes the museum’s later acquisition, leaving the unfamiliar artwork undefined."},"passage":"While researching a topic, a student has taken the following notes:\n• The Thread Atrium is a public artwork created by fictional artist Leyla Rho in 2019.\n• The work consists of hundreds of suspended strips of fabric dyed with plant pigments.\n• Visitors move through the strips, changing the pattern of shadows on the floor.\n• Rho first exhibited the artwork at the Havil Museum.\n• The museum later acquired several of Rho’s drawings.","notes":["The Thread Atrium is a public artwork created by fictional artist Leyla Rho in 2019.","The work consists of hundreds of suspended strips of fabric dyed with plant pigments.","Visitors move through the strips, changing the pattern of shadows on the floor.","Rho first exhibited the artwork at the Havil Museum.","The museum later acquired several of Rho’s drawings."],"goal":"introduce the Thread Atrium to readers unfamiliar with the artwork","strategy":"Provide just enough definition or context for an unfamiliar reader to understand the subject and central point."},{"id":"RS-014","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to present Olan’s research to readers who have not heard of the Cloud Spine. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Neri Olan collected and compared water samples from a ridge and from nearby coastal groundwater.","B":"On Cava, a limestone ridge called the Cloud Spine gathers water from passing clouds; Neri Olan studied that water and found it less salty than nearby coastal groundwater.","C":"The Cloud Spine intercepts low clouds, and droplets collect on the ridge’s exposed rocks.","D":"Geographer Neri Olan measured water from the Cloud Spine, compared its salinity with groundwater from the nearby coast, and published the results of the project in 2021."},"answer":"B","explanation":"The correct choice defines the unfamiliar location, explains the mechanism, and identifies the research finding.","choice_explanations":{"A":"Incorrect: This summarizes the method but gives no context for the unfamiliar name or the finding.","B":"Correct: The correct choice defines the unfamiliar location, explains the mechanism, and identifies the research finding.","C":"Incorrect: This explains the ridge’s physical process but fails to introduce Olan’s research.","D":"Incorrect: This uses the place name without defining what or where the Cloud Spine is."},"passage":"While researching a topic, a student has taken the following notes:\n• The Cloud Spine is a limestone ridge on the fictional island of Cava.\n• Because the ridge intercepts low clouds, droplets collect on its exposed rocks.\n• Geographer Neri Olan measured this cloud-derived water along the ridge.\n• The samples contained less salt than nearby coastal groundwater.\n• Olan published the results in 2021.","notes":["The Cloud Spine is a limestone ridge on the fictional island of Cava.","Because the ridge intercepts low clouds, droplets collect on its exposed rocks.","Geographer Neri Olan measured this cloud-derived water along the ridge.","The samples contained less salt than nearby coastal groundwater.","Olan published the results in 2021."],"goal":"present Olan’s research to readers who have not heard of the Cloud Spine","strategy":"Provide just enough definition or context for an unfamiliar reader to understand the subject and central point."},{"id":"RS-015","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to introduce Tesh’s Echo Mapping technique to an audience unfamiliar with it. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Mara Tesh’s Echo Mapping technique records small timing differences as speakers repeat phrases, allowing researchers to examine rhythmic patterns such as pauses before suffixes.","B":"Mara Tesh studied the Kevi language in a room equipped with microphones.","C":"In the Kevi language, certain suffixes are preceded by regular pauses, a pattern discovered in Mara Tesh’s work with speakers who repeated phrases into a microphone.","D":"Researchers recorded short phrases in Kevi and also photographed the room where the recordings were made."},"answer":"A","explanation":"The correct option names and explains how the unfamiliar technique works while providing an example of its use.","choice_explanations":{"A":"Correct: The correct option names and explains how the unfamiliar technique works while providing an example of its use.","B":"Incorrect: This names the researcher and equipment but does not explain the distinctive procedure.","C":"Incorrect: This presents a result without defining the technique that produced it.","D":"Incorrect: This collects procedural details without naming or explaining Echo Mapping."},"passage":"While researching a topic, a student has taken the following notes:\n• Echo Mapping is a method developed by fictional linguist Mara Tesh.\n• A speaker repeats short phrases while a microphone records tiny timing differences between syllables.\n• Tesh used the method to study the rhythm of the fictional Kevi language.\n• The recordings revealed consistent pauses before certain suffixes.\n• The research team also photographed the recording room.","notes":["Echo Mapping is a method developed by fictional linguist Mara Tesh.","A speaker repeats short phrases while a microphone records tiny timing differences between syllables.","Tesh used the method to study the rhythm of the fictional Kevi language.","The recordings revealed consistent pauses before certain suffixes.","The research team also photographed the recording room."],"goal":"introduce Tesh’s Echo Mapping technique to an audience unfamiliar with it","strategy":"Provide just enough definition or context for an unfamiliar reader to understand the subject and central point."},{"id":"RS-016","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to introduce Night Windows to an audience that has never encountered the work. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Night Windows, a 2024 interactive artwork by Dara Moss, projects poems onto storefront windows and lets passersby choose which poem appears.","B":"The poems displayed in Night Windows can be changed using buttons near storefronts.","C":"Passersby can press buttons on Court Lane to change the poems projected nearby.","D":"Dara Moss first installed the Night Windows project along Court Lane in 2024, while also pursuing another art form through sculptures made from recycled glass."},"answer":"A","explanation":"An introduction should identify Night Windows as a specific artwork and describe its interactive form.","choice_explanations":{"A":"Correct: An introduction should identify Night Windows as a specific artwork and describe its interactive form.","B":"Incorrect: This assumes the reader already knows what Night Windows is and supplies only a functional detail.","C":"Incorrect: This offers a local interaction detail without naming or characterizing the work.","D":"Incorrect: This never names the work and shifts toward the artist’s other medium."},"passage":"While researching a topic, a student has taken the following notes:\n• Night Windows is a 2024 interactive artwork by fictional artist Dara Moss.\n• It projects short poems onto darkened storefront windows.\n• A passerby can change which poem appears by pressing a nearby button.\n• The project was first installed along Court Lane.\n• Moss has also made sculptures from recycled glass.","notes":["Night Windows is a 2024 interactive artwork by fictional artist Dara Moss.","It projects short poems onto darkened storefront windows.","A passerby can change which poem appears by pressing a nearby button.","The project was first installed along Court Lane.","Moss has also made sculptures from recycled glass."],"goal":"introduce Night Windows to an audience that has never encountered the work","strategy":"Provide just enough definition or context for an unfamiliar reader to understand the subject and central point."},{"id":"RS-017","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to introduce Paper Currents to readers who already know the anthology North Passage. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"North Passage, edited by Tal Eris in 2020, brings together essays about trade and migration across an inland sea, including an essay by the author Jo Lin.","B":"Shipping receipts could be reused as letters by merchants traveling across inland seas.","C":"North Passage explores commerce and migration, while some of its essays have individual authors.","D":"In the familiar anthology North Passage, Jo Lin’s essay Paper Currents explores the reuse of shipping receipts as personal correspondence."},"answer":"D","explanation":"The audience needs to learn which essay is being discussed and its particular focus, not the anthology’s basic premise.","choice_explanations":{"A":"Incorrect: This unnecessarily reintroduces the already-familiar anthology and ignores the essay.","B":"Incorrect: This mentions the topic but does not identify the essay or connect it to the anthology.","C":"Incorrect: This provides generic information about the anthology and does not introduce Paper Currents.","D":"Correct: The audience needs to learn which essay is being discussed and its particular focus, not the anthology’s basic premise."},"passage":"While researching a topic, a student has taken the following notes:\n• The anthology North Passage contains essays on trade and migration across a fictional inland sea.\n• An essay in North Passage titled Paper Currents was written by Jo Lin.\n• Paper Currents examines how merchants reused shipping receipts as personal letters.\n• The anthology was edited by Tal Eris in 2020.","notes":["The anthology North Passage contains essays on trade and migration across a fictional inland sea.","An essay in North Passage titled Paper Currents was written by Jo Lin.","Paper Currents examines how merchants reused shipping receipts as personal letters.","The anthology was edited by Tal Eris in 2020."],"goal":"introduce Paper Currents to readers who already know the anthology North Passage","strategy":"Assume specified background knowledge; foreground what is new or distinctive to the audience."},{"id":"RS-018","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to introduce Taro’s modification to readers already familiar with ordinary sand filtration. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Sand filters remove suspended particles by allowing water to pass through layers of sand.","B":"Imani Taro’s team added a replaceable charcoal layer above a standard sand bed, cutting maintenance time by 30% in trials.","C":"Both filters in Taro’s study used the same inlet pipes and were tested by the team.","D":"In ordinary sand filtration, particles remain in the filter while cleaner water moves through."},"answer":"B","explanation":"The familiar audience benefits from the new design feature and its measured advantage, rather than a definition of sand filtration.","choice_explanations":{"A":"Incorrect: This explains a technique that the intended audience already knows.","B":"Correct: The familiar audience benefits from the new design feature and its measured advantage, rather than a definition of sand filtration.","C":"Incorrect: This describes a shared design detail but omits the actual modification and result.","D":"Incorrect: This offers another redundant explanation of standard filtration."},"passage":"While researching a topic, a student has taken the following notes:\n• A fictional engineering team led by Imani Taro added a removable charcoal layer above the sand.\n• The charcoal layer could be replaced without emptying the sand bed.\n• In trials, the modified filter required 30% less maintenance time than the standard model.\n• Both filter versions used identical inlet pipes.","notes":["A fictional engineering team led by Imani Taro added a removable charcoal layer above the sand.","The charcoal layer could be replaced without emptying the sand bed.","In trials, the modified filter required 30% less maintenance time than the standard model.","Both filter versions used identical inlet pipes."],"goal":"introduce Taro’s modification to readers already familiar with ordinary sand filtration","strategy":"Assume specified background knowledge; foreground what is new or distinctive to the audience."},{"id":"RS-019","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to introduce Vale’s Afterimage Garden exhibition to an audience familiar with the artist. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Mineral pigments can be used to create large paintings, as Noah Vale has demonstrated.","B":"In Afterimage Garden, Noah Vale’s 2024 exhibition of twelve mineral-pigment canvases, the artist examines how artificial light alters the appearance of color.","C":"From childhood drawing lessons with an older sibling to his later use of mineral pigments on large canvases, Noah Vale’s artistic practice has involved varied approaches to drawing and painting.","D":"Vale began learning to draw as a child and went on to create exhibitions of paintings."},"answer":"B","explanation":"The intended audience already knows Vale, so the sentence should foreground the named exhibition, its contents, and its subject.","choice_explanations":{"A":"Incorrect: This discusses materials in general but fails to introduce the particular exhibition.","B":"Correct: The intended audience already knows Vale, so the sentence should foreground the named exhibition, its contents, and its subject.","C":"Incorrect: This repeats biographical background and never introduces the exhibition.","D":"Incorrect: This summarizes biography instead of presenting the new work."},"passage":"While researching a topic, a student has taken the following notes:\n• Vale opened the exhibition Afterimage Garden in 2024.\n• Afterimage Garden includes twelve large canvases made with mineral pigments.\n• The exhibition explores how artificial light changes perceived colors.\n• Vale studied drawing with an older sibling as a child.","notes":["Vale opened the exhibition Afterimage Garden in 2024.","Afterimage Garden includes twelve large canvases made with mineral pigments.","The exhibition explores how artificial light changes perceived colors.","Vale studied drawing with an older sibling as a child."],"goal":"introduce Vale’s Afterimage Garden exhibition to an audience familiar with the artist","strategy":"Assume specified background knowledge; foreground what is new or distinctive to the audience."},{"id":"RS-020","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to introduce Moren’s expedition to readers who already know the Valora Isles. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The Valora Isles are a chain of volcanic islands known for varied inlets and coastlines, some of which were not systematically charted before expeditions in the nineteenth century.","B":"Volcanic islands can have coastlines with numerous inlets, some of which may be difficult to chart.","C":"Elisa Moren’s 1891 expedition surveyed previously uncharted inlets on three of the Valora Isles, leading to a revised coastal map in 1893.","D":"The Valora Isles are volcanic, and researchers have sometimes collected seaweed there."},"answer":"C","explanation":"The option highlights what the expedition did and produced without repeating the audience’s existing geographic knowledge.","choice_explanations":{"A":"Incorrect: This simply restates background the readers already know.","B":"Incorrect: This gives general geographic commentary, not an introduction to Moren’s particular expedition.","C":"Correct: The option highlights what the expedition did and produced without repeating the audience’s existing geographic knowledge.","D":"Incorrect: This relies on known background and an incidental specimen detail without identifying the expedition."},"passage":"While researching a topic, a student has taken the following notes:\n• In 1891, cartographer Elisa Moren led an expedition to the Valora Isles.\n• The expedition measured previously uncharted inlets on three islands.\n• Moren used those measurements to issue a new coastal map in 1893.\n• The expedition also collected specimens of seaweed.","notes":["In 1891, cartographer Elisa Moren led an expedition to the Valora Isles.","The expedition measured previously uncharted inlets on three islands.","Moren used those measurements to issue a new coastal map in 1893.","The expedition also collected specimens of seaweed."],"goal":"introduce Moren’s expedition to readers who already know the Valora Isles","strategy":"Assume specified background knowledge; foreground what is new or distinctive to the audience."},{"id":"RS-021","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to explain an advantage of Jae’s coating. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Jae’s coating used a film applied to solar panels before the field trials began.","B":"Untreated panels collected windblown dust and required weekly cleaning.","C":"By letting morning dew carry away accumulated dust, Jae’s coating reduced how often the solar panels needed manual washing.","D":"Untreated solar panels accumulated windblown dust and needed weekly cleaning, whereas a different group of panels was coated with a film that responded to morning dew."},"answer":"C","explanation":"This option connects the coating’s dust-removal mechanism to the reduced cleaning frequency.","choice_explanations":{"A":"Incorrect: This identifies the coated surface but omits the benefit it provides.","B":"Incorrect: This describes the problem with untreated panels, not how the coating helps.","C":"Correct: This option connects the coating’s dust-removal mechanism to the reduced cleaning frequency.","D":"Incorrect: This is a shared feature and does not explain the advantage."},"passage":"While researching a topic, a student has taken the following notes:\n• In fictional field trials, untreated solar panels accumulated a thin layer of windblown dust.\n• Engineer Sol Jae coated other panels with a film that released accumulated dust when droplets of morning dew rolled across it.\n• The coated panels needed manual washing only once every four weeks.\n• Untreated panels needed manual washing once per week.\n• Both panel groups generated electricity during the daytime.","notes":["In fictional field trials, untreated solar panels accumulated a thin layer of windblown dust.","Engineer Sol Jae coated other panels with a film that released accumulated dust when droplets of morning dew rolled across it.","The coated panels needed manual washing only once every four weeks.","Untreated panels needed manual washing once per week.","Both panel groups generated electricity during the daytime."],"goal":"explain an advantage of Jae’s coating","strategy":"Connect the feature to the particular benefit, rather than merely describing the innovation."},{"id":"RS-022","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to explain why the redesigned viewer works better on memory-limited computers. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The redesigned viewer provides a detailed map, just like the conventional viewer, and organizes geographic information using an index of small tiles that correspond to different city locations.","B":"The conventional viewer stores high-resolution raster maps that contain detailed street information.","C":"Because the redesigned viewer loads only map tiles needed for the visible area, it can display the same detail while using less memory.","D":"The redesigned viewer is designed for mapping streets and uses an index of geographic tiles."},"answer":"C","explanation":"Loading only visible tiles reduces memory demand without sacrificing zoom-level detail.","choice_explanations":{"A":"Incorrect: This is a shared capability, not the explanation of better performance.","B":"Incorrect: This describes the old design but does not present the new design’s advantage.","C":"Correct: Loading only visible tiles reduces memory demand without sacrificing zoom-level detail.","D":"Incorrect: This names an indexing feature but omits how it lowers memory usage."},"passage":"While researching a topic, a student has taken the following notes:\n• A conventional map viewer loads an entire city’s high-resolution raster map before showing a street.\n• A fictional redesign stores an index of small geographic tiles.\n• When a user requests a street, the redesigned viewer retrieves only the tiles intersecting the visible area.\n• Tests found that the redesigned viewer used less memory on low-power laptops.\n• Both viewers display the same geographic detail at the same zoom level.","notes":["A conventional map viewer loads an entire city’s high-resolution raster map before showing a street.","A fictional redesign stores an index of small geographic tiles.","When a user requests a street, the redesigned viewer retrieves only the tiles intersecting the visible area.","Tests found that the redesigned viewer used less memory on low-power laptops.","Both viewers display the same geographic detail at the same zoom level."],"goal":"explain why the redesigned viewer works better on memory-limited computers","strategy":"Connect the feature to the particular benefit, rather than merely describing the innovation."},{"id":"RS-023","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to emphasize an advantage of Flor’s adjustable louvers over the fixed awnings. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Flor installed her adjustable louvers as part of a renovation of the plaza.","B":"The fixed awnings were intended to block sunlight in the afternoon.","C":"The new louvers tilt above the seating area and are made of adjustable panels.","D":"Unlike the fixed awnings, Flor’s louvers admit morning sunlight while still offering shade on hot afternoons."},"answer":"D","explanation":"The benefit is the ability to meet competing lighting needs at different times, which the fixed awnings could not do.","choice_explanations":{"A":"Incorrect: This names installation context without explaining an advantage.","B":"Incorrect: This describes only the earlier awnings and omits the new design’s improvement.","C":"Incorrect: This lists the physical feature but not the practical advantage it creates.","D":"Correct: The benefit is the ability to meet competing lighting needs at different times, which the fixed awnings could not do."},"passage":"While researching a topic, a student has taken the following notes:\n• A fictional plaza’s old fixed awnings blocked afternoon sunlight but also made the plaza dark in the morning.\n• Designer Nia Flor installed adjustable louvers above the seating area.\n• The louvers can tilt to allow morning light through and shade the seating area later in the day.\n• Temperature readings in the seating area fell on hot afternoons after installation.\n• The louvers were installed during the plaza’s renovation.","notes":["A fictional plaza’s old fixed awnings blocked afternoon sunlight but also made the plaza dark in the morning.","Designer Nia Flor installed adjustable louvers above the seating area.","The louvers can tilt to allow morning light through and shade the seating area later in the day.","Temperature readings in the seating area fell on hot afternoons after installation.","The louvers were installed during the plaza’s renovation."],"goal":"emphasize an advantage of Flor’s adjustable louvers over the fixed awnings","strategy":"Connect the feature to the particular benefit, rather than merely describing the innovation."},{"id":"RS-024","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to explain a production advantage of the fungal cushioning material. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Unlike the earlier plastic cushion, the fungal material can be produced without a prolonged high-temperature molding step.","B":"The packaging team tested whether glass products survived shipping with either cushion.","C":"The fungal cushion is grown from fibers that form on agricultural husks.","D":"The team’s fungal cushion was grown on agricultural husks and later used to protect fragile glass products, much as the previous plastic cushion had protected glass in shipping tests."},"answer":"A","explanation":"The requested production advantage is avoiding the high-temperature molding step, not a shared shipping outcome.","choice_explanations":{"A":"Correct: The requested production advantage is avoiding the high-temperature molding step, not a shared shipping outcome.","B":"Incorrect: This gives testing context and no production comparison.","C":"Incorrect: This identifies ingredients without stating the manufacturing advantage.","D":"Incorrect: This shows a shared performance property rather than a production benefit."},"passage":"While researching a topic, a student has taken the following notes:\n• A fictional packaging team grows a cushioning material from fungal fibers on agricultural husks.\n• The new material becomes firm at room temperature.\n• The factory’s earlier plastic cushion required a prolonged high-temperature molding process.\n• Growing and setting the fungal cushion requires no high-temperature molding.\n• Both materials protect glass products from impact in shipping trials.","notes":["A fictional packaging team grows a cushioning material from fungal fibers on agricultural husks.","The new material becomes firm at room temperature.","The factory’s earlier plastic cushion required a prolonged high-temperature molding process.","Growing and setting the fungal cushion requires no high-temperature molding.","Both materials protect glass products from impact in shipping trials."],"goal":"explain a production advantage of the fungal cushioning material","strategy":"Connect the feature to the particular benefit, rather than merely describing the innovation."},{"id":"RS-025","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to describe how the researchers tested the relative roles of color and odor. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Beetles were placed in a chamber with a shelter, and researchers later summarized their travel directions.","B":"The study explored the possibility that color and odor can both guide beetles toward shelter.","C":"The researchers varied landmark color and odor separately in a chamber and recorded the beetles’ direction of travel.","D":"The researchers investigated why beetles might depend on visual landmarks or smells when seeking shelter."},"answer":"C","explanation":"Changing one possible cue at a time and measuring movement is the methodological design that separates the cues’ effects.","choice_explanations":{"A":"Incorrect: This mentions setup and recording but omits the critical isolation of color and odor.","B":"Incorrect: This restates a possible explanation instead of how it was evaluated.","C":"Correct: Changing one possible cue at a time and measuring movement is the methodological design that separates the cues’ effects.","D":"Incorrect: This states the research question without describing the experimental manipulation."},"passage":"While researching a topic, a student has taken the following notes:\n• Researchers wondered whether beetles use colored landmarks or plant odors to locate a shelter.\n• They built a test chamber containing a shelter at one end.\n• On some trials, researchers changed the landmark color while keeping the odor the same.\n• On other trials, researchers changed the odor while keeping the landmark color the same.\n• They recorded which direction the beetles walked.","notes":["Researchers wondered whether beetles use colored landmarks or plant odors to locate a shelter.","They built a test chamber containing a shelter at one end.","On some trials, researchers changed the landmark color while keeping the odor the same.","On other trials, researchers changed the odor while keeping the landmark color the same.","They recorded which direction the beetles walked."],"goal":"describe how the researchers tested the relative roles of color and odor","strategy":"Explain what the researchers actually measured or how they tested a hypothesis, not merely their conclusions."},{"id":"RS-026","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to present the method used to estimate when the pottery styles were in use. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The team dated charred seeds found beside pottery in successive layers and compared those dates with the shards’ painted patterns.","B":"The researchers found that painting styles varied with sediment depth at the excavation.","C":"Pottery from Port Eren exhibited different painted patterns in three sediment layers, with simpler decorative elements appearing more frequently among the fragments found in the deepest layer.","D":"The excavation revealed pottery shards buried in multiple layers at Port Eren."},"answer":"A","explanation":"The dating strategy used associated organic material across layers, followed by stylistic comparison; this tells how the chronology was established.","choice_explanations":{"A":"Correct: The dating strategy used associated organic material across layers, followed by stylistic comparison; this tells how the chronology was established.","B":"Incorrect: This reports an observed pattern without explaining how the chronological comparison was made.","C":"Incorrect: This is a finding about decorative patterns, not the dating method.","D":"Incorrect: This identifies the excavation context but not the dating procedure."},"passage":"While researching a topic, a student has taken the following notes:\n• An excavation of fictional Port Eren found pottery shards in three distinct sediment layers.\n• The research team sampled charred seeds found directly beside the shards in each layer.\n• The team radiocarbon-dated the seeds, rather than attempting to radiocarbon-date the pottery itself.\n• Researchers then compared the dates with patterns painted on the pottery.\n• Shards in the deepest layer generally had simpler patterns.","notes":["An excavation of fictional Port Eren found pottery shards in three distinct sediment layers.","The research team sampled charred seeds found directly beside the shards in each layer.","The team radiocarbon-dated the seeds, rather than attempting to radiocarbon-date the pottery itself.","Researchers then compared the dates with patterns painted on the pottery.","Shards in the deepest layer generally had simpler patterns."],"goal":"present the method used to estimate when the pottery styles were in use","strategy":"Explain what the researchers actually measured or how they tested a hypothesis, not merely their conclusions."},{"id":"RS-027","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to explain the procedure used to investigate NQ-18’s wavelength-dependent brightness changes. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The team suspected that NQ-18’s brightness would fluctuate differently in blue and infrared light.","B":"NQ-18’s brightness varied more in blue light than in infrared light, according to observations collected during a nine-night study of the star at multiple wavelengths.","C":"Over nine nights, the astronomers measured NQ-18 through three color filters and compared its brightness with that of a stable nearby star.","D":"Astronomers have used colored filters to distinguish wavelength-dependent changes in stellar brightness."},"answer":"C","explanation":"The desired method includes repeated filtered measurements plus comparison to a stable reference star.","choice_explanations":{"A":"Incorrect: This states the prior hypothesis without the procedure used to test it.","B":"Incorrect: This reports the result rather than describing the measurement procedure.","C":"Correct: The desired method includes repeated filtered measurements plus comparison to a stable reference star.","D":"Incorrect: This is a generic description, not the specific study and its comparison measurements."},"passage":"While researching a topic, a student has taken the following notes:\n• Astronomers suspected that the fictional variable star NQ-18 changed brightness differently across wavelengths.\n• For nine consecutive nights, they photographed NQ-18 through blue, red, and infrared filters.\n• They measured the star’s brightness in each filtered image.\n• Each night, they also photographed a nearby star known to have stable brightness.\n• The NQ-18 measurements changed more in blue light than in infrared light.","notes":["Astronomers suspected that the fictional variable star NQ-18 changed brightness differently across wavelengths.","For nine consecutive nights, they photographed NQ-18 through blue, red, and infrared filters.","They measured the star’s brightness in each filtered image.","Each night, they also photographed a nearby star known to have stable brightness.","The NQ-18 measurements changed more in blue light than in infrared light."],"goal":"explain the procedure used to investigate NQ-18’s wavelength-dependent brightness changes","strategy":"Explain what the researchers actually measured or how they tested a hypothesis, not merely their conclusions."},{"id":"RS-028","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to present the researchers’ authorship-analysis method rather than the result. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The Glass Dunes and Winter Bell are two fictional plays whose authors are uncertain.","B":"Winter Bell, one of two disputed plays that researchers examined, was classified as stylistically closest to Mara Doy, whose known works were included in the broader comparison.","C":"Researchers concluded that the authorship of Winter Bell was most closely associated with Mara Doy’s writing.","D":"To investigate the plays’ authorship, researchers trained a model on stylistic measures from known plays and tested it on separate known works before analyzing the disputed texts."},"answer":"D","explanation":"This reports the workflow and held-out testing needed to characterize the method, without replacing it with the outcome.","choice_explanations":{"A":"Incorrect: This states the problem under investigation but not the computational approach.","B":"Incorrect: This is a finding of the model, not a description of how it was built and evaluated.","C":"Incorrect: This gives the outcome instead of the analysis process.","D":"Correct: This reports the workflow and held-out testing needed to characterize the method, without replacing it with the outcome."},"passage":"While researching a topic, a student has taken the following notes:\n• Two unpublished fictional plays, The Glass Dunes and Winter Bell, had uncertain authorship.\n• The researchers compiled 150 measures of word choice and sentence structure from works of four known playwrights.\n• They trained a computer model on some of those known works.\n• They tested the model on other known works before analyzing the anonymous plays.\n• The final analysis classified Winter Bell as stylistically closest to the works of playwright Mara Doy.","notes":["Two unpublished fictional plays, The Glass Dunes and Winter Bell, had uncertain authorship.","The researchers compiled 150 measures of word choice and sentence structure from works of four known playwrights.","They trained a computer model on some of those known works.","They tested the model on other known works before analyzing the anonymous plays.","The final analysis classified Winter Bell as stylistically closest to the works of playwright Mara Doy."],"goal":"present the researchers’ authorship-analysis method rather than the result","strategy":"Explain what the researchers actually measured or how they tested a hypothesis, not merely their conclusions."},{"id":"RS-029","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to summarize the study’s findings about root depth. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The team investigated how environmental conditions might affect marsh iris root growth.","B":"All of the irises grew in plots containing the same soil type.","C":"Researchers grew marsh iris plants in different combinations of shade and salt while keeping soil type constant across the experimental plots so that environmental conditions could be compared.","D":"Marsh irises developed deeper roots under higher salt concentrations, while shade had little effect on root depth within the tested conditions."},"answer":"D","explanation":"The finding distinguishes a relationship with salt concentration from the absence of a comparable shade effect.","choice_explanations":{"A":"Incorrect: This states the study’s general purpose, not its outcomes.","B":"Incorrect: This notes a control variable but not a result.","C":"Incorrect: This describes experimental conditions rather than what the plants did.","D":"Correct: The finding distinguishes a relationship with salt concentration from the absence of a comparable shade effect."},"passage":"While researching a topic, a student has taken the following notes:\n• A fictional field study tested whether salt concentration and shade affected the roots of marsh iris plants.\n• Researchers compared irises in three salt conditions and two levels of shade.\n• Plants exposed to higher salt concentrations developed deeper roots.\n• Within each salt condition, shaded and unshaded plants had similar root depths.\n• The study used the same soil type in all plots.","notes":["A fictional field study tested whether salt concentration and shade affected the roots of marsh iris plants.","Researchers compared irises in three salt conditions and two levels of shade.","Plants exposed to higher salt concentrations developed deeper roots.","Within each salt condition, shaded and unshaded plants had similar root depths.","The study used the same soil type in all plots."],"goal":"summarize the study’s findings about root depth","strategy":"Synthesize reported observations or outcomes, preserving contrast and limits, rather than retelling methods."},{"id":"RS-030","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to present the main results of the call-recognition study. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Researchers positioned playback speakers at equal distances from the test birds and played familiar and unfamiliar calls to individuals from coastal and inland forest populations.","B":"Birds in both regions approached familiar calls more often, but this preference was weaker in the coastal population.","C":"The study compared responses by birds living in inland and coastal forests.","D":"The team used familiar and unfamiliar bird calls to investigate possible regional differences."},"answer":"B","explanation":"The key results are the shared response direction and the regional difference in its strength.","choice_explanations":{"A":"Incorrect: This gives the setup and a control, not the results.","B":"Correct: The key results are the shared response direction and the regional difference in its strength.","C":"Incorrect: This identifies the sampled groups but omits the birds’ behavior.","D":"Incorrect: This describes the design and question without reporting the observations."},"passage":"While researching a topic, a student has taken the following notes:\n• Researchers played recordings of familiar and unfamiliar calls to birds from two regions.\n• Birds from the inland forest approached familiar-call recordings more often than unfamiliar-call recordings.\n• Birds from the coastal forest also approached familiar calls more often.\n• The preference for familiar calls was weaker among the coastal birds than among the inland birds.\n• All playback speakers were placed the same distance from the test birds.","notes":["Researchers played recordings of familiar and unfamiliar calls to birds from two regions.","Birds from the inland forest approached familiar-call recordings more often than unfamiliar-call recordings.","Birds from the coastal forest also approached familiar calls more often.","The preference for familiar calls was weaker among the coastal birds than among the inland birds.","All playback speakers were placed the same distance from the test birds."],"goal":"present the main results of the call-recognition study","strategy":"Synthesize reported observations or outcomes, preserving contrast and limits, rather than retelling methods."},{"id":"RS-031","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to summarize the ridership results without claiming that the discount alone caused them. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The pilot covered two routes, and Route East also gained additional morning departures.","B":"Officials introduced a fare discount as part of an effort to encourage more bus use.","C":"The city introduced fare discounts on Route East and Route West, but it also added morning departures to Route East during the pilot, complicating comparisons between the two routes.","D":"Weekday trips rose on both pilot routes, by 14% on Route East and 2% on Route West, although the figures alone do not isolate the discount’s effect."},"answer":"D","explanation":"The correct option reports both observed increases and avoids attributing them solely to fares, especially given the changed service schedule.","choice_explanations":{"A":"Incorrect: This describes the pilot and a possible confounder, not the ridership results.","B":"Incorrect: This states the policy goal, not what happened.","C":"Incorrect: This overclaims causation because no control isolates the discount from added departures or other changes.","D":"Correct: The correct option reports both observed increases and avoids attributing them solely to fares, especially given the changed service schedule."},"passage":"While researching a topic, a student has taken the following notes:\n• A fictional city introduced a pilot fare discount on two bus routes.\n• After the change, Route East recorded 14% more weekday trips than in the preceding comparison period.\n• Route West recorded 2% more weekday trips than in its comparison period.\n• The pilot did not include a randomly assigned control group.\n• The city also added new morning departure times on Route East during the pilot.","notes":["A fictional city introduced a pilot fare discount on two bus routes.","After the change, Route East recorded 14% more weekday trips than in the preceding comparison period.","Route West recorded 2% more weekday trips than in its comparison period.","The pilot did not include a randomly assigned control group.","The city also added new morning departure times on Route East during the pilot."],"goal":"summarize the ridership results without claiming that the discount alone caused them","strategy":"Synthesize reported observations or outcomes, preserving contrast and limits, rather than retelling methods."},{"id":"RS-032","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to present the pattern in the study’s temperature findings. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"At both sites, glazed pottery had higher estimated firing temperatures than unglazed pottery, though the study did not establish the reason.","B":"At two archaeological sites, a laboratory analyzed pottery fragments using the same temperature-estimation method, examining both glazed and unglazed potsherds rather than only one category of ceramics.","C":"Potters at both sites deliberately raised firing temperatures to improve the appearance of glazing.","D":"Site Irra and Site Meran contributed glazed and unglazed pottery fragments to the study."},"answer":"A","explanation":"The estimated temperature gap appears at each site; the explanation for potters’ choices is explicitly unresolved.","choice_explanations":{"A":"Correct: The estimated temperature gap appears at each site; the explanation for potters’ choices is explicitly unresolved.","B":"Incorrect: This describes methodological consistency, not the observed temperature pattern.","C":"Incorrect: This asserts the potters’ intentions, which the study did not establish.","D":"Incorrect: This lists the sample types without giving the key finding."},"passage":"While researching a topic, a student has taken the following notes:\n• An archaeology laboratory estimated firing temperatures for potsherds from two fictional sites.\n• At Site Irra, glazed pottery averaged an estimated 910°C, compared with 720°C for unglazed pottery.\n• At Site Meran, glazed pottery averaged 870°C, compared with 700°C for unglazed pottery.\n• The laboratory used the same temperature-estimation technique at both sites.\n• The study did not determine why potters used different firing temperatures.","notes":["An archaeology laboratory estimated firing temperatures for potsherds from two fictional sites.","At Site Irra, glazed pottery averaged an estimated 910°C, compared with 720°C for unglazed pottery.","At Site Meran, glazed pottery averaged 870°C, compared with 700°C for unglazed pottery.","The laboratory used the same temperature-estimation technique at both sites.","The study did not determine why potters used different firing temperatures."],"goal":"present the pattern in the study’s temperature findings","strategy":"Synthesize reported observations or outcomes, preserving contrast and limits, rather than retelling methods."},{"id":"RS-033","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to emphasize the potential practical significance of the enzyme finding. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The researchers plan to study the enzyme’s cost of production.","B":"The researchers isolated an enzyme from a cold-water bacterium, tested its capacity to break down a dye under laboratory conditions, and are now investigating the costs of producing it.","C":"Because the enzyme breaks down a dye at 6°C, it could eventually help treat some dyed wastewater with less heating, if the laboratory result can be scaled up.","D":"The enzyme has already replaced high-temperature wastewater treatment in industrial facilities."},"answer":"C","explanation":"The finding suggests a possible energy-saving application, but industrial use remains untested.","choice_explanations":{"A":"Incorrect: This names a next step but not the potential benefit of low-temperature dye breakdown.","B":"Incorrect: This recounts isolation and testing rather than why the finding could matter.","C":"Correct: The finding suggests a possible energy-saving application, but industrial use remains untested.","D":"Incorrect: This falsely treats a laboratory demonstration as established commercial adoption."},"passage":"While researching a topic, a student has taken the following notes:\n• Researchers isolated an enzyme from a fictional cold-water bacterium.\n• In laboratory experiments, the enzyme broke down a test dye at 6°C.\n• An older industrial treatment of the same dye requires heating wastewater substantially above room temperature.\n• The researchers have not tested the enzyme in a full-scale wastewater facility.\n• The researchers are evaluating whether the enzyme could be manufactured at low cost.","notes":["Researchers isolated an enzyme from a fictional cold-water bacterium.","In laboratory experiments, the enzyme broke down a test dye at 6°C.","An older industrial treatment of the same dye requires heating wastewater substantially above room temperature.","The researchers have not tested the enzyme in a full-scale wastewater facility.","The researchers are evaluating whether the enzyme could be manufactured at low cost."],"goal":"emphasize the potential practical significance of the enzyme finding","strategy":"Explain why the finding matters in the precise terms supported by the notes, avoiding inflated implications."},{"id":"RS-034","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to explain the importance of Kir’s finding for descriptions of the Nemi language family. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Kir’s recordings reveal a vowel contrast not previously documented in the Nemi family, indicating that descriptions of the family’s sound systems need revision.","B":"The Nemi family’s vowel contrast must have originated from contact with a neighboring language.","C":"Before Kir’s study, descriptions of Nemi languages lacked a particular vowel distinction.","D":"Before Kir’s analysis, linguists had cataloged no rounded-versus-unrounded front-vowel contrast in the Nemi family, and her published research drew on recordings from older Luven speakers."},"answer":"A","explanation":"A documented sound contrast challenges an earlier account of what the family’s languages contain; its origin remains unknown.","choice_explanations":{"A":"Correct: A documented sound contrast challenges an earlier account of what the family’s languages contain; its origin remains unknown.","B":"Incorrect: This invents a historical cause that the notes explicitly say is unknown.","C":"Incorrect: This describes the earlier knowledge gap but omits how the new evidence changes it.","D":"Incorrect: This gives the collection method and date rather than the finding’s conceptual consequence."},"passage":"While researching a topic, a student has taken the following notes:\n• Linguists had previously cataloged no contrast between rounded and unrounded front vowels in the fictional Nemi language family.\n• Researcher Ada Kir collected recordings from elderly speakers of the family’s rarely documented Luven language.\n• Kir’s analysis found that Luven speakers systematically distinguish two words only by whether the front vowel is rounded.\n• The finding does not establish how the contrast arose historically.\n• The research appeared in 2025.","notes":["Linguists had previously cataloged no contrast between rounded and unrounded front vowels in the fictional Nemi language family.","Researcher Ada Kir collected recordings from elderly speakers of the family’s rarely documented Luven language.","Kir’s analysis found that Luven speakers systematically distinguish two words only by whether the front vowel is rounded.","The finding does not establish how the contrast arose historically.","The research appeared in 2025."],"goal":"explain the importance of Kir’s finding for descriptions of the Nemi language family","strategy":"Explain why the finding matters in the precise terms supported by the notes, avoiding inflated implications."},{"id":"RS-035"
