or purpose questions, identify the emotional relationship joining the details. A final positive feeling need not erase an earlier attachment."},{"id":"TSP-013","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It explains why detecting defects more frequently cannot affect the length of time a device remains usable.","B":"It specifies the period over which the pumps were observed, thereby establishing the main limitation of the study.","C":"It identifies the point at which a device should be replaced once an inspection reveals a minor defect.","D":"It defines a measure that the passage subsequently distinguishes from the timing of a different action."},"answer":"D","explanation":"The short appositive clarifies the meaning of 'inspection interval.' Its role is narrower than the passage's later caution about inferring service-life benefits from more frequent inspection.","choice_explanations":{"A":"The effect on working life is unresolved, not shown to be impossible. The phrase defines a term rather than supplies a causal argument.","B":"An interval between inspections is not the study's total follow-up period. The latter limitation is described separately.","C":"The phrase refers to spacing between examinations, not a replacement threshold; the passage keeps those decisions separate.","D":"The short appositive clarifies the meaning of 'inspection interval.' Its role is narrower than the passage's later caution about inferring service-life benefits from more frequent inspection."},"text":"The report distinguishes the inspection interval, the time between successive examinations of a device, from its replacement schedule. A device may be inspected monthly yet remain in service for years. The researchers shortened inspection intervals for a set of pumps and found more minor defects before the pumps failed. However, they did not observe those pumps for long enough to determine whether earlier detection extended their working lives. They therefore recommend further monitoring before adjusting replacement schedules. The extra inspections change how often information is collected; their implications for the appropriate age of retirement remain unsettled.","text_html":"The report distinguishes the inspection interval, <u>the time between successive examinations of a device<\/u>, from its replacement schedule. A device may be inspected monthly yet remain in service for years. The researchers shortened inspection intervals for a set of pumps and found more minor defects before the pumps failed. However, they did not observe those pumps for long enough to determine whether earlier detection extended their working lives. They therefore recommend further monitoring before adjusting replacement schedules. The extra inspections change how often information is collected; their implications for the appropriate age of retirement remain unsettled.","strategy":"For a short underlined phrase, begin with its grammatical role. Do not substitute the purpose of the surrounding experiment for the function of a definition."},{"id":"TSP-014","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best states the main purpose of the text?","choices":{"A":"To explain why Neri believes she has a relevant strength despite lacking some advantages possessed by other applicants.","B":"To portray Neri's realization that the requirements of surveying are incompatible with the abilities she has developed.","C":"To demonstrate that Neri has discovered a more efficient surveying technique and therefore deserves selection over faster applicants.","D":"To describe the director's decision to change the selection criteria after observing Neri correct other applicants' mistakes."},"answer":"A","explanation":"The passage aligns Neri's demonstrated attentiveness with the director's need while explicitly withholding any guarantee of selection. The contrast with speed supports her decision to keep trying.","choice_explanations":{"A":"The passage aligns Neri's demonstrated attentiveness with the director's need while explicitly withholding any guarantee of selection. The contrast with speed supports her decision to keep trying.","B":"The incidents encourage her to remain an applicant because her attentiveness matches a stated requirement.","C":"She notices instrument errors; no new technique or entitlement to selection is established.","D":"The director's stated need appears from the start, and no decision to change criteria is reported."},"text":"The survey director wanted someone who could notice a mistaken reading before it traveled into the final map. Neri could not claim the strongest legs or the quickest arithmetic among the applicants. But during practice she had stopped twice to check a bearing that everyone else had accepted; each time, a loose clamp had shifted the instrument. She did not take those incidents as a promise of selection. They were simply the reason she had not withdrawn her application when she saw the others working so rapidly. Speed, she thought, was valuable only if one was still going in the right direction.","text_html":"The survey director wanted someone who could notice a mistaken reading before it traveled into the final map. Neri could not claim the strongest legs or the quickest arithmetic among the applicants. But during practice she had stopped twice to check a bearing that everyone else had accepted; each time, a loose clamp had shifted the instrument. She did not take those incidents as a promise of selection. They were simply the reason she had not withdrawn her application when she saw the others working so rapidly. Speed, she thought, was valuable only if one was still going in the right direction.","strategy":"Distinguish a character's reason for hope from an objective guarantee, a completed selection, or a claim of superiority in every respect."},{"id":"TSP-015","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It describes a revision to the experiment that corrected the handling errors and made further training unnecessary.","B":"It concedes that the effort needed to produce the tabs may outweigh the modest reduction in errors observed in the trial.","C":"It provides a practical reason to retain an intervention despite the limited benefit documented earlier.","D":"It explains why the researchers believe the tabs will become substantially more effective as volunteers gain experience."},"answer":"C","explanation":"The target supports a limited recommendation on the basis of low implementation burden. It neither enlarges the measured effect nor removes the need for training.","choice_explanations":{"A":"No revised experiment is described; the passage explicitly rejects replacing training with tabs.","B":"The clause emphasizes almost no added effort, supporting retention rather than suggesting effort outweighs benefit.","C":"The target supports a limited recommendation on the basis of low implementation burden. It neither enlarges the measured effect nor removes the need for training.","D":"The effect did not grow with experience, and the clause concerns implementation effort, not effectiveness."},"text":"An archive tested colored tabs intended to help volunteers return folders to the correct shelves. Errors declined only slightly, and the effect did not grow as volunteers gained experience. The researchers did not recommend treating the tabs as a substitute for training. They nevertheless supported keeping them because the tabs could be printed on labels already produced for every folder, with no additional handling step. Their argument was not that the intervention was powerful, but that a modest improvement could be worth retaining alongside other safeguards when it required almost no additional effort.","text_html":"An archive tested colored tabs intended to help volunteers return folders to the correct shelves. Errors declined only slightly, and the effect did not grow as volunteers gained experience. The researchers did not recommend treating the tabs as a substitute for training. They nevertheless supported keeping them <u>because the tabs could be printed on labels already produced for every folder, with no additional handling step<\/u>. Their argument was not that the intervention was powerful, but that a modest improvement could be worth retaining alongside other safeguards when it required almost no additional effort.","strategy":"Separate the size of a benefit from whether it is worth its cost. A reason to keep a weak intervention is not evidence that it is strong."},{"id":"TSP-016","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It describes a preliminary technique that the surveyors abandoned when they devised a more dependable written record.","B":"It presents the evidence by which the surveyors verified that their assessments of gate conditions were accurate.","C":"It establishes why the surveyors chose to inspect gates rather than other features of the marsh road.","D":"It explains how a procedure addressed the recording difficulty introduced earlier in the text."},"answer":"D","explanation":"The details show the mechanism of a workaround: information is stored in beads during rain and transcribed later. The problem is retaining information, not deciding which gates are damaged.","choice_explanations":{"A":"The beads and the ledger are successive parts of one procedure, not an abandoned technique and its replacement.","B":"The procedure preserves assessments; the passage explicitly distinguishes preservation from improved accuracy.","C":"The sentence describes recording steps, not the reason for choosing the survey's subject.","D":"The details show the mechanism of a workaround: information is stored in beads during rain and transcribed later. The problem is retaining information, not deciding which gates are damaged."},"text":"The surveyors needed to record each gate along the marsh road, but rain repeatedly erased the pencil marks in their notebooks. Their leader introduced a cord strung with beads of several shapes. At each gate, a surveyor moved beads into a separate loop to encode the gate's position and condition, then copied the sequence into a ledger after returning to shelter. The final records therefore resembled those produced in dry weather, although they had been assembled through an intermediate physical code. The cord did not make the surveyors' judgments about damaged gates more reliable; it made those judgments easier to preserve until they could be written down.","text_html":"The surveyors needed to record each gate along the marsh road, but rain repeatedly erased the pencil marks in their notebooks. Their leader introduced a cord strung with beads of several shapes. <u>At each gate, a surveyor moved beads into a separate loop to encode the gate&#x27;s position and condition, then copied the sequence into a ledger after returning to shelter.<\/u> The final records therefore resembled those produced in dry weather, although they had been assembled through an intermediate physical code. The cord did not make the surveyors&#x27; judgments about damaged gates more reliable; it made those judgments easier to preserve until they could be written down.","strategy":"Match a procedure to the specific obstacle it solves. Better storage of a judgment is not the same as a better judgment."},{"id":"TSP-017","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It identifies the hypothesis that the directory's compiler tested before deciding to retain the district's traditional name.","B":"It proposes an explanation for why repairers preferred to settle near workshops that continued to employ weavers.","C":"It presents a specific archival discovery that independently confirms the occupations listed in the rental records.","D":"It states a general principle that makes sense of the mismatch explored through the district's records."},"answer":"D","explanation":"The target abstracts from the example: an inherited label can outlast the activity it once described. The records illustrate this principle; the sentence does not itself supply a new record or explain people's motives.","choice_explanations":{"A":"The passage attributes no investigation or hypothesis testing to the compiler.","B":"It concerns persistence of names, not motives for settlement or the continued presence of weavers.","C":"The sentence is a generalization, not another archival observation. Specific earlier and later records follow it.","D":"The target abstracts from the example: an inherited label can outlast the activity it once described. The records illustrate this principle; the sentence does not itself supply a new record or explain people's motives."},"text":"An old directory calls the eastern district of Bellhaven the Weavers' Quarter, although the surviving rental records identify most of its nineteenth-century occupants as instrument repairers. Names can preserve a former use of a place long after its economic role has changed. Records from a century earlier list numerous loom workshops there, while later repairers continued to use the familiar district name on their invoices. The directory's label is therefore informative about the district's history but misleading if treated as a description of all the work being done when the directory was printed.","text_html":"An old directory calls the eastern district of Bellhaven the Weavers&#x27; Quarter, although the surviving rental records identify most of its nineteenth-century occupants as instrument repairers. <u>Names can preserve a former use of a place long after its economic role has changed.<\/u> Records from a century earlier list numerous loom workshops there, while later repairers continued to use the familiar district name on their invoices. The directory&#x27;s label is therefore informative about the district&#x27;s history but misleading if treated as a description of all the work being done when the directory was printed.","strategy":"A generalization explains how examples fit together; it is not itself an additional example or a report of somebody's experimental plan."},{"id":"TSP-018","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the overall structure of the text?","choices":{"A":"It explains why an instrument was borrowed, compares its present sound with its former sound, and attributes its deterioration to careless transport.","B":"It recounts Jo's criticism of the piano, supplies her father's explanation of its value, and shows her accepting the explanation.","C":"It begins with an assessment of an object's defects, describes an interaction with it, and ends with the observer reconsidering the adequacy of that assessment.","D":"It presents the father's disappointment with the piano, describes Jo's effort to improve it, and ends with his renewed willingness to play."},"answer":"C","explanation":"Jo notices defects, then observes her father preparing to continue playing. His unspoken response leads her to recognize the limits of her inspection, without identifying exactly what he values.","choice_explanations":{"A":"Neither the borrowing decision, an earlier sound, nor damage caused by transport is explained.","B":"Jo does not voice the criticism, and her father does not explain the value. She draws a limited realization from observing him.","C":"Jo notices defects, then observes her father preparing to continue playing. His unspoken response leads her to recognize the limits of her inspection, without identifying exactly what he values.","D":"Disappointment and improvement are not reported; the father's actions cause Jo to reconsider her anticipated apology."},"text":"When the borrowed piano reached the attic, Jo saw first the chipped keys and the uneven polish. Her father said only that it would fit beneath the sloping roof. He waited until the porters had gone before lifting the lid. The first chord was thin, and one note lingered unpleasantly after the others. Jo was preparing to apologize for the instrument when she noticed that her father had closed his eyes and set his hands in position for a second chord. She put the apology away. Whatever he had found in that imperfect sound, it was not something her careful inspection of the case had taught her to recognize.","text_html":"When the borrowed piano reached the attic, Jo saw first the chipped keys and the uneven polish. Her father said only that it would fit beneath the sloping roof. He waited until the porters had gone before lifting the lid. The first chord was thin, and one note lingered unpleasantly after the others. Jo was preparing to apologize for the instrument when she noticed that her father had closed his eyes and set his hands in position for a second chord. She put the apology away. Whatever he had found in that imperfect sound, it was not something her careful inspection of the case had taught her to recognize.","strategy":"An event can change an observer's understanding without an explicit explanation or spoken disagreement. Preserve the difference between observed reaction and known motive."},{"id":"TSP-019","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It introduces a conflict that the editors resolve by agreeing to apply a common rule for retaining their drafts.","B":"It summarizes the compromise that makes the anthology possible after both editors abandon their earlier procedures.","C":"It establishes a contrast in working habits that the passage later presents as a resource for collaboration.","D":"It contrasts an experienced editor's caution with a less experienced editor's impatience, explaining their unequal contributions."},"answer":"C","explanation":"The initial difference is real, but the anticipated conflict does not occur. The later sentences show how both habits contribute while remaining distinct.","choice_explanations":{"A":"They never adopt a common rule; the text explicitly says neither changes the relevant habit.","B":"This is the initial contrast, not a later compromise, and both retain their procedures.","C":"The initial difference is real, but the anticipated conflict does not occur. The later sentences show how both habits contribute while remaining distinct.","D":"Experience and unequal contribution are not established. The passage depicts complementary contributions, not a hierarchy."},"text":"Iris kept every version of a paragraph; Tomas threw away a draft as soon as he had improved it. To Iris, a deleted line remained a possible answer to a question not yet asked. To Tomas, saving it meant leaving the question needlessly open. Their colleagues expected the two editors to quarrel over the anthology. Instead, Tomas's brisk exclusions gave the book a shape, while Iris could retrieve an earlier passage whenever that shape proved too narrow. Neither adopted the other's habits. The finished manuscript bore the marks of a cooperation that depended on their difference rather than on its disappearance.","text_html":"<u>Iris kept every version of a paragraph; Tomas threw away a draft as soon as he had improved it.<\/u> To Iris, a deleted line remained a possible answer to a question not yet asked. To Tomas, saving it meant leaving the question needlessly open. Their colleagues expected the two editors to quarrel over the anthology. Instead, Tomas&#x27;s brisk exclusions gave the book a shape, while Iris could retrieve an earlier passage whenever that shape proved too narrow. Neither adopted the other&#x27;s habits. The finished manuscript bore the marks of a cooperation that depended on their difference rather than on its disappearance.","strategy":"Contrast does not automatically imply conflict. Check whether later events eliminate the difference or put it to use."},{"id":"TSP-020","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the overall structure of the text?","choices":{"A":"It contrasts the harbor's disorder with the precision of printing, finally rejecting the initial comparison as unsuitable.","B":"It describes the harbor at dawn and then shifts to a literal printing room where the speaker learns how books are produced.","C":"It presents a sequence of increasingly accurate interpretations, ending when the speaker discovers the message shared by the harbor's workers.","D":"It sustains a comparison of harbor activity to printing, then qualifies the comparison by distinguishing ongoing production from a completed, agreed message."},"answer":"D","explanation":"Cranes, barges, ropes, a gull, and wind all elaborate one printing metaphor. The later lines limit what it implies: constant production need not amount to a unified text awaiting correction.","choice_explanations":{"A":"The speaker remains beside 'this working press'; the analogy continues even as a finished, agreed message is denied.","B":"The printing-room vocabulary remains figurative throughout; the speaker does not move to a second literal setting.","C":"The poem explicitly disclaims a finished message or agreed sentence and does not culminate in a decoded meaning.","D":"Cranes, barges, ropes, a gull, and wind all elaborate one printing metaphor. The later lines limit what it implies: constant production need not amount to a unified text awaiting correction."},"text":"Dawn sets the harbor's printing press in motion:\nthe cranes lift black initials from the quay,\nthe barges place their commas on the water,\nand ropes draw slender lines between the words.\nA gull corrects the margin with a cry;\nthe wind turns over pages no one numbered.\nI read no finished message in the bustle,\nno sentence that the scattered hands agreed.\nYet every hour another sheet is lifted,\nstill wet, still changing as it catches light,\nand I remain beside this working press,\nits willing reader, not its proofreader.","text_html":"Dawn sets the harbor&#x27;s printing press in motion:<br>\nthe cranes lift black initials from the quay,<br>\nthe barges place their commas on the water,<br>\nand ropes draw slender lines between the words.<br>\nA gull corrects the margin with a cry;<br>\nthe wind turns over pages no one numbered.<br>\nI read no finished message in the bustle,<br>\nno sentence that the scattered hands agreed.<br>\nYet every hour another sheet is lifted,<br>\nstill wet, still changing as it catches light,<br>\nand I remain beside this working press,<br>\nits willing reader, not its proofreader.","strategy":"Qualifying a metaphor is not necessarily rejecting it. Track whether the same figurative vocabulary continues after the qualification."},{"id":"TSP-021","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best states the main purpose of the text?","choices":{"A":"To show Mara addressing concerns by distinguishing the limited scope of her proposal from purposes others attribute to it.","B":"To show Mara narrowing a formerly ambitious campaign after discovering that residents oppose public identification of landlords.","C":"To present Mara's argument that collecting detailed information about owners is necessary before vacant properties can be used.","D":"To establish that Mara and Dev agree on the survey's objectives but disagree about who should verify the resulting map."},"answer":"A","explanation":"Mara repeatedly says what the survey will and will not do. These limits respond to Dev's concerns and clarify an existing proposal; the text does not portray the abandonment of a previous campaign.","choice_explanations":{"A":"Mara repeatedly says what the survey will and will not do. These limits respond to Dev's concerns and clarify an existing proposal; the text does not portray the abandonment of a previous campaign.","B":"The passage does not establish that Mara ever proposed such a campaign. She corrects an interpretation rather than revising a documented plan.","C":"She expressly excludes names and distinguishes information about spaces from information about people.","D":"Their exchange concerns the proposal's scope and intent; Dev never objects to committee verification."},"text":"A residents' committee is discussing a proposed survey of empty shops.\n\nMARA: You need not picture strangers measuring your living rooms. We would record only the vacant storefronts visible from the street.\n\nDEV: And publish a list of the owners?\n\nMARA: A list of usable spaces, not of people. The map would show approximate dimensions and whether a doorway is accessible. It would not show names. Before anything is circulated, the committee would check every entry.\n\nDEV: I thought you wanted a campaign against the landlords.\n\nMARA: I want the pottery group to find a room. Let us not turn an inventory into a prosecution.","text_html":"A residents&#x27; committee is discussing a proposed survey of empty shops.<br>\n<br>\nMARA: You need not picture strangers measuring your living rooms. We would record only the vacant storefronts visible from the street.<br>\n<br>\nDEV: And publish a list of the owners?<br>\n<br>\nMARA: A list of usable spaces, not of people. The map would show approximate dimensions and whether a doorway is accessible. It would not show names. Before anything is circulated, the committee would check every entry.<br>\n<br>\nDEV: I thought you wanted a campaign against the landlords.<br>\n<br>\nMARA: I want the pottery group to find a room. Let us not turn an inventory into a prosecution.","strategy":"Separate a speaker's original intention from another character's mistaken description of that intention."},{"id":"TSP-022","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It establishes that intact pottery was more common in regional households than repaired pottery, a difference Oren tries to explain.","B":"It introduces an earlier attempt to investigate repair practices that Oren seeks to improve by enlarging its sample.","C":"It identifies a collecting practice whose usefulness for a different kind of historical inquiry is subsequently questioned.","D":"It presents an interpretation of damaged pottery that Oren accepts while challenging the accuracy of its stylistic classifications."},"answer":"C","explanation":"The opening establishes how the record was assembled. The rest asks what that choice leaves out, without asserting that the original stylistic classifications are wrong.","choice_explanations":{"A":"A catalogue's preference is not evidence of the relative frequency of objects in households. Oren examines a selection effect.","B":"The catalogues classified intact vessels by style; they are not described as investigations of repair practices.","C":"The opening establishes how the record was assembled. The rest asks what that choice leaves out, without asserting that the original stylistic classifications are wrong.","D":"The sentence describes selection of intact pottery, and Oren does not challenge the accuracy of stylistic identifications."},"text":"Early catalogues of household pottery in the region generally selected intact vessels and classified them by decorative style. Historian Oren argues that this practice makes the surviving record less informative about how people actually used pottery than its apparent richness suggests. He instead examines fragments with drilled holes, patches, or worn rims. Such traces, he proposes, reveal decisions to repair and retain vessels that a display of undamaged examples cannot readily disclose. His argument does not depend on claiming that the early cataloguers misidentified the styles they recorded; it concerns the questions their selection of objects made difficult to ask.","text_html":"<u>Early catalogues of household pottery in the region generally selected intact vessels and classified them by decorative style.<\/u> Historian Oren argues that this practice makes the surviving record less informative about how people actually used pottery than its apparent richness suggests. He instead examines fragments with drilled holes, patches, or worn rims. Such traces, he proposes, reveal decisions to repair and retain vessels that a display of undamaged examples cannot readily disclose. His argument does not depend on claiming that the early cataloguers misidentified the styles they recorded; it concerns the questions their selection of objects made difficult to ask.","strategy":"Distinguish questioning what a method can reveal from disputing whether its existing results are accurate. A curated record is not automatically a representative population."},{"id":"TSP-023","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the overall structure of the text?","choices":{"A":"It portrays a writer's initial resistance to criticism and then describes the confidence gained by accepting an editor's guidance.","B":"It develops an extended comparison between self-questioning in writing and the inspection of travelers at a border.","C":"It compares two forms of self-questioning and then rejects one because it prevents the speaker from making any progress.","D":"It alternates between a literal account of border inspections and a separate account of the speaker's difficulties with writing."},"answer":"B","explanation":"Verbs, promises, and sentences all occupy roles in the same border-inspection metaphor. The final qualification limits the metaphor's severity without introducing a second narrative or resolving the writing process.","choice_explanations":{"A":"There is no editor or progression to confidence. Doubt remains part of the same sustained image.","B":"Verbs, promises, and sentences all occupy roles in the same border-inspection metaphor. The final qualification limits the metaphor's severity without introducing a second narrative or resolving the writing process.","C":"The poem sustains one comparison; it does not distinguish and reject two forms, and the final lines leave possibility open.","D":"The border details consistently refer to sentences and words; no independent literal border episode is narrated."},"text":"Doubt sits at the border of each sentence,\nasking my verbs for papers.\nIt weighs a promise, opens it,\nand shakes the lining for a concealed escape.\nThe modest word passes after inspection;\nthe splendid one waits beside the gate.\nEven the sentence I have crossed out\nreturns with a different coat,\nand Doubt, patient officer,\nturns it toward the light.\nBeyond the barrier the page remains unwritten;\nno traveler has yet been told\nthat the road itself is closed.","text_html":"Doubt sits at the border of each sentence,<br>\nasking my verbs for papers.<br>\nIt weighs a promise, opens it,<br>\nand shakes the lining for a concealed escape.<br>\nThe modest word passes after inspection;<br>\nthe splendid one waits beside the gate.<br>\nEven the sentence I have crossed out<br>\nreturns with a different coat,<br>\nand Doubt, patient officer,<br>\nturns it toward the light.<br>\nBeyond the barrier the page remains unwritten;<br>\nno traveler has yet been told<br>\nthat the road itself is closed.","strategy":"Changes within an extended metaphor need not be changes of subject, time period, or speaker. Identify the comparison that holds the whole passage together."},{"id":"TSP-024","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It describes the measured difference that allowed the team to rule out changes in illumination as the explanation for fading.","B":"It explains why the researchers concluded that cleaning removed dye rather than dirt from the treated cloth.","C":"It clarifies what the reference swatch is, rather than reporting what the comparison eventually revealed.","D":"It identifies the limitation that makes a reference sample unsuitable for comparing fabrics exposed to different treatments."},"answer":"C","explanation":"The appositive provides a definition immediately after 'reference swatch.' The experimental control, the result, and the result's interpretive limit occur elsewhere.","choice_explanations":{"A":"It describes an untreated piece of fabric, not a measured difference; the lighting arrangement appears in the next sentence.","B":"The team explicitly says the comparison cannot distinguish those explanations; the target only defines the reference.","C":"The appositive provides a definition immediately after 'reference swatch.' The experimental control, the result, and the result's interpretive limit occur elsewhere.","D":"The phrase explains the reference sample's identity and role, not its unsuitability; the method is used to compare appearance."},"text":"To investigate how a cleaning solution altered dyed cloth, researchers photographed treated samples beside a reference swatch, a piece of the same fabric preserved without treatment for comparison. Every photograph contained both pieces under the same lamp, so a change in lighting would affect their recorded appearances together. After several treatments, the cleaned pieces appeared lighter relative to the reference. The team cautioned that this comparison identified a change in appearance, not whether the solution had removed dirt, dye, or some mixture of the two. A separate chemical analysis would be needed to distinguish those possibilities.","text_html":"To investigate how a cleaning solution altered dyed cloth, researchers photographed treated samples beside a reference swatch, <u>a piece of the same fabric preserved without treatment for comparison<\/u>. Every photograph contained both pieces under the same lamp, so a change in lighting would affect their recorded appearances together. After several treatments, the cleaned pieces appeared lighter relative to the reference. The team cautioned that this comparison identified a change in appearance, not whether the solution had removed dirt, dye, or some mixture of the two. A separate chemical analysis would be needed to distinguish those possibilities.","strategy":"Do not let a technical context make a simple explanatory phrase seem like a result, methodological criticism, or causal conclusion."},{"id":"TSP-025","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the overall structure of the text?","choices":{"A":"It describes an unsuccessful trial, explains the revision prompted by that failure, and reports that the revised sleeves work with both kinds of gloves.","B":"It explains why crews prefer tactile markings, outlines a proposed device, and postpones evaluating it until the indoor and outdoor requirements are identical.","C":"It identifies a failure in an established cord-labeling system, compares several traditional crafts, and selects the least costly alternative for outdoor use.","D":"It presents a practical difficulty, explains the inspiration for a tested response, and distinguishes the setting in which that response works from one requiring further adaptation."},"answer":"D","explanation":"The text moves from two limitations to an external design cue, then an implemented device and test results. Its closing distinction prevents generalizing indoor success to an unadapted outdoor setting.","choice_explanations":{"A":"The design precedes the trial, and no successful revision for thicker gloves is reported.","B":"The response has been tested and is used indoors; evaluation has not been postponed.","C":"Only one craft provides the inspiration; costs are not compared, and outdoor adaptation remains unresolved.","D":"The text moves from two limitations to an external design cue, then an implemented device and test results. Its closing distinction prevents generalizing indoor success to an unadapted outdoor setting."},"text":"Backstage crews needed to distinguish several identical control cords without switching on lights. Flat labels were unreadable by touch, while large tags caught on neighboring cords. A technician noticed that a seamstress marked fabric bundles with different combinations of small knots. Borrowing that principle, the technician fitted the cords with low-profile sleeves bearing distinct raised patterns. In a rehearsal, crew members identified the cords reliably while wearing thin gloves, but several patterns were confused when thicker gloves were used. The sleeves are now used in the indoor theater; adapting them for outdoor crews remains a separate design problem.","text_html":"Backstage crews needed to distinguish several identical control cords without switching on lights. Flat labels were unreadable by touch, while large tags caught on neighboring cords. A technician noticed that a seamstress marked fabric bundles with different combinations of small knots. Borrowing that principle, the technician fitted the cords with low-profile sleeves bearing distinct raised patterns. In a rehearsal, crew members identified the cords reliably while wearing thin gloves, but several patterns were confused when thicker gloves were used. The sleeves are now used in the indoor theater; adapting them for outdoor crews remains a separate design problem.","strategy":"For technical structure questions, mark proposed, built, tested, and adopted as distinct stages. A remaining limitation does not mean nothing has been implemented."},{"id":"TSP-026","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It interprets Len's behavior as expressing a reluctance that his polite speech has not directly acknowledged.","B":"It describes the moment when the director recognizes Len's intention to leave and withdraws her invitation.","C":"It explains how an interruption in the conversation prevents Len from giving the direct refusal he had prepared.","D":"It reveals that Len's earlier praise was intended to conceal his dislike of the director's plans."},"answer":"A","explanation":"The sentence assigns communicative force to a gesture. In context, Len's abandoned drink and attention to departure express reluctance about responsibility, not a rejection of the institution's plans.","choice_explanations":{"A":"The sentence assigns communicative force to a gesture. In context, Len's abandoned drink and attention to departure express reluctance about responsibility, not a rejection of the institution's plans.","B":"The narrator interprets Len's behavior, but the director's understanding and any withdrawal are not reported.","C":"No interruption or prepared refusal is described. The tea figuratively communicates what his speech avoids.","D":"The last sentence affirms genuine interest; reluctance to take responsibility does not make the praise insincere."},"text":"At the reception, Len praised the new director's plans with a fluency that surprised even him. He promised to visit the workshops, to attend the rehearsals, to make himself useful wherever he could. Then the director offered him the seat beside hers at the committee table. Len set his full cup on the mantel and began adjusting the cuffs of his coat. The untouched tea delivered the refusal his courteous sentences had carefully withheld. When he next spoke, it was to ask whether the last tram still stopped outside. His interest in the institution was sincere; the possibility of being made responsible for it had suddenly become less attractive.","text_html":"At the reception, Len praised the new director&#x27;s plans with a fluency that surprised even him. He promised to visit the workshops, to attend the rehearsals, to make himself useful wherever he could. Then the director offered him the seat beside hers at the committee table. Len set his full cup on the mantel and began adjusting the cuffs of his coat. <u>The untouched tea delivered the refusal his courteous sentences had carefully withheld.<\/u> When he next spoke, it was to ask whether the last tram still stopped outside. His interest in the institution was sincere; the possibility of being made responsible for it had suddenly become less attractive.","strategy":"For figurative descriptions of behavior, identify the unspoken attitude without inventing another character's reaction or treating reluctance as total insincerity."},{"id":"TSP-027","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the overall structure of the text?","choices":{"A":"It reports a finding and the comparison supporting it, then proposes an application while explaining why that application remains unverified.","B":"It identifies a defect in an existing transport system, describes an experiment designed to correct it, and assesses the repaired system's performance.","C":"It contrasts two proposed explanations, reports evidence favoring both, and recommends combining them in a new container design.","D":"It outlines an intended application, explains why earlier studies failed to support it, and introduces a revised experiment that establishes its feasibility."},"answer":"A","explanation":"The passage moves from an observed effect and its supporting comparison to a potential use. The final qualifications keep laboratory evidence distinct from demonstrated performance in a container.","choice_explanations":{"A":"The passage moves from an observed effect and its supporting comparison to a potential use. The final qualifications keep laboratory evidence distinct from demonstrated performance in a container.","B":"No existing defective system or trial of a repaired system is described. The container application follows the finding and remains untested.","C":"The controlled comparison attributes a difference to channel width; it does not establish two explanations that should be combined.","D":"The order is finding before application, and no earlier failed studies or revised feasibility experiment are reported."},"text":"A team studying porous ceramic tiles found that tiles with narrow channels absorbed moisture rapidly but released it gradually. By comparing tiles with the same composition and different channel widths, the team linked the difference in release rates to the channels rather than to the ceramic material itself. The researchers suggest that a lining made from such tiles might help stabilize humidity inside containers used to transport delicate instruments. That application has not been tested: a container is repeatedly opened and exposed to changing temperatures, unlike the sealed chambers in the study. The finding therefore supplies a possible design principle, not a demonstrated transport system.","text_html":"A team studying porous ceramic tiles found that tiles with narrow channels absorbed moisture rapidly but released it gradually. By comparing tiles with the same composition and different channel widths, the team linked the difference in release rates to the channels rather than to the ceramic material itself. The researchers suggest that a lining made from such tiles might help stabilize humidity inside containers used to transport delicate instruments. That application has not been tested: a container is repeatedly opened and exposed to changing temperatures, unlike the sealed chambers in the study. The finding therefore supplies a possible design principle, not a demonstrated transport system.","strategy":"When a text ends with a possible application, do not rewrite the whole investigation as if it began with and successfully delivered that application."},{"id":"TSP-028","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It portrays repeated motion as productive persistence, contributing to the speaker's appreciative response to the loom.","B":"It compares two methods of weaving in order to explain why one produces cloth more rapidly than the other.","C":"It establishes a threatening quality in the loom's movement that contrasts with the speaker's eventual relief when it falls silent.","D":"It introduces a defect in the loom that explains why the speaker later hopes to replace its irregular rhythm."},"answer":"A","explanation":"The target's backward-and-forward movement repeatedly returns carrying thread. The following image of colors joining and the speaker's willing attention establish productive endurance, not malfunction or threat.","choice_explanations":{"A":"The target's backward-and-forward movement repeatedly returns carrying thread. The following image of colors joining and the speaker's willing attention establish productive endurance, not malfunction or threat.","B":"Only one continuing motion is described; no competing weaving method or speed comparison appears.","C":"The loom does not fall silent, and the speaker deliberately leaves the gate open to hear it. 'Strikes' does not by itself establish fear.","D":"The repeated motion is followed by cloth taking shape and the speaker's contentment, not a defect or replacement wish."},"text":"Across the yard the old loom starts again,\nits wooden answer to the waking street.\nThe shuttle strikes, retreats, and strikes once more;\neach checked advance returns with thread to spare.\nNo banner rises from the modest frame,\nno trumpet tells the neighbors what is made.\nYet on the cloth the scattered colors meet,\nand what was separate learns a patient shape.\nI leave the gate unlatched to hear it work,\ncontent to let its stubborn rhythm mark\nthe hours I once had hurried to divide.","text_html":"Across the yard the old loom starts again,<br>\nits wooden answer to the waking street.<br>\n<u>The shuttle strikes, retreats, and strikes once more;<br>\neach checked advance returns with thread to spare.<\/u><br>\nNo banner rises from the modest frame,<br>\nno trumpet tells the neighbors what is made.<br>\nYet on the cloth the scattered colors meet,<br>\nand what was separate learns a patient shape.<br>\nI leave the gate unlatched to hear it work,<br>\ncontent to let its stubborn rhythm mark<br>\nthe hours I once had hurried to divide.","strategy":"Read potentially negative words such as 'strikes,' 'checked,' or 'stubborn' through the surrounding tone. Their isolated connotations do not determine the function of a poetic image."},{"id":"TSP-029","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It identifies a similarity between recording studios and ordinary buildings that establishes the robot's general usefulness.","B":"It describes a modification intended to make the robot rely on visual inspection rather than on acoustic information.","C":"It reports the observation that led the engineers to conclude that panel thickness was the main cause of classification errors.","D":"It explains why a particular setting let the researchers vary what the robot needed to detect while controlling a possible visual cue."},"answer":"D","explanation":"Changing hidden cavities while keeping the visible panel constant helps isolate the information of interest. This is a rationale for the experimental setting, not a finding about performance or a guarantee of generalization.","choice_explanations":{"A":"No such similarity or general usefulness is established; the last sentence explicitly limits that inference.","B":"Keeping the surface unchanged limits visual cues, so the robot's classification can be evaluated using echoes.","C":"The sentence explains the setting choice. The performance observations and thickness difference appear later.","D":"Changing hidden cavities while keeping the visible panel constant helps isolate the information of interest. This is a rationale for the experimental setting, not a finding about performance or a guarantee of generalization."},"text":"Engineers studying inspection robots needed to determine whether a machine could recognize a hollow wall from the echoes of its own taps. They chose a disused recording studio because its removable wall panels allowed internal cavities to be altered without changing the visible surface. In each trial, the robot approached the same painted panel, tapped it, and classified the space behind it. Its classifications were accurate when the panel was thin, but became less reliable as thickness increased. The engineers describe the studio as a useful testing environment, not as evidence that the robot can already inspect every kind of building.","text_html":"Engineers studying inspection robots needed to determine whether a machine could recognize a hollow wall from the echoes of its own taps. <u>They chose a disused recording studio because its removable wall panels allowed internal cavities to be altered without changing the visible surface.<\/u> In each trial, the robot approached the same painted panel, tapped it, and classified the space behind it. Its classifications were accurate when the panel was thin, but became less reliable as thickness increased. The engineers describe the studio as a useful testing environment, not as evidence that the robot can already inspect every kind of building.","strategy":"Distinguish why a study used a setting from what the study found in that setting."},{"id":"TSP-030","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the overall structure of the text?","choices":{"A":"It introduces an object of uncertain ownership, reconstructs the owner's motives from physical evidence, and confirms those motives through another person's intervention.","B":"It describes a practical problem, considers competing ways of addressing it, and explains why the narrator rejects the attendant's proposed solution.","C":"It describes an ordinary object, follows the narrator's speculative interpretation of it, and ends with recognition of that interpretation's personal character.","D":"It presents a distressing discovery, recounts the narrator's attempts to resolve it, and concludes that the discovery was less serious than it first seemed."},"answer":"C","explanation":"The glove's appearance prompts imagined possibilities, not verified information about its owner. The ending makes the narrator aware of projecting an unspoken personal question onto the object.","choice_explanations":{"A":"The narrator speculates rather than reconstructs or confirms motives; the attendant only offers to store the glove.","B":"The narrator accepts the attendant's suggestion; the intervening speculation concerns meaning, not alternative storage solutions.","C":"The glove's appearance prompts imagined possibilities, not verified information about its owner. The ending makes the narrator aware of projecting an unspoken personal question onto the object.","D":"The passage neither presents the glove as distressing nor describes attempts to solve its loss."},"text":"A single glove lay on the reading-room table, its fingers curved around nothing. The morning sun had reached it through the high windows, outlining each seam as sharply as the lines on a map. I first thought of the person who must return for it, and then wondered whether the glove had been left deliberately. Perhaps someone had walked out into the cold and discovered that an unprotected hand could still be useful. The attendant offered to put it in the lost-property drawer. I said yes, embarrassed to find that I had begun treating a misplaced object as an answer to a question I had not yet asked aloud.","text_html":"A single glove lay on the reading-room table, its fingers curved around nothing. The morning sun had reached it through the high windows, outlining each seam as sharply as the lines on a map. I first thought of the person who must return for it, and then wondered whether the glove had been left deliberately. Perhaps someone had walked out into the cold and discovered that an unprotected hand could still be useful. The attendant offered to put it in the lost-property drawer. I said yes, embarrassed to find that I had begun treating a misplaced object as an answer to a question I had not yet asked aloud.","strategy":"A passage can move from observation to interpretation without proving the interpretation. Preserve the narrator's uncertainty in a structural summary."},{"id":"TSP-031","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best states the main purpose of the text?","choices":{"A":"To show Vale declining to endorse a design whose measurements he has checked but whose operating principle he still doubts.","B":"To present a disagreement over whether speed or technical accuracy should take priority during the presentation.","C":"To show Iona persuading Vale to share responsibility for a model she is not yet ready to present independently.","D":"To convey Vale's effort to let Iona present and receive recognition for her own contribution while remaining available to assist."},"answer":"D","explanation":"Vale distinguishes checking measurements from originating the design and warns that his own speaking would overshadow Iona. His final offer preserves support without taking over.","choice_explanations":{"A":"He does not express doubt about the mechanism or withhold endorsement; his concern is whose contribution the audience will recognize.","B":"Vale concedes he could explain faster, but the contrast concerns visibility and credit, not competing standards of accuracy.","C":"The direction of persuasion is reversed: Vale encourages Iona to lead, with limited assistance available.","D":"Vale distinguishes checking measurements from originating the design and warns that his own speaking would overshadow Iona. His final offer preserves support without taking over."},"text":"A senior designer, Vale, and an apprentice, Iona, are preparing to present a model.\n\nIONA: You should explain the hinge. They will ask why the lid opens sideways.\n\nVALE: They should ask the person who found room for it.\n\nIONA: But you checked the measurements.\n\nVALE: I checked them because you asked me to. That is not the same as inventing the arrangement.\n\nIONA: You could explain it faster.\n\nVALE: Probably. I could also answer every question before anyone looked at your drawing. Then they would leave knowing a great deal about my voice. Put your model at the front. I will be close enough to pass you a ruler.","text_html":"A senior designer, Vale, and an apprentice, Iona, are preparing to present a model.<br>\n<br>\nIONA: You should explain the hinge. They will ask why the lid opens sideways.<br>\n<br>\nVALE: They should ask the person who found room for it.<br>\n<br>\nIONA: But you checked the measurements.<br>\n<br>\nVALE: I checked them because you asked me to. That is not the same as inventing the arrangement.<br>\n<br>\nIONA: You could explain it faster.<br>\n<br>\nVALE: Probably. I could also answer every question before anyone looked at your drawing. Then they would leave knowing a great deal about my voice. Put your model at the front. I will be close enough to pass you a ruler.","strategy":"Identify what a speaker is trying to accomplish through the exchange. A concession about speed can serve an argument about recognition rather than efficiency."},{"id":"TSP-032","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It symbolizes an irreversible loss that Kavi finally accepts after recognizing that his earlier ambitions cannot be recovered.","B":"It identifies the event that causes Kavi to withdraw applications for positions he had previously hoped to obtain.","C":"It establishes the station's deterioration as a contrast to the renewed confidence Kavi feels about his career prospects.","D":"It supplies a visual detail that Kavi subsequently uses to understand his own unsettled circumstances."},"answer":"D","explanation":"The rectangles exist independently of Kavi's decisions, but he interprets them through his current uncertainty. The passage explicitly moves from the visual detail to a way of imagining possibilities.","choice_explanations":{"A":"Kavi reads the spaces as potential places for new destinations, not irreversible loss or proof that earlier ambitions are impossible.","B":"The withdrawals occurred that morning, before he saw the board. The detail becomes an analogy, not their cause.","C":"Clearing a board is not deterioration, and Kavi gains tolerable uncertainty rather than confidence about specific prospects.","D":"The rectangles exist independently of Kavi's decisions, but he interprets them through his current uncertainty. The passage explicitly moves from the visual detail to a way of imagining possibilities."},"text":"At the station, Kavi watched the departure board being cleared for the next day's services. Pale rectangles remained where the destination cards had been. He had spent the morning withdrawing applications for jobs he had once been certain he wanted. Now the spaces on the board seemed to him less like absences than like places where another destination might fit. The workman, unaware of Kavi's attention, stacked the discarded cards and went home. Kavi stayed a moment longer. Nothing had been decided for him, but for the first time that day his uncertainty had acquired a shape he could bear to look at.","text_html":"At the station, Kavi watched the departure board being cleared for the next day&#x27;s services. <u>Pale rectangles remained where the destination cards had been.<\/u> He had spent the morning withdrawing applications for jobs he had once been certain he wanted. Now the spaces on the board seemed to him less like absences than like places where another destination might fit. The workman, unaware of Kavi&#x27;s attention, stacked the discarded cards and went home. Kavi stayed a moment longer. Nothing had been decided for him, but for the first time that day his uncertainty had acquired a shape he could bear to look at.","strategy":"In literary function questions, distinguish a detail used to express a mental state from an event that causes that state."},{"id":"TSP-033","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best states the main purpose of the text?","choices":{"A":"To explain how Ada and Ben developed a procedure for making repairs more efficiently than their apprentices could.","B":"To show how the hall's atmosphere changes as inexperienced workers gradually learn to handle unfamiliar tools.","C":"To contrast Ada's apprehension about the apprentices' mistakes with Ben's confidence in their ability to work independently.","D":"To evoke a deliberately prepared setting at the moment before its expected activity begins."},"answer":"D","explanation":"Light, objects, paper, and measured actions construct the setting before work begins. The final sentence anticipates future activity but does not portray it or indicate anxiety about it.","choice_explanations":{"A":"The passage gives preparations, not the development or comparative efficiency of a repair procedure.","B":"The apprentices have not arrived. The anticipated activity is not narrated as a learning process already occurring.","C":"Neither difference in emotion nor a view about independent work is attributed to the characters.","D":"Light, objects, paper, and measured actions construct the setting before work begins. The final sentence anticipates future activity but does not portray it or indicate anxiety about it."},"text":"Before the first shift, the repair hall was quiet enough for Ada to hear the brushes touch the floor. Ben opened the shutters one at a time, directing each strip of light toward a different workbench. On the nearest bench, somebody had arranged the unfinished toys with their broken parts facing outward, as if the defects themselves had been invited to speak first. Ada set a fresh sheet beside every object. Neither she nor Ben hurried. When the apprentices arrived, there would be questions, mistakes, and the scrape of tools; for now the room held all those possibilities without yet committing itself to any of them.","text_html":"Before the first shift, the repair hall was quiet enough for Ada to hear the brushes touch the floor. Ben opened the shutters one at a time, directing each strip of light toward a different workbench. On the nearest bench, somebody had arranged the unfinished toys with their broken parts facing outward, as if the defects themselves had been invited to speak first. Ada set a fresh sheet beside every object. Neither she nor Ben hurried. When the apprentices arrived, there would be questions, mistakes, and the scrape of tools; for now the room held all those possibilities without yet committing itself to any of them.","strategy":"Descriptions of preparation often establish a scene. Do not convert anticipated events into events that have already happened or quietness into anxiety."},{"id":"TSP-034","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best states the main purpose of the text?","choices":{"A":"To show Ruth recognizing that her productivity depends more on conversation than on the privacy she initially requested.","B":"To portray Ruth's competing desires for uninterrupted work and a sense of proximity to others.","C":"To explain how the relocation of Ruth's colleagues eventually enables her to establish a more efficient working routine.","D":"To trace Ruth's shift from appreciating a private workspace to rejecting it as an obstacle to professional relationships."},"answer":"B","explanation":"Privacy continues to have value for Ruth, but complete separation becomes uncomfortable. The final combination of the corner desk and open door expresses both preferences rather than a simple reversal.","choice_explanations":{"A":"The common room slows her writing. Wanting nearby company is not a conclusion that conversation improves productivity.","B":"Privacy continues to have value for Ruth, but complete separation becomes uncomfortable. The final combination of the corner desk and open door expresses both preferences rather than a simple reversal.","C":"The passage tracks mixed feelings, not a demonstrated increase in efficiency after the relocation.","D":"She returns gratefully to the desk; the open door preserves a wish for company without rejecting privacy."},"text":"Ruth had asked for the corner desk because no one passed behind it. For a month she enjoyed finishing a paragraph without turning to greet someone or make room for a trolley. Yet when the neighboring office moved upstairs, she began leaving her door ajar. She could still work undisturbed, but now she paused at sounds that did not come. On Friday she carried her papers to the common room, where the conversation made every sentence take twice as long. At closing time she returned gratefully to her corner and, before sitting down, checked that the door was open.","text_html":"Ruth had asked for the corner desk because no one passed behind it. For a month she enjoyed finishing a paragraph without turning to greet someone or make room for a trolley. Yet when the neighboring office moved upstairs, she began leaving her door ajar. She could still work undisturbed, but now she paused at sounds that did not come. On Friday she carried her papers to the common room, where the conversation made every sentence take twice as long. At closing time she returned gratefully to her corner and, before sitting down, checked that the door was open.","strategy":"When a character retains elements of both choices, a purpose answer describing tension can be better than one describing a completed conversion."},{"id":"TSP-035","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It introduces an inherited interpretation that the later examination challenges without rejecting the broader similarity among the instruments.","B":"It states the conclusion Ro reached after distinguishing superficial differences among otherwise interchangeable components.","C":"It identifies an earlier manufacturing technique whose advantages Ro compares with those of the method used for the surviving instruments.","D":"It establishes an agreed historical fact that Ro uses to explain why the original manufacturers avoided hand-adjusting the rods."},"answer":"A","explanation":"The first sentence supplies the view that the rest of the passage revises. Ro rejects the claim that parts were interchangeable while preserving the narrower claim that their design was shared.","choice_explanations":{"A":"The first sentence supplies the view that the rest of the passage revises. Ro rejects the claim that parts were interchangeable while preserving the narrower claim that their design was shared.","B":"The sentence reports the earlier catalogue's position, which Ro challenges; the parts do not fit interchangeably.","C":"The initial statement is a catalogue interpretation, not a technique whose relative advantages are evaluated.","D":"Interchangeability is precisely what is questioned, and Ro finds evidence of hand adjustment rather than its avoidance."},"text":"The first catalogue of the Valen instrument collection treated its brass measuring rods as interchangeable components of a standardized kit. Later catalogues repeated that description without testing the rods against the surviving mounts. Conservator Ines Ro compared the fittings and found that each rod seated securely in only one mount; tiny variations had been corrected by hand rather than eliminated during manufacture. Ro does not dispute that the instruments shared a common design. She argues, however, that similarity of design has been mistaken for interchangeability of parts, and that the catalogue's language has concealed the individual adjustments visible on the objects.","text_html":"<u>The first catalogue of the Valen instrument collection treated its brass measuring rods as interchangeable components of a standardized kit.<\/u> Later catalogues repeated that description without testing the rods against the surviving mounts. Conservator Ines Ro compared the fittings and found that each rod seated securely in only one mount; tiny variations had been corrected by hand rather than eliminated during manufacture. Ro does not dispute that the instruments shared a common design. She argues, however, that similarity of design has been mistaken for interchangeability of parts, and that the catalogue&#x27;s language has concealed the individual adjustments visible on the objects.","strategy":"Attribute a claim before evaluating its role. A view quoted at the beginning may be the position the passage is about to challenge."},{"id":"TSP-036","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best states the main purpose of the text?","choices":{"A":"To express regret that the speaker's incomplete knowledge prevents the friend from undertaking a journey they once planned together.","B":"To warn a friend that departing without a complete chart would repeat mistakes the speaker has already learned to avoid.","C":"To encourage a friend to pursue an independent course while treating the speaker's experience as useful but incomplete guidance.","D":"To persuade a friend that the speaker's earlier journey provides the most reliable route to an equally successful return."},"answer":"C","explanation":"The speaker offers limited experience without demanding repetition. The final wish for a larger map frames the friend's independence positively while preserving uncertainty about the journey.","choice_explanations":{"A":"The incomplete chart is offered as a starting point, not a barrier, and no shared journey is described.","B":"The poem urges departure and explicitly says the blank is not a warning to remain.","C":"The speaker offers limited experience without demanding repetition. The final wish for a larger map frames the friend's independence positively while preserving uncertainty about the journey.","D":"The speaker does not prescribe the same route or promise success; the friend is invited to discover what the speaker could not."},"text":"Take the unfinished chart, my friend;\nI have not marked the safest shore.\nThe blank is not a warning to remain,\nnor a promise that the crossing will be kind.\nI can tell you where my own boat scraped,\nbut not where yours must turn.\nKeep what is useful of my penciled lines;\nleave room beside them for another hand.\nWhen you return, do not report\nthat every mile agreed with me.\nBring back the names I could not give,\nand let the map be larger than my journey.","text_html":"Take the unfinished chart, my friend;<br>\nI have not marked the safest shore.<br>\nThe blank is not a warning to remain,<br>\nnor a promise that the crossing will be kind.<br>\nI can tell you where my own boat scraped,<br>\nbut not where yours must turn.<br>\nKeep what is useful of my penciled lines;<br>\nleave room beside them for another hand.<br>\nWhen you return, do not report<br>\nthat every mile agreed with me.<br>\nBring back the names I could not give,<br>\nand let the map be larger than my journey.","strategy":"A caution within encouragement does not make the whole passage a warning. Identify the speaker's overall attitude toward the proposed action."},{"id":"TSP-037","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best states the main purpose of the text?","choices":{"A":"To describe how a malfunction in a drying cabinet led workers to develop a more precise way of measuring internal moisture.","B":"To argue that mechanical humidity controls should replace electronic sensors wherever workers need to assess whether an object is dry.","C":"To explain the operation of a moisture-responsive mechanism and distinguish its automatic response from a judgment it cannot itself make.","D":"To compare the accuracy of two humidity-control systems and explain why one requires more frequent manual adjustment."},"answer":"C","explanation":"The central sentences explain the causal sequence from moisture to unequal expansion to vent movement. The ending clarifies what responding to air humidity does not establish about the objects being dried.","choice_explanations":{"A":"No malfunction, historical development, or method of directly measuring internal moisture is described.","B":"The passage explains one mechanism; it neither recommends general replacement nor says the mechanism assesses moisture within an object.","C":"The central sentences explain the causal sequence from moisture to unequal expansion to vent movement. The ending clarifies what responding to air humidity does not establish about the objects being dried.","D":"Electronic sensors are an opening contrast, not a system subjected to a comparative accuracy or adjustment test."},"text":"A workshop's drying cabinet uses neither a timer nor an electronic humidity sensor to open its vents. Instead, each vent is connected to two bonded strips that lengthen by different amounts as they absorb moisture. When the air inside becomes damp, the unequal expansion bends the pair and lifts the vent; as the air dries, the strips straighten and the vent closes. Adjusting the initial spacing changes when opening begins. The cabinet still requires a worker to check whether its contents are dry enough for use, since the vent responds to the surrounding air rather than directly measuring moisture inside each object.","text_html":"A workshop&#x27;s drying cabinet uses neither a timer nor an electronic humidity sensor to open its vents. Instead, each vent is connected to two bonded strips that lengthen by different amounts as they absorb moisture. When the air inside becomes damp, the unequal expansion bends the pair and lifts the vent; as the air dries, the strips straighten and the vent closes. Adjusting the initial spacing changes when opening begins. The cabinet still requires a worker to check whether its contents are dry enough for use, since the vent responds to the surrounding air rather than directly measuring moisture inside each object.","strategy":"A description can mention a familiar alternative to clarify how something works without becoming a comparison, superiority claim, or recommendation."},{"id":"TSP-038","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best states the main purpose of the text?","choices":{"A":"To portray the resolution of an initial distrust that had kept Pavel and the craftswoman from exchanging personal experiences.","B":"To demonstrate that Pavel wins his employer's confidence by successfully correcting a mistake she had been unwilling to acknowledge.","C":"To show how a shared task reduces the formality between two people who have already begun a friendly association.","D":"To explain why the craftswoman replaces formal instruction with independent work after Pavel questions her expertise."},"answer":"C","explanation":"The craftswoman's willingness to share mistakes and assist Pavel makes their interaction less formal. His use of her name and reciprocal story mark that change without requiring hostility or a completed technical success.","choice_explanations":{"A":"Her patient invitation and account of mistakes show openness from the outset; Pavel's formality is not established as distrust.","B":"She volunteers her mistakes, and the repair remains unfinished. The relationship does not depend on a completed repair.","C":"The craftswoman's willingness to share mistakes and assist Pavel makes their interaction less formal. His use of her name and reciprocal story mark that change without requiring hostility or a completed technical success.","D":"Pavel does not question her expertise; they work together, not independently, and no instructional policy change is described."},"text":"On his second day in the workshop, Pavel still called the master craftswoman 'Madam,' though she had already asked him to use her name. She corrected him without impatience, then handed him a drawer that stuck. While he worked, she described the several unsuccessful repairs she herself had tried. Pavel had expected instructions, not this inventory of mistakes. When he suggested moving the lower rail, she fetched the tools and held the drawer while he measured it. The repair was unfinished when the noon bell rang, but at the meal Pavel began an account of his own mishap with a cabinet. This time he addressed her by her name.","text_html":"On his second day in the workshop, Pavel still called the master craftswoman &#x27;Madam,&#x27; though she had already asked him to use her name. She corrected him without impatience, then handed him a drawer that stuck. While he worked, she described the several unsuccessful repairs she herself had tried. Pavel had expected instructions, not this inventory of mistakes. When he suggested moving the lower rail, she fetched the tools and held the drawer while he measured it. The repair was unfinished when the noon bell rang, but at the meal Pavel began an account of his own mishap with a cabinet. This time he addressed her by her name.","strategy":"A relationship can become closer without beginning in conflict. Separate the social effect of a task from whether the task has been completed."},{"id":"TSP-039","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It presents a discrepancy that the remainder of the text explains by distinguishing what the assessments measured.","B":"It describes the evidence that the researchers use to show that repetition had no educational benefit in either set of classes.","C":"It contrasts a laboratory prediction with practical classroom observations, setting up a critique of the earlier experimental setting.","D":"It establishes that the follow-up classes received an inferior form of instruction, explaining why the original evaluation could not be replicated."},"answer":"A","explanation":"The target states the apparent inconsistency. The next sentences account for it through different kinds of tests, not fewer repetitions, incompetent teaching, or score errors.","choice_explanations":{"A":"The target states the apparent inconsistency. The next sentences account for it through different kinds of tests, not fewer repetitions, incompetent teaching, or score errors.","B":"Smaller gains and limited transfer do not mean no benefit; the proposed interpretation allows improved recognition.","C":"Both evaluations concern students using the exercise; no laboratory-versus-classroom contrast is supplied.","D":"The passage explicitly rejects reduced instruction as an explanation and instead contrasts the assessment tasks."},"text":"An early evaluation of a vocabulary exercise found that students improved substantially after repeating short passages with substituted synonyms. Follow-up classes using the same exercise showed much smaller gains, despite completing just as many repetitions. The early evaluation had assessed students with sentences taken from the exercises, whereas the follow-ups asked them to use the words in unfamiliar contexts. Researchers reviewing both sets of results argued that the exercise may have improved recognition of practiced sentences more than flexible use of the vocabulary. They did not find evidence that the later teachers had delivered less instruction or that either set of scores had been calculated incorrectly.","text_html":"An early evaluation of a vocabulary exercise found that students improved substantially after repeating short passages with substituted synonyms. <u>Follow-up classes using the same exercise showed much smaller gains, despite completing just as many repetitions.<\/u> The early evaluation had assessed students with sentences taken from the exercises, whereas the follow-ups asked them to use the words in unfamiliar contexts. Researchers reviewing both sets of results argued that the exercise may have improved recognition of practiced sentences more than flexible use of the vocabulary.
