,"category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to emphasize how the new observations affect interpretations of Etna-4’s history. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The observing team used two independent approaches to estimate ages for a group of stars in Etna-4, and these stars account for a small part of the galaxy’s total mass.","B":"The newly found stars prove that star formation continued in Etna-4 until 800 million years ago.","C":"The discovery of much younger stars complicates the view that Etna-4’s stellar history ended 3 billion years ago, though their origin remains uncertain.","D":"Most of Etna-4’s stars belong to populations older than the newly detected group."},"answer":"C","explanation":"Younger stars challenge a simple historical account, but migration remains an alternative to local recent formation.","choice_explanations":{"A":"Incorrect: This describes validation methods without explaining implications for the model.","B":"Incorrect: This overstates what the ages establish because the stars may have arrived from elsewhere.","C":"Correct: Younger stars challenge a simple historical account, but migration remains an alternative to local recent formation.","D":"Incorrect: This highlights the new group’s small relative mass but does not address the challenged historical interpretation."},"passage":"While researching a topic, a student has taken the following notes:\n• Models of a fictional galaxy, Etna-4, once placed the end of its major star-formation period roughly 3 billion years ago.\n• A new observing campaign detected a group of stars in Etna-4 estimated to be about 800 million years old.\n• The age estimates were confirmed using two independent measurement approaches.\n• The young stars represent a small part of Etna-4’s total stellar mass.\n• Researchers do not yet know whether those stars formed in the galaxy or migrated into it.","notes":["Models of a fictional galaxy, Etna-4, once placed the end of its major star-formation period roughly 3 billion years ago.","A new observing campaign detected a group of stars in Etna-4 estimated to be about 800 million years old.","The age estimates were confirmed using two independent measurement approaches.","The young stars represent a small part of Etna-4’s total stellar mass.","Researchers do not yet know whether those stars formed in the galaxy or migrated into it."],"goal":"emphasize how the new observations affect interpretations of Etna-4’s history","strategy":"Explain why the finding matters in the precise terms supported by the notes, avoiding inflated implications."},{"id":"RS-036","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to emphasize the historical significance of the newly examined records. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The learning circle taught more city residents to read than government-run schools did.","B":"Local textile workers organized a learning circle that remained active for several years.","C":"The records show that education in the city also occurred through a worker-organized learning circle, broadening a history previously centered on official schools.","D":"Lesson plans and attendance sheets from a learning circle founded by textile workers in 1919 remain in the municipal archive, which documents activity continuing through at least 1927."},"answer":"C","explanation":"The documents add a previously neglected type of educational institution to the historical account without claiming unknown literacy outcomes.","choice_explanations":{"A":"Incorrect: This makes a quantitative comparison unsupported by the archive.","B":"Incorrect: This reports organizational details without foregrounding their broader historiographical importance.","C":"Correct: The documents add a previously neglected type of educational institution to the historical account without claiming unknown literacy outcomes.","D":"Incorrect: This simply inventories records and omits how they change historical understanding."},"passage":"While researching a topic, a student has taken the following notes:\n• A fictional municipal archive contains lesson plans and attendance sheets for an informal neighborhood learning circle founded in 1919.\n• The circle was organized by local textile workers, many of whom were women.\n• Previous accounts of education in the city focused mainly on government-operated schools.\n• The learning circle continued through at least 1927.\n• The archive does not indicate how many residents learned to read through the circle.","notes":["A fictional municipal archive contains lesson plans and attendance sheets for an informal neighborhood learning circle founded in 1919.","The circle was organized by local textile workers, many of whom were women.","Previous accounts of education in the city focused mainly on government-operated schools.","The learning circle continued through at least 1927.","The archive does not indicate how many residents learned to read through the circle."],"goal":"emphasize the historical significance of the newly examined records","strategy":"Explain why the finding matters in the precise terms supported by the notes, avoiding inflated implications."},{"id":"RS-037","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to place the adoption of Rell’s revised brake in the sequence of its development. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"In 1921, a factory began using a revised version of Rell’s cable brake.","B":"The factory-produced version of Rell’s brake was easier to adjust than the original prototype.","C":"After proposing the cable brake in 1906 and building a prototype in 1914, Rell saw a revised version adopted for factory bicycles in 1921.","D":"Emi Rell invented a bicycle brake and also wrote a maintenance guide."},"answer":"C","explanation":"The requested context spans proposal, prototype, and adoption, not simply the adoption date or a design feature.","choice_explanations":{"A":"Incorrect: This states only the final step and cannot show its place in the process.","B":"Incorrect: This discusses design improvement but leaves out the requested sequence.","C":"Correct: The requested context spans proposal, prototype, and adoption, not simply the adoption date or a design feature.","D":"Incorrect: This gives unrelated biographical facts without developmental chronology."},"passage":"While researching a topic, a student has taken the following notes:\n• In 1906, fictional inventor Emi Rell proposed a bicycle brake activated by pressing a cable.\n• Rell built a working prototype in 1914.\n• A factory first installed a revised version of the brake on its bicycles in 1921.\n• The 1921 version was easier to adjust than the prototype.\n• Rell later published an illustrated guide to bicycle maintenance.","notes":["In 1906, fictional inventor Emi Rell proposed a bicycle brake activated by pressing a cable.","Rell built a working prototype in 1914.","A factory first installed a revised version of the brake on its bicycles in 1921.","The 1921 version was easier to adjust than the prototype.","Rell later published an illustrated guide to bicycle maintenance."],"goal":"place the adoption of Rell’s revised brake in the sequence of its development","strategy":"Place events in their accurate sequence and use dates or prior positions to explain the requested relationship."},{"id":"RS-038","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to place Nav’s endorsement of the 1868 declaration in the context of her changing views. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Although Nav had opposed public funding for an embankment in 1862, after the 1866 flood she came to support the project and endorsed the 1868 declaration.","B":"The River Protection Declaration, endorsed in 1868, authorized Bellhaven to begin planning an embankment after a flood in 1866 had damaged many riverside homes.","C":"The flood of 1866 damaged homes along Bellhaven’s river, leading the city to consider new defenses.","D":"Nav opposed public funding for a river embankment before the 1866 flood."},"answer":"A","explanation":"The correct choice links Nav’s earlier opposition, the intervening event, and her later support.","choice_explanations":{"A":"Correct: The correct choice links Nav’s earlier opposition, the intervening event, and her later support.","B":"Incorrect: This reports the endorsement without describing the change in position.","C":"Incorrect: This provides background context but does not explain Nav’s shift.","D":"Incorrect: This states the initial view but omits its reversal and the declaration."},"passage":"While researching a topic, a student has taken the following notes:\n• In 1862, councilor Sera Nav opposed using public funds to construct a river embankment in fictional Bellhaven.\n• A severe flood in 1866 damaged many riverside homes.\n• Following the flood, Nav publicly argued that a shared embankment was necessary.\n• Nav endorsed the city’s River Protection Declaration in 1868.\n• The declaration authorized the city to begin planning the embankment.","notes":["In 1862, councilor Sera Nav opposed using public funds to construct a river embankment in fictional Bellhaven.","A severe flood in 1866 damaged many riverside homes.","Following the flood, Nav publicly argued that a shared embankment was necessary.","Nav endorsed the city’s River Protection Declaration in 1868.","The declaration authorized the city to begin planning the embankment."],"goal":"place Nav’s endorsement of the 1868 declaration in the context of her changing views","strategy":"Place events in their accurate sequence and use dates or prior positions to explain the requested relationship."},{"id":"RS-039","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to clarify how the 2022 edition of Lantern Weather relates to earlier publications. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"In 2015, an excerpt from Lantern Weather appeared in a collection of shorter works.","B":"Oren Bell published Lantern Weather in 2008, followed by a collection of short works containing an excerpt in 2015, and his next novel is scheduled for 2028.","C":"Lantern Weather was originally published in 2008 by the writer Oren Bell.","D":"The 2022 edition revised Bell’s 2008 novella Lantern Weather and restored a chapter, following the inclusion of an excerpt in a 2015 collection."},"answer":"D","explanation":"The revised edition’s relationship to the original text and intervening excerpt is the chronological context requested.","choice_explanations":{"A":"Incorrect: This states an intermediate publication without linking it to the revision.","B":"Incorrect: This introduces a later unrelated work rather than the history of Lantern Weather.","C":"Incorrect: This identifies the original edition but omits both the revision and the intervening excerpt.","D":"Correct: The revised edition’s relationship to the original text and intervening excerpt is the chronological context requested."},"passage":"While researching a topic, a student has taken the following notes:\n• Fictional writer Oren Bell published the novella Lantern Weather in 2008.\n• In 2015, Bell included an excerpt of Lantern Weather in a collection of shorter works.\n• A revised edition of the full novella appeared in 2022.\n• The revised edition restored a chapter absent from the 2008 publication.\n• Bell’s next novel is scheduled for 2028.","notes":["Fictional writer Oren Bell published the novella Lantern Weather in 2008.","In 2015, Bell included an excerpt of Lantern Weather in a collection of shorter works.","A revised edition of the full novella appeared in 2022.","The revised edition restored a chapter absent from the 2008 publication.","Bell’s next novel is scheduled for 2028."],"goal":"clarify how the 2022 edition of Lantern Weather relates to earlier publications","strategy":"Place events in their accurate sequence and use dates or prior positions to explain the requested relationship."},{"id":"RS-040","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to explain the order in which the lakebed’s sand and volcanic ash were deposited. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"After Lake Anor drained and exposed its bed, wind deposited sand there; a volcanic ash layer formed above that sand later.","B":"A volcanic ash layer helped researchers match sediment layers across the basin.","C":"Wind deposited sand across Lake Anor’s bed before the outlet opened and the lake drained.","D":"Lake Anor’s former high-water shoreline has been dated to approximately 2,400 years ago, and researchers later used a volcanic ash layer to compare sediments collected across the basin."},"answer":"A","explanation":"The sediment sequence is outlet opening, exposure of lakebed, sand accumulation, and later ash deposition.","choice_explanations":{"A":"Correct: The sediment sequence is outlet opening, exposure of lakebed, sand accumulation, and later ash deposition.","B":"Incorrect: This explains the usefulness of the ash but not its chronological relationship to the sand.","C":"Incorrect: This reverses the documented order of lake drainage and sand deposition.","D":"Incorrect: This provides the earlier shoreline date without the requested sediment sequence."},"passage":"While researching a topic, a student has taken the following notes:\n• Researchers studying a fictional basin dated the last high-water shoreline of Lake Anor to about 2,400 years ago.\n• Evidence suggests the lake’s outlet opened around 2,100 years ago, rapidly lowering the water level.\n• Windblown sand accumulated across the newly exposed lakebed after the drainage event.\n• A thin volcanic ash layer was deposited above much of the sand about 1,700 years ago.\n• Researchers used the ash as a marker to compare sediment layers at different sites.","notes":["Researchers studying a fictional basin dated the last high-water shoreline of Lake Anor to about 2,400 years ago.","Evidence suggests the lake’s outlet opened around 2,100 years ago, rapidly lowering the water level.","Windblown sand accumulated across the newly exposed lakebed after the drainage event.","A thin volcanic ash layer was deposited above much of the sand about 1,700 years ago.","Researchers used the ash as a marker to compare sediment layers at different sites."],"goal":"explain the order in which the lakebed’s sand and volcanic ash were deposited","strategy":"Place events in their accurate sequence and use dates or prior positions to explain the requested relationship."},{"id":"RS-041","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to identify which of Lor’s novels won the Harbor Fiction Prize. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The Harbor Fiction Prize recognizes fiction annually, and Lor has written several books.","B":"Faye Lor published Quiet Maps in 2019 and Stone Lantern in 2022.","C":"Faye Lor’s Stone Lantern won the Harbor Fiction Prize in 2023.","D":"Bright Fern was shortlisted for the Harbor Fiction Prize in 2024."},"answer":"C","explanation":"The notes distinguish a 2023 winner from a 2024 shortlisted novel; only Stone Lantern won.","choice_explanations":{"A":"Incorrect: This supplies award and author background without the winning title.","B":"Incorrect: This gives publication chronology without identifying the prize winner.","C":"Correct: The notes distinguish a 2023 winner from a 2024 shortlisted novel; only Stone Lantern won.","D":"Incorrect: Being shortlisted does not mean winning and refers to a different novel."},"passage":"While researching a topic, a student has taken the following notes:\n• Writer Faye Lor published the novel Stone Lantern in 2022.\n• Stone Lantern received the fictional Harbor Fiction Prize in 2023.\n• Lor’s other novel Bright Fern was shortlisted for the same prize in 2024.\n• The Harbor Fiction Prize is awarded annually.\n• Lor also published the poetry collection Quiet Maps in 2019.","notes":["Writer Faye Lor published the novel Stone Lantern in 2022.","Stone Lantern received the fictional Harbor Fiction Prize in 2023.","Lor’s other novel Bright Fern was shortlisted for the same prize in 2024.","The Harbor Fiction Prize is awarded annually.","Lor also published the poetry collection Quiet Maps in 2019."],"goal":"identify which of Lor’s novels won the Harbor Fiction Prize","strategy":"Extract the exact name, location, kind, object, year, or role requested while ignoring attractive background details."},{"id":"RS-042","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to specify where the inscribed bronze weight was recovered. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The expedition recovered the inscribed bronze weight on the island of Corin.","B":"An inscribed bronze weight was described in the expedition’s 2022 catalog.","C":"Researchers mapped burial mounds on the island of Vassa.","D":"The 2021 expedition examined Pela, Corin, and Vassa."},"answer":"A","explanation":"The archaeological object is explicitly associated with Corin, not the other surveyed islands.","choice_explanations":{"A":"Correct: The archaeological object is explicitly associated with Corin, not the other surveyed islands.","B":"Incorrect: This refers to the publication rather than where the object was found.","C":"Incorrect: This names the location of a different discovery.","D":"Incorrect: This lists the expedition sites but does not identify the weight’s location."},"passage":"While researching a topic, a student has taken the following notes:\n• An expedition in 2021 surveyed three fictional islands: Pela, Corin, and Vassa.\n• On Pela, researchers recorded traces of a stone harbor.\n• On Corin, the expedition recovered an inscribed bronze weight.\n• On Vassa, researchers mapped a cluster of burial mounds.\n• All findings were reported in the expedition’s 2022 catalog.","notes":["An expedition in 2021 surveyed three fictional islands: Pela, Corin, and Vassa.","On Pela, researchers recorded traces of a stone harbor.","On Corin, the expedition recovered an inscribed bronze weight.","On Vassa, researchers mapped a cluster of burial mounds.","All findings were reported in the expedition’s 2022 catalog."],"goal":"specify where the inscribed bronze weight was recovered","strategy":"Extract the exact name, location, kind, object, year, or role requested while ignoring attractive background details."},{"id":"RS-043","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to identify Soran’s scientific field. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Reva Soran worked with an oceanographer and a museum curator on an estuary study.","B":"Oceanographer Lenna Per collaborated with Reva Soran on the research.","C":"The team analyzed nitrogen levels along an estuary.","D":"Reva Soran is a biogeochemist who studies how nutrients circulate through living and nonliving parts of ecosystems."},"answer":"D","explanation":"The notes identify Soran’s discipline directly as biogeochemistry; collaborator disciplines must not be transferred to Soran.","choice_explanations":{"A":"Incorrect: This lists collaborators without specifying Soran’s field.","B":"Incorrect: This identifies a collaborator’s field, not Soran’s.","C":"Incorrect: This describes the topic of a study, not Soran’s professional discipline.","D":"Correct: The notes identify Soran’s discipline directly as biogeochemistry; collaborator disciplines must not be transferred to Soran."},"passage":"While researching a topic, a student has taken the following notes:\n• Dr. Reva Soran studies how nutrients move between water, soil, and living organisms.\n• Soran’s discipline is biogeochemistry.\n• On a recent project, Soran collaborated with oceanographer Lenna Per.\n• Museum curator Kito Venn helped the team catalog its samples.\n• The study examined nitrogen concentrations along a river estuary.","notes":["Dr. Reva Soran studies how nutrients move between water, soil, and living organisms.","Soran’s discipline is biogeochemistry.","On a recent project, Soran collaborated with oceanographer Lenna Per.","Museum curator Kito Venn helped the team catalog its samples.","The study examined nitrogen concentrations along a river estuary."],"goal":"identify Soran’s scientific field","strategy":"Extract the exact name, location, kind, object, year, or role requested while ignoring attractive background details."},{"id":"RS-044","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to identify the instrument used to measure changes in surface height. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Photographs documented changes in the appearance of the bronze mirrors.","B":"The team used a laser profilometer to measure how the bronze mirrors’ surface height changed after cleaning.","C":"The team analyzed both surface shape and the chemistry of bronze-mirror corrosion.","D":"A handheld spectrometer measured the composition of corrosion deposits."},"answer":"B","explanation":"The instrument named in the notes for height measurement is the laser profilometer, not the spectrometer or camera.","choice_explanations":{"A":"Incorrect: This gives the documentation technique instead of the instrument measuring height.","B":"Correct: The instrument named in the notes for height measurement is the laser profilometer, not the spectrometer or camera.","C":"Incorrect: This restates study scope without identifying the requested instrument.","D":"Incorrect: This names the instrument used for a different measurement."},"passage":"While researching a topic, a student has taken the following notes:\n• A fictional museum team examined the surfaces of old bronze mirrors.\n• To measure tiny changes in surface height, it used a device called a laser profilometer.\n• A handheld spectrometer measured the chemical composition of corrosion deposits.\n• Photographs documented the appearance of each mirror.\n• The team repeated the surface-height measurements after cleaning.","notes":["A fictional museum team examined the surfaces of old bronze mirrors.","To measure tiny changes in surface height, it used a device called a laser profilometer.","A handheld spectrometer measured the chemical composition of corrosion deposits.","Photographs documented the appearance of each mirror.","The team repeated the surface-height measurements after cleaning."],"goal":"identify the instrument used to measure changes in surface height","strategy":"Extract the exact name, location, kind, object, year, or role requested while ignoring attractive background details."},{"id":"RS-045","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to make a generalization about the materials used in these restorations. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"The bridges now carry pedestrians and were restored by a preservation group.","B":"The restorations largely preserved the original timber choices but incorporated modern steel connectors at heavily stressed joints.","C":"Every component installed during the restorations was made from traditional wood.","D":"Modern materials replaced almost all of the wood in the three historic bridges."},"answer":"B","explanation":"The notes support a qualified mixture of traditional timber and selective modern connectors, not an all-or-nothing description.","choice_explanations":{"A":"Incorrect: This reports use and ownership without generalizing about materials.","B":"Correct: The notes support a qualified mixture of traditional timber and selective modern connectors, not an all-or-nothing description.","C":"Incorrect: This ignores the explicitly mentioned steel connectors.","D":"Incorrect: This reverses the stated predominance of timber and exaggerates modern substitution."},"passage":"While researching a topic, a student has taken the following notes:\n• A fictional preservation group restored three historic wooden footbridges.\n• For most replacement boards, workers used timber from the same species as the original bridge.\n• Where joints carried exceptional loads, workers installed modern steel connectors.\n• Workers documented which components had been replaced.\n• The restored bridges are now open to pedestrians.","notes":["A fictional preservation group restored three historic wooden footbridges.","For most replacement boards, workers used timber from the same species as the original bridge.","Where joints carried exceptional loads, workers installed modern steel connectors.","Workers documented which components had been replaced.","The restored bridges are now open to pedestrians."],"goal":"make a generalization about the materials used in these restorations","strategy":"Generalize from the notes without dropping exceptions, quantities, or scope restrictions."},{"id":"RS-046","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to generalize about the use of captions across the six libraries. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"All six libraries shared the same platform for posting online readings.","B":"Every library included captions with its recordings.","C":"Two libraries made their online readings available as audio recordings.","D":"Most, but not all, of the libraries included synchronized captions in their online readings."},"answer":"D","explanation":"Four of six is a majority, but two lack captions, so the precise generalization is “most, but not all.”","choice_explanations":{"A":"Incorrect: This is a different shared feature and not about caption use.","B":"Incorrect: This incorrectly treats the four captioned libraries as all six.","C":"Incorrect: This notes only a subset and fails to capture the prevalence across all six.","D":"Correct: Four of six is a majority, but two lack captions, so the precise generalization is “most, but not all.”"},"passage":"While researching a topic, a student has taken the following notes:\n• Six fictional neighborhood libraries began offering online readings.\n• Four libraries added synchronized captions to their recordings.\n• Two libraries provided audio recordings without captions.\n• All six libraries posted their recordings on the same platform.\n• The project was funded through a local grant.","notes":["Six fictional neighborhood libraries began offering online readings.","Four libraries added synchronized captions to their recordings.","Two libraries provided audio recordings without captions.","All six libraries posted their recordings on the same platform.","The project was funded through a local grant."],"goal":"generalize about the use of captions across the six libraries","strategy":"Generalize from the notes without dropping exceptions, quantities, or scope restrictions."},{"id":"RS-047","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to make a generalization about the dispersal strategies found among the studied Ulna species. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Ulna rubra is the only Ulna species that uses insects to disperse seeds.","B":"All species in the genus Ulna use either wind or insects to disperse their seeds.","C":"Among the three Ulna species examined, some disperse seeds by wind while another relies on insects.","D":"The study focused on Ulna argent and Ulna brevis, two wind-dispersed species."},"answer":"C","explanation":"The evidence supports variation within the three sampled species but not a claim about every member of the genus.","choice_explanations":{"A":"Incorrect: This falsely generalizes uniqueness from the sample to the genus.","B":"Incorrect: This extends a three-species sample into an unsupported claim about the entire genus.","C":"Correct: The evidence supports variation within the three sampled species but not a claim about every member of the genus.","D":"Incorrect: This excludes the insect-dispersed species and therefore fails to generalize across the studied set."},"passage":"While researching a topic, a student has taken the following notes:\n• Botanists studied seed dispersal in three fictional species of the genus Ulna.\n• Ulna argent has lightweight winged seeds dispersed by wind.\n• Ulna brevis has lightweight winged seeds dispersed by wind.\n• Ulna rubra produces nutrient-coated seeds that ants carry away to their nests.\n• The botanists did not examine any other species of Ulna.","notes":["Botanists studied seed dispersal in three fictional species of the genus Ulna.","Ulna argent has lightweight winged seeds dispersed by wind.","Ulna brevis has lightweight winged seeds dispersed by wind.","Ulna rubra produces nutrient-coated seeds that ants carry away to their nests.","The botanists did not examine any other species of Ulna."],"goal":"make a generalization about the dispersal strategies found among the studied Ulna species","strategy":"Generalize from the notes without dropping exceptions, quantities, or scope restrictions."},{"id":"RS-048","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to make a cautious generalization about the observed electricity spending. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Rooftop solar panels reduced electricity spending at every center in the evaluation.","B":"The study proves that solar panels caused the spending decreases at three centers.","C":"Because electricity use varied, the researchers were unable to compare spending before and after installation.","D":"Electricity spending declined at three of the five centers after installation but was roughly unchanged at the other two."},"answer":"D","explanation":"The notes establish a mixed before-and-after pattern, not universal savings or a controlled causal effect.","choice_explanations":{"A":"Incorrect: This wrongly states that all five centers experienced declines.","B":"Incorrect: This asserts causation that the uncontrolled before-and-after data cannot isolate.","C":"Incorrect: This invents an inability to compare spending despite explicit before-and-after totals.","D":"Correct: The notes establish a mixed before-and-after pattern, not universal savings or a controlled causal effect."},"passage":"While researching a topic, a student has taken the following notes:\n• An evaluation followed five fictional community centers that installed rooftop solar panels.\n• Three centers spent less on electricity during the first year after installation than in the year before.\n• Two centers spent about the same amount in both years.\n• The evaluation did not include a matched group of centers without solar panels.\n• Electricity use varied between the centers.","notes":["An evaluation followed five fictional community centers that installed rooftop solar panels.","Three centers spent less on electricity during the first year after installation than in the year before.","Two centers spent about the same amount in both years.","The evaluation did not include a matched group of centers without solar panels.","Electricity use varied between the centers."],"goal":"make a cautious generalization about the observed electricity spending","strategy":"Generalize from the notes without dropping exceptions, quantities, or scope restrictions."}]},{"category":"Expression of Ideas","subcategory":"Transitions","questions":[{"id":"TRN-001","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For example,","B":"Likewise,","C":"However,","D":"Therefore,"},"answer":"C","explanation":"The real-world result contradicts the predicted insulation advantage, so a contrast transition is required.","choice_explanations":{"A":"Incorrect: The trial is counterevidence to a specific prediction, not an example of the covering performing well.","B":"Incorrect: The simulated success and the observed result are not similar outcomes.","C":"Correct: The real-world result contradicts the predicted insulation advantage, so a contrast transition is required.","D":"Incorrect: The team did not predict that the covering would fail; the experimental outcome contradicts the expected advantage."},"passage":"A greenhouse team expected a new ceramic covering to prevent rapid heat loss at night. The covering had performed well in a theoretical simulation, and the researchers anticipated a clear advantage over bare planters. _______ a comparison trial showed that covered planters cooled just as quickly as uncovered ones.","strategy":"Identify the change or contradiction: the next statement conflicts with, rather than follows from, the earlier one."},{"id":"TRN-002","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"To put it another way,","B":"By contrast,","C":"Similarly,","D":"As a result,"},"answer":"B","explanation":"The second sentence sets access under a new system against the travel requirement imposed by the old system.","choice_explanations":{"A":"Incorrect: Global digital access is not a restatement of the requirement to travel to the archive; it is a change in access.","B":"Correct: The second sentence sets access under a new system against the travel requirement imposed by the old system.","C":"Incorrect: The new arrangement reverses the earlier access limitation instead of sharing it.","D":"Incorrect: The previous travel requirement did not cause the digital maps to be accessible worldwide."},"passage":"At that time, the maps were too fragile for staff to send out as loans. When only printed copies were available, visitors had to travel to the regional archive to study its maps. _______ the archive's recently released digital collection can be viewed from any location with internet access.","strategy":"Identify the change or contradiction: the next statement conflicts with, rather than follows from, the earlier one."},{"id":"TRN-003","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"However,","B":"Likewise,","C":"For instance,","D":"Consequently,"},"answer":"A","explanation":"The sensor records challenge the planners' description by showing substantial winter use.","choice_explanations":{"A":"Correct: The sensor records challenge the planners' description by showing substantial winter use.","B":"Incorrect: The two accounts disagree rather than present parallel findings.","C":"Incorrect: Frequent crossings are not an example of the courtyard being deserted.","D":"Incorrect: The planners' account did not cause the high numbers recorded by the sensors."},"passage":"The planners drew their conclusions from occasional visits during weekday mornings. In interviews, planners described a public courtyard as largely deserted during the winter. _______ records from motion sensors showed hundreds of people crossing the courtyard on most winter days.","strategy":"Identify the change or contradiction: the next statement conflicts with, rather than follows from, the earlier one."},{"id":"TRN-004","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For example,","B":"Instead,","C":"Similarly,","D":"Previously,"},"answer":"B","explanation":"Reinforcing the existing wood is the alternative selected in place of replacement with concrete.","choice_explanations":{"A":"Incorrect: The vote describes the chosen alternative, not an illustrative case of rejection.","B":"Correct: Reinforcing the existing wood is the alternative selected in place of replacement with concrete.","C":"Incorrect: Strengthening the old structure is not the same action as replacing it with concrete.","D":"Incorrect: The vote occurs after the inspection, not before the earlier proposal."},"passage":"The restoration committee originally planned to replace an old footbridge with a modern concrete structure. After examining the bridge's intact wooden supports, it rejected the proposal. _______ the committee voted to reinforce the original timbers.","strategy":"Identify the change or contradiction: the next statement conflicts with, rather than follows from, the earlier one."},{"id":"TRN-005","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For example,","B":"Likewise,","C":"Even so,","D":"For this reason,"},"answer":"C","explanation":"The room is unexpectedly popular even though its location and access were expected to deter visits.","choice_explanations":{"A":"Incorrect: High attendance is not an illustrative case of an unwelcoming stairway or a windowless room.","B":"Incorrect: The passage contrasts an expectation with an outcome, not two similar cases.","C":"Correct: The room is unexpectedly popular even though its location and access were expected to deter visits.","D":"Incorrect: The inconveniences were expected to reduce attendance, not cause the room to become popular."},"passage":"A city's underground reading room has no windows and is reached by a steep, narrow staircase. Librarians had feared that these conditions would discourage students from visiting, especially during the winter. _______ since opening, the room has become one of the library's most heavily used spaces.","strategy":"Treat the initial fact as a possible obstacle or reason to expect the opposite; look for a result that occurs despite it."},{"id":"TRN-006","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Nevertheless,","B":"Similarly,","C":"Therefore,","D":"For example,"},"answer":"A","explanation":"The model's strength on routine language is qualified by a limitation in figurative contexts.","choice_explanations":{"A":"Correct: The model's strength on routine language is qualified by a limitation in figurative contexts.","B":"Incorrect: The two performance results are different, not parallel successes.","C":"Incorrect: Good performance on routine instructions does not logically produce poor handling of figurative language.","D":"Incorrect: Loss of nuance in figurative passages does not exemplify success on straightforward tasks."},"passage":"A translation model accurately handles nearly every expression in a set of routine instructions. Such success suggests that it could be useful for straightforward tasks. _______ linguists caution that the model frequently loses the subtleties of figurative passages.","strategy":"Treat the initial fact as a possible obstacle or reason to expect the opposite; look for a result that occurs despite it."},{"id":"TRN-007","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For this reason,","B":"In the same way,","C":"Despite this limitation,","D":"For instance,"},"answer":"C","explanation":"The team identified plants using physical features even though the planned DNA method was unavailable.","choice_explanations":{"A":"Incorrect: The genetic-test limitation did not make the seed coats identifiable.","B":"Incorrect: The passage discusses an alternative approach, not a second analogous DNA-based approach.","C":"Correct: The team identified plants using physical features even though the planned DNA method was unavailable.","D":"Incorrect: Identifying plants is a countervailing accomplishment, not an example of failing to test DNA."},"passage":"Seeds recovered from the excavation were too degraded for genetic testing. This meant researchers could not determine their species from DNA. _______ distinctive patterns on the surviving seed coats allowed the team to identify several cultivated plants.","strategy":"Treat the initial fact as a possible obstacle or reason to expect the opposite; look for a result that occurs despite it."},{"id":"TRN-008","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Nonetheless,","B":"Accordingly,","C":"For example,","D":"Likewise,"},"answer":"A","explanation":"Complete sampling is surprising given the major delay and the investigators' expectations.","choice_explanations":{"A":"Correct: Complete sampling is surprising given the major delay and the investigators' expectations.","B":"Incorrect: The delay would suggest fewer completed sites, not the successful completion described.","C":"Incorrect: Full coverage is not a specific illustration of the rainfall delay.","D":"Incorrect: No comparable team or similar outcome is described."},"passage":"Unusually heavy rain kept the field team from entering the study area for almost half the summer. The investigators had expected to leave several sites unexamined. _______ by the first frost, they had collected samples from every site on their original list.","strategy":"Treat the initial fact as a possible obstacle or reason to expect the opposite; look for a result that occurs despite it."},{"id":"TRN-009","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"In contrast,","B":"Consequently,","C":"For instance,","D":"Previously,"},"answer":"B","explanation":"Reduced direct solar heating produces the observed temperature difference.","choice_explanations":{"A":"Incorrect: The cooler leaves are the expected effect of shading, not a competing claim about the cloth.","B":"Correct: Reduced direct solar heating produces the observed temperature difference.","C":"Incorrect: The plant temperatures report an outcome, not one example of a kind of cloth.","D":"Incorrect: The text provides no earlier period to contrast with a later one."},"passage":"A woven shade cloth blocks most direct midday sunlight while allowing air to circulate around the leaves below it. _______ plants grown under the cloth tend to experience lower leaf temperatures than those in direct sun.","strategy":"Name the cause and its outcome; reject transitions that imply similarity, contrast, or merely another example."},{"id":"TRN-010","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"As a result,","B":"In much the same way,","C":"Conversely,","D":"For example,"},"answer":"A","explanation":"Repeated damage is the reason the managers relocated the route.","choice_explanations":{"A":"Correct: Repeated damage is the reason the managers relocated the route.","B":"Incorrect: Relocating a path is a response to storm damage, not an analogous process occurring elsewhere.","C":"Incorrect: The relocation responds to the damage, not an opposite process happening in another location.","D":"Incorrect: Moving the entire route is a response to the problem, not an example of a sign being erased."},"passage":"The dunes shifted several meters during the storm season. Seasonal storms repeatedly erased trail markers placed on a narrow, unstable dune. Each replacement sign lasted only a few weeks. _______ park managers moved the walking route to firmer ground farther inland.","strategy":"Name the cause and its outcome; reject transitions that imply similarity, contrast, or merely another example."},{"id":"TRN-011","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For instance,","B":"Previously,","C":"By comparison,","D":"Therefore,"},"answer":"D","explanation":"The oxygen-poor conditions help account for the pigments' exceptional survival.","choice_explanations":{"A":"Incorrect: The condition of the pigments is a consequence of preservation, not a particular instance of oxygen restriction.","B":"Incorrect: The statement concerns a present observation explained by past conditions, not an earlier event.","C":"Incorrect: No other collection of tiles is being compared.","D":"Correct: The oxygen-poor conditions help account for the pigments' exceptional survival."},"passage":"When a river overflowed its banks, a layer of fine silt buried a set of painted clay tiles. The silt restricted the amount of oxygen reaching the painted surfaces for centuries. _______ many of the tiles still retain unusually vivid pigments.","strategy":"Name the cause and its outcome; reject transitions that imply similarity, contrast, or merely another example."},{"id":"TRN-012","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Nevertheless,","B":"For example,","C":"Likewise,","D":"Thus,"},"answer":"D","explanation":"The lack of usable visibility directly explains the decision to postpone.","choice_explanations":{"A":"Incorrect: Postponement is consistent with the fog problem rather than occurring despite it.","B":"Incorrect: The postponement is the outcome of the visibility problem, not an illustrative case of unclear images.","C":"Incorrect: There is no second mission being compared.","D":"Correct: The lack of usable visibility directly explains the decision to postpone."},"passage":"Surveyors needed clear views of the valley floor and the cliff faces to construct an accurate map. Dense fog obscured a mountain pass for three consecutive mornings. The aerial mapping crew could not obtain clear images of its slopes. _______ the flight was postponed until visibility improved.","strategy":"Name the cause and its outcome; reject transitions that imply similarity, contrast, or merely another example."},{"id":"TRN-013","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For example,","B":"By contrast,","C":"Instead,","D":"Consequently,"},"answer":"A","explanation":"Desert beetles provide a particular instance of insects using vibrations to detect other organisms.","choice_explanations":{"A":"Correct: Desert beetles provide a particular instance of insects using vibrations to detect other organisms.","B":"Incorrect: The example agrees with the general statement rather than challenging it.","C":"Incorrect: The beetles exemplify the vibration-sensing method rather than substituting a different one.","D":"Incorrect: The general fact did not cause the beetles' behavior."},"passage":"Direct sight is not always needed for an animal to detect the approach of another organism. Some insects locate other organisms by sensing vibrations moving through nearby surfaces. _______ certain desert beetles orient toward the minute disturbances that a walking animal transmits through sand.","strategy":"A later concrete case demonstrates the earlier generalization without reversing or merely repeating it."},{"id":"TRN-014","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Nevertheless,","B":"Meanwhile,","C":"For instance,","D":"In other words,"},"answer":"C","explanation":"Bark from fallen branches is one concrete discarded material used in dye production.","choice_explanations":{"A":"Incorrect: Nothing about bark dye contradicts or qualifies the broader statement.","B":"Incorrect: The passage does not describe simultaneous actions whose timing matters.","C":"Correct: Bark from fallen branches is one concrete discarded material used in dye production.","D":"Incorrect: The second sentence names one material rather than restating the entire general practice."},"passage":"Because collecting fresh plants could be labor-intensive, artisans often used materials close at hand. Traditional dyemakers sometimes obtained pigments from materials that would otherwise have been discarded. _______ bark from fallen branches could be boiled to create a durable brown dye.","strategy":"A later concrete case demonstrates the earlier generalization without reversing or merely repeating it."},{"id":"TRN-015","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Conversely,","B":"To illustrate,","C":"As a result,","D":"Instead,"},"answer":"B","explanation":"The spaces behind roof tiles are an illustrative architectural feature that creates nesting opportunities.","choice_explanations":{"A":"Incorrect: The second sentence reinforces rather than reverses the first.","B":"Correct: The spaces behind roof tiles are an illustrative architectural feature that creates nesting opportunities.","C":"Incorrect: Nesting in roof gaps illustrates the general claim; the sentence is not presented as a consequence caused by the statement of that claim.","D":"Incorrect: Roof gaps are not proposed as an alternative to the use of building details; they are such a detail."},"passage":"Tiny details in city buildings can create nesting spaces for birds that usually nest in natural rock cavities. _______ the narrow gaps behind ornamental roof tiles offer sheltered places where swifts can raise their young.","strategy":"A later concrete case demonstrates the earlier generalization without reversing or merely repeating it."},{"id":"TRN-016","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For example,","B":"All things considered,","C":"Conversely,","D":"Thus,"},"answer":"A","explanation":"A newly informative ledger is a single case that illustrates the possible significance of neglected records.","choice_explanations":{"A":"Correct: A newly informative ledger is a single case that illustrates the possible significance of neglected records.","B":"Incorrect: The ledger is one concrete case, not an overall evaluation or synthesis of several independent findings.","C":"Incorrect: The ledger supports the earlier point rather than indicating the opposite.","D":"Incorrect: The specific discovery is evidence for the broad claim, not an effect caused by that claim."},"passage":"Many damaged documents enter archives without catalog descriptions because their purpose is unclear. Records initially considered unimportant can sometimes change historians' understanding of regional trade. _______ a damaged merchant's ledger revealed that goods passed through a remote harbor decades earlier than scholars had believed.","strategy":"A later concrete case demonstrates the earlier generalization without reversing or merely repeating it."},{"id":"TRN-017","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Specifically,","B":"Nevertheless,","C":"On the other hand,","D":"As a result,"},"answer":"A","explanation":"The second sentence identifies the exact property and measurement that defined the investigation.","choice_explanations":{"A":"Correct: The second sentence identifies the exact property and measurement that defined the investigation.","B":"Incorrect: The chosen measurement is compatible with the narrow scope, not a surprising exception to it.","C":"Incorrect: The precise measurement defines the chosen study focus instead of presenting an opposing investigation.","D":"Incorrect: The statement reports what the study examined, not an outcome caused by limiting the scope."},"passage":"The acousticians limited their investigation to one property of the concert hall rather than evaluating its overall design. _______ they measured how the shape of the ceiling affected the time taken for echoes to fade.","strategy":"Ask which aspect of the preceding broad statement the following sentence defines or specifies."},{"id":"TRN-018","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"In particular,","B":"Previously,","C":"Moreover,","D":"By comparison,"},"answer":"A","explanation":"The sensor error singles out one identifiable limitation from the broader set.","choice_explanations":{"A":"Correct: The sensor error singles out one identifiable limitation from the broader set.","B":"Incorrect: The passage provides no change in time or sequence of tests.","C":"Incorrect: The sensor error is one of the limitations already introduced, not a separate additional category of finding.","D":"Incorrect: No second rover or other sensor is presented for comparison."},"passage":"The rover navigated reliably on flat terrain but performed less consistently in complex lighting and steep topography. Tests revealed several limitations in the rover's autonomous navigation system. _______ its height sensor sometimes misread steep slopes when sunlight struck the ground at a low angle.","strategy":"Ask which aspect of the preceding broad statement the following sentence defines or specifies."},{"id":"TRN-019","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Consequently,","B":"By contrast,","C":"More specifically,","D":"In conclusion,"},"answer":"C","explanation":"The second sentence spells out the particular ventilation-system alteration mentioned generally in the first.","choice_explanations":{"A":"Incorrect: Installing baffles is the nature of the alteration, not a later effect of that alteration.","B":"Incorrect: Baffles in ventilation ducts are consistent with the stated method, not its opposite.","C":"Correct: The second sentence spells out the particular ventilation-system alteration mentioned generally in the first.","D":"Incorrect: The passage elaborates on a method instead of summing up an argument."},"passage":"The builders controlled street noise using an alteration to the ventilation system rather than by installing thicker walls. _______ they inserted narrow sound-absorbing baffles near the openings of the air ducts.","strategy":"Ask which aspect of the preceding broad statement the following sentence defines or specifies."},{"id":"TRN-020","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"To be precise,","B":"Meanwhile,","C":"Nonetheless,","D":"For this reason,"},"answer":"A","explanation":"The sentence supplies the study's exact operational criterion for the term 'recovery.'","choice_explanations":{"A":"Correct: The sentence supplies the study's exact operational criterion for the term 'recovery.'","B":"Incorrect: The sentence is a definition, not an event occurring at the same time as something else.","C":"Incorrect: The survival requirement does not oppose the statement that the definition is strict.","D":"Incorrect: The definition does not follow as a consequence of people using the word casually; it states the researchers' chosen meaning."},"passage":"The investigators defined 'recovery' more strictly than the word is often used in casual discussions of habitat restoration. _______ a site was considered recovered only if new plants survived at least two full growing seasons.","strategy":"Ask which aspect of the preceding broad statement the following sentence defines or specifies."},{"id":"TRN-021","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For example,","B":"In other words,","C":"In contrast,","D":"Moreover,"},"answer":"D","explanation":"Lower power consumption is a second distinct improvement in addition to better resolution.","choice_explanations":{"A":"Incorrect: Energy efficiency is a different benefit from optical resolution, not an example of greater detail.","B":"Incorrect: Less power use does not restate the image-resolution improvement.","C":"Incorrect: The two features are compatible improvements, not competing results.","D":"Correct: Lower power consumption is a second distinct improvement in addition to better resolution."},"passage":"The new instrument was intended for long observation sessions in remote laboratories. A redesigned microscope resolves details that the older instrument could not distinguish. _______ its compact light source consumes less electrical power than the one used in the previous model.","strategy":"Both statements contribute different, compatible facts; neither is just an example or a consequence of the other."},{"id":"TRN-022","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Additionally,","B":"Instead,","C":"To put it another way,","D":"As a result,"},"answer":"A","explanation":"Audio descriptions complement tactile replicas as a distinct accessibility service.","choice_explanations":{"A":"Correct: Audio descriptions complement tactile replicas as a distinct accessibility service.","B":"Incorrect: The museum added descriptions rather than replacing the tactile replicas.","C":"Incorrect: Audio descriptions are a distinct service, not a paraphrase of making tactile sculpture replicas.","D":"Incorrect: The passage does not state that the tactile replicas caused the museum to introduce audio descriptions."},"passage":"The institution wanted visitors to experience art through more than one sensory channel. To make its collection more accessible, a museum commissioned tactile replicas of several sculptures. _______ it introduced audio descriptions of the permanent galleries for visitors who prefer listening to printed labels.","strategy":"Both statements contribute different, compatible facts; neither is just an example or a consequence of the other."},{"id":"TRN-023","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For instance,","B":"Furthermore,","C":"Consequently,","D":"By comparison,"},"answer":"B","explanation":"Ease of cleaning is another independent practical advantage of the container.","choice_explanations":{"A":"Incorrect: A removable lid is not an instance of being squeezable without cracking.","B":"Correct: Ease of cleaning is another independent practical advantage of the container.","C":"Incorrect: The lid's design is not caused by the container's flexibility.","D":"Incorrect: Both sentences describe the same container's advantages rather than comparing two containers' performance on the same feature."},"passage":"The sample container was developed for fieldworkers who must transport and clean their equipment repeatedly. Unlike an ordinary glass vial, the flexible sample container can be squeezed without cracking. _______ its removable lid makes the interior easy to wash between experiments.","strategy":"Both statements contribute different, compatible facts; neither is just an example or a consequence of the other."},{"id":"TRN-024","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For example,","B":"By contrast,","C":"Nevertheless,","D":"In addition,"},"answer":"D","explanation":"Providing scans is a separate service that complements physical preservation of the originals.","choice_explanations":{"A":"Incorrect: Online scans are not a specific illustration of keeping notebooks in temperature-controlled cabinets.","B":"Incorrect: Offering scans complements the preservation of physical notebooks; the services are not opposed.","C":"Incorrect: The availability of digital scans does not contradict safe storage of the originals.","D":"Correct: Providing scans is a separate service that complements physical preservation of the originals."},"passage":"Its collection spans decades of field observations and includes several irreplaceable hand-drawn diagrams. The research archive protects original field notebooks in temperature-controlled cabinets. _______ it makes high-resolution scans of the notebooks available to scholars who cannot visit the collection.","strategy":"Both statements contribute different, compatible facts; neither is just an example or a consequence of the other."},{"id":"TRN-025","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"In conclusion,","B":"Similarly,","C":"Next,","D":"For example,"},"answer":"C","explanation":"Application of the chosen solvent is the next step after inspection and selection.","choice_explanations":{"A":"Incorrect: The second action continues the procedure rather than summarizing it.","B":"Incorrect: Choosing a solvent and applying it are sequential stages, not comparable procedures in different situations.","C":"Correct: Application of the chosen solvent is the next step after inspection and selection.","D":"Incorrect: Applying the solvent is the next action, not a specimen of the earlier decision to select one."},"passage":"To restore a damaged mural, workers first brushed away loose dust. After examining the remaining residue, they selected a solvent that would not disturb the paint. _______ they applied the solvent to soften the old adhesive.","strategy":"Track dates, stages, and explicit sequence markers rather than treating temporal succession as logical causation."},{"id":"TRN-026","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For example,","B":"In much the same way,","C":"Beforehand,","D":"Soon afterward,"},"answer":"D","explanation":"The return follows the completion of sonar repairs in an explicit chronological sequence.","choice_explanations":{"A":"Incorrect: The return trip is a later stage, not an instance of equipment repair.","B":"Incorrect: Mapping the deeper channels follows the repair in a timeline rather than resembling a separate repair procedure.","C":"Incorrect: Returning to map deeper water is not presented as occurring before the equipment repairs.","D":"Correct: The return follows the completion of sonar repairs in an explicit chronological sequence."},"passage":"A survey ship charted shallow channels in May. In early June, its crew finished repairing the sonar equipment needed for deeper water. _______ the ship returned to map the deeper sections of the harbor.","strategy":"Track dates, stages, and explicit sequence markers rather than treating temporal succession as logical causation."},{"id":"TRN-027","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Conversely,","B":"For instance,","C":"Finally,","D":"Similarly,"},"answer":"C","explanation":"Firing is the final described stage following kneading, shaping, and drying.","choice_explanations":{"A":"Incorrect: Firing does not reverse any earlier step; the stages are complementary.","B":"Incorrect: Firing is a later stage of the process, not an example of kneading or shaping.","C":"Correct: Firing is the final described stage following kneading, shaping, and drying.","D":"Incorrect: The steps occur in a sequence, not as analogous practices in separate settings."},"passage":"A potter first kneads clay to remove trapped air and then shapes a vessel on a wheel. Once the vessel has dried, it is ready for heat treatment. _______ the potter fires the vessel in a kiln.","strategy":"Track dates, stages, and explicit sequence markers rather than treating temporal succession as logical causation."},{"id":"TRN-028","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Specifically,","B":"Eventually,","C":"Beforehand,","D":"In contrast,"},"answer":"B","explanation":"Completion is the delayed endpoint of a project interrupted and then restarted.","choice_explanations":{"A":"Incorrect: Completion is the final event, not a more detailed description of the new grant.","B":"Correct: Completion is the delayed endpoint of a project interrupted and then restarted.","C":"Incorrect: Completion took place after, not before, the renewed construction.","D":"Incorrect: Opening is the outcome of renewed work, not an opposing fact about the observatory."},"passage":"Construction of a hilltop observatory began in 1988, but the building was abandoned when funding disappeared. A new grant allowed work to resume nearly a decade later. _______ the facility was completed and opened to visitors.","strategy":"Track dates, stages, and explicit sequence markers rather than treating temporal succession as logical causation."},{"id":"TRN-029","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Nevertheless,","B":"As a result,","C":"For example,","D":"Similarly,"},"answer":"D","explanation":"Both groups use rooftops to guide rainfall into storage containers.","choice_explanations":{"A":"Incorrect: The practices are alike; there is no failed expectation or meaningful opposition.","B":"Incorrect: The second island's practice is not presented as caused by the first island's practice.","C":"Incorrect: The second island is an independent parallel case, not a detail of how the first island stores water.","D":"Correct: Both groups use rooftops to guide rainfall into storage containers."},"passage":"Neither island has large rivers, so stored precipitation helps households cope with dry seasons. On one island, homes collect rainwater in underground tanks connected to sloping roofs. _______ families on a nearby island use roof channels to direct rainfall into covered cisterns.","strategy":"Check that different subjects undergo analogous processes or show similar behavior."},{"id":"TRN-030","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"On the contrary,","B":"Likewise,","C":"Previously,","D":"Therefore,"},"answer":"B","explanation":"Each experiment shows recognition despite a change to a superficial feature of the music.","choice_explanations":{"A":"Incorrect: The second result supports a parallel finding rather than contradicting the first.","B":"Correct: Each experiment shows recognition despite a change to a superficial feature of the music.","C":"Incorrect: No temporal comparison between an earlier and later practice is at issue.","D":"Incorrect: Recognizing sped-up melodies does not cause recognition on different instruments."},"passage":"The experiments were designed to investigate which properties of a melody remain recognizable after a recording is altered. In one listening experiment, participants recognized familiar tunes even after the recordings were sped up. _______ in a separate experiment, listeners identified those tunes when they were played on unfamiliar instruments.","strategy":"Check that different subjects undergo analogous processes or show similar behavior."},{"id":"TRN-031","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"In much the same way,","B":"However,","C":"To conclude,","D":"Consequently,"},"answer":"A","explanation":"Two different performance groups let spectators influence the order of their works.","choice_explanations":{"A":"Correct: Two different performance groups let spectators influence the order of their works.","B":"Incorrect: The two participation models are similar rather than being in opposition.","C":"Incorrect: The dance example offers a parallel case, not a summary of an argument.","D":"Incorrect: The dance company's approach is not established as a consequence of the theater group's practice."},"passage":"The performances are designed so that scenes can be reordered without changing the central story. A theater group allows audiences to vote on the order in which its scenes are presented. _______ a contemporary dance company invites spectators to select which sequence of movements its performers will execute.","strategy":"Check that different subjects undergo analogous processes or show similar behavior."},{"id":"TRN-032","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Likewise,","B":"Instead,","C":"As a result,","D":"For instance,"},"answer":"A","explanation":"The lakes display comparable temperature changes under the same condition.","choice_explanations":{"A":"Correct: The lakes display comparable temperature changes under the same condition.","B":"Incorrect: The second lake does not show an alternative to cooling after sunset; it shows the same pattern.","C":"Incorrect: Cooling in one lake is not said to cause cooling in the other.","D":"Incorrect: The second lake is a separate parallel observation, not an example of a process acting within the first lake."},"passage":"The scientists compared overnight cooling in bodies of water with similar depth and exposure to wind. Researchers found that a shallow lake's surface temperature fell rapidly once the sun had set. _______ a second lake of comparable depth experienced an equally sharp drop in surface temperature after sunset.","strategy":"Check that different subjects undergo analogous processes or show similar behavior."},{"id":"TRN-033","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For this reason,","B":"For example,","C":"By contrast,","D":"In other words,"},"answer":"D","explanation":"Grouping by authors' relationships instead of dates is restated as organizing by collaborative networks rather than chronology.","choice_explanations":{"A":"Incorrect: The second sentence explains the same organizational principle, not a separate event caused by it.","B":"Incorrect: The second sentence paraphrases the organizing principle; it does not offer a sample group of documents.","C":"Incorrect: The two sentences describe the same organizational system in compatible terms.","D":"Correct: Grouping by authors' relationships instead of dates is restated as organizing by collaborative networks rather than chronology."},"passage":"Two documents written decades apart can belong to the same cluster. The archive groups documents according to relationships among their creators rather than the dates on which the documents were written. _______ the collection's arrangement reflects networks of collaboration, not a timeline.","strategy":"Test whether the second statement expresses the first proposition in different terms, rather than adding separate evidence."},{"id":"TRN-034","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Nevertheless,","B":"Previously,","C":"That is,","D":"For instance,"},"answer":"C","explanation":"The second sentence translates the contrast between local and global reference systems into equivalent terms.","choice_explanations":{"A":"Incorrect: No unexpected obstacle or opposing finding is introduced.","B":"Incorrect: The wording contrasts reference systems, not earlier and later periods.","C":"Correct: The second sentence translates the contrast between local and global reference systems into equivalent terms.","D":"Incorrect: The second sentence is not a particular example; it describes the exact same measurement scheme."},"passage":"The coastal atlas measures the shoreline's movement relative to an old lighthouse, rather than using a worldwide grid of coordinates. _______ the atlas treats a nearby landmark, not a global reference system, as the basis for its measurements.","strategy":"Test whether the second statement expresses the first proposition in different terms, rather than adding separate evidence."},{"id":"TRN-035","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Consequently,","B":"Put differently,","C":"To illustrate,","D":"However,"},"answer":"B","explanation":"The second statement restates the distinction between retained melody and new harmony.","choice_explanations":{"A":"Incorrect: The second sentence reformulates the musical change, not an independent result caused by it.","B":"Correct: The second statement restates the distinction between retained melody and new harmony.","C":"Incorrect: No distinct example is supplied; the same composition is described in new language.","D":"Incorrect: Keeping the tune and changing the harmony are not contradictions between the sentences."},"passage":"The new composition was intended to make a familiar tune feel unfamiliar without changing its melodic outline. The composer reused a melody from an earlier piece but supplied it with entirely different harmonies. _______ the notes of the tune remained recognizable even though the chords accompanying them changed.","strategy":"Test whether the second statement expresses the first proposition in different terms, rather than adding separate evidence."},{"id":"TRN-036","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"As a result,","B":"To put it another way,","C":"For example,","D":"By comparison,"},"answer":"B","explanation":"The distance-based definition is restated by ruling out other meanings of 'local.'","choice_explanations":{"A":"Incorrect: The clarification is not a newly caused result of using a ten-kilometer threshold.","B":"Correct: The distance-based definition is restated by ruling out other meanings of 'local.'","C":"Incorrect: The second sentence offers an equivalent definition, not a case involving one particular supplier.","D":"Incorrect: No two different workshops or definitions are compared."},"passage":"In a survey of pottery workshops, the researchers used 'local' strictly to describe clay sourced within ten kilometers of the kiln. _______ for their analysis, the term depended on distance from the workshop, not on cultural or political boundaries.","strategy":"Test whether the second statement expresses the first proposition in different terms, rather than adding separate evidence."},{"id":"TRN-037","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"For instance,","B":"Meanwhile,","C":"Instead,","D":"Overall,"},"answer":"D","explanation":"The final sentence evaluates both sets of test results together and identifies their shared inadequacy.","choice_explanations":{"A":"Incorrect: The third sentence summarizes both cases rather than providing another individual case.","B":"Incorrect: The central relation is synthesis of results, not simultaneous timing.","C":"Incorrect: The overall assessment is not presented as an alternative action taken in place of testing.","D":"Correct: The final sentence evaluates both sets of test results together and identifies their shared inadequacy."},"passage":"One protective coating kept steel from rusting in rain but peeled away at low temperatures. A second coating adhered in the cold but offered little defense against moisture. _______ neither coating satisfied every requirement of the outdoor trial.","strategy":"Combine the preceding findings into a balanced overall statement; do not turn a conclusion into one example."},{"id":"TRN-038","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Previously,","B":"By contrast,","C":"Taken together,","D":"For instance,"},"answer":"C","explanation":"The complementary accounts collectively support a broader understanding of the district.","choice_explanations":{"A":"Incorrect: Nothing in the text compares an earlier and later period of interviewing.","B":"Incorrect: The sentence emphasizes the collective value of the interviews, not a disagreement among their accounts.","C":"Correct: The complementary accounts collectively support a broader understanding of the district.","D":"Incorrect: The last sentence draws a conclusion from the accounts rather than presenting another interview."},"passage":"An oral-history project gathered accounts from market vendors, visiting merchants, and dockworkers. Their descriptions highlighted different aspects of the same commercial district. _______ the interviews provided a more varied picture than municipal transaction records alone could offer.","strategy":"Combine the preceding findings into a balanced overall statement; do not turn a conclusion into one example."},{"id":"TRN-039","category":"Expression of Ideas","skill":"Transitions","level":"very_hard","question":"Which choice completes the text with the most logical transition?","choices":{"A":"Previously,","B":"For instance,","C":"In sum,","D":"Conversely,"},"answer":"C","explanation":"The final sentence combines the benefits of shorter journeys and later operating hours into one assessment.","choice_explanations":{"A":"Incorrect: The passage does not mark a past-versus-present shift at the beginning of its conclusion.","B":"Incorrect: The last sentence summarizes two improvements, rather than describing a new isolated example.","C":"Correct: The final sentence combines the benefits of shorter journeys and later operating hours in
