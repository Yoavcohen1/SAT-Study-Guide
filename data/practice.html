e noise hypothesis without proving it exclusive."},"passage":"A biologist suspects that birds near highways sing at higher pitches because traffic noise masks lower notes. Another researcher proposes that artificial streetlights, not traffic, cause the change. Along several roads where lighting levels remain nearly constant throughout the week, average song pitch falls on quiet Sundays and rises again during busy weekday mornings.","strategy":"Use variation in one factor against stability in a rival to weigh explanations without overstating causality."},{"id":"INF-046","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"the manuscripts must have been written by four people who independently observed the eclipse.","B":"the shared mistake proves that the eclipse itself was invented.","C":"the earliest version can be dated precisely from the error in the town’s name alone.","D":"four surviving accounts need not constitute four independent confirmations of the eclipse date."},"answer":"D","explanation":"Three copies inherit information from a common source, reducing the effective number of independent testimonies.","choice_explanations":{"A":"Incorrect: Three texts were copied from a common source.","B":"Incorrect: Copying can produce dependent accounts of a real event; no falsification is established.","C":"Incorrect: A shared spelling mistake does not supply a calendar date.","D":"Correct: Three copies inherit information from a common source, reducing the effective number of independent testimonies."},"passage":"Four medieval chronicles describe an eclipse on the same date, apparently supporting the reliability of the event's dating. A historian notices, however, that all four manuscripts reproduce an unusual spelling mistake in the name of the observing town. Archival analysis reveals that three of the manuscripts were copied from a version of the fourth. The evidence implies that ______","strategy":"Track whether apparently separate pieces of evidence share an origin before treating them as independent."},{"id":"INF-047","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice most logically completes the text?","choices":{"A":"membership club subscribers must have visited the exhibition fewer times than other visitors.","B":"the excellent ratings must be higher than those of nonrespondents because the survey reached frequent museum attendees.","C":"exactly 84 percent of all people who attended the exhibition must have found it excellent.","D":"it is uncertain whether the high rating among respondents reflects the views of all exhibition visitors."},"answer":"D","explanation":"The responding group may overrepresent highly engaged visitors, while nonrespondents remain unknown.","choice_explanations":{"A":"Incorrect: Subscribers are described as frequent museum attendees, and no specific visit counts are given.","B":"Incorrect: Engaged attendees may be overrepresented, but nonrespondents’ ratings are unknown, so a definite comparison is unsupported.","C":"Incorrect: The percentage applies only to respondents, whose participation was selective.","D":"Correct: The responding group may overrepresent highly engaged visitors, while nonrespondents remain unknown."},"passage":"A museum emailed visitors an optional survey about a recent exhibition, and 84 percent of respondents rated it excellent. Visitors were most likely to open the survey after receiving a follow-up message from the exhibition's membership club, whose subscribers frequently attend museum events. The museum did not record ratings from people who ignored the invitation. A statistician warns that ______","strategy":"Ask who had a higher probability of responding before generalizing a sample percentage."},{"id":"INF-048","category":"Information and Ideas","skill":"Inferences","level":"very_hard","question":"Which choice is best supported by the text?","choices":{"A":"The particles’ exact molecular mechanism has been proven by the friction measurements alone.","B":"The coating’s friction-reducing benefit is associated with humid conditions rather than appearing uniformly in all tested environments.","C":"The coating substantially reduces friction even when no moisture is available.","D":"The coating permanently changes the metal so that friction can never increase again."},"answer":"B","explanation":"A benefit appears in the humid treatment but not the dry treatment; the proposed microphysical explanation remains a hypothesis.","choice_explanations":{"A":"Incorrect: The moisture-driven lubrication mechanism is a hypothesis; friction measurements do not directly establish molecular details.","B":"Correct: A benefit appears in the humid treatment but not the dry treatment; the proposed microphysical explanation remains a hypothesis.","C":"Incorrect: Dry-condition tests showed similar friction with and without coating.","D":"Incorrect: Neither a permanent material change nor future performance was measured."},"passage":"Engineers coated a moving metal component with a thin film containing microscopic water-attracting particles. Under humid laboratory conditions, coated components experienced substantially less friction than uncoated ones. Under dry conditions, the coated and uncoated components performed similarly. The engineers hypothesize that moisture enables the particles to form a lubricating layer.","strategy":"Identify the observed treatment-by-condition interaction while keeping the proposed mechanism provisional."}]},{"category":"Standard English Conventions","subcategory":"Boundaries","questions":[{"id":"BND-001","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":";","B":"; although","C":",","D":", however,"},"answer":"A","explanation":"Both sides are independent clauses, and the semicolon cleanly separates two contrasting observations about seals from different periods.","choice_explanations":{"A":"Correct: Both sides are independent clauses, and the semicolon cleanly separates two contrasting observations about seals from different periods.","B":"Incorrect: Although makes the material after the semicolon dependent, leaving a fragment instead of an independent clause.","C":"Incorrect: A comma alone cannot join the complete clauses beginning “The oldest wax seals” and “seals from the same workshop.”","D":"Incorrect: However is a conjunctive adverb, not a conjunction; the comma before it produces a comma splice."},"passage":"The oldest wax seals in the collection bear an image of a crescent_______ seals from the same workshop made a century later depict a six-pointed star.","strategy":"Identify the subject and finite verb on both sides; a semicolon can separate independent clauses without a coordinating conjunction."},{"id":"BND-002","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"; because","B":", however,","C":",","D":";"},"answer":"D","explanation":"The first clause reports laboratory stability, whereas the second reports an independent, contrasting field observation; a semicolon properly joins them.","choice_explanations":{"A":"Incorrect: The because-clause after the semicolon cannot stand alone; a semicolon requires another independent clause.","B":"Incorrect: The inserted conjunctive adverb does not repair the comma splice between the two main clauses.","C":"Incorrect: The two complete clauses cannot be joined by a comma alone.","D":"Correct: The first clause reports laboratory stability, whereas the second reports an independent, contrasting field observation; a semicolon properly joins them."},"passage":"Despite months of adjustments to its cooling system, the prototype remained stable during repeated laboratory trials_______ its performance varied sharply once it was exposed to saltwater.","strategy":"Identify the subject and finite verb on both sides; a semicolon can separate independent clauses without a coordinating conjunction."},{"id":"BND-003","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"; whereas","B":",","C":";","D":", moreover,"},"answer":"C","explanation":"The sentence contains two complete statements describing different cataloging practices, making a semicolon appropriate.","choice_explanations":{"A":"Incorrect: Whereas introduces a subordinate clause, which cannot appear on its own after this semicolon.","B":"Incorrect: A comma by itself joins two independent clauses incorrectly.","C":"Correct: The sentence contains two complete statements describing different cataloging practices, making a semicolon appropriate.","D":"Incorrect: Adding moreover between commas does not supply the independent-clause boundary required here."},"passage":"After conservators had cleaned and photographed the recovered fragments, every tile in the first mosaic was carefully numbered_______ the pieces from the second mosaic were cataloged only by color.","strategy":"Identify the subject and finite verb on both sides; a semicolon can separate independent clauses without a coordinating conjunction."},{"id":"BND-004","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":",","B":";","C":", instead,","D":"; while"},"answer":"B","explanation":"Each station is the subject of a complete clause, and the semicolon separates the contrasting reports without changing their relationship.","choice_explanations":{"A":"Incorrect: A lone comma results in a comma splice between the two reports.","B":"Correct: Each station is the subject of a complete clause, and the semicolon separates the contrasting reports without changing their relationship.","C":"Incorrect: The phrase instead, offset only by commas, still leaves two independent clauses improperly joined.","D":"Incorrect: While would subordinate the second report, leaving a fragment after a semicolon."},"passage":"Despite the stations being only twenty kilometers apart, the station recorded heavy rainfall throughout March_______ the neighboring station reported unusually dry conditions for the same period.","strategy":"Identify the subject and finite verb on both sides; a semicolon can separate independent clauses without a coordinating conjunction."},{"id":"BND-005","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"period:","B":"period.","C":"period,","D":"period"},"answer":"B","explanation":"A period ends the complete salinity statement and allows the unrelated account of the bird study to begin as a new sentence.","choice_explanations":{"A":"Incorrect: The bird-nesting report does not define, explain, or enumerate the unchanged salinity, so a colon would misrepresent the relationship.","B":"Correct: A period ends the complete salinity statement and allows the unrelated account of the bird study to begin as a new sentence.","C":"Incorrect: A comma alone splices two independent sentences.","D":"Incorrect: Without terminal punctuation, the sentences run together."},"passage":"The pond's salinity remained constant across the observation _______ A separate team later documented the nesting habits of birds on the surrounding cliffs.","strategy":"Check whether each side can stand alone; use a period when the second sentence is a new topic rather than an explanation of the first."},{"id":"BND-006","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"archive.","B":"archive,","C":"archive","D":"archive:"},"answer":"A","explanation":"The missing-page statement is complete; the next independent sentence introduces a different inquiry, so a period marks the boundary.","choice_explanations":{"A":"Correct: The missing-page statement is complete; the next independent sentence introduces a different inquiry, so a period marks the boundary.","B":"Incorrect: A comma alone cannot join these two complete statements.","C":"Incorrect: The second independent clause begins without any sentence-boundary punctuation.","D":"Incorrect: The examination of cover pigments does not explain or list the circumstances of the missing last page."},"passage":"The manuscript's final page was missing from the _______ A separate investigation examined pigments used in its cover illustration.","strategy":"Check whether each side can stand alone; use a period when the second sentence is a new topic rather than an explanation of the first."},{"id":"BND-007","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"quarries,","B":"quarries:","C":"quarries","D":"quarries."},"answer":"D","explanation":"The quarry survey is a complete statement, and the later study of ocean currents is a separate topic that needs a new sentence.","choice_explanations":{"A":"Incorrect: The comma alone creates a comma splice between complete sentences.","B":"Incorrect: The ocean-current study is not a list or explanation of the three quarries, so the colon signals the wrong relationship.","C":"Incorrect: Two independent clauses have been fused without punctuation.","D":"Correct: The quarry survey is a complete statement, and the later study of ocean currents is a separate topic that needs a new sentence."},"passage":"A survey of the island's eastern slope identified three abandoned _______ Another expedition later mapped ocean currents beyond the island's reefs.","strategy":"Check whether each side can stand alone; use a period when the second sentence is a new topic rather than an explanation of the first."},{"id":"BND-008","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"1974:","B":"1974","C":"1974.","D":"1974,"},"answer":"C","explanation":"The replacement date completes the first sentence; the report on antenna maintenance begins a distinct independent sentence.","choice_explanations":{"A":"Incorrect: The report on antennas is not an explanation or specification of the earlier tracking-mechanism replacement.","B":"Incorrect: Without a period or other appropriate separator, the sentences form a run-on.","C":"Correct: The replacement date completes the first sentence; the report on antenna maintenance begins a distinct independent sentence.","D":"Incorrect: The comma would improperly combine two independent clauses."},"passage":"The observatory replaced its original tracking mechanism in _______ A later report examined how the site's radio antennas had been maintained in the 1980s.","strategy":"Check whether each side can stand alone; use a period when the second sentence is a new topic rather than an explanation of the first."},{"id":"BND-009","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"but","B":"; but,","C":", but","D":", but,"},"answer":"C","explanation":"But joins the independent clause about identical containers with the contrasting independent clause about unequal heating; a comma precedes it.","choice_explanations":{"A":"Incorrect: A comma is needed before but when it coordinates these two full clauses.","B":"Incorrect: The comma after but separates the conjunction from its clause; the semicolon-plus-conjunction construction also fails the ordinary coordinate-clause pattern.","C":"Correct: But joins the independent clause about identical containers with the contrasting independent clause about unequal heating; a comma precedes it.","D":"Incorrect: But should not be followed by a comma here; it directly introduces the second clause."},"passage":"In a study designed to minimize differences among samples, the trial used identical glass containers_______ the vessels at the edge of the shelf heated more quickly.","strategy":"Locate the subjects and verbs on both sides; if but/and/yet/or links two independent clauses, the comma normally precedes the conjunction."},{"id":"BND-010","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"; and,","B":", and","C":"and","D":", and,"},"answer":"B","explanation":"And coordinates the two independent clauses, so a comma belongs immediately before the conjunction.","choice_explanations":{"A":"Incorrect: The comma after and incorrectly breaks the link to its clause; a semicolon is not the normal punctuation before this coordinator.","B":"Correct: And coordinates the two independent clauses, so a comma belongs immediately before the conjunction.","C":"Incorrect: The two independently complete clauses need a comma before and.","D":"Incorrect: The added comma after and incorrectly separates the conjunction from the subject of the second clause."},"passage":"Because several paintings had deteriorated during transport, the gallery commissioned a detailed digital replica_______ its conservators used the scans to plan repairs.","strategy":"Locate the subjects and verbs on both sides; if but/and/yet/or links two independent clauses, the comma normally precedes the conjunction."},{"id":"BND-011","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":", yet","B":"yet","C":"; yet,","D":"yet,"},"answer":"A","explanation":"Yet links two contrasting independent clauses; the comma marks the boundary before the coordinating conjunction.","choice_explanations":{"A":"Correct: Yet links two contrasting independent clauses; the comma marks the boundary before the coordinating conjunction.","B":"Incorrect: Without the comma, the independent-clause boundary is not conventionally marked.","C":"Incorrect: The comma after yet improperly divides the coordinator from the following clause; the semicolon is not the conventional connector here.","D":"Incorrect: The comma is on the wrong side of yet and incorrectly separates it from the second clause."},"passage":"In an experiment on how repeated freezing affects tissue structure, several samples survived the first freezing cycle_______ almost none remained intact after the second.","strategy":"Locate the subjects and verbs on both sides; if but/and/yet/or links two independent clauses, the comma normally precedes the conjunction."},{"id":"BND-012","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":", or,","B":"; or,","C":"or","D":", or"},"answer":"D","explanation":"Or presents two alternatives and links two complete clauses, so a comma is required before the coordinating conjunction.","choice_explanations":{"A":"Incorrect: The comma after or would improperly interrupt the conjunction and the following clause.","B":"Incorrect: The comma after or wrongly separates the coordinator from the second clause; the semicolon is also not conventional in this short coordination.","C":"Incorrect: A comma is needed to separate the two independent clauses coordinated by or.","D":"Correct: Or presents two alternatives and links two complete clauses, so a comma is required before the coordinating conjunction."},"passage":"After strong winds disrupted a planned outdoor technology demonstration, the team could repeat the demonstration indoors_______ it could postpone the session until the weather improved.","strategy":"Locate the subjects and verbs on both sides; if but/and/yet/or links two independent clauses, the comma normally precedes the conjunction."},{"id":"BND-013","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"languages;","B":"languages:","C":"languages","D":"languages,"},"answer":"D","explanation":"Although begins a dependent clause; the comma closes it before the main clause about the archivists.","choice_explanations":{"A":"Incorrect: A semicolon cannot follow an incomplete although-clause.","B":"Incorrect: A colon cannot follow a subordinate clause that cannot stand alone.","C":"Incorrect: Omitting the comma leaves the boundary between the introductory subordinate clause and the main clause unmarked.","D":"Correct: Although begins a dependent clause; the comma closes it before the main clause about the archivists."},"passage":"The documents were initially thought to describe separate journeys. Although the field notes were written in three different _______ the archivists determined that they described the same expedition.","strategy":"A clause introduced by although, if, because, or when cannot stand alone; place a comma at its boundary with the following main clause."},{"id":"BND-014","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"operation;","B":"operation:","C":"operation,","D":"operation"},"answer":"C","explanation":"The if-clause states a condition; a comma separates it from the independent result clause beginning “its controller.”","choice_explanations":{"A":"Incorrect: The material preceding the semicolon is only a conditional clause, not an independent clause.","B":"Incorrect: A colon requires a preceding independent clause, but the sentence begins with a dependent if-clause.","C":"Correct: The if-clause states a condition; a comma separates it from the independent result clause beginning “its controller.”","D":"Incorrect: The introductory if-clause requires a comma before the main clause in this construction."},"passage":"The assembly-line robot includes a built-in emergency safety protocol. If the robotic arm detects an obstruction during _______ its controller stops the movement immediately.","strategy":"A clause introduced by although, if, because, or when cannot stand alone; place a comma at its boundary with the following main clause."},{"id":"BND-015","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"expected:","B":"expected,","C":"expected;","D":"expected"},"answer":"B","explanation":"The because-clause provides the reason; a comma marks its end before the independent statement of the consequence.","choice_explanations":{"A":"Incorrect: A colon cannot directly follow this incomplete subordinate clause.","B":"Correct: The because-clause provides the reason; a comma marks its end before the independent statement of the consequence.","C":"Incorrect: The because-clause cannot be a complete sentence before a semicolon.","D":"Incorrect: The comma separating the introductory because-clause from the main clause is missing."},"passage":"Because the clay absorbed more water than the researchers _______ the kiln needed additional time to dry the vessels.","strategy":"A clause introduced by although, if, because, or when cannot stand alone; place a comma at its boundary with the following main clause."},{"id":"BND-016","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"resolution,","B":"resolution:","C":"resolution","D":"resolution;"},"answer":"A","explanation":"When introduces an introductory dependent clause, which needs a comma before the main clause describing the markings.","choice_explanations":{"A":"Correct: When introduces an introductory dependent clause, which needs a comma before the main clause describing the markings.","B":"Incorrect: A colon cannot separate this subordinate when-clause from its main clause.","C":"Incorrect: A comma is expected after the introductory when-clause.","D":"Incorrect: A semicolon would incorrectly treat the dependent when-clause as an independent sentence."},"passage":"The previous scans had blurred the edges of several handwritten labels. When the archival photographs were scanned at higher _______ previously unnoticed markings became visible.","strategy":"A clause introduced by although, if, because, or when cannot stand alone; place a comma at its boundary with the following main clause."},{"id":"BND-017","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":":","B":".","C":", and","D":";"},"answer":"A","explanation":"The complete clause announces three outcomes, and the colon properly introduces their list.","choice_explanations":{"A":"Correct: The complete clause announces three outcomes, and the colon properly introduces their list.","B":"Incorrect: A period would leave the list as a sentence fragment.","C":"Incorrect: And after a comma suggests a new coordinated clause, but the material that follows is just a list of outcomes.","D":"Incorrect: The material after the semicolon is a list of noun phrases, not an independent clause."},"passage":"The notebook recorded exactly three outcomes from the first test_______ increased brightness, a shorter response time, and reduced heat loss.","strategy":"Verify that the material before the colon is a complete clause; check that the material after it supplies the promised list or explanation."},{"id":"BND-018","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":", because","B":";","C":".","D":":"},"answer":"D","explanation":"The independent clause introduces a mixture, and the colon supplies the specific description of that mixture.","choice_explanations":{"A":"Incorrect: Because cannot introduce this noun phrase as a complete causal clause.","B":"Incorrect: A semicolon requires an independent clause after it, not a noun phrase describing the mixture.","C":"Incorrect: The descriptive phrase after the period would be a sentence fragment.","D":"Correct: The independent clause introduces a mixture, and the colon supplies the specific description of that mixture."},"passage":"During an excavation of what had been thought to be a uniform stone deposit, researchers found something unusual. The quarry contained an unexpected mixture of materials_______ rounded river pebbles embedded in hardened volcanic ash.","strategy":"Verify that the material before the colon is a complete clause; check that the material after it supplies the promised list or explanation."},{"id":"BND-019","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":".","B":", unless","C":":","D":";"},"answer":"C","explanation":"The complete clause promises one instruction, which the colon introduces as an infinitive phrase.","choice_explanations":{"A":"Incorrect: A full stop would leave the infinitive phrase as an incomplete sentence.","B":"Incorrect: Unless cannot grammatically introduce the infinitive phrase as a finite subordinate clause here.","C":"Correct: The complete clause promises one instruction, which the colon introduces as an infinitive phrase.","D":"Incorrect: The infinitive phrase “to remain within sight” cannot stand as the independent clause a semicolon requires."},"passage":"The expedition had one instruction for crews stationed on the outer ridge_______ to remain within sight of the base station after dusk.","strategy":"Verify that the material before the colon is a complete clause; check that the material after it supplies the promised list or explanation."},{"id":"BND-020","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":", but","B":":","C":".","D":";"},"answer":"B","explanation":"The first independent clause introduces four symbols; the colon formally presents the four-item list.","choice_explanations":{"A":"Incorrect: But requires a contrasting clause, not a list naming the symbols.","B":"Correct: The first independent clause introduces four symbols; the colon formally presents the four-item list.","C":"Incorrect: Using a period would strand the list as a fragment.","D":"Incorrect: A list of noun phrases is not a second independent clause, so a semicolon is inappropriate."},"passage":"The custom map used four symbols for terrain features_______ circles for lakes, triangles for peaks, squares for towns, and dots for springs.","strategy":"Verify that the material before the colon is a complete clause; check that the material after it supplies the promised list or explanation."},{"id":"BND-021","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"of:","B":"of","C":"of—","D":"of,"},"answer":"B","explanation":"Of takes the following embedded whether-clause as its complement; punctuation cannot intervene between the preposition and its object.","choice_explanations":{"A":"Incorrect: The material before the colon ends in a preposition, so it is not a complete independent clause.","B":"Correct: Of takes the following embedded whether-clause as its complement; punctuation cannot intervene between the preposition and its object.","C":"Incorrect: An em dash would incorrectly sever the preposition from its required complement.","D":"Incorrect: A comma cannot divide the preposition of from the clause completing its meaning."},"passage":"The researchers devoted much of the final session to the question _______ whether the cave paintings had been made in a single period.","strategy":"Find the grammatical core: punctuation cannot split a verb from what completes it, a preposition from its object, or a subject from its verb."},{"id":"BND-022","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"as","B":"as:","C":"as;","D":"as,"},"answer":"A","explanation":"As directly introduces the description “a network of overlapping fibers”; no punctuation belongs between a preposition and its complement.","choice_explanations":{"A":"Correct: As directly introduces the description “a network of overlapping fibers”; no punctuation belongs between a preposition and its complement.","B":"Incorrect: A colon cannot directly follow as before its required complement.","C":"Incorrect: The semicolon splits the predicate and leaves a fragment after it.","D":"Incorrect: The comma separates as from the phrase it introduces."},"passage":"After reviewing the micrographs, the biologists described the material _______ a network of overlapping fibers rather than a single continuous sheet.","strategy":"Find the grammatical core: punctuation cannot split a verb from what completes it, a preposition from its object, or a subject from its verb."},{"id":"BND-023","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"size;","B":"size,","C":"size:","D":"size"},"answer":"D","explanation":"The full subject ends with “size” and is followed immediately by the main verb “came”; no punctuation separates subject from verb.","choice_explanations":{"A":"Incorrect: A semicolon needs an independent clause on both sides, but the first side lacks a verb.","B":"Incorrect: A comma without a closing parenthetical would separate the subject from came.","C":"Incorrect: A colon cannot separate the subject noun phrase from its main predicate.","D":"Correct: The full subject ends with “size” and is followed immediately by the main verb “came”; no punctuation separates subject from verb."},"passage":"The only reliable estimate of the collection's original _______ came from an inventory compiled two decades before the fire.","strategy":"Find the grammatical core: punctuation cannot split a verb from what completes it, a preposition from its object, or a subject from its verb."},{"id":"BND-024","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"to;","B":"to:","C":"to","D":"to,"},"answer":"C","explanation":"To is the preposition in “committed to,” and the gerund phrase “preserving...” is its complement; no punctuation is inserted between them.","choice_explanations":{"A":"Incorrect: A semicolon cannot stand between a preposition and its object.","B":"Incorrect: The material before the colon is incomplete: the preposition to still needs a complement.","C":"Correct: To is the preposition in “committed to,” and the gerund phrase “preserving...” is its complement; no punctuation is inserted between them.","D":"Incorrect: The comma improperly separates to from its gerund complement."},"passage":"Early tests showed that the paint would tolerate only gentle cleaning. Despite several delays, the restoration team remained committed _______ preserving the original pigments wherever possible.","strategy":"Find the grammatical core: punctuation cannot split a verb from what completes it, a preposition from its object, or a subject from its verb."},{"id":"BND-025","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"observations;","B":"observations","C":"observations,","D":"observations:"},"answer":"C","explanation":"The appositive description of the telescope begins after a comma; the matching comma closes it before the main verb captured.","choice_explanations":{"A":"Incorrect: A semicolon would separate the subject from its main verb; the material before it is not a complete independent clause.","B":"Incorrect: The appositive is opened by a comma but never closed before captured.","C":"Correct: The appositive description of the telescope begins after a comma; the matching comma closes it before the main verb captured.","D":"Incorrect: A colon does not close a comma-delimited appositive and cannot replace the subject–verb connection."},"passage":"The telescope, an older model built for high-altitude _______ captured the faint comet just before dawn.","strategy":"Remove the parenthetical phrase; if the remaining sentence is complete, use a matching comma to close the interruption."},{"id":"BND-026","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"sensors:","B":"sensors,","C":"sensors","D":"sensors;"},"answer":"B","explanation":"The nonessential which-clause is enclosed between matching commas; the second comma comes before the main verb recommended.","choice_explanations":{"A":"Incorrect: The colon incorrectly intrudes between the complete subject and its verb.","B":"Correct: The nonessential which-clause is enclosed between matching commas; the second comma comes before the main verb recommended.","C":"Incorrect: The comma before which is unpaired, so the supplementary relative clause is not closed.","D":"Incorrect: A semicolon leaves the report without its verb on the left and separates it from recommended."},"passage":"The latest report, which combined measurements from five independent _______ recommended replacing the station's damaged receiver.","strategy":"Remove the parenthetical phrase; if the remaining sentence is complete, use a matching comma to close the interruption."},{"id":"BND-027","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"collection,","B":"collection:","C":"collection;","D":"collection"},"answer":"A","explanation":"The title-like appositive identifying Maren Voss is supplemental and must be closed with a second comma.","choice_explanations":{"A":"Correct: The title-like appositive identifying Maren Voss is supplemental and must be closed with a second comma.","B":"Incorrect: The colon is not a valid counterpart to the earlier comma around this appositive.","C":"Incorrect: The semicolon would break off the subject from its predicate.","D":"Incorrect: Without the closing comma, the appositive interrupts the subject–verb structure."},"passage":"Maren Voss, the curator responsible for the glass _______ recognized the maker's mark on the vessel.","strategy":"Remove the parenthetical phrase; if the remaining sentence is complete, use a matching comma to close the interruption."},{"id":"BND-028","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"sand:","B":"sand","C":"sand;","D":"sand,"},"answer":"D","explanation":"The noun phrase describing the layer is a nonessential appositive; a closing comma pairs with the comma after layer.","choice_explanations":{"A":"Incorrect: A colon cannot close an appositive opened by a comma.","B":"Incorrect: Without the second comma, the supplementary description is not closed.","C":"Incorrect: The semicolon separates a subject from the main verb contained, producing a fragment.","D":"Correct: The noun phrase describing the layer is a nonessential appositive; a closing comma pairs with the comma after layer."},"passage":"The newly discovered layer, a thin band of ash beneath the coastal _______ contained fragments of charcoal and burnt seeds.","strategy":"Remove the parenthetical phrase; if the remaining sentence is complete, use a matching comma to close the interruption."},{"id":"BND-029","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"one:","B":"one;","C":"one,","D":"one"},"answer":"D","explanation":"The restrictive that-clause specifies which plate is meant, and it attaches directly to the noun one without punctuation.","choice_explanations":{"A":"Incorrect: A colon would separate the noun from the clause identifying it and would not follow a complete clause.","B":"Incorrect: A semicolon cannot divide a noun phrase from the relative clause that defines its referent.","C":"Incorrect: A restrictive clause beginning that cannot be separated from one by a comma.","D":"Correct: The restrictive that-clause specifies which plate is meant, and it attaches directly to the noun one without punctuation."},"passage":"Of the dozens of plates in the archive, only the _______ that shows the northern harbor includes handwritten annotations.","strategy":"A clause specifying which one is meant is essential; do not insert a comma before restrictive that or leave an unmatched comma before the main verb."},{"id":"BND-030","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"samples:","B":"samples—","C":"samples","D":"samples,"},"answer":"C","explanation":"The that-clause restricts samples to a particular group and belongs immediately after the noun without a comma.","choice_explanations":{"A":"Incorrect: A colon is not permitted between samples and the essential relative clause defining them.","B":"Incorrect: A dash would wrongly detach the identifying relative clause from samples.","C":"Correct: The that-clause restricts samples to a particular group and belongs immediately after the noun without a comma.","D":"Incorrect: Standard English does not set off a restrictive that-clause with a comma."},"passage":"A quality-control review compared samples kept under several storage conditions. The _______ that had been stored without refrigeration produced inconsistent measurements.","strategy":"A clause specifying which one is meant is essential; do not insert a comma before restrictive that or leave an unmatched comma before the main verb."},{"id":"BND-031","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"seedlings;","B":"seedlings","C":"seedlings,","D":"seedlings:"},"answer":"B","explanation":"The whose-clause identifies the specific seedlings referred to; it is essential and must stay connected to the subject.","choice_explanations":{"A":"Incorrect: The material before a semicolon is a fragment, and whose cannot begin an independent clause here.","B":"Correct: The whose-clause identifies the specific seedlings referred to; it is essential and must stay connected to the subject.","C":"Incorrect: A comma opens a supposedly nonessential clause but no matching comma closes it before survived.","D":"Incorrect: The colon would interrupt the subject and its identifying relative clause."},"passage":"The greenhouse experiment exposed one group of plants to saline water and another group to ordinary tap water. Only the _______ whose roots had been exposed to saltwater survived the second treatment.","strategy":"A clause specifying which one is meant is essential; do not insert a comma before restrictive that or leave an unmatched comma before the main verb."},{"id":"BND-032","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"recording","B":"recording;","C":"recording:","D":"recording,"},"answer":"A","explanation":"The restrictive that-clause specifies which recording was stored separately; it must not be set off by punctuation.","choice_explanations":{"A":"Correct: The restrictive that-clause specifies which recording was stored separately; it must not be set off by punctuation.","B":"Incorrect: The phrase “The recording” is not an independent clause and cannot precede a semicolon.","C":"Incorrect: A colon cannot separate the noun recording from its required identifying clause.","D":"Incorrect: A restrictive relative clause beginning with that takes no preceding comma."},"passage":"Although the catalog listed several copies of the same conversation, the _______ that contained the original interview was stored on a separate drive.","strategy":"A clause specifying which one is meant is essential; do not insert a comma before restrictive that or leave an unmatched comma before the main verb."},{"id":"BND-033","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"supply—","B":"supply; ","C":"supply, ","D":"supply: "},"answer":"A","explanation":"The dash after sensor begins a nonessential design detail; a second dash after supply closes it before the main verb sent.","choice_explanations":{"A":"Correct: The dash after sensor begins a nonessential design detail; a second dash after supply closes it before the main verb sent.","B":"Incorrect: A semicolon would incorrectly separate the subject from its verb and leave an unmatched dash.","C":"Incorrect: A comma cannot properly close the interruption that opened with an em dash.","D":"Incorrect: A colon does not pair with the first em dash and breaks the subject–verb construction."},"passage":"The field sensor—designed to function without an external power _______sent its first readings before sunrise.","strategy":"Find the opening em dash, then close the supplementary phrase with a second em dash before the main sentence resumes."},{"id":"BND-034","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"peninsula, ","B":"peninsula: ","C":"peninsula; ","D":"peninsula—"},"answer":"D","explanation":"Two em dashes mark the beginning and end of the supplementary description, leaving “Lina’s second novel explores...” intact.","choice_explanations":{"A":"Incorrect: The comma mismatches the initial em dash rather than closing the parenthetical consistently.","B":"Incorrect: A colon cannot function as the closing half of this em-dash pair.","C":"Incorrect: The semicolon interrupts the subject and predicate and fails to close the dash-delimited phrase.","D":"Correct: Two em dashes mark the beginning and end of the supplementary description, leaving “Lina’s second novel explores...” intact."},"passage":"Lina's second novel—written while she was living on a remote _______explores the history of an imaginary island.","strategy":"Find the opening em dash, then close the supplementary phrase with a second em dash before the main sentence resumes."},{"id":"BND-035","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"week; ","B":"week: ","C":"week—","D":"week, "},"answer":"C","explanation":"The appositive is introduced by an em dash and must be closed by a matching em dash before contains.","choice_explanations":{"A":"Incorrect: The material before the semicolon has no main predicate, so it is not an independent clause.","B":"Incorrect: A colon does not close the dash-delimited appositive or link this subject to its verb.","C":"Correct: The appositive is introduced by an em dash and must be closed by a matching em dash before contains.","D":"Incorrect: A closing comma is inconsistent with the opening dash in this parenthetical construction."},"passage":"The ship's log—a rare surviving account of the expedition's final _______contains sketches of the coastal settlements.","strategy":"Find the opening em dash, then close the supplementary phrase with a second em dash before the main sentence resumes."},{"id":"BND-036","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"resins, ","B":"resins—","C":"resins; ","D":"resins: "},"answer":"B","explanation":"A second em dash closes the optional phrase describing the coating; the core sentence is “A coating ... proved surprisingly durable.”","choice_explanations":{"A":"Incorrect: A comma does not match the earlier em dash marking the beginning of the parenthetical.","B":"Correct: A second em dash closes the optional phrase describing the coating; the core sentence is “A coating ... proved surprisingly durable.”","C":"Incorrect: A semicolon would stand between the subject and proved, not between independent clauses.","D":"Incorrect: A colon cannot serve as a closing dash or separate the subject from its predicate."},"passage":"A coating made from discarded shells—an inexpensive alternative to imported _______proved surprisingly durable in laboratory tests.","strategy":"Find the opening em dash, then close the supplementary phrase with a second em dash before the main sentence resumes."},{"id":"BND-037","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"vibration; however","B":"vibration; however,","C":"vibration, however,","D":"vibration however,"},"answer":"B","explanation":"However links contrasting independent clauses but is not a coordinating conjunction; it needs a semicolon before it and a comma after it.","choice_explanations":{"A":"Incorrect: The conjunctive adverb however requires a comma before the second main clause.","B":"Correct: However links contrasting independent clauses but is not a coordinating conjunction; it needs a semicolon before it and a comma after it.","C":"Incorrect: However between commas still creates a comma splice between two complete clauses.","D":"Incorrect: Without a semicolon or period before however, the two independent clauses run together."},"passage":"The technicians initially assumed that the public data release was complete. The recording system logged every _______ several measurements were omitted from the published chart.","strategy":"A conjunctive adverb is not a coordinating conjunction: separate independent clauses with a semicolon and follow the adverb with a comma."},{"id":"BND-038","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"instructions; therefore,","B":"instructions therefore,","C":"instructions, therefore,","D":"instructions; therefore"},"answer":"A","explanation":"Therefore connects two independent clauses by marking an inference; a semicolon precedes it and a comma follows it.","choice_explanations":{"A":"Correct: Therefore connects two independent clauses by marking an inference; a semicolon precedes it and a comma follows it.","B":"Incorrect: There is no independent-clause boundary before therefore, so the result is a fused construction.","C":"Incorrect: A conjunctive adverb surrounded by commas cannot repair the comma splice between independent clauses.","D":"Incorrect: A comma after therefore is needed to separate the introductory conjunctive adverb from the rest of the clause."},"passage":"The first participant group received only printed _______ its results cannot establish how participants would perform with interactive guidance.","strategy":"A conjunctive adverb is not a coordinating conjunction: separate independent clauses with a semicolon and follow the adverb with a comma."},{"id":"BND-039","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"bone, instead,","B":"bone; instead","C":"bone instead,","D":"bone; instead,"},"answer":"D","explanation":"Instead begins a contrasting independent clause, so it is separated from the previous clause by a semicolon and followed by a comma.","choice_explanations":{"A":"Incorrect: The comma before instead leaves two main clauses joined by a comma splice.","B":"Incorrect: The absence of a comma after instead incorrectly merges the introductory conjunctive adverb with the second clause.","C":"Incorrect: Without a semicolon before instead, the independent clauses are run together.","D":"Correct: Instead begins a contrasting independent clause, so it is separated from the previous clause by a semicolon and followed by a comma."},"passage":"The team could not extract DNA from the weathered _______ it reconstructed the animal's diet from chemical traces in the surrounding soil.","strategy":"A conjunctive adverb is not a coordinating conjunction: separate independent clauses with a semicolon and follow the adverb with a comma."},{"id":"BND-040","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"light, nevertheless,","B":"light nevertheless,","C":"light; nevertheless,","D":"light; nevertheless"},"answer":"C","explanation":"Nevertheless signals an unexpected contrary result and links two independent clauses; it requires a semicolon before and a comma after.","choice_explanations":{"A":"Incorrect: A comma alone cannot join complete clauses, even with nevertheless inserted.","B":"Incorrect: The missing semicolon creates a run-on between independent clauses.","C":"Correct: Nevertheless signals an unexpected contrary result and links two independent clauses; it requires a semicolon before and a comma after.","D":"Incorrect: The adverb nevertheless needs a comma to set it off from the independent clause it introduces."},"passage":"The manufacturer had predicted that its new protective coating would prevent rapid color changes. The pigment appeared stable under ordinary _______ it faded rapidly when exposed to ultraviolet light.","strategy":"A conjunctive adverb is not a coordinating conjunction: separate independent clauses with a semicolon and follow the adverb with a comma."},{"id":"BND-041","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"village:","B":"village,","C":"village;","D":"village."},"answer":"C","explanation":"The three geographic entries each contain internal commas; a semicolon consistently separates the second entry from the third, just as it separates the first from the second.","choice_explanations":{"A":"Incorrect: A colon is not used to separate the second and third parallel entries in this series.","B":"Incorrect: A comma blurs the item boundary with the internal appositive commas and breaks the semicolon pattern of this complex list.","C":"Correct: The three geographic entries each contain internal commas; a semicolon consistently separates the second entry from the third, just as it separates the first from the second.","D":"Incorrect: The following “and Orla, a desert market town” would be a sentence fragment."},"passage":"The exhibit featured artifacts from Selas, a river port; Niran, a mountain _______ and Orla, a desert market town.","strategy":"Mentally bracket each full list item, including its description; use semicolons consistently to prevent item boundaries from blending with internal commas."},{"id":"BND-042","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"conservator:","B":"conservator;","C":"conservator.","D":"conservator,"},"answer":"B","explanation":"The semicolon marks the boundary between the Dev Malik and Lina Kerr entries; because each person has a comma-delimited description, semicolons are the clear consistent list separators.","choice_explanations":{"A":"Incorrect: A colon does not divide parallel people-and-role entries in a series.","B":"Correct: The semicolon marks the boundary between the Dev Malik and Lina Kerr entries; because each person has a comma-delimited description, semicolons are the clear consistent list separators.","C":"Incorrect: The final item beginning with and would become a fragment rather than remain part of the invitation list.","D":"Incorrect: The comma would be hard to distinguish from the commas inside the list entries and is inconsistent with the first separator."},"passage":"The workshop invited Ema Sato, a ceramic artist; Dev Malik, a textile _______ and Lina Kerr, a historical cartographer.","strategy":"Mentally bracket each full list item, including its description; use semicolons consistently to prevent item boundaries from blending with internal commas."},{"id":"BND-043","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"flats;","B":"flats.","C":"flats,","D":"flats:"},"answer":"A","explanation":"Semicolons, not ordinary commas, consistently separate the three place-and-location entries, each of which contains its own comma.","choice_explanations":{"A":"Correct: Semicolons, not ordinary commas, consistently separate the three place-and-location entries, each of which contains its own comma.","B":"Incorrect: And Torin, by the lake would be a fragment disconnected from the main clause.","C":"Incorrect: The comma fails to clearly separate list items that already contain commas and breaks the existing semicolon series.","D":"Incorrect: The colon would interrupt the parallel structure instead of separating list items."},"passage":"The field team surveyed Ardo, on the western ridge; Vela, near the salt _______ and Torin, by the lake.","strategy":"Mentally bracket each full list item, including its description; use semicolons consistently to prevent item boundaries from blending with internal commas."},{"id":"BND-044","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"extended.","B":"extended:","C":"extended,","D":"extended;"},"answer":"D","explanation":"Since each year is followed by a comma and descriptive time clause, semicolons maintain clear boundaries between the three dated report groups.","choice_explanations":{"A":"Incorrect: The segment beginning with and 2003 would have no main verb and form a sentence fragment.","B":"Incorrect: A colon introduces an explanation or list, not a final parallel item after the semicolon pattern has been established.","C":"Incorrect: A comma would blend the second and third years with their internal descriptive commas and disrupt the semicolon series.","D":"Correct: Since each year is followed by a comma and descriptive time clause, semicolons maintain clear boundaries between the three dated report groups."},"passage":"The library acquired reports from 1924, when the harbor opened; 1968, when the pier was _______ and 2003, when the site became a public park.","strategy":"Mentally bracket each full list item, including its description; use semicolons consistently to prevent item boundaries from blending with internal commas."},{"id":"BND-045","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"move.","B":"move,","C":"move;","D":"move?"},"answer":"D","explanation":"The first clause directly asks what caused the shift, so it must end in a question mark before the independent statement about the technicians.","choice_explanations":{"A":"Incorrect: A period is not the conventional end mark for a direct interrogative sentence.","B":"Incorrect: The comma fails to close the direct question and improperly runs it into a new statement.","C":"Incorrect: A semicolon cannot replace the required question mark at the end of a direct question.","D":"Correct: The first clause directly asks what caused the shift, so it must end in a question mark before the independent statement about the technicians."},"passage":"What caused the instrument's readings to shift after the _______ The technicians examined the power supply first.","strategy":"Ask whether the first clause directly asks a question, as opposed to reporting a question; use a question mark for a direct question."},{"id":"BND-046","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"freeze;","B":"freeze,","C":"freeze?","D":"freeze."},"answer":"C","explanation":"The sentence asks a direct how-question; the question mark ends it before the next declarative sentence begins.","choice_explanations":{"A":"Incorrect: The question mark, not a semicolon, is required to end the direct interrogative clause.","B":"Incorrect: A comma does not terminate the direct question before the independent statement.","C":"Correct: The sentence asks a direct how-question; the question mark ends it before the next declarative sentence begins.","D":"Incorrect: The first sentence is interrogative, so a period cannot stand in place of its question mark."},"passage":"The greenhouse was left unheated for much of the night, and several trays were exposed to subzero temperatures. How could the seedlings have survived the extended _______ A review of the storage records offered one possible answer.","strategy":"Ask whether the first clause directly asks a question, as opposed to reporting a question; use a question mark for a direct question."},{"id":"BND-047","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"border.","B":"border?","C":"border;","D":"border,"},"answer":"B","explanation":"The inverted auxiliary Did marks a direct yes-or-no question, which requires a question mark before the next statement.","choice_explanations":{"A":"Incorrect: A direct yes-or-no question should end with a question mark.","B":"Correct: The inverted auxiliary Did marks a direct yes-or-no question, which requires a question mark before the next statement.","C":"Incorrect: A semicolon is not an acceptable substitute for the end punctuation on a direct question.","D":"Incorrect: The comma fails to mark the end of the question and creates an improperly joined sentence."},"passage":"Did the mapmaker intend the dotted line to mark a _______ The inscription provides no clear answer.","strategy":"Ask whether the first clause directly asks a question, as opposed to reporting a question; use a question mark for a direct question."},{"id":"BND-048","category":"Standard English Conventions","skill":"Boundaries","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"begin?","B":"begin.","C":"begin,","D":"begin;"},"answer":"A","explanation":"When introduces a direct question, so a question mark closes the question before the independent reporting sentence.","choice_explanations":{"A":"Correct: When introduces a direct question, so a question mark closes the question before the independent reporting sentence.","B":"Incorrect: The opening when and auxiliary would mark a direct question that needs a question mark.","C":"Incorrect: A comma does not end a direct question and incorrectly joins it to the next independent clause.","D":"Incorrect: A semicolon cannot replace a question mark in a direct interrogative sentence."},"passage":"When would the second phase of the trial _______ The researchers had not yet announced a date.","strategy":"Ask whether the first clause directly asks a question, as opposed to reporting a question; use a question mark for a direct question."}]},{"category":"Standard English Conventions","subcategory":"Form, Structure and Sense","questions":[{"id":"FSS-001","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"translators","B":"translator's'","C":"translator's","D":"translators'"},"answer":"D","explanation":"The five translators are plural possessors, so the regular plural noun translators takes its apostrophe after the s.","choice_explanations":{"A":"Incorrect: The noun must be possessive because the versions belong to the translators; a bare plural does not mark that relationship.","B":"Incorrect: This word contains an extra apostrophe and is not a conventional English possessive form.","C":"Incorrect: The possessive of a single translator cannot refer to the five translators introduced in the sentence.","D":"Correct: The five translators are plural possessors, so the regular plural noun translators takes its apostrophe after the s."},"passage":"Five translators independently prepared versions of the same short poem. To study differences in regional vocabulary, the editor arranged all five _______ versions in parallel columns.","strategy":"Count the possessors first, then decide where the apostrophe belongs."},{"id":"FSS-002","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"child's","B":"children","C":"children's","D":"childrens'"},"answer":"C","explanation":"Children is already an irregular plural, so its possessive is formed by adding apostrophe-s: children’s.","choice_explanations":{"A":"Incorrect: The singular possessive child’s does not match the three different children described.","B":"Incorrect: The bare plural children does not show possession before pictures.","C":"Correct: Children is already an irregular plural, so its possessive is formed by adding apostrophe-s: children’s.","D":"Incorrect: Childrens is not the plural of child; the irregular plural is children."},"passage":"Three children each drew a different animal for the classroom mural. After all three drawings were finished, the teacher displayed the three _______ pictures along the hallway.","strategy":"Count the possessors first, then decide where the apostrophe belongs."},{"id":"FSS-003","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"museums's","B":"museum's","C":"museums","D":"museums'"},"answer":"D","explanation":"Both modifies two museums; the collections are owned by those museums, requiring the regular plural possessive museums’.","choice_explanations":{"A":"Incorrect: A regular plural ending in s takes a final apostrophe, not an additional apostrophe-s.","B":"Incorrect: The singular possessive identifies only one museum, not both museums.","C":"Incorrect: The bare plural does not express that the collections belong to the museums.","D":"Correct: Both modifies two museums; the collections are owned by those museums, requiring the regular plural possessive museums’."},"passage":"Two museums collaborated on a virtual exhibit. Visitors can browse both _______ collections through the same online catalog rather than opening a separate site for each institution.","strategy":"Count the possessors first, then decide where the apostrophe belongs."},{"id":"FSS-004","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"divers","B":"divers'","C":"diver's","D":"divers's"},"answer":"B","explanation":"The logs belong to four divers; the possessive of the regular plural divers is divers’.","choice_explanations":{"A":"Incorrect: Without the apostrophe, the word does not express the possessive relationship needed here.","B":"Correct: The logs belong to four divers; the possessive of the regular plural divers is divers’.","C":"Incorrect: A singular possessive would incorrectly indicate that the logs belong to one diver.","D":"Incorrect: Regular plural nouns ending in s form the possessive with an apostrophe after s, not apostrophe-s."},"passage":"Four divers independently recorded the location of each reef marker. To verify the coordinates, the project manager compared all four _______ logs before publishing the final map.","strategy":"Count the possessors first, then decide where the apostrophe belongs."},{"id":"FSS-005","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"theirs","B":"it's","C":"its","D":"their"},"answer":"C","explanation":"The singular inanimate antecedent instrument requires the singular possessive determiner its.","choice_explanations":{"A":"Incorrect: Theirs is an independent possessive pronoun, not a determiner before own alignment.","B":"Incorrect: It’s means it is or it has, so it cannot modify the noun alignment as a possessive.","C":"Correct: The singular inanimate antecedent instrument requires the singular possessive determiner its.","D":"Incorrect: Their is plural and does not agree with the single instrument."},"passage":"Unlike the laboratory’s other devices, the new polarimeter recalibrates automatically. Every morning, the instrument checks _______ own alignment against a fixed reference before taking any measurements.","strategy":"Identify the specific noun being modified and trace the determiner to its owner or referent."},{"id":"FSS-006","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"there","B":"its","C":"their","D":"theirs"},"answer":"C","explanation":"The estimates belong to the two teams, so the plural possessive determiner their is required.","choice_explanations":{"A":"Incorrect: There indicates location or introduces a clause; it does not mark ownership of estimates.","B":"Incorrect: Its is singular and cannot refer to two separate teams.","C":"Correct: The estimates belong to the two teams, so the plural possessive determiner their is required.","D":"Incorrect: Theirs cannot directly precede estimates as a determiner."},"passage":"Two research teams measured the same wetland at different times. Although the teams followed similar procedures, _______ estimates of seasonal water loss differed substantially.","strategy":"Identify the specific noun being modified and trace the determiner to its owner or referent."},{"id":"FSS-007","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"This","B":"An","C":"That","D":"These"},"answer":"D","explanation":"The noun documents is plural and refers to the seven letters just mentioned; these is the matching plural determiner.","choice_explanations":{"A":"Incorrect: This is singular and cannot directly modify plural documents.","B":"Incorrect: An is a singular article and cannot modify the plural noun documents.","C":"Incorrect: That is singular and cannot directly modify plural documents.","D":"Correct: The noun documents is plural and refers to the seven letters just mentioned; these is the matching plural determiner."},"passage":"The archive recently recovered seven letters written by the same explorer. _______ documents include detailed sketches of river crossings and will be displayed together next month.","strategy":"Identify the specific noun being modified and trace the determiner to its owner or referent."},{"id":"FSS-008","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"Them","B":"Those","C":"This","D":"These"},"answer":"C","explanation":"Hypothesis is a singular count noun, and this refers back to the single explanation just described.","choice_explanations":{"A":"Incorrect: Them is an object pronoun in Standard English, not a determiner before hypothesis.","B":"Incorrect: Those is plural and cannot modify the singular noun hypothesis.","C":"Correct: Hypothesis is a singular count noun, and this refers back to the single explanation just described.","D":"Incorrect: These is plural and cannot modify the singular noun hypothesis."},"passage":"The researchers proposed a single explanation for the unusual vowel shift: speakers had adopted a pronunciation from a neighboring community. _______ hypothesis will be evaluated with recordings from an earlier period.","strategy":"Identify the specific noun being modified and trace the determiner to its owner or referent."},{"id":"FSS-009","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"itself","B":"they","C":"it","D":"them"},"answer":"B","explanation":"The plural subject three autonomous submersibles requires the plural subject pronoun they.","choice_explanations":{"A":"Incorrect: Itself is singular and reflexive, so it cannot serve as the independent subject of this clause.","B":"Correct: The plural subject three autonomous submersibles requires the plural subject pronoun they.","C":"Incorrect: It is singular and cannot refer to all three submersibles.","D":"Incorrect: Them is an object pronoun; this clause needs a subject before had been programmed."},"passage":"Three autonomous submersibles were released at dawn. Because _______ had been programmed to follow different routes, the researchers expected the devices to collect data from widely separated parts of the bay.","strategy":"Underline the exact noun that the pronoun replaces; check singular/plural and reflexive meaning."},{"id":"FSS-010","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"them","B":"its","C":"they","D":"it"},"answer":"C","explanation":"They is the plural subject pronoun referring to the four maps.","choice_explanations":{"A":"Incorrect: Them is an object form and cannot serve as the subject of show.","B":"Incorrect: Its is a possessive determiner, not a subject pronoun.","C":"Correct: They is the plural subject pronoun referring to the four maps.","D":"Incorrect: It is singular and cannot refer collectively to the four maps as individual objects."},"passage":"The catalog contains four hand-drawn maps. Although _______ show the same mountain range, each depicts the rivers at slightly different angles.","strategy":"Underline the exact noun that the pronoun replaces; check singular/plural and reflexive meaning."},{"id":"FSS-011","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"their","B":"them","C":"it","D":"they"},"answer":"C","explanation":"The singular subject pronoun it correctly replaces the singular clay bowl and agrees with has.","choice_explanations":{"A":"Incorrect: Their is a possessive determiner that requires a following noun, not a finite verb.","B":"Incorrect: Them is an object form and cannot serve as the subject of has.","C":"Correct: The singular subject pronoun it correctly replaces the singular clay bowl and agrees with has.","D":"Incorrect: They is plural and conflicts with the singular verb has."},"passage":"The clay bowl was reconstructed from six fragments. Although _______ still has a narrow crack across its base, its original curved profile is now clearly visible.","strategy":"Underline the exact noun that the pronoun replaces; check singular/plural and reflexive meaning."},{"id":"FSS-012","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"themselves","B":"them","C":"itself","D":"theirs"},"answer":"A","explanation":"The sensors both perform and receive the adjusting action; the plural reflexive pronoun themselves makes that relationship explicit.","choice_explanations":{"A":"Correct: The sensors both perform and receive the adjusting action; the plural reflexive pronoun themselves makes that relationship explicit.","B":"Incorrect: Them would refer to a different group of objects rather than back to the sensors that are adjusting.","C":"Incorrect: Itself is singular and does not agree with sensors.","D":"Incorrect: Theirs expresses possession and is not the reflexive object of adjust."},"passage":"Because the new sensors are self-calibrating, they can periodically adjust _______ without receiving commands from a separate control system.","strategy":"Underline the exact noun that the pronoun replaces; check singular/plural and reflexive meaning."},{"id":"FSS-013","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"indicate","B":"indicating","C":"have indicated","D":"indicates"},"answer":"D","explanation":"The singular head noun distribution is the subject, so it takes the singular present-tense verb indicates.","choice_explanations":{"A":"Incorrect: The plural verb indicate mistakenly agrees with the intervening plural beads or pits rather than distribution.","B":"Incorrect: Indicating is a nonfinite participle, so the sentence would lack a finite main verb.","C":"Incorrect: Have is plural and does not agree with the singular subject distribution.","D":"Correct: The singular head noun distribution is the subject, so it takes the singular present-tense verb indicates."},"passage":"The distribution of beads recovered from the three excavation pits _______ a gradual change in ornament styles over approximately two centuries.","strategy":"Strip out phrases between the subject and verb and test subject-verb agreement."},{"id":"FSS-014","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"protects","B":"protect","C":"protecting","D":"have protected"},"answer":"A","explanation":"The subject is the singular phrase a row; the plural panels and shifts are not the head of the subject.","choice_explanations":{"A":"Correct: The subject is the singular phrase a row; the plural panels and shifts are not the head of the subject.","B":"Incorrect: Protect is the plural present-tense form and fails to agree with the singular row.","C":"Incorrect: Protecting is nonfinite and cannot be the main-clause predicate without an auxiliary.","D":"Incorrect: Have is a plural auxiliary and does not agree with a row."},"passage":"A row of insulated panels, despite repeated shifts in outside temperature, _______ the instruments from sudden heat loss during field tests.","strategy":"Strip out phrases between the subject and verb and test subject-verb agreement."},{"id":"FSS-015","category":"Standard English Conventions","skill":"Form, Structure and Sense","level":"hard","question":"Which choice completes the text so that it conforms to the conventions of Standard English?","choices":{"A":"varies","B":"are varying","C":"varying","D":"vary"},"answer":"A","explanation":"The
