They did not find evidence that the later teachers had delivered less instruction or that either set of scores had been calculated incorrectly.","strategy":"When a sentence reports conflicting outcomes, inspect how the text explains them. Do not invent a change in setting, instruction, or honesty when the stated difference concerns measurement."},{"id":"TSP-040","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the overall structure of the text?","choices":{"A":"It contrasts two independent findings, explains why their disagreement is caused by flawed measurements, and proposes repeating the earlier experiment.","B":"It introduces alternative accounts, moves from an observation that does not distinguish them to a more informative test, and identifies what that test still leaves to determine.","C":"It presents an accepted explanation, documents two unsuccessful attempts to reproduce its prediction, and replaces it with an account that excludes any role for air.","D":"It states two hypotheses, uses a preliminary test to establish which is correct, and then measures precisely the contribution of the preferred mechanism."},"answer":"B","explanation":"The first observation fits both accounts, while the low-air comparison excludes an air-only explanation. The passage ends with a remaining quantitative question, not the exclusive confirmation of a single mechanism.","choice_explanations":{"A":"The observations need not disagree; no measurement flaw or proposal to repeat the first experiment is described.","B":"The first observation fits both accounts, while the low-air comparison excludes an air-only explanation. The passage ends with a remaining quantitative question, not the exclusive confirmation of a single mechanism.","C":"The accounts begin as proposals, the first observation fits both, and a contribution from air remains open rather than excluded.","D":"The preliminary test is inconclusive, and precise contributions remain a future task, not a completed measurement."},"text":"Researchers proposed two explanations for the prolonged ringing of a shallow metal bowl: vibration of its walls and resonance of air within it. A first experiment showed strong motion near the bowl's center, but both explanations were compatible with that observation. The team next compared the bowl's ringing in ordinary air with its ringing in a chamber from which nearly all air had been removed. Ringing persisted in the chamber, though for a shorter time. The team therefore ruled out enclosed air as the sole source of the sound. Its next task is to determine how much the air contributes to the duration of ringing under ordinary conditions.","text_html":"Researchers proposed two explanations for the prolonged ringing of a shallow metal bowl: vibration of its walls and resonance of air within it. A first experiment showed strong motion near the bowl&#x27;s center, but both explanations were compatible with that observation. The team next compared the bowl&#x27;s ringing in ordinary air with its ringing in a chamber from which nearly all air had been removed. Ringing persisted in the chamber, though for a shorter time. The team therefore ruled out enclosed air as the sole source of the sound. Its next task is to determine how much the air contributes to the duration of ringing under ordinary conditions.","strategy":"In multi-stage research, distinguish evidence compatible with a hypothesis from evidence that discriminates between hypotheses. Rejecting a sole cause does not reject every contribution from it."},{"id":"TSP-041","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It explains why Anik decides to reorganize the workspace in response to the narrator's criticism.","B":"It makes explicit how an observed use of an object undermines the narrator's earlier judgment of the workspace.","C":"It illustrates the narrator's original assessment by showing how an improvised tool creates additional difficulty for Anik.","D":"It marks a change in Anik's standards by contrasting a formerly careless practice with a newly systematic method."},"answer":"B","explanation":"The sentence translates an observed action into its significance for the narrator. The final sentence reinforces that little has physically changed even though the interpretation of the room has.","choice_explanations":{"A":"The narrator observes rather than reports speaking criticism, and Anik uses an existing object rather than reorganizing the room.","B":"The sentence translates an observed action into its significance for the narrator. The final sentence reinforces that little has physically changed even though the interpretation of the room has.","C":"The wedge stabilizes the vase and enables the repair, contradicting rather than supporting the original accusation.","D":"The change is in the narrator's evaluation. Anik's ordinary use of the wedge does not establish a change in working standards."},"text":"From the doorway, I took Anik's bench for evidence of carelessness. The handles differed in length, the drawers lacked matching knobs, and a row of little wedges lay where any orderly worker would have left a clear surface. Anik selected one wedge, held it against the uneven base of a vase, and set the vase securely on the bench. The object I had counted as clutter made the delicate repair possible. Nothing on the bench had changed places except that single wedge; nevertheless, I found that I could no longer arrange the rest of the room under the same easy accusation.","text_html":"From the doorway, I took Anik&#x27;s bench for evidence of carelessness. The handles differed in length, the drawers lacked matching knobs, and a row of little wedges lay where any orderly worker would have left a clear surface. Anik selected one wedge, held it against the uneven base of a vase, and set the vase securely on the bench. <u>The object I had counted as clutter made the delicate repair possible.<\/u> Nothing on the bench had changed places except that single wedge; nevertheless, I found that I could no longer arrange the rest of the room under the same easy accusation.","strategy":"Distinguish a character changing from an observer discovering a character's existing qualities. The target may explain a revision in judgment, not a revision in behavior."},{"id":"TSP-042","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It presents evidence that maps became more useful after their design was revised, a development the passage then explains.","B":"It summarizes a disagreement about how to measure collection speed that the analyst resolves by proposing a new measurement.","C":"It establishes a discrepancy that the passage subsequently relates to a difference in the conditions being compared.","D":"It contrasts observations from functioning warehouses with results from a simulation whose unrealistic assumptions the analyst later identifies."},"answer":"C","explanation":"The opening reports opposite associations. The remaining sentences offer a possible explanation involving workload and the timing of adoption, without claiming that either report fabricated its observations.","choice_explanations":{"A":"No revision to the maps is mentioned. The proposed explanation concerns deployment conditions, not map design.","B":"The disagreement is between reported outcomes, not definitions or measures of speed; no new measure is proposed.","C":"The opening reports opposite associations. The remaining sentences offer a possible explanation involving workload and the timing of adoption, without claiming that either report fabricated its observations.","D":"Nothing identifies the trial as a simulation or calls its assumptions unrealistic; the issue is comparability of workload."},"text":"Earlier warehouse reports associated route maps with slower order collection, yet a recent trial found that workers using maps completed comparable orders more quickly. Analyst Priya Sen notes that the earlier warehouses had introduced maps only when unusually heavy workloads prompted emergency reorganizations. Their reports compared those periods with quieter periods in which no maps were used. The trial, by contrast, assigned mapped and unmapped routes while keeping order volume comparable. Sen argues that the apparent conflict may reflect the conditions under which maps were introduced rather than a change in what maps themselves enable workers to do.","text_html":"<u>Earlier warehouse reports associated route maps with slower order collection, yet a recent trial found that workers using maps completed comparable orders more quickly.<\/u> Analyst Priya Sen notes that the earlier warehouses had introduced maps only when unusually heavy workloads prompted emergency reorganizations. Their reports compared those periods with quieter periods in which no maps were used. The trial, by contrast, assigned mapped and unmapped routes while keeping order volume comparable. Sen argues that the apparent conflict may reflect the conditions under which maps were introduced rather than a change in what maps themselves enable workers to do.","strategy":"Identify what conflicts and what later explains the conflict. A confounding circumstance is not the same as false data or a newly invented measurement."},{"id":"TSP-043","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It supplies a comparison that supports an interpretation of the symbols' function without identifying who applied them.","B":"It identifies the evidence that enables Lian to attribute the symbols to depot employees rather than to the senders.","C":"It restates Lian's interpretation in general terms without contributing a separate observation about the parcels.","D":"It presents an inconsistency in the register that Lian explains by showing how the depot confused parcels from different makers."},"answer":"A","explanation":"The comparison separates maker identity from destination and shows that the marks align with the latter. That supports a function without settling who made the marks.","choice_explanations":{"A":"The comparison separates maker identity from destination and shows that the marks align with the latter. That supports a function without settling who made the marks.","B":"The passage explicitly leaves that attribution open; function and authorship are separate questions.","C":"The sentence supplies concrete relationships among makers, symbols, and loading bays; it is evidence rather than mere restatement.","D":"No inconsistent record or mistaken handling is described; the regular pattern supports a routing interpretation."},"text":"Historian Lian suggests that the small symbols on parcels in a depot's surviving photographs served as routing instructions rather than makers' decorations. The same maker's parcels bear different symbols, whereas parcels from different makers share a symbol when the register assigns them to the same loading bay. That pattern fits the routing interpretation better than an association with a particular workshop. Lian nevertheless leaves open whether the symbols were applied by the senders or by depot employees. Their probable function, she emphasizes, is easier to reconstruct from the records than the identity of the people who drew them.","text_html":"Historian Lian suggests that the small symbols on parcels in a depot&#x27;s surviving photographs served as routing instructions rather than makers&#x27; decorations. <u>The same maker&#x27;s parcels bear different symbols, whereas parcels from different makers share a symbol when the register assigns them to the same loading bay.<\/u> That pattern fits the routing interpretation better than an association with a particular workshop. Lian nevertheless leaves open whether the symbols were applied by the senders or by depot employees. Their probable function, she emphasizes, is easier to reconstruct from the records than the identity of the people who drew them.","strategy":"Evidence can support one part of an interpretation while leaving another unanswered. Keep function, cause, and authorship separate."},{"id":"TSP-044","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the overall structure of the text?","choices":{"A":"It compares two established detection systems, identifies the cheaper one, and recommends replacing the other despite uncertainty about maintenance.","B":"It presents a detection problem, describes an adapted technique and its implementation, and reports an improvement with a remaining condition to test.","C":"It identifies a limitation of a conveyor belt, explains why repainting solved it, and reports a camera modification that made the repair unnecessary.","D":"It describes how jewelers discovered a new optical effect, explains its theoretical basis, and proposes an industrial test of that discovery."},"answer":"B","explanation":"The stages are obstacle, borrowed approach, implementation, observed benefit, and a limit on what has been tested. The final qualification does not undo the reported improvement or turn implementation into a proposal.","choice_explanations":{"A":"There is no comparison of costs or two established systems, and replacement is not recommended.","B":"The stages are obstacle, borrowed approach, implementation, observed benefit, and a limit on what has been tested. The final qualification does not undo the reported improvement or turn implementation into a proposal.","C":"The belt was not repainted, and the identified difficulty is detecting clear edges, not a documented repainting repair.","D":"The technique was already used; the engineers implemented and tested it rather than merely proposing a test."},"text":"A recycling line could identify colored fragments of glass but often missed the edges of clear ones against its pale conveyor belt. Engineers turned to a technique used by jewelers: illuminating an object from a shallow angle so that its edges stand out. They installed narrow lamps beside the belt and trained the camera system on the resulting bright outlines. In tests, the line detected more clear fragments without requiring the belt to be repainted. The team has not yet established how well the arrangement works when dust accumulates on the lamps, so regular production trials remain necessary.","text_html":"A recycling line could identify colored fragments of glass but often missed the edges of clear ones against its pale conveyor belt. Engineers turned to a technique used by jewelers: illuminating an object from a shallow angle so that its edges stand out. They installed narrow lamps beside the belt and trained the camera system on the resulting bright outlines. In tests, the line detected more clear fragments without requiring the belt to be repainted. The team has not yet established how well the arrangement works when dust accumulates on the lamps, so regular production trials remain necessary.","strategy":"Track whether a solution has been suggested, built, tested, or generally deployed. These are different stages, even when the same device is discussed."},{"id":"TSP-045","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the overall structure of the text?","choices":{"A":"It introduces a criticism of a design, presents its creator's alternative understanding of that feature, and ends with qualified acceptance of the critics' wording.","B":"It describes the architect's initial satisfaction, traces her growing agreement with the visitors, and concludes with her promise to complete the design.","C":"It presents doubts about the courtyard, supplies accounts of events that disproved those doubts, and records the visitors' change of opinion.","D":"It contrasts two completed designs, explains why the architect preferred the less decorative one, and proposes a compromise with the visitors."},"answer":"A","explanation":"The passage gives a criticism, then a different value for the criticized quality: openness permits future uses. The final repetition of 'unfinished' preserves disagreement about its meaning rather than resolving the dispute.","choice_explanations":{"A":"The passage gives a criticism, then a different value for the criticized quality: openness permits future uses. The final repetition of 'unfinished' preserves disagreement about its meaning rather than resolving the dispute.","B":"She reinterprets 'unfinished' without accepting failure or promising completion; no change from satisfaction to agreement is narrated.","C":"The gatherings are imagined, and the visitors retain their criticism. Neither completed events nor their conversion is reported.","D":"Only one courtyard is described. Missing ornaments are not a second completed design, and no compromise is proposed."},"text":"They called the courtyard empty. No fountain interrupted its paving, no sculpture rose conveniently at its center. The architect listened without defending the unoccupied space. Then she asked them to imagine a morning when the school across the lane had nowhere to rehearse, an evening when neighbors needed chairs beneath the sky. She did not claim that either gathering had already occurred. She wanted a place whose usefulness would not depend on preserving the arrangement she had drawn. The visitors continued to call it unfinished; she accepted the word, though not the failure they meant by it.","text_html":"They called the courtyard empty. No fountain interrupted its paving, no sculpture rose conveniently at its center. The architect listened without defending the unoccupied space. Then she asked them to imagine a morning when the school across the lane had nowhere to rehearse, an evening when neighbors needed chairs beneath the sky. She did not claim that either gathering had already occurred. She wanted a place whose usefulness would not depend on preserving the arrangement she had drawn. The visitors continued to call it unfinished; she accepted the word, though not the failure they meant by it.","strategy":"Agreement on a word need not be agreement on its evaluation. In structure choices, verify that imagined scenes remain imagined and critics actually change their minds."},{"id":"TSP-046","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the overall structure of the text?","choices":{"A":"It presents a disputed explanation for fading, compares two rival predictions, and shows why the researchers accepted one over the other.","B":"It identifies an unresolved question, describes a prediction and a test, and reports a result that does not support the predicted difference.","C":"It describes a familiar phenomenon, outlines a test of its cause, and explains how the resulting measurements establish the chemical mechanism.","D":"It introduces a hypothesis, presents apparently inconsistent results, and describes the revised hypothesis the researchers developed to reconcile them."},"answer":"B","explanation":"The text distinguishes faster overall fading, which occurs, from a disproportionate effect on one dye, which does not. Its sequence ends with a limited negative result rather than a new explanation.","choice_explanations":{"A":"Only one prediction is introduced, and no competing explanation is accepted.","B":"The text distinguishes faster overall fading, which occurs, from a disproportionate effect on one dye, which does not. Its sequence ends with a limited negative result rather than a new explanation.","C":"The test concerns relative dye stability, not the full cause of fading, and no chemical mechanism is established.","D":"The results fail to support the selective effect, but the passage does not supply a revised hypothesis."},"text":"A laboratory knew that its violet labels faded faster near a window, but it was unclear whether brighter light also changed the relative stability of the two dyes in the ink. The researchers predicted that stronger illumination would disproportionately damage the blue dye. They printed identical labels, exposed them to several light levels, and measured each dye separately. Although both dyes faded faster under brighter conditions, their rates increased in the same proportion. The team reported that the proposed selective effect had not appeared in the tested range; the study did not identify the chemical reason for the dyes' matching responses.","text_html":"A laboratory knew that its violet labels faded faster near a window, but it was unclear whether brighter light also changed the relative stability of the two dyes in the ink. The researchers predicted that stronger illumination would disproportionately damage the blue dye. They printed identical labels, exposed them to several light levels, and measured each dye separately. Although both dyes faded faster under brighter conditions, their rates increased in the same proportion. The team reported that the proposed selective effect had not appeared in the tested range; the study did not identify the chemical reason for the dyes&#x27; matching responses.","strategy":"Map the precise prediction, not merely the broad topic. An effect may occur while the predicted difference within that effect does not."},{"id":"TSP-047","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It disputes the factual premise of the initial interpretation by showing that illustrations were more common than previously thought.","B":"It acknowledges a feature that could favor the initial interpretation before the text explains why that feature is insufficient to support it.","C":"It explains the historical reason that owners increasingly replaced diagrams with measurements and procedural warnings.","D":"It identifies the central defect that the author believes makes these books unreliable evidence of household repair practices."},"answer":"B","explanation":"The author does not deny the lack of drawings. Instead, the subsequent procedural details show why a real limitation does not justify the broad claim that users lacked systematic knowledge.","choice_explanations":{"A":"The sentence concedes the scarcity of drawings; it does not contradict that premise.","B":"The author does not deny the lack of drawings. Instead, the subsequent procedural details show why a real limitation does not justify the broad claim that users lacked systematic knowledge.","C":"No trend over time or reason for replacing diagrams is given; the passage compares what survives in the books.","D":"The author grants a limitation for unfamiliar readers but argues that the books still reveal systematic practices."},"text":"Because surviving household repair books seldom resemble modern illustrated manuals, they are sometimes treated as evidence that their owners lacked systematic mechanical knowledge. That inference overlooks how the books were used. Only a small fraction include drawings of the devices under repair. Many instead record measurements, the order in which parts should be removed, and warnings beside steps that had previously failed. Such entries could guide someone who already recognized the parts. The absence of a picture therefore limits what an unfamiliar reader can reconstruct without showing that the original user worked without a method.","text_html":"Because surviving household repair books seldom resemble modern illustrated manuals, they are sometimes treated as evidence that their owners lacked systematic mechanical knowledge. That inference overlooks how the books were used. <u>Only a small fraction include drawings of the devices under repair.<\/u> Many instead record measurements, the order in which parts should be removed, and warnings beside steps that had previously failed. Such entries could guide someone who already recognized the parts. The absence of a picture therefore limits what an unfamiliar reader can reconstruct without showing that the original user worked without a method.","strategy":"A concession may accept a fact while rejecting the conclusion someone draws from it. Track those two levels separately."},{"id":"TSP-048","category":"Craft and Structure","skill":"Text Structure and Purpose","level":"very_hard","question":"Which choice best describes the function of the underlined portion in the text as a whole?","choices":{"A":"It introduces evidence that household apprentices did not perform the preliminary tests documented in institutional instruction.","B":"It sets a boundary on the population represented by the evidence without overturning the narrower conclusion developed afterward.","C":"It concedes a weakness that the researchers later eliminate by comparing institutional notebooks with equally detailed household records.","D":"It explains why the researchers regard the workshop notebooks as unreliable descriptions of the practices they record."},"answer":"B","explanation":"The target restricts representativeness, not the credibility of the observations within that scope. The eventual claim is carefully limited to the institutions actually documented.","choice_explanations":{"A":"The sentence says direct evidence is limited; the ending explicitly leaves household practice unresolved.","B":"The target restricts representativeness, not the credibility of the observations within that scope. The eventual claim is carefully limited to the institutions actually documented.","C":"No such equally detailed comparison is reported. The scope boundary remains in place.","D":"Limited population coverage is not the same as unreliability about the workshops represented; the subsequent evidence supports a claim about those workshops."},"text":"A survey of workshop notebooks found that apprentices commonly tested a tool on scrap material before using it on a finished object. The notebooks all came from large training workshops, so they provide little direct evidence about apprentices who learned in private households. Nevertheless, within the workshops represented, the same practice appears in notes kept by both instructors and apprentices over several decades. The researchers therefore argue that preliminary testing was a stable feature of instruction in those institutions. They leave open whether its absence from surviving household records reflects a different practice or simply a different habit of keeping records.","text_html":"A survey of workshop notebooks found that apprentices commonly tested a tool on scrap material before using it on a finished object. <u>The notebooks all came from large training workshops, so they provide little direct evidence about apprentices who learned in private households.<\/u> Nevertheless, within the workshops represented, the same practice appears in notes kept by both instructors and apprentices over several decades. The researchers therefore argue that preliminary testing was a stable feature of instruction in those institutions. They leave open whether its absence from surviving household records reflects a different practice or simply a different habit of keeping records.","strategy":"Distinguish a scope limitation from invalid evidence. An appropriate conclusion can survive a limitation by applying only to the population the evidence represents."}]},{"category":"Craft and Structure","subcategory":"Words in Context","questions":[{"id":"WIC-001","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"called\" most nearly mean?","choices":{"A":"Described","B":"Summoned","C":"Telephoned","D":"Named officially"},"answer":"A","explanation":"The commentators characterized the images as unprecedented, so \"called\" means described or characterized.","choice_explanations":{"A":"Correct: the word introduces the commentators' characterization of the images.","B":"No one is being summoned.","C":"The passage has nothing to do with telephoning.","D":"The images are not being formally assigned a name."},"passage":"When the observatory released its first images, several commentators called them unprecedented. Historian Leila Morgan, however, noted that astronomers had produced similar composite images decades earlier. What was new, she argued, was not the basic technique but the resolution at which faint structures could now be distinguished.","target_text":"called","strategy":"Replace the target with each choice and ask which meaning fits the exact grammatical and logical role in the sentence."},{"id":"WIC-002","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"load\" most nearly mean?","choices":{"A":"Burden","B":"Quantity carried","C":"Shipment","D":"Electrical demand"},"answer":"B","explanation":"The passage concerns the amount of sediment transported by the river; \"load\" means the quantity being carried.","choice_explanations":{"A":"A burden is something difficult to bear, which is not the intended sense.","B":"Correct: the river carries a quantity of sediment.","C":"Shipment implies deliberate commercial transport.","D":"Electrical demand is an unrelated technical meaning of load."},"passage":"The river once carried enough sediment to rebuild marshes after severe storms. After several upstream dams were completed, however, much of that sediment was trapped in reservoirs. As a result, the river now delivers only a fraction of its former sediment load to the coast.","target_text":"load","strategy":"Use the noun modified by the target expression: sediment determines which sense of \"load\" is possible."},{"id":"WIC-003","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"carry\" most nearly mean?","choices":{"A":"Transport physically","B":"Win approval for","C":"Convey","D":"Support the weight of"},"answer":"C","explanation":"The gestures communicate emotional meaning, so \"carry\" means convey.","choice_explanations":{"A":"Nothing is physically transported.","B":"The passage does not discuss votes or approval.","C":"Correct: the gestures convey meaning that explicit explanation once supplied.","D":"No literal weight is involved."},"passage":"The novelist's earliest drafts explain nearly every motive directly. In later revisions, she removes many of those explanations and lets small gestures carry more of the emotional meaning. The final version is therefore more restrained, but it is not less revealing.","target_text":"carry","strategy":"Look at the object of the verb. A gesture can \"carry meaning\" idiomatically by conveying it."},{"id":"WIC-004","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"weight\" most nearly mean?","choices":{"A":"Mass","B":"Difficulty","C":"Pressure","D":"Importance"},"answer":"D","explanation":"Repeated evidence makes the finding more persuasive or significant, so \"weight\" means importance or evidentiary force.","choice_explanations":{"A":"The passage is not discussing physical mass.","B":"The repetition does not make the finding more difficult.","C":"No physical pressure is described.","D":"Correct: repetition increases the finding's evidentiary importance."},"passage":"A single unusual measurement would not have persuaded the team. But the same chemical signature appeared in samples collected at five widely separated sites. That repetition gave the finding considerably more weight than any one sample could have provided.","target_text":"weight","strategy":"Ask what changed because of repetition: not the sample's mass, but how strongly the evidence should count."},{"id":"WIC-005","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"account\" most nearly mean?","choices":{"A":"Explanation","B":"Financial record","C":"Personal profile","D":"Calculation"},"answer":"A","explanation":"The catalog offered an explanation of the figures' origins; the new inscription complicates that explanation.","choice_explanations":{"A":"Correct: \"account\" refers to an explanatory version of what happened.","B":"No finances are discussed.","C":"The catalog is not a biography.","D":"No numerical calculation is at issue."},"passage":"The museum's first catalog treated the two bronze figures as products of the same workshop. A newly discovered inscription complicates that account: one figure appears to have been made at least thirty years later than the other, probably by a different group of artisans.","target_text":"account","strategy":"When an object can be \"complicated\" by new evidence, \"account\" usually means an explanation or narrative, not a ledger."},{"id":"WIC-006","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"qualify\" most nearly mean?","choices":{"A":"Become eligible for","B":"Limit or modify","C":"Demonstrate expertise in","D":"Classify"},"answer":"B","explanation":"The researchers add a limitation to their conclusion, so they qualify it by modifying or restricting its scope.","choice_explanations":{"A":"Eligibility is not being discussed.","B":"Correct: they weaken the generality of the conclusion by stating a limitation.","C":"No professional credential is involved.","D":"They are not sorting the conclusion into a category."},"passage":"Because the first survey included only households with landline telephones, its estimate may not represent the whole population. The researchers therefore qualify their conclusion, emphasizing that the pattern is clear within the surveyed group but may differ elsewhere.","target_text":"qualify","strategy":"Watch for nearby limitation language such as \"within the surveyed group\" and \"may differ elsewhere.\""},{"id":"WIC-007","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"contour\" most nearly mean?","choices":{"A":"Physical boundary","B":"Volume","C":"Overall shape","D":"Emotional tone"},"answer":"C","explanation":"In a musical context, the melody's contour is its overall shape or pattern of movement.","choice_explanations":{"A":"The phrase is figurative, not a literal physical edge.","B":"Volume concerns loudness, not melodic form.","C":"Correct: the melody remains recognizably shaped even after its setting changes.","D":"The effect changes, so emotional tone is specifically not what is preserved."},"passage":"The composer did not abandon the melody when she revised the piece. Instead, she placed it in the lower strings and surrounded it with denser harmonies, altering its effect while preserving its basic contour.","target_text":"contour","strategy":"Use the contrast: the effect changes but something structural remains. That preserved feature is the melody's shape."},{"id":"WIC-008","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"force\" most nearly mean?","choices":{"A":"Physical strength","B":"Military unit","C":"Coercion","D":"Effectiveness"},"answer":"D","explanation":"Weak enforcement reduces how effectively the law changes behavior; \"force\" means practical effectiveness or impact.","choice_explanations":{"A":"No physical strength is involved.","B":"No military group is discussed.","C":"Although laws can coerce, the phrase \"practical force\" here refers more broadly to effectiveness.","D":"Correct: warnings without penalties reduce the law's practical impact."},"passage":"The law was intended to curb the disposal of untreated waste, but enforcement remained uneven. In several districts, inspectors issued warnings repeatedly without imposing penalties, blunting the law's practical force.","target_text":"force","strategy":"Interpret the whole phrase, not the target word alone. \"Practical force\" is the law's real-world effect."},{"id":"WIC-009","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"ground\" most nearly mean?","choices":{"A":"Basis","B":"Area of land","C":"Soil","D":"Powdered material"},"answer":"A","explanation":"The pottery had served as the basis or justification for the original dating claim.","choice_explanations":{"A":"Correct: the evidence was the basis for the original date.","B":"The target phrase concerns a reason for a conclusion, not a location.","C":"Soil appears in the archaeological setting but is not the sense used here.","D":"Nothing is being ground into powder."},"passage":"The archaeologists initially dated the wall to the seventh century because pottery from that period was found nearby. Later excavation revealed that the pottery had washed into the area from a higher slope, removing the principal ground for the original date.","target_text":"ground","strategy":"A phrase like \"ground for a claim\" almost always points to justification or basis."},{"id":"WIC-010","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"maintain\" most nearly mean?","choices":{"A":"Claim","B":"Preserve","C":"Repair","D":"Provide financial support for"},"answer":"B","explanation":"Song differences help preserve the populations' separation over time.","choice_explanations":{"A":"No verbal claim is being made.","B":"Correct: the distinction keeps the populations separated.","C":"Nothing is being repaired.","D":"No financial support is involved."},"passage":"Although the two bird populations look nearly identical, their songs differ sharply. Those differences are enough for females to distinguish local males from outsiders, helping maintain the separation between the populations even where their ranges overlap.","target_text":"maintain","strategy":"Substitute \"keep\" for the target. If the sentence remains logical, the preservation sense is likely intended."},{"id":"WIC-011","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"framed\" most nearly mean?","choices":{"A":"Falsely accused","B":"Placed in a border","C":"Presented","D":"Constructed physically"},"answer":"C","explanation":"The documentary presented or characterized the dispute in a particular way.","choice_explanations":{"A":"The criminal-law sense of \"framed\" is irrelevant.","B":"No literal picture frame is involved.","C":"Correct: the sentence concerns how the film presents the dispute.","D":"The dispute is not a physical object being built."},"passage":"The critic objected not to the documentary's conclusion but to the way it framed the dispute. By presenting only the two most extreme positions, the film made a broad range of intermediate views seem as though they did not exist.","target_text":"framed","strategy":"Look for an abstract object such as issue, debate, or dispute; \"frame\" often means present or characterize."},{"id":"WIC-012","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"settle\" most nearly mean?","choices":{"A":"Establish a residence in","B":"Pay","C":"Sink to the bottom","D":"Resolve"},"answer":"D","explanation":"The evidence does not resolve the debate completely, though it eliminates one explanation.","choice_explanations":{"A":"The object is a debate, not a place.","B":"No debt is being paid.","C":"No material is sinking.","D":"Correct: \"settle the debate\" means resolve it."},"passage":"The new evidence does not settle the debate over why the settlement was abandoned. It does, however, rule out one influential proposal by showing that the river remained navigable for centuries after residents had left.","target_text":"settle","strategy":"Use the object noun: debates are settled by being resolved."},{"id":"WIC-013","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"register\" most nearly mean?","choices":{"A":"Record or express","B":"Enroll","C":"Understand","D":"Measure mechanically"},"answer":"A","explanation":"The letters express or record the poet's growing frustration.","choice_explanations":{"A":"Correct: the letters reveal and express a change in attitude.","B":"No enrollment occurs.","C":"The passage concerns expression, not comprehension.","D":"No measuring device is involved."},"passage":"The poet's letters reveal admiration for the older writer, but they also register increasing frustration with his advice. By the final year of their correspondence, the poet thanks him politely while quietly rejecting nearly every suggestion he makes.","target_text":"register","strategy":"When an artifact such as a letter, face, or instrument \"registers\" something, it often shows or records it."},{"id":"WIC-014","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the phrase \"bears directly on\" most nearly mean?","choices":{"A":"Physically presses against","B":"Is immediately relevant to","C":"Places responsibility on","D":"Resembles closely"},"answer":"B","explanation":"The finding is directly relevant to the engineering effort described.","choice_explanations":{"A":"The phrase is not literal.","B":"Correct: the result has immediate relevance to component design.","C":"No assignment of responsibility is discussed.","D":"The finding does not resemble the effort; it informs it."},"passage":"Researchers expected the alloy to become brittle after repeated heating. Instead, microscopic imaging showed a network of defects that allowed the material to accommodate stress. The finding bears directly on efforts to design components for engines that cycle rapidly between temperatures.","target_text":"bears directly on","strategy":"Treat multiword targets as fixed expressions first; do not define each word separately."},{"id":"WIC-015","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"marks\" most nearly mean?","choices":{"A":"Celebrates","B":"Damages","C":"Indicates","D":"Grades"},"answer":"C","explanation":"The map indicates the harbor's location with a small circle.","choice_explanations":{"A":"No celebration is involved.","B":"The map is not damaging the harbor.","C":"Correct: a symbol on a map indicates a location.","D":"No evaluation or grading occurs."},"passage":"The earliest version of the map marks the harbor with only a small circle. In copies made after 1720, the harbor receives elaborate shading and several labels, reflecting its growing commercial importance.","target_text":"marks","strategy":"Use genre knowledge carefully: on a map, a symbol commonly marks a place by indicating it."},{"id":"WIC-016","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"sustain\" most nearly mean?","choices":{"A":"Keep alive physically","B":"Supply with food","C":"Endure","D":"Support as defensible"},"answer":"D","explanation":"New evidence made the assumption difficult to defend or support as reasonable.","choice_explanations":{"A":"The assumption is not alive.","B":"No nourishment is involved.","C":"The sentence concerns whether the claim can be supported, not simply whether it lasts.","D":"Correct: the assumption becomes difficult to defend in light of new evidence."},"passage":"The proposal attracted attention because it promised to reduce costs without reducing service. Yet its central assumption—that demand would remain constant for ten years—was difficult to sustain once new population estimates became available.","target_text":"sustain","strategy":"In arguments, a claim is \"sustained\" when evidence can support or defend it."},{"id":"WIC-017","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"tempering\" most nearly mean?","choices":{"A":"Moderating","B":"Hardening","C":"Testing","D":"Provoking"},"answer":"A","explanation":"The replication reduced or moderated the researchers' enthusiasm.","choice_explanations":{"A":"Correct: the weaker result makes enthusiasm less intense.","B":"Hardening is a materials-related sense, not the one used here.","C":"The replication tests the treatment, but \"tempering enthusiasm\" describes its effect on attitude.","D":"The result reduces rather than provokes enthusiasm."},"passage":"The first experiment produced a striking difference between the treatment and control groups. A larger replication, however, yielded almost no difference at all, tempering researchers' initial enthusiasm for the treatment.","target_text":"tempering","strategy":"Identify the direction of change: strong enthusiasm becomes weaker, so the verb must mean moderate or reduce."},{"id":"WIC-018","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"narrower\" most nearly mean?","choices":{"A":"More physically confined","B":"More limited in scope","C":"Less accurate","D":"More difficult to detect"},"answer":"B","explanation":"The historian's claim is more limited in scope than a wholesale denial of the treaty's importance.","choice_explanations":{"A":"No physical width is involved.","B":"Correct: she makes a restricted claim about over-attribution.","C":"The text does not say her point is less accurate.","D":"Detectability is irrelevant."},"passage":"The historian does not deny that the treaty mattered. Her point is narrower: later writers made the treaty carry too much explanatory burden, treating it as the cause of developments that had begun years earlier.","target_text":"narrower","strategy":"Contrast the claim with what it explicitly does not say. That reveals the intended scope."},{"id":"WIC-019","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"critical\" most nearly mean?","choices":{"A":"Essential","B":"At a dangerous point","C":"Disapproving","D":"Analytically important"},"answer":"C","explanation":"The report finds fault with the agency's record-keeping, so \"critical\" means disapproving or fault-finding.","choice_explanations":{"A":"The report is not saying record-keeping is essential in this phrase.","B":"No emergency condition is described.","C":"Correct: the report expresses negative judgment.","D":"Although analysis is involved, the sentence specifically conveys disapproval."},"passage":"The committee's report is critical of the agency's record-keeping but stops short of accusing employees of misconduct. It instead attributes most errors to outdated software and inconsistent procedures.","target_text":"critical","strategy":"Do not choose the most academic-sounding sense. Match the emotional/evaluative direction of the sentence."},{"id":"WIC-020","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"currency\" most nearly mean?","choices":{"A":"Money","B":"Urgency","C":"Accuracy","D":"Circulation or acceptance"},"answer":"D","explanation":"The model made the idea more widely accepted and discussed among specialists.","choice_explanations":{"A":"No money is involved.","B":"Urgency is not discussed.","C":"The model may support the idea, but \"currency\" refers to its acceptance, not truth itself.","D":"Correct: an idea gains currency when it becomes more accepted or widespread."},"passage":"At first, the researchers treated the two signals as separate phenomena. A later model showed that both could arise from the same underlying process, giving the idea new currency among specialists who had previously dismissed it.","target_text":"currency","strategy":"For abstract nouns like idea or theory, \"currency\" usually concerns circulation or acceptance."},{"id":"WIC-021","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"securely\" most nearly mean?","choices":{"A":"Firmly or confidently","B":"Safely","C":"Secretly","D":"By fastening"},"answer":"A","explanation":"The matching dimensions provide strong evidence for confidently linking the drawing to the project.","choice_explanations":{"A":"Correct: the attribution can be made with confidence.","B":"Physical safety is irrelevant.","C":"Nothing is concealed.","D":"No object is being physically fastened."},"passage":"The architect's notebooks contain dozens of sketches, but few are tied to specific commissions. One drawing can be securely linked to the railway station project because its dimensions match those in a dated engineering plan.","target_text":"securely","strategy":"Ask whether the adverb describes physical action or certainty of inference. Here it modifies an attribution claim."},{"id":"WIC-022","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"issue\" most nearly mean?","choices":{"A":"Problem","B":"Edition","C":"Result","D":"Disagreement"},"answer":"B","explanation":"A journal \"issue\" is an edition or installment containing a group of articles.","choice_explanations":{"A":"Coastal adaptation is a problem, but the target refers to the journal's publication unit.","B":"Correct: an entire edition was devoted to the topic.","C":"No result is being described.","D":"No disagreement is meant."},"passage":"The journal devoted an entire issue to coastal adaptation. Rather than focusing only on engineering, the collection included essays on insurance, migration, public health, and local governance.","target_text":"issue","strategy":"Use the noun that governs the target: journal strongly cues the publication sense of \"issue.\""},{"id":"WIC-023","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"stable\" most nearly mean?","choices":{"A":"Structurally safe","B":"Chemically inert","C":"Consistent","D":"Balanced physically"},"answer":"C","explanation":"Flowering occurs at a relatively consistent time despite variable temperatures.","choice_explanations":{"A":"No structure is being evaluated.","B":"No chemical reaction is discussed.","C":"Correct: the timing changes little from year to year.","D":"Physical balance is irrelevant."},"passage":"The valley's spring temperatures vary from year to year, but the timing of flowering is remarkably stable. The plants appear to respond not to temperature alone but to the lengthening daylight, which provides a more reliable seasonal signal.","target_text":"stable","strategy":"Translate the contrast: temperatures vary, but flowering timing does not vary much."},{"id":"WIC-024","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"As used in the text, what does the word \"addresses\" most nearly mean?","choices":{"A":"Speaks formally to","B":"Corrects","C":"Provides a location for","D":"Deals with"},"answer":"D","explanation":"The decision deals with one legal question but not the broader environmental question.","choice_explanations":{"A":"The target takes an issue as its object, not an audience.","B":"The court does not necessarily fix the issue; it considers it.","C":"No location is being provided.","D":"Correct: the court considers or deals with the procedural question."},"passage":"The court's decision addresses only whether the permit was issued according to the required procedure. It leaves untouched the broader question of whether the project itself is environmentally sound.","target_text":"addresses","strategy":"When the object is a question, problem, or concern, \"address\" commonly means deal with or consider."},{"id":"WIC-025","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"corroborate","B":"circumscribe","C":"preclude","D":"disregard"},"answer":"A","explanation":"Independent records that agree with an existing claim provide supporting evidence, so they corroborate it.","choice_explanations":{"A":"Correct: independent matching evidence supports the claim.","B":"Circumscribe means restrict, which the records do not do.","C":"Preclude means prevent, the opposite of the relationship described.","D":"The records do not ignore the claim; they support it."},"passage":"A newly recovered set of shipping records lists the same merchant names that appear in tax registers from the period. Because the two sources were produced independently, the records _______ historians' claim that the merchants dominated regional trade.","target_text":"_______","strategy":"Identify the evidence relationship before evaluating vocabulary: new independent evidence agrees with an existing claim = support/corroborate."},{"id":"WIC-026","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"amplify","B":"reconcile","C":"replicate","D":"obscure"},"answer":"B","explanation":"The distinction explains how both survey results can be true, reconciling the apparent conflict.","choice_explanations":{"A":"The distinction reduces rather than amplifies the conflict.","B":"Correct: it makes the findings compatible.","C":"No study is being repeated.","D":"The distinction clarifies the results instead of obscuring them."},"passage":"The two surveys appear to disagree, but they asked different questions. One measured whether residents used public transit at least once a month; the other measured whether transit was residents' primary mode of travel. Recognizing this distinction helps _______ the apparently conflicting results.","target_text":"_______","strategy":"Look for apparent contradiction followed by a distinction that makes both claims compatible; that is reconciliation."},{"id":"WIC-027","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"infallible","B":"arbitrary","C":"warranted","D":"irrelevant"},"answer":"C","explanation":"The surviving evidence gives reasonable justification for the identification, making it warranted, though not certain.","choice_explanations":{"A":"The first sentence explicitly rules out certainty.","B":"Arbitrary would mean unsupported, contradicting the surviving letters.","C":"Correct: the evidence justifies the identification without proving it.","D":"The identification remains relevant to the inscription."},"passage":"The inscription is badly damaged, so the proposed reading cannot be treated as definitive. Still, the surviving letters align with the name of a ruler known to have governed the region at the time, making the identification _______ rather than purely speculative.","target_text":"_______","strategy":"Track degree. The passage rejects certainty but also rejects pure speculation, so the answer must express justified-but-not-proven."},{"id":"WIC-028","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"indistinguishable","B":"unviable","C":"pervasive","D":"atypical"},"answer":"D","explanation":"The species differs from most others, so its behavior is atypical; the text explicitly avoids saying it is harmful.","choice_explanations":{"A":"The behavior is specifically distinguishable from the norm.","B":"Unviable means unable to succeed, which the passage does not claim.","C":"Pervasive means widespread, the opposite of unusual.","D":"Correct: the behavior is unusual relative to the community."},"passage":"Unlike most desert plants, which reduce water loss by opening their stomata mainly at night, this species keeps its stomata partially open during the day. The behavior is therefore _______ within the ecological community, though not necessarily disadvantageous.","target_text":"_______","strategy":"Separate rarity from value. Unusual does not automatically mean harmful."},{"id":"WIC-029","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"enhance","B":"impede","C":"standardize","D":"supplant"},"answer":"A","explanation":"Reducing noise while preserving signal improves detection ability, so the method enhances it.","choice_explanations":{"A":"Correct: the method improves sensitivity.","B":"Impede means hinder, opposite the described effect.","C":"Nothing indicates that detection ability becomes uniform.","D":"The method does not replace the researchers' ability."},"passage":"The new filter removes most of the background noise without eliminating the faint signal of interest. By reducing interference while preserving the signal, the method can _______ researchers' ability to detect very weak events.","target_text":"_______","strategy":"State the causal result in plain language first: less noise + same signal = better detection."},{"id":"WIC-030","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"circumvent","B":"substantiate","C":"delineate","D":"disseminate"},"answer":"B","explanation":"The study lacks enough evidence to support or establish a causal interpretation, so it cannot substantiate it.","choice_explanations":{"A":"Circumvent means avoid, which does not fit the object.","B":"Correct: substantiate means support with evidence.","C":"Delineate means describe boundaries or details, not prove causation.","D":"Disseminate means spread information."},"passage":"The authors caution that the correlation may reflect differences in income rather than the program itself. Because the study did not randomly assign participants, the evidence is insufficient to _______ a causal interpretation.","target_text":"_______","strategy":"Identify the semantic slot: evidence is insufficient to ___ an interpretation. The missing verb must mean support with evidence."},{"id":"WIC-031","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"exhaustive","B":"redundant","C":"partial","D":"conclusive"},"answer":"C","explanation":"An evaluation that considers only one benefit while ignoring a cost is incomplete or partial.","choice_explanations":{"A":"Exhaustive means comprehensive, the opposite of the described evaluation.","B":"The problem is incompleteness, not unnecessary repetition.","C":"Correct: it captures only part of the policy's effects.","D":"Ignoring a major cost makes the evaluation less, not more, conclusive."},"passage":"Although the policy reduced average waiting times, it also increased the number of patients who had to travel to a different clinic. Any evaluation that considers only waiting time would therefore be _______ because it ignores an important cost of the policy.","target_text":"_______","strategy":"Convert the sentence after \"because\" into the needed property: ignores an important cost = incomplete/partial."},{"id":"WIC-032","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"replicate","B":"exacerbate","C":"authenticate","D":"attenuate"},"answer":"D","explanation":"Binding the metals reduces their toxic effects, so the process attenuates those effects.","choice_explanations":{"A":"Replicate means copy or reproduce.","B":"Exacerbate means worsen, opposite the described mechanism.","C":"Authenticate means verify genuineness.","D":"Correct: attenuate means reduce in strength."},"passage":"The fungus survives in soils with high metal concentrations by binding the metals inside specialized cell compartments. This process does not remove the metals from the environment, but it does _______ their toxic effects on the fungus itself.","target_text":"_______","strategy":"Determine the direction of effect before looking at vocabulary: the mechanism reduces toxicity."},{"id":"WIC-033","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"corroborates","B":"visualizes","C":"contradicts","D":"initiates"},"answer":"A","explanation":"The photographs independently support the reports' description of rapid change, so they corroborate it.","choice_explanations":{"A":"Correct: the visual evidence confirms the reports.","B":"The photographs depict change, but the key relationship is that they support another source's claim.","C":"The two sources agree rather than conflict.","D":"The photographs do not cause the transformation."},"passage":"The earliest photographs show the plaza almost empty, while images from only a decade later show permanent stalls covering much of the space. The visual record therefore _______ the rapid transformation described in municipal reports from the same period.","target_text":"_______","strategy":"When two independent sources tell the same story, prefer a support verb such as corroborate over a merely descriptive verb."},{"id":"WIC-034","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"validated","B":"constrained","C":"generated","D":"magnified"},"answer":"B","explanation":"Topography limits where the model performs well, so its usefulness is constrained by terrain.","choice_explanations":{"A":"Topography does not validate the model; it reveals a limitation.","B":"Correct: terrain limits the model's applicability.","C":"Topography does not generate usefulness.","D":"The model is less useful in mountains, not more."},"passage":"The model predicts rainfall accurately in coastal regions but performs poorly in mountainous terrain, where elevation changes sharply over short distances. Its usefulness is therefore _______ by topography rather than uniform across the entire country.","target_text":"_______","strategy":"Translate \"not uniform across the country\" into the missing concept: limited by conditions."},{"id":"WIC-035","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"incompatible","B":"synonymous","C":"consistent","D":"inseparable"},"answer":"C","explanation":"Because the same patterns occur regionally, the manuscripts' similarities fit or are consistent with regional practice.","choice_explanations":{"A":"The evidence does not conflict with regional practice.","B":"Spelling similarities are not synonymous with a practice.","C":"Correct: regional practice can explain the shared spellings.","D":"Nothing says the manuscripts and regional practice cannot be separated."},"passage":"The two manuscripts share several unusual spelling patterns, but those patterns also occur in unrelated documents from the region. Thus, the similarities are _______ with common regional practice and do not by themselves prove that one manuscript was copied from the other.","target_text":"_______","strategy":"Note the cautionary conclusion: the evidence has an alternative explanation. The missing word should express compatibility, not proof."},{"id":"WIC-036","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"countervailing","B":"derivative","C":"inevitable","D":"alternative"},"answer":"D","explanation":"Wind offers another possible cause of the birds' behavior, making it an alternative explanation.","choice_explanations":{"A":"Countervailing means offsetting an effect, not simply providing another causal account.","B":"Derivative means based on something else, which is not the relationship described.","C":"The wind explanation is plausible, not certain.","D":"Correct: wind is a competing possible explanation."},"passage":"Researchers observed that the birds changed feeding sites soon after a predator arrived, but the timing alone does not show that the predator caused the shift. A sudden change in wind occurred at nearly the same time and is a plausible _______ explanation.","target_text":"_______","strategy":"Distinguish \"another possible cause\" from more specialized relations like opposition or derivation."},{"id":"WIC-037","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"prescriptive","B":"reticent","C":"ornamental","D":"fragmentary"},"answer":"A","explanation":"The narrator strongly directs readers toward a particular interpretation, making the narration prescriptive rather than open or suggestive.","choice_explanations":{"A":"Correct: the narration dictates how motives should be understood.","B":"Reticent means restrained or unwilling to say much, the opposite of explicit explanation.","C":"Ornamental concerns decoration, not interpretive control.","D":"Fragmentary means incomplete or broken into pieces, which is not the criticism."},"passage":"The critic praises the novel's historical detail but argues that its narrator explains characters' motives so explicitly that readers have little room to interpret them. For the critic, the narration is therefore overly _______ rather than suggestive.","target_text":"_______","strategy":"Use the explicit contrast after \"rather than\": suggestive vs. a term meaning directive or interpretively controlling."},{"id":"WIC-038","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"uniform","B":"differential","C":"negligible","D":"accidental"},"answer":"B","explanation":"The size of the benefit differed across neighborhoods, so the benefits were differential rather than uniform.","choice_explanations":{"A":"Uniform directly contradicts the final clause.","B":"Correct: effects varied by prior shade conditions.","C":"The effect was strong in some areas, so it was not negligible overall.","D":"The pattern is linked to prior shade, not described as accidental."},"passage":"The city's tree-planting program lowered summer temperatures most strongly in neighborhoods that had previously had little shade. In already leafy neighborhoods, the effect was much smaller. The program's benefits were therefore _______ rather than evenly distributed.","target_text":"_______","strategy":"When the text contrasts groups with different effect sizes, look for a word meaning varying by group."},{"id":"WIC-039","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"incidental","B":"analogous","C":"integral","D":"peripheral"},"answer":"C","explanation":"The date is essential to determining whether the evidence genuinely supports the argument, so it is integral to the evaluation.","choice_explanations":{"A":"Incidental means secondary, the opposite of the passage's logic.","B":"The date is not being compared as similar to the evaluation.","C":"Correct: dating is essential to evaluating the evidence.","D":"Peripheral means marginal, again opposite to the passage."},"passage":"The historian's argument depends on a diary entry whose date is uncertain. If the entry was written after the event it supposedly predicts, the evidence would lose much of its value. Establishing the date is therefore _______ to evaluating the argument.","target_text":"_______","strategy":"Ask whether removing the factor would undermine the evaluation. If yes, it is central/integral."},{"id":"WIC-040","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"predictive","B":"conventional","C":"replicable","D":"anomalous"},"answer":"D","explanation":"A result not reproduced by three independent teams is unusual relative to the broader evidence, so it appears anomalous.","choice_explanations":{"A":"Nothing indicates it successfully predicts future outcomes.","B":"Conventional means typical or standard, opposite the contrast.","C":"The result specifically failed replication.","D":"Correct: the original finding is an outlier."},"passage":"One laboratory reported that the compound dramatically accelerated plant growth. Three independent teams using the same concentration found no measurable effect. The original result now appears _______ rather than representative of the compound's typical effect.","target_text":"_______","strategy":"Use the phrase \"rather than representative\": the answer must mean unusual or outlying."},{"id":"WIC-041","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"produced","B":"negated","C":"concealed","D":"authenticated"},"answer":"A","explanation":"The viewing angle creates the appearance of symmetry even though the object itself is asymmetric.","choice_explanations":{"A":"Correct: perspective produces the apparent symmetry.","B":"The viewing angle creates, not cancels, the appearance.","C":"The angle does not conceal symmetry; it conceals asymmetry.","D":"The angle does not verify authenticity."},"passage":"The sculpture appears symmetrical from the front, but measurements show that its left side is several centimeters wider than its right. The apparent symmetry is therefore _______ by viewing angle rather than perfectly realized in the object itself.","target_text":"_______","strategy":"Track what is real versus apparent. The angle causes the appearance, so the missing verb must mean creates."},{"id":"WIC-042","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"compiled","B":"construed","C":"rectified","D":"forecast"},"answer":"B","explanation":"The passage warns against interpreting silence as evidence of ignorance, so \"construed\" fits.","choice_explanations":{"A":"Compiled means gathered together.","B":"Correct: construed means interpreted in a particular way.","C":"Rectified means corrected.","D":"Forecast means predicted."},"passage":"The archive contains thousands of letters, but only a small fraction mention the strike. Because silence in a letter can reflect many things, the absence of discussion should not be _______ as evidence that most writers were unaware of the event.","target_text":"_______","strategy":"Use the construction \"X as evidence that...\"; the verb should mean interpret or understand."},{"id":"WIC-043","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"sweeping","B":"inadvertent","C":"selective","D":"perfunctory"},"answer":"C","explanation":"Only some features are modernized while the structure remains, so the modernization is selective.","choice_explanations":{"A":"Sweeping implies broad transformation, which the text denies.","B":"The translation's changes are deliberate, not accidental.","C":"Correct: the changes target particular expressions.","D":"Perfunctory means done with little care, which is not supported."},"passage":"The new translation preserves the poem's sentence order but replaces many archaic expressions with contemporary ones. It is therefore not a radical rewriting; rather, it is a _______ modernization that leaves the poem's basic structure intact.","target_text":"_______","strategy":"Use the contrast with \"not a radical rewriting\" and the preserved sentence order to calibrate the scope of change."},{"id":"WIC-044","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"homogeneous","B":"indeterminate","C":"depleted","D":"differentiated"},"answer":"D","explanation":"Genetic differences associated with habitat mean the population is genetically differentiated.","choice_explanations":{"A":"Homogeneous means uniform, contrary to the stated differences.","B":"The differences are observed, not uncertain.","C":"No reduction in genetic material or population is stated.","D":"Correct: subpopulations differ genetically."},"passage":"The species occupies both cool upland forests and hot coastal scrub, but individuals from each habitat differ genetically in ways associated with temperature tolerance. The population is therefore geographically widespread yet genetically _______.","target_text":"_______","strategy":"Do not let \"geographically widespread\" push you toward uniformity; the sentence explicitly contrasts geographic range with genetic variation."},{"id":"WIC-045","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"contingent","B":"immune","C":"orthogonal","D":"retrospective"},"answer":"A","explanation":"The forecast depends on the assumption about energy prices, so it is contingent on that assumption.","choice_explanations":{"A":"Correct: contingent on means dependent on.","B":"The forecast is vulnerable to price changes, not immune to them.","C":"Orthogonal means unrelated or independent in some contexts, the opposite here.","D":"The forecast concerns the future, not a retrospective analysis."},"passage":"The economist's forecast assumes that energy prices will remain near current levels. A prolonged price spike would change production costs across the model, so the forecast is _______ on an assumption that may not hold.","target_text":"_______","strategy":"Recognize the fixed construction \"contingent on\" = dependent on a condition."},{"id":"WIC-046","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"reciprocal","B":"disparate","C":"redundant","D":"provisional"},"answer":"B","explanation":"Acidic and alkaline optimal conditions are markedly different, so the requirements are disparate.","choice_explanations":{"A":"Reciprocal means mutual or corresponding, not simply different.","B":"Correct: the environmental requirements differ strongly.","C":"Redundant means unnecessarily duplicative.","D":"Provisional means temporary or tentative."},"passage":"The two enzymes perform the same overall reaction, but one works best in acidic conditions and the other in alkaline conditions. Their functions are similar, yet their environmental requirements are _______.","target_text":"_______","strategy":"Map the explicit comparison: same function, different conditions. The blank must encode strong difference."},{"id":"WIC-047","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"definitive","B":"irreconcilable","C":"tentative","D":"pervasive"},"answer":"C","explanation":"The political-pressure explanation is plausible but lacks direct proof, so it remains tentative.","choice_explanations":{"A":"Definitive would imply certainty the passage explicitly lacks.","B":"Nothing is described as impossible to reconcile.","C":"Correct: the explanation is provisional and not established.","D":"Pervasive means widespread, which does not describe the certainty of an explanation."},"passage":"The first edition contains several passages criticizing the monarchy, but those passages are absent from the edition published after the author accepted a government position. The omissions may therefore reflect political pressure, although that explanation remains _______ without direct documentary evidence.","target_text":"_______","strategy":"Whenever a sentence includes \"although\" plus missing direct evidence, expect a word that lowers certainty."},{"id":"WIC-048","category":"Craft and Structure","skill":"Words in Context","level":"very_hard","question":"Which choice completes the text with the most logical and precise word or phrase?","choices":{"A":"indeterminate","B":"spurious","C":"universal","D":"negligible"},"answer":"D","explanation":"A very small real effect can be statistically significant yet practically negligible.","choice_explanations":{"A":"The effect is measurable, not indeterminate.","B":"Spurious would imply the effect is false or artifactual, contrary to the statistical evidence.","C":"Universal concerns applicability to everyone, not effect size.","D":"Correct: the effect is too small to matter much in practice."},"passage":"The intervention produced a statistically detectable improvement, but the average gain was less than one percentage point. The researchers therefore describe the practical effect as _______ even though the statistical result is unlikely to be due to chance.","target_text":"_______","strategy":"Distinguish statistical existence from practical magnitude. A real effect can still be negligible."}]},{"category":"Expression of Ideas","subcategory":"Rhetorical Synthesis","questions":[{"id":"RS-001","category":"Expression of Ideas","skill":"Rhetorical Synthesis","level":"very_hard","question":"The student wants to emphasize a similarity between the two artworks. Which choice most effectively uses relevant information from the notes to accomplish this goal?","choices":{"A":"Tidal Alphabet is installed outdoors, whereas Window Archive is displayed indoors.","B":"Both Tidal Alphabet and Window Archive incorporate recordings of local people sharing stories.","C":"Visitors activate Tidal Alphabet by walking past sensors and Window Archive by opening drawers.","D":"Mina Vale began using recorded fishers’ stories in Tidal Alphabet in 2017."},"answer":"B","explanation":"The two installations both convey local oral histories through recordings, despite their different venues and interactions.","choice_explanations":{"A":"Incorrect: T
